<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PARTI SYNTH</title>
<style>
:root {
  --r: 255; --g: 0; --b: 0;
  --bg-color: rgb(var(--r), var(--g), var(--b));
  --text-color: #ffffff;
  --accent-color: #ffff00;
  --border-color: rgba(255, 255, 255, 0.3);
  --safe-area-inset-top: env(safe-area-inset-top);
  --safe-area-inset-bottom: env(safe-area-inset-bottom);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  background: #000;
  color: var(--text-color);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-weight: 700;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  overscroll-behavior: none;
  overflow: hidden;
}

body {
  background: var(--bg-color);
  transition: background 0.1s linear;
}

#app-container {
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* MAIN PAD - Devrimci tasarım */
#pad {
  width: 100%;
  height: 100vh;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(0, 0, 0, 0.2);
  cursor: crosshair;
  overflow: hidden;
}

#pad::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: radial-gradient(circle at center, 
    rgba(255, 255, 255, 0.1) 0%, 
    rgba(0, 0, 0, 0.3) 70%);
  pointer-events: none;
}

/* Display Elements - Tam opak ve okunaklı */
#noteDisplay, #motionDisplay, #wahDisplay, #panDisplay {
  position: absolute;
  background: rgba(0, 0, 0, 0.95) !important;
  color: var(--text-color) !important;
  pointer-events: none;
  z-index: 10;
  border: 2px solid var(--border-color);
  backdrop-filter: blur(20px);
  padding: 12px 24px;
  border-radius: 25px;
  font-size: 16px;
  font-weight: 800;
  text-shadow: 0 0 10px currentColor;
  box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
}

#noteDisplay {
  top: max(25px, var(--safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  font-size: 32px;
  background: rgba(0, 0, 0, 0.95) !important;
  color: var(--text-color) !important;
  border: 3px solid var(--accent-color);
}

#motionDisplay, #wahDisplay, #panDisplay {
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  background: rgba(0, 0, 0, 0.95) !important;
}

#wahDisplay { bottom: 70px; }
#panDisplay { bottom: 120px; }
#motionDisplay { bottom: 170px; }

/* Note Ruler - Güncellenmiş */
#noteRuler {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 50px;
  background: rgba(0, 0, 0, 0.8);
  border-left: 2px solid var(--border-color);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 15px 0;
  pointer-events: none;
  z-index: 5;
}

.ruler-note {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-color);
  border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  text-shadow: 0 0 5px currentColor;
}

/* Controls - Parti stili */
#controls {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-height: 75vh;
  background: rgba(0, 0, 0, 0.98) !important;
  backdrop-filter: blur(30px);
  border-top: 3px solid var(--accent-color);
  transform: translateY(calc(100% - 60px));
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  z-index: 1000;
}

#controls.expanded {
  transform: translateY(0);
}

#toggleControls {
  position: fixed;
  bottom: 15px;
  right: 20px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--accent-color);
  border: 3px solid #000;
  color: #000;
  font-size: 24px;
  font-weight: 900;
  cursor: pointer;
  z-index: 1001;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px rgba(255, 255, 0, 0.7);
  transition: all 0.3s ease;
}

#toggleControls:active {
  transform: scale(0.9);
}

/* Buttons ve Controls - Tam opak */
button, select, input[type=range], label {
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  border-radius: 12px;
  border: 2px solid var(--border-color);
  background: rgba(0, 0, 0, 0.95) !important;
  color: var(--text-color) !important;
  -webkit-appearance: none;
  appearance: none;
  transition: all 0.2s ease;
  outline: none;
}

button {
  padding: 12px 15px;
  cursor: pointer;
  min-height: 45px;
  background: rgba(0, 0, 0, 0.95) !important;
  color: var(--text-color) !important;
}

button.active {
  background: var(--accent-color) !important;
  color: #000 !important;
  border-color: #000;
  box-shadow: 0 0 20px var(--accent-color);
}

.control-group {
  display: flex;
  flex-direction: column;
  align-items: center;
}

label {
  font-size: 11px;
  margin-bottom: 5px;
  text-align: center;
  font-weight: 800;
  background: transparent !important;
}

input[type=range] {
  width: 100%;
  height: 6px;
  background: rgba(255, 255, 255, 0.2);
  border: none;
  margin: 8px 0;
  border-radius: 3px;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  background: var(--accent-color);
  cursor: pointer;
  border-radius: 50%;
  box-shadow: 0 0 15px var(--accent-color);
  border: 2px solid #000;
}

select {
  padding: 10px;
  cursor: pointer;
  min-height: 45px;
  width: 100%;
  background: rgba(0, 0, 0, 0.95) !important;
  color: var(--text-color) !important;
}

/* Status Message */
#statusMessage {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.95) !important;
  color: var(--text-color) !important;
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 700;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  border: 2px solid var(--accent-color);
}

#statusMessage.show {
  opacity: 1;
}

/* Effect Groups */
.effect-group {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin: 15px 0;
  padding: 15px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 15px;
  border: 2px solid var(--border-color);
}

.effect-group-title {
  grid-column: 1 / -1;
  text-align: center;
  font-size: 14px;
  font-weight: 900;
  color: var(--accent-color);
  margin-bottom: 8px;
  text-transform: uppercase;
}

.rhythm-panel {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 15px 0;
  padding: 15px;
  background: rgba(255, 255, 0, 0.1);
  border-radius: 15px;
  border: 2px solid var(--accent-color);
}

.rhythm-title {
  grid-column: 1 / -1;
  text-align: center;
  font-size: 14px;
  font-weight: 900;
  color: var(--accent-color);
  margin-bottom: 8px;
  text-transform: uppercase;
}

/* Modal */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.95);
  z-index: 2000;
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: rgba(0, 0, 0, 0.98);
  padding: 30px;
  border-radius: 20px;
  max-width: 85%;
  text-align: center;
  backdrop-filter: blur(30px);
  border: 3px solid var(--accent-color);
}

.modal-buttons {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.modal-buttons button {
  flex: 1;
  background: rgba(0, 0, 0, 0.95) !important;
}
</style>
</head>
<body>
<div id="app-container">
  <div id="pad">
    <div id="noteDisplay">C4</div>
    <div id="motionDisplay">Tilt:0°</div>
    <div id="wahDisplay">Wah:ON</div>
    <div id="panDisplay">Pan:0%</div>
    <div id="noteRuler"></div>
  </div>
  
  <button id="toggleControls">⚙️</button>
  
  <div id="controls">
    <button id="startBtn">START</button>
    <button id="stopBtn" disabled>STOP</button>
    <button id="motionBtn">MOTION</button>
    <button id="panBtn">PAN</button>
    <button id="octDown">OCT-</button>
    <button id="octUp">OCT+</button>
    
    <div class="control-group">
      <label>WAVE TYPE</label>
      <select id="waveSelect">
        <option value="sawtooth">SAWTOOTH</option>
        <option value="triangle">TRIANGLE</option>
        <option value="square">SQUARE</option>
        <option value="sine">SINE</option>
        <option value="pulse">PULSE</option>
        <option value="fm">FM</option>
      </select>
    </div>
    
    <div class="control-group">
      <label>DETUNE</label>
      <input type="range" id="detuneRange" min="0" max="50" value="15">
    </div>
    
    <div class="control-group">
      <label>FILTER FREQ</label>
      <input type="range" id="filterFreq" min="200" max="20000" value="20000" step="100">
    </div>
    
    <div class="control-group">
      <label>FILTER RESO</label>
      <input type="range" id="filterReso" min="0.5" max="20" value="1" step="0.5">
    </div>
    
    <div class="control-group">
      <label>WAH RATE</label>
      <input type="range" id="autoWahRate" min="0.1" max="5" value="1" step="0.1">
    </div>
    
    <div class="control-group">
      <label>WAH DEPTH</label>
      <input type="range" id="autoWahDepth" min="100" max="1500" value="800">
    </div>

    <div class="rhythm-panel">
      <div class="rhythm-title">RHYTHM SECTION</div>
      <button id="rhythm4">1/4</button>
      <button id="rhythm8">1/8</button>
      <button id="rhythm16">1/16</button>
      <button id="rhythmStop">STOP</button>
    </div>

    <div class="effect-group">
      <div class="effect-group-title">EFFECTS REVOLUTION</div>
      <button id="toggleDist">DISTORTION</button>
      <button id="toggleAutoWah">AUTO WAH</button>
      <button id="toggleFlanger">FLANGER</button>
      <button id="toggleChorus">CHORUS</button>
      <button id="toggleTremolo">TREMOLO</button>
      <button id="toggleFilter">FILTER</button>
      <button id="toggleDelay">DELAY</button>
      <button id="toggleReverb">REVERB</button>
    </div>
  </div>
</div>

<div id="statusMessage"></div>

<div id="permissionModal" class="modal">
  <div class="modal-content">
    <h3>🎵 MOTION ACCESS REQUIRED 🎵</h3>
    <p>Revolution needs your device's motion sensors for ultimate tilt control!</p>
    <div class="modal-buttons">
      <button id="permissionAllow">ALLOW</button>
      <button id="permissionDeny">DENY</button>
    </div>
  </div>
</div>

<script>
// YÜKSEK PERFORMANS DEVRİMİ
const AppState = {
  audioCtx: null,
  oscillators: [],
  masterGain: null,
  baseFreq: 261.63,
  octaveOffset: 0,
  tiltBend: 0,
  detuneAmount: 15,
  waveType: "sawtooth",
  isPlaying: false,
  motionEnabled: false,
  panEnabled: false,
  NUM_OSC: 7,
  pulseWidth: 0.5
};

const effects = {
  dist: false,
  autoWah: false,
  flanger: false,
  chorus: false,
  tremolo: false,
  filter: true,
  delay: false,
  reverb: false
};

let audioNodes = {};
let rhythmInterval = null;
let lastOrientationTime = 0;
let lastTouchTime = 0;

// DEVRİMCİ RENK SİSTEMİ
const noteColors = {
  'C': [255, 50, 50],    // Kırmızı
  'C#': [255, 100, 50],  // Turuncu
  'D': [255, 255, 50],   // Sarı
  'D#': [150, 255, 50],  // Açık yeşil
  'E': [50, 255, 50],    // Yeşil
  'F': [50, 255, 150],   // Cam göbeği
  'F#': [50, 255, 255],  // Açık mavi
  'G': [50, 150, 255],   // Mavi
  'G#': [50, 50, 255],   // Koyu mavi
  'A': [150, 50, 255],   // Mor
  'A#': [255, 50, 255],  // Pembe
  'B': [255, 50, 150]    // Fuşya
};

// ELEMENT DEVRİMİ
const elements = {
  pad: document.getElementById("pad"),
  noteDisplay: document.getElementById("noteDisplay"),
  motionDisplay: document.getElementById("motionDisplay"),
  wahDisplay: document.getElementById("wahDisplay"),
  panDisplay: document.getElementById("panDisplay"),
  startBtn: document.getElementById("startBtn"),
  stopBtn: document.getElementById("stopBtn"),
  motionBtn: document.getElementById("motionBtn"),
  panBtn: document.getElementById("panBtn"),
  statusMessage: document.getElementById("statusMessage"),
  permissionModal: document.getElementById("permissionModal"),
  controls: document.getElementById("controls"),
  toggleControls: document.getElementById("toggleControls"),
  noteRuler: document.getElementById("noteRuler")
};

const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

// YÜKSEK HIZ FONKSİYONLARI
function isAudioContextValid() {
  return AppState.audioCtx && AppState.audioCtx.state === 'running';
}

function safeAudioOperation(op) {
  if (!isAudioContextValid()) {
    showStatus('START SYNTH FIRST COMRADE!');
    return false;
  }
  try {
    op();
    return true;
  } catch (e) {
    console.error('Audio error:', e);
    showStatus('AUDIO REVOLUTION FAILED!');
    return false;
  }
}

function showStatus(msg, dur = 1200) {
  elements.statusMessage.textContent = msg;
  elements.statusMessage.classList.add('show');
  setTimeout(() => elements.statusMessage.classList.remove('show'), dur);
}

function updateButtonStates() {
  elements.startBtn.disabled = AppState.isPlaying;
  elements.stopBtn.disabled = !AppState.isPlaying;
}

// OSCILLATOR DEVRİMİ
function cleanupOscillators() {
  if (AppState.oscillators.length > 0) {
    AppState.oscillators.forEach(osc => {
      try {
        osc.stop();
        osc.disconnect();
      } catch (e) {}
    });
    AppState.oscillators = [];
  }
}

function startSynth() {
  if (isAudioContextValid()) {
    showStatus('ALREADY REVOLUTIONING!');
    return;
  }
  
  try {
    AppState.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    createAudioNodes();
    AppState.isPlaying = true;
    updateButtonStates();
    showStatus('REVOLUTION STARTED! 🎵');
  } catch (e) {
    console.error('Start failed:', e);
    showStatus('REVOLUTION FAILED!');
  }
}

function createAudioNodes() {
  cleanupOscillators();
  
  AppState.masterGain = AppState.audioCtx.createGain();
  AppState.masterGain.gain.value = 0.2;
  
  // Audio nodes creation
  audioNodes.panner = AppState.audioCtx.createStereoPanner();
  audioNodes.panner.pan.value = 0;
  
  audioNodes.distortion = createWaveShaper(50);
  audioNodes.distortionGain = AppState.audioCtx.createGain();
  audioNodes.distortionGain.gain.value = 0;
  
  audioNodes.autoWah = AppState.audioCtx.createBiquadFilter();
  audioNodes.autoWah.type = "bandpass";
  audioNodes.autoWah.frequency.value = 800;
  audioNodes.autoWah.Q.value = 5;
  
  audioNodes.autoWahLFO = AppState.audioCtx.createOscillator();
  audioNodes.autoWahLFO.frequency.value = 1;
  audioNodes.autoWahGain = AppState.audioCtx.createGain();
  audioNodes.autoWahGain.gain.value = 600;
  audioNodes.autoWahLFO.connect(audioNodes.autoWahGain);
  audioNodes.autoWahGain.connect(audioNodes.autoWah.frequency);
  audioNodes.autoWahLFO.start();
  
  // Flanger setup
  audioNodes.flangerDelay = AppState.audioCtx.createDelay(0.02);
  audioNodes.flangerDelay.delayTime.value = 0.005;
  audioNodes.flangerLFO = AppState.audioCtx.createOscillator();
  audioNodes.flangerLFO.frequency.value = 0.2;
  audioNodes.flangerGain = AppState.audioCtx.createGain();
  audioNodes.flangerGain.gain.value = 0.005;
  audioNodes.flangerFeedback = AppState.audioCtx.createGain();
  audioNodes.flangerFeedback.gain.value = 0.5;
  audioNodes.flangerLFO.connect(audioNodes.flangerGain);
  audioNodes.flangerGain.connect(audioNodes.flangerDelay.delayTime);
  audioNodes.flangerLFO.start();
  
  // Chorus setup
  audioNodes.chorusDelay = AppState.audioCtx.createDelay(0.05);
  audioNodes.chorusDelay.delayTime.value = 0.025;
  audioNodes.chorusLFO = AppState.audioCtx.createOscillator();
  audioNodes.chorusLFO.frequency.value = 0.5;
  audioNodes.chorusGain = AppState.audioCtx.createGain();
  audioNodes.chorusGain.gain.value = 0.01;
  audioNodes.chorusLFO.connect(audioNodes.chorusGain);
  audioNodes.chorusGain.connect(audioNodes.chorusDelay.delayTime);
  audioNodes.chorusLFO.start();
  
  // Tremolo setup
  audioNodes.tremoloLFO = AppState.audioCtx.createOscillator();
  audioNodes.tremoloLFO.frequency.value = 5;
  audioNodes.tremoloGain = AppState.audioCtx.createGain();
  audioNodes.tremoloGain.gain.value = 0;
  audioNodes.tremoloLFO.connect(audioNodes.tremoloGain);
  audioNodes.tremoloLFO.start();
  
  audioNodes.filter = AppState.audioCtx.createBiquadFilter();
  audioNodes.filter.type = "lowpass";
  audioNodes.filter.frequency.value = 20000;
  audioNodes.filter.Q.value = 1;
  
  // Delay setup
  audioNodes.delay = AppState.audioCtx.createDelay(2);
  audioNodes.delay.delayTime.value = 0.3;
  audioNodes.delayFeedback = AppState.audioCtx.createGain();
  audioNodes.delayFeedback.gain.value = 0.5;
  
  // Reverb setup
  audioNodes.reverb = AppState.audioCtx.createConvolver();
  const buffer = AppState.audioCtx.createBuffer(2, AppState.audioCtx.sampleRate * 2, AppState.audioCtx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buffer.getChannelData(c);
    for (let i = 0; i < buffer.length; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / buffer.length, 2);
    }
  }
  audioNodes.reverb.buffer = buffer;
  
  createOscillators();
  connectAudioGraph();
}

function createWaveShaper(amount) {
  const ws = AppState.audioCtx.createWaveShaper();
  const n = 44100;
  const curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i - n / 2) / (n / 2);
    curve[i] = (3 + amount) * x * 20 * 0.0174533 / (Math.PI + amount * Math.abs(x));
  }
  ws.curve = curve;
  ws.oversample = '4x';
  return ws;
}

function createOscillators() {
  const now = AppState.audioCtx.currentTime;
  
  for (let i = 0; i < AppState.NUM_OSC; i++) {
    let osc;
    
    if (AppState.waveType === 'fm') {
      osc = AppState.audioCtx.createOscillator();
      osc.type = 'sine';
      const modulator = AppState.audioCtx.createOscillator();
      modulator.type = 'sine';
      modulator.frequency.value = AppState.baseFreq * 2;
      const modGain = AppState.audioCtx.createGain();
      modGain.gain.value = 100;
      modulator.connect(modGain);
      modGain.connect(osc.frequency);
      modulator.start(now);
    } else if (AppState.waveType === 'pulse') {
      osc = AppState.audioCtx.createOscillator();
      osc.type = 'square';
    } else {
      osc = AppState.audioCtx.createOscillator();
      osc.type = AppState.waveType;
    }
    
    osc.detune.value = (i - Math.floor(AppState.NUM_OSC / 2)) * AppState.detuneAmount;
    
    if (AppState.waveType === 'pulse') {
      const pulseWidth = AppState.audioCtx.createWaveShaper();
      const pulseCurve = new Float32Array(256);
      for (let j = 0; j < 256; j++) {
        pulseCurve[j] = j < 128 * AppState.pulseWidth ? -1 : 1;
      }
      pulseWidth.curve = pulseCurve;
      osc.connect(pulseWidth);
      pulseWidth.connect(AppState.masterGain);
    } else {
      osc.connect(AppState.masterGain);
    }
    
    osc.start(now);
    AppState.oscillators.push(osc);
  }
}

function connectAudioGraph() {
  // Disconnect everything first
  AppState.masterGain.disconnect();
  audioNodes.distortion.disconnect();
  audioNodes.autoWah.disconnect();
  audioNodes.flangerDelay.disconnect();
  audioNodes.chorusDelay.disconnect();
  audioNodes.filter.disconnect();
  audioNodes.delay.disconnect();
  audioNodes.reverb.disconnect();
  audioNodes.panner.disconnect();
  
  let signal = AppState.masterGain;
  
  if (effects.dist) {
    signal.connect(audioNodes.distortion);
    signal = audioNodes.distortion;
  }
  
  if (effects.autoWah) {
    signal.connect(audioNodes.autoWah);
    signal = audioNodes.autoWah;
  }
  
  if (effects.flanger) {
    signal.connect(audioNodes.flangerDelay);
    audioNodes.flangerDelay.connect(audioNodes.flangerFeedback);
    audioNodes.flangerFeedback.connect(audioNodes.flangerDelay);
    signal = audioNodes.flangerDelay;
  }
  
  if (effects.chorus) {
    signal.connect(audioNodes.chorusDelay);
    signal = audioNodes.chorusDelay;
  }
  
  signal.connect(audioNodes.filter);
  
  if (effects.delay) {
    audioNodes.filter.connect(audioNodes.delay);
    audioNodes.delay.connect(audioNodes.delayFeedback);
    audioNodes.delayFeedback.connect(audioNodes.delay);
    signal = audioNodes.delay;
  }
  
  if (effects.reverb) {
    signal.connect(audioNodes.reverb);
    signal = audioNodes.reverb;
  }
  
  if (effects.tremolo) {
    audioNodes.tremoloGain.connect(signal.gain);
  }
  
  signal.connect(audioNodes.panner);
  audioNodes.panner.connect(AppState.audioCtx.destination);
  
  // Update effect gains
  audioNodes.distortionGain.gain.value = effects.dist ? 1 : 0;
  audioNodes.autoWahGain.gain.value = effects.autoWah ? 1 : 0;
  audioNodes.tremoloGain.gain.value = effects.tremolo ? 0.5 : 0;
}

// GÖRSEL DEVRİM
function createNoteRuler() {
  const notes = ['D4', 'C#4', 'C4', 'B3', 'A#3', 'A3', 'G#3', 'G3', 'F#3', 'F3', 'E3', 'D#3', 'D3', 'C#3', 'C3', 'B2', 'A#2'];
  elements.noteRuler.innerHTML = '';
  notes.forEach(note => {
    const div = document.createElement('div');
    div.className = 'ruler-note';
    div.textContent = note;
    elements.noteRuler.appendChild(div);
  });
}

function freqToNote(freq) {
  const A4 = 440;
  const semitonesFromA4 = 12 * Math.log2(freq / A4);
  const noteIndex = Math.round(semitonesFromA4 + 9) % 12;
  const octave = Math.floor((semitonesFromA4 + 9) / 12);
  const noteName = noteNames[(noteIndex + 12) % 12];
  return { name: noteName, octave: octave, fullName: `${noteName}${octave}` };
}

function updateThemeColor(noteName) {
  const color = noteColors[noteName] || [255, 255, 255];
  document.documentElement.style.setProperty('--r', color[0]);
  document.documentElement.style.setProperty('--g', color[1]);
  document.documentElement.style.setProperty('--b', color[2]);
}

// YÜKSEK HIZ INPUT İŞLEME
function noteFromPad(y) {
  const padHeight = window.innerHeight;
  const ratio = 1 - (y / padHeight);
  const baseFreq = 130.81 * Math.pow(2, AppState.octaveOffset);
  return baseFreq * Math.pow(2, (ratio * 17) / 12);
}

function applyPitch() {
  if (!safeAudioOperation(() => {
    const freq = AppState.baseFreq;
    const noteInfo = freqToNote(freq);
    AppState.oscillators.forEach((osc, i) => {
      if (osc.frequency) {
        osc.frequency.setTargetAtTime(freq, AppState.audioCtx.currentTime, 0.002); // Daha hızlı response
      }
    });
    elements.noteDisplay.textContent = noteInfo.fullName;
    updateThemeColor(noteInfo.name);
  })) return;
}

function handleTouch(e) {
  const now = performance.now();
  if (now - lastTouchTime < 2) return; // YÜKSEK HIZ
  lastTouchTime = now;
  
  if (!isAudioContextValid()) {
    showStatus('START SYNTH FIRST COMRADE!');
    return;
  }
  
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  
  AppState.baseFreq = noteFromPad(clientY);
  const volume = clientX / window.innerWidth;
  
  safeAudioOperation(() => {
    AppState.masterGain.gain.setTargetAtTime(volume * 0.4, AppState.audioCtx.currentTime, 0.002);
  });
  
  applyPitch();
}

function updatePan(position) {
  if (!audioNodes.panner) return;
  safeAudioOperation(() => {
    audioNodes.panner.pan.setTargetAtTime(position, AppState.audioCtx.currentTime, 0.002);
    const panPercent = Math.round(position * 100);
    elements.panDisplay.textContent = `Pan:${panPercent}%`;
  });
}

function stopSynth() {
  if (!AppState.audioCtx) {
    showStatus('NO REVOLUTION RUNNING!');
    return;
  }
  
  try {
    cleanupOscillators();
    stopRhythm();
    disableMotion();
    
    AppState.audioCtx.close().then(() => {
      AppState.audioCtx = null;
      AppState.isPlaying = false;
      updateButtonStates();
      showStatus('REVOLUTION STOPPED!');
    }).catch(e => {
      console.error('Close error:', e);
      showStatus('STOP REVOLUTION FAILED!');
    });
  } catch (e) {
    console.error('Stop error:', e);
    showStatus('STOP REVOLUTION FAILED!');
  }
}

// UI KONTROLLERİ
function toggleControls() {
  elements.controls.classList.toggle('expanded');
  elements.toggleControls.textContent = elements.controls.classList.contains('expanded') ? '✕' : '⚙️';
}

// YÜKSEK HIZ MOTION KONTROLÜ
function requestMotionPermission() {
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    elements.permissionModal.style.display = 'flex';
  } else {
    startMotionControl();
  }
}

function startMotionControl() {
  window.addEventListener("deviceorientation", handleOrientation, { passive: true });
  AppState.motionEnabled = true;
  elements.motionBtn.textContent = "MOTION ON";
  elements.motionBtn.classList.add('active');
  elements.motionDisplay.style.display = 'block';
  showStatus('MOTION REVOLUTION! TILT AWAY!');
}

function disableMotion() {
  window.removeEventListener("deviceorientation", handleOrientation);
  AppState.motionEnabled = false;
  AppState.tiltBend = 0;
  elements.motionBtn.textContent = "MOTION OFF";
  elements.motionBtn.classList.remove('active');
  elements.motionDisplay.style.display = 'none';
  showStatus('MOTION REVOLUTION ENDED!');
}

function handleOrientation(e) {
  const now = performance.now();
  if (now - lastOrientationTime < 8) return; // ÇOK YÜKSEK HIZ
  lastOrientationTime = now;
  
  if (e.beta === null) return;
  
  const tilt = e.beta;
  const pan = e.gamma;
  
  // Yüksek hassasiyetli tilt kontrol
  if (AppState.motionEnabled) {
    AppState.tiltBend = (tilt / 45) * 24; // 2x daha hassas
    const baseFreq = 130.81 * Math.pow(2, AppState.octaveOffset);
    AppState.baseFreq = baseFreq * Math.pow(2, AppState.tiltBend / 12);
    elements.motionDisplay.textContent = `Tilt:${Math.round(AppState.tiltBend * 10) / 10}st`;
    applyPitch();
  }
  
  // Yüksek hassasiyetli pan kontrol
  if (AppState.panEnabled && pan !== null) {
    const panValue = Math.max(-1, Math.min(1, pan / 45)); // 2x daha hassas
    updatePan(panValue);
  }
}

function togglePan() {
  AppState.panEnabled = !AppState.panEnabled;
  elements.panBtn.textContent = AppState.panEnabled ? "PAN ON" : "PAN OFF";
  elements.panBtn.classList.toggle('active', AppState.panEnabled);
  elements.panDisplay.style.display = AppState.panEnabled ? 'block' : 'none';
  if (!AppState.panEnabled) {
    updatePan(0);
  }
  showStatus(AppState.panEnabled ? 'PAN REVOLUTION! TILT SIDEWAYS!' : 'PAN REVOLUTION ENDED!');
}

// RHYTHM DEVRİMİ
function startRhythm(pattern) {
  if (!isAudioContextValid()) {
    showStatus('START SYNTH FIRST COMRADE!');
    return;
  }
  
  stopRhythm();
  let interval;
  switch (pattern) {
    case '4': interval = 500; break;
    case '8': interval = 250; break;
    case '16': interval = 125; break;
  }
  
  rhythmInterval = setInterval(() => {
    safeAudioOperation(() => {
      AppState.masterGain.gain.setTargetAtTime(0.3, AppState.audioCtx.currentTime, 0.005);
      setTimeout(() => {
        if (isAudioContextValid()) {
          AppState.masterGain.gain.setTargetAtTime(0.05, AppState.audioCtx.currentTime, 0.005);
        }
      }, 50);
    });
  }, interval);
}

function stopRhythm() {
  if (rhythmInterval) {
    clearInterval(rhythmInterval);
    rhythmInterval = null;
  }
}

// EVENT LISTENER DEVRİMİ
function initializeEventListeners() {
  // High-performance touch/mouse events
  elements.pad.addEventListener("touchstart", handleTouch, { passive: false });
  elements.pad.addEventListener("touchmove", handleTouch, { passive: false });
  elements.pad.addEventListener("mousedown", handleTouch);
  elements.pad.addEventListener("mousemove", e => {
    if (e.buttons === 1) handleTouch(e);
  });
  
  // Control buttons
  elements.startBtn.addEventListener("click", startSynth);
  elements.stopBtn.addEventListener("click", stopSynth);
  elements.motionBtn.addEventListener("click", () => {
    AppState.motionEnabled ? disableMotion() : requestMotionPermission();
  });
  elements.panBtn.addEventListener("click", togglePan);
  elements.toggleControls.addEventListener("click", toggleControls);
  
  // Octave controls
  document.getElementById("octUp").addEventListener("click", () => {
    AppState.octaveOffset++;
    applyPitch();
    createNoteRuler();
  });
  document.getElementById("octDown").addEventListener("click", () => {
    AppState.octaveOffset--;
    applyPitch();
    createNoteRuler();
  });
  
  // Permission modal
  document.getElementById("permissionAllow").addEventListener("click", () => {
    DeviceOrientationEvent.requestPermission().then(r => {
      elements.permissionModal.style.display = 'none';
      if (r === 'granted') {
        startMotionControl();
      } else {
        showStatus('MOTION REVOLUTION DENIED!');
      }
    }).catch(e => {
      elements.permissionModal.style.display = 'none';
      showStatus('PERMISSION REVOLUTION FAILED!');
    });
  });
  document.getElementById("permissionDeny").addEventListener("click", () => {
    elements.permissionModal.style.display = 'none';
    showStatus('MOTION REVOLUTION DENIED!');
  });
  
  // Wave selection
  document.getElementById("waveSelect").addEventListener("change", e => {
    AppState.waveType = e.target.value;
    cleanupOscillators();
    createOscillators();
    connectAudioGraph();
    showStatus('WAVE: ' + AppState.waveType.toUpperCase());
  });
  
  // Real-time controls
  document.getElementById("detuneRange").addEventListener("input", e => {
    AppState.detuneAmount = parseFloat(e.target.value);
    if (AppState.oscillators.length > 0) {
      AppState.oscillators.forEach((osc, i) => {
        if (osc.detune) osc.detune.value = (i - Math.floor(AppState.NUM_OSC / 2)) * AppState.detuneAmount;
      });
    }
  });
  
  document.getElementById("filterFreq").addEventListener("input", e => {
    audioNodes.filter.frequency.value = parseFloat(e.target.value);
  });
  
  document.getElementById("filterReso").addEventListener("input", e => {
    audioNodes.filter.Q.value = parseFloat(e.target.value);
  });
  
  document.getElementById("autoWahRate").addEventListener("input", e => {
    audioNodes.autoWahLFO.frequency.value = parseFloat(e.target.value);
  });
  
  document.getElementById("autoWahDepth").addEventListener("input", e => {
    audioNodes.autoWahGain.gain.value = parseFloat(e.target.value);
  });
  
  // Effect toggles
  const toggleMap = {
    toggleDist: 'dist',
    toggleAutoWah: 'autoWah',
    toggleFlanger: 'flanger',
    toggleChorus: 'chorus',
    toggleTremolo: 'tremolo',
    toggleFilter: 'filter',
    toggleDelay: 'delay',
    toggleReverb: 'reverb'
  };
  
  Object.entries(toggleMap).forEach(([id, effect]) => {
    document.getElementById(id).addEventListener("click", () => {
      effects[effect] = !effects[effect];
      document.getElementById(id).classList.toggle('active', effects[effect]);
      connectAudioGraph();
      showStatus(effect.toUpperCase() + ' ' + (effects[effect] ? 'ON' : 'OFF'));
      if (effect === 'autoWah') {
        elements.wahDisplay.style.display = effects[effect] ? 'block' : 'none';
        elements.wahDisplay.textContent = 'Wah:' + (effects[effect] ? 'ON' : 'OFF');
      }
    });
  });
  
  // Rhythm controls
  document.getElementById("rhythm4").addEventListener("click", () => {
    startRhythm('4');
    showStatus('1/4 RHYTHM REVOLUTION!');
  });
  document.getElementById("rhythm8").addEventListener("click", () => {
    startRhythm('8');
    showStatus('1/8 RHYTHM REVOLUTION!');
  });
  document.getElementById("rhythm16").addEventListener("click", () => {
    startRhythm('16');
    showStatus('1/16 RHYTHM REVOLUTION!');
  });
  document.getElementById("rhythmStop").addEventListener("click", () => {
    stopRhythm();
    showStatus('RHYTHM REVOLUTION STOPPED!');
  });
}

// DEVRİM BAŞLASIN!
window.addEventListener('load', () => {
  updateThemeColor('C');
  initializeEventListeners();
  updateButtonStates();
  createNoteRuler();
  showStatus('READY FOR REVOLUTION! CLICK START! 🎵');
});

// Context menu devrimi
window.addEventListener("contextmenu", e => e.preventDefault());
</script>
