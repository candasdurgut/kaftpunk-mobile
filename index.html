<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Premium Synth</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

:root {
    --r: 100;
    --g: 100;
    --b: 100;
    --bg-color: rgb(var(--r), var(--g), var(--b));
    --control-bg: rgba(0, 0, 0, 0.2);
    --text-color: #f0f0f0;
    --border-color: rgba(var(--r), var(--g), var(--b), 0.5);
}

html, body {
    margin: 0; padding: 0; height: 100%;
    background-color: #111;
    color: var(--text-color);
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    touch-action: none;
    overscroll-behavior: none;
    /* Renk geçişi daha hızlı ve dinamik */
    transition: background-color 0.05s ease;
}

body {
    background-color: var(--bg-color);
}

#pad {
    width: 100vw;
    height: 60vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, var(--control-bg), rgba(0,0,0,0.5));
    cursor: crosshair;
    overflow: hidden;
}

#noteDisplay {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background-color: rgba(0, 0, 0, 0.5);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 28px;
    font-weight: 600;
    color: var(--text-color);
    pointer-events: none;
    z-index: 10;
    text-shadow: 0 0 15px var(--bg-color);
    border: 1px solid var(--border-color);
}

#controls {
    height: 40vh;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    padding: 15px;
    background: rgba(0,0,0,0.4);
    box-sizing: border-box;
    overflow-y: auto;
    backdrop-filter: blur(10px);
}

button, select, input[type=range], label {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    background: var(--control-bg);
    color: var(--text-color);
    -webkit-appearance: none;
    appearance: none;
    transition: all 0.2s ease;
}

button {
    padding: 12px 20px;
    cursor: pointer;
}

button:hover, select:hover {
    background: rgba(var(--r), var(--g), var(--b), 0.2);
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(var(--r), var(--g), var(--b), 0.3);
}

button.active {
    background: var(--bg-color);
    color: #111;
    font-weight: 600;
    box-shadow: 0 0 20px var(--bg-color);
}

label {
    font-size: 12px;
    margin-bottom: 5px;
    display: block;
    text-align: center;
    color: var(--border-color);
}

.control-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

input[type=range] {
    width: 100%;
    height: 6px;
    background: rgba(var(--r), var(--g), var(--b), 0.2);
    outline: none;
    border: none;
    padding: 0;
}

input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    background: var(--bg-color);
    cursor: pointer;
    border-radius: 50%;
    box-shadow: 0 0 10px var(--bg-color);
}

input[type=range]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    background: var(--bg-color);
    cursor: pointer;
    border-radius: 50%;
    box-shadow: 0 0 10px var(--bg-color);
}

select {
    padding: 10px;
    cursor: pointer;
}

/* --- Cetvel Stilleri --- */
#noteRuler {
    position: absolute;
    top: 0;
    left: 0;
    width: 60px;
    height: 100%;
    background: rgba(0, 0, 0, 0.3);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 10px 0;
    box-sizing: border-box;
    pointer-events: none;
    z-index: 5;
}

.ruler-item {
    display: flex;
    align-items: center;
    width: 100%;
    padding-right: 10px;
    box-sizing: border-box;
}

.ruler-item .tick {
    width: 10px;
    height: 1px;
    background-color: var(--border-color);
    margin-right: 8px;
}

.ruler-item .note-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--border-color);
    text-align: right;
    width: 100%;
}
</style>
</head>
<body>

<div id="pad">
    <div id="noteDisplay">C4</div>
</div>

<div id="controls">
    <button id="startBtn">Start Synth</button>
    <button id="stopBtn">Stop Synth</button>
    <button id="motionBtn">Enable Motion</button>
    <button id="octDown">Octave -</button>
    <button id="octUp">Octave +</button>
    
    <div class="control-group">
        <label for="waveSelect">Wave Type</label>
        <select id="waveSelect">
            <option value="sawtooth">Sawtooth</option>
            <option value="triangle">Triangle</option>
            <option value="square">Square</option>
            <option value="sine">Sine</option>
        </select>
    </div>

    <div class="control-group">
        <label for="detuneRange">Detune</label>
        <input type="range" id="detuneRange" min="0" max="50" value="15">
    </div>
    
    <div class="control-group">
        <label for="filterFreq">Filter Frequency</label>
        <input type="range" id="filterFreq" min="200" max="20000" value="20000">
    </div>

    <div class="control-group">
        <label for="filterReso">Filter Resonance</label>
        <input type="range" id="filterReso" min="0.5" max="20" value="1" step="0.5">
    </div>
    
    <button id="toggleFilter">Enable Filter</button>
    <button id="toggleReverb">Enable Reverb</button>
    <button id="toggleFlanger">Enable Flanger</button>
    <button id="togglePhaser">Enable Phaser</button>
    <button id="toggleDist">Enable Distortion</button>
    <button id="toggleDelay">Enable Delay</button>

    <div class="control-group">
        <label for="reverbMix">Reverb Mix</label>
        <input type="range" id="reverbMix" min="0" max="100" value="70">
    </div>

    <div class="control-group">
        <label for="distAmount">Distortion Amount</label>
        <input type="range" id="distAmount" min="0" max="100" value="50">
    </div>

    <div class="control-group">
        <label for="delayTime">Delay Time (ms)</label>
        <input type="range" id="delayTime" min="50" max="1000" value="250">
    </div>
    <div class="control-group">
        <label for="delayFeedback">Delay Feedback</label>
        <input type="range" id="delayFeedback" min="0" max="90" value="40">
    </div>
</div>

<script>
let audioCtx;
let oscillators = [];
let masterGain, filter, reverb, delayNode, delayFeedback;
let baseFreq = 261.63, octaveOffset = 0, tiltBend = 0;
let isFilter=false, isReverb=false, isFlanger=false, isPhaser=false, isDist=false, isDelay=false;
const NUM_OSC = 7;
let detuneAmount = 15;
let waveType = "sawtooth";

// --- Effect Nodes ---
let reverbDryWet, flangerDryWet, phaserDryWet, distortionGain, delayDryWet;

// --- Note to Color Mapping ---
const noteColors = {
    'C': [255, 100, 100], 'C#': [255, 150, 100], 'D': [255, 255, 100],
    'D#': [150, 255, 100], 'E': [100, 255, 100], 'F': [100, 255, 150],
    'F#': [100, 255, 255], 'G': [100, 150, 255], 'G#': [100, 100, 255],
    'A': [150, 100, 255], 'A#': [255, 100, 255], 'B': [255, 100, 150]
};

function startSynth(){
    if (audioCtx) {
        audioCtx.close();
    }
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const now = audioCtx.currentTime;

    // --- Main Nodes ---
    masterGain = audioCtx.createGain(); masterGain.gain.value = 0.2;
    filter = audioCtx.createBiquadFilter(); filter.type="lowpass"; filter.frequency.value=20000; filter.Q.value=1;
    reverb = createReverb(audioCtx);
    
    // --- Effects Creation ---
    const flanger = createFlanger(audioCtx); flangerDryWet = flanger.dryWet;
    const phaser = createPhaser(audioCtx); phaserDryWet = phaser.dryWet;
    const distortionWaveShaper = createDistortion(audioCtx); distortionGain = audioCtx.createGain(); distortionGain.gain.value = 0;
    
    delayNode = audioCtx.createDelay(1.0); delayFeedback = audioCtx.createGain(); delayDryWet = audioCtx.createGain();
    delayNode.delayTime.value = 0.25; delayFeedback.gain.value = 0.4; delayDryWet.gain.value = 0;

    // --- Create Main Oscillators ---
    oscillators = [];
    for(let i=0;i<NUM_OSC;i++){
        const osc = audioCtx.createOscillator();
        osc.type = waveType;
        const detune = (i-Math.floor(NUM_OSC/2))*detuneAmount;
        osc.detune.value = detune;
        osc.connect(masterGain);
        osc.start(now);
        oscillators.push(osc);
    }
    
    // --- TAMAMEN YENİDEN DÜZENLENMİŞ SİNYAL YOLU ---
    masterGain.connect(filter);

    // Ana (kuru) sinyal için bir kazanç düğümü
    const dryGain = audioCtx.createGain();
    dryGain.gain.value = 1.0;
    filter.connect(dryGain);

    // Efektleri paralel olarak bağla
    filter.connect(reverb); reverb.connect(reverbDryWet);
    filter.connect(flanger.delay); flangerDryWet.connect(audioCtx.destination);
    filter.connect(phaser.filter); phaserDryWet.connect(audioCtx.destination);
    filter.connect(distortionGain); distortionGain.connect(distortionWaveShaper); distortionWaveShaper.connect(audioCtx.destination);
    filter.connect(delayNode); delayNode.connect(delayFeedback); delayFeedback.connect(delayNode); delayDryWet.connect(audioCtx.destination);
    
    // Tüm sinyalleri (kuru ve ıslak) birleştir
    dryGain.connect(audioCtx.destination);
    reverbDryWet.connect(audioCtx.destination);
}

// === Helper Functions (Reverb, Flanger, Phaser, Distortion) ===
function createReverb(ctx) {
    const convolver = ctx.createConvolver(); const len = 3*ctx.sampleRate;
    const impulse = ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){ const buf = impulse.getChannelData(c);
        for(let i=0;i<len;i++){ buf[i]=(Math.random()*2-1)*(1-i/len); }
    } convolver.buffer = impulse; return convolver;
}

function createFlanger(ctx) {
    const delay = ctx.createDelay(0.005); delay.delayTime.value = 0.002;
    const feedback = ctx.createGain(); feedback.gain.value = 0.7;
    const dryWet = ctx.createGain(); dryWet.gain.value = 0;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.25;
    const lfoGain = ctx.createGain(); lfoGain.gain.value = 0.001;
    lfo.connect(lfoGain); lfoGain.connect(delay.delayTime); lfo.start();
    delay.connect(feedback); feedback.connect(delay);
    return { delay, feedback, dryWet, lfo, lfoGain };
}

function createPhaser(ctx) {
    const stages = 8;
    const filters = [];
    for (let i = 0; i < stages; i++) {
        filters.push(ctx.createBiquadFilter());
        filters[i].type = "allpass";
        filters[i].frequency.value = 1000;
        filters[i].Q.value = 1;
    }
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.5;
    const lfoGain = ctx.createGain(); lfoGain.gain.value = 800;
    lfo.connect(lfoGain);
    lfoGain.connect(filters[0].frequency);
    for (let i = 1; i < stages; i++) {
        lfoGain.connect(filters[i].frequency);
    }
    lfo.start();
    const dryWet = ctx.createGain(); dryWet.gain.value = 0;
    for (let i = 0; i < stages - 1; i++) {
        filters[i].connect(filters[i + 1]);
    }
    return { filter: filters[0], filters, lfo, dryWet };
}

function createDistortion(ctx) {
    const waveshaper = ctx.createWaveShaper(); const amount = 50; const samples = 44100;
    const curve = new Float32Array(samples); const deg = Math.PI / 180;
    for (let i = 0; i < samples; i++) { const x = (i * 2) / samples - 1;
        curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
    } waveshaper.curve = curve; waveshaper.oversample = '4x'; return waveshaper;
}

// === UI Logic ===
const pad = document.getElementById("pad"); const noteDisplay = document.getElementById("noteDisplay");
const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const root = document.documentElement;

function createNoteRuler() {
    const ruler = document.createElement('div');
    ruler.id = 'noteRuler';
    pad.appendChild(ruler);

    const notesToShow = [
        { name: 'C', octave: 5 },
        { name: 'A', octave: 4 },
        { name: 'F', octave: 4 },
        { name: 'D', octave: 4 },
        { name: 'B', octave: 3 },
        { name: 'G', octave: 3 },
        { name: 'E', octave: 3 },
        { name: 'C', octave: 3 }
    ];

    notesToShow.forEach(noteInfo => {
        const item = document.createElement('div');
        item.className = 'ruler-item';
        const tick = document.createElement('div'); tick.className = 'tick';
        const label = document.createElement('div'); label.className = 'note-label';
        label.textContent = `${noteInfo.name}${noteInfo.octave}`;
        item.appendChild(tick); item.appendChild(label);
        ruler.appendChild(item);
    });
}

function freqToNote(freq) {
    const A4 = 440;
    const semitonesFromA4 = 12 * Math.log2(freq / A4);
    const noteIndex = Math.round(semitonesFromA4 + 9) % 12;
    const octave = Math.floor((semitonesFromA4 + 9) / 12);
    const noteName = noteNames[(noteIndex + 12) % 12];
    return { name: noteName, octave: octave, fullName: `${noteName}${octave}` };
}

function updateThemeColor(noteName) {
    const color = noteColors[noteName];
    root.style.setProperty('--r', color[0]);
    root.style.setProperty('--g', color[1]);
    root.style.setProperty('--b', color[2]);
}

// --- YENİ: 1 OKTAVLİK PAD ---
function noteFromPad(y){
    const padHeight = window.innerHeight * 0.6;
    const ratio = 1 - (y / padHeight);
    // 1 oktavlık aralık (C'ten C'ye)
    const rootNoteFreq = 261.63 * Math.pow(2, octaveOffset); // C4 veya seçilen oktav
    return rootNoteFreq * Math.pow(2, ratio);
}

function applyPitch(){
    const freq = baseFreq * Math.pow(2, tiltBend / 12);
    const noteInfo = freqToNote(freq);
    
    oscillators.forEach(osc => osc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.01));
    
    noteDisplay.textContent = noteInfo.fullName;
    updateThemeColor(noteInfo.name);
}

pad.addEventListener("touchstart", handleTouch, { passive: false });
pad.addEventListener("touchmove", handleTouch, { passive: false });
pad.addEventListener("mousedown", handleTouch);
pad.addEventListener("mousemove", e => { if (e.buttons === 1) handleTouch(e);});

function handleTouch(e){
    e.preventDefault();
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    
    baseFreq = noteFromPad(clientY);
    
    const volume = clientX / window.innerWidth;
    masterGain.gain.setTargetAtTime(volume * 0.4, audioCtx.currentTime, 0.01);

    applyPitch();
}

// --- YENİ: DİK EKSEN HAREKET KONTROLÜ ---
function enableMotion(){
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
        DeviceOrientationEvent.requestPermission().then(res=>{ if(res==='granted'){
            window.addEventListener("deviceorientation", handleOrientation);
        }});
    } else { 
        window.addEventListener("deviceorientation", handleOrientation);
    }
    document.getElementById("motionBtn").textContent = "Disable Motion";
    document.getElementById("motionBtn").onclick = disableMotion;
}

function disableMotion() {
    window.removeEventListener("deviceorientation", handleOrientation);
    tiltBend = 0;
    applyPitch();
    document.getElementById("motionBtn").textContent = "Enable Motion";
    document.getElementById("motionBtn").onclick = enableMotion;
}

function handleOrientation(e) {
    // Beta (dönme) eksenini kullanarak nota bükme
    if (e.beta !== null) {
        // Beta -180 ile 180 arasıdır. Bunu -12 ile +12 aralığına ölçeklendiriyoruz.
        // -45 ila 45 arası daha kullanışlı bir aralıktır.
        const normalizedBeta = Math.max(-45, Math.min(45, e.beta));
        tiltBend = (normalizedBeta / 45) * 12;
        applyPitch();
    }
}

// === Event Listeners ===
document.getElementById("startBtn").onclick = ()=>startSynth();
document.getElementById("stopBtn").onclick = ()=>{ if(audioCtx){ audioCtx.close(); audioCtx = null; } };
document.getElementById("motionBtn").onclick = ()=>enableMotion();
document.getElementById("octUp").onclick = ()=>{ octaveOffset++; applyPitch(); };
document.getElementById("octDown").onclick = ()=>{ octaveOffset--; applyPitch(); };
document.getElementById("waveSelect").onchange = e=>{ waveType = e.target.value; oscillators.forEach(osc=>osc.type=waveType); };
document.getElementById("detuneRange").oninput = e=>{ detuneAmount = parseFloat(e.target.value); oscillators.forEach((osc,i)=>{ const det = (i-Math.floor(NUM_OSC/2))*detuneAmount; osc.detune.setValueAtTime(det,audioCtx.currentTime); }); };
document.getElementById("filterFreq").oninput = e=>{ if(filter) filter.frequency.setTargetAtTime(parseFloat(e.target.value), audioCtx.currentTime, 0.01); };
document.getElementById("filterReso").oninput = e=>{ if(filter) filter.Q.value=parseFloat(e.target.value); };
document.getElementById("delayTime").oninput = e=>{ if(delayNode) delayNode.delayTime.value = parseFloat(e.target.value) / 1000; };
document.getElementById("delayFeedback").oninput = e=>{ if(delayFeedback) delayFeedback.gain.value = parseFloat(e.target.value) / 100; };
document.getElementById("reverbMix").oninput = e=>{ if(reverbDryWet) reverbDryWet.gain.value = parseFloat(e.target.value) / 100; };

// --- DÜZELTİLMİŞ DISTORTION KONTROLÜ ---
document.getElementById("distAmount").oninput = e=>{ 
    const amount = parseFloat(e.target.value);
    if(distortionGain && distortionGain.context) {
        const ws = distortionGain.context.createWaveShaper();
        const samples = 44100; const deg = Math.PI / 180;
        const curve = new Float32Array(samples);
        for (let i = 0; i < samples; i++) { const x = (i * 2) / samples - 1;
            curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
        }
        ws.curve = curve; ws.oversample = '4x';
        
        // Eski waveshaper'ı değiştir
        const oldNode = distortionGain.disconnect();
        distortionGain.connect(ws);
        ws.connect(audioCtx.destination);
    }
};

// --- DÜZELTİLMİŞ EFETK TOGGLE'LARI ---
document.getElementById("toggleFilter").onclick = () => {
    isFilter = !isFilter;
    const targetFreq = isFilter ? parseFloat(document.getElementById('filterFreq').value) : 20000;
    const targetQ = isFilter ? parseFloat(document.getElementById('filterReso').value) : 1;
    filter.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.01);
    filter.Q.setTargetAtTime(targetQ, audioCtx.currentTime, 0.01);
    document.getElementById("toggleFilter").classList.toggle('active', isFilter);
};
document.getElementById("toggleReverb").onclick = () => { isReverb = !isReverb; reverbDryWet.gain.setTargetAtTime(isReverb ? parseFloat(document.getElementById('reverbMix').value)/100 : 0, audioCtx.currentTime, 0.01); document.getElementById("toggleReverb").classList.toggle('active', isReverb); };
document.getElementById("toggleFlanger").onclick = () => { isFlanger = !isFlanger; flangerDryWet.gain.setTargetAtTime(isFlanger ? 0.7 : 0, audioCtx.currentTime, 0.01); document.getElementById("toggleFlanger").classList.toggle('active', isFlanger); };
document.getElementById("togglePhaser").onclick = () => { isPhaser = !isPhaser; phaserDryWet.gain.setTargetAtTime(isPhaser ? 0.7 : 0, audioCtx.currentTime, 0.01); document.getElementById("togglePhaser").classList.toggle('active', isPhaser); };
document.getElementById("toggleDist").onclick = () => { isDist = !isDist; distortionGain.gain.setTargetAtTime(isDist ? 1 : 0, audioCtx.currentTime, 0.01); document.getElementById("toggleDist").classList.toggle('active', isDist); };
document.getElementById("toggleDelay").onclick = () => { isDelay = !isDelay; delayDryWet.gain.setTargetAtTime(isDelay ? 0.5 : 0, audioCtx.currentTime, 0.01); document.getElementById("toggleDelay").classList.toggle('active', isDelay); };

// Initialize
window.addEventListener('load', () => {
    createNoteRuler();
    updateThemeColor('C');
});

window.addEventListener("contextmenu", e=>e.preventDefault());
</script>
</body>
</html>
