<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>Synth Pro</title>
<style>
:root{--r:100;--g:100;--b:100;--bg:rgb(var(--r),var(--g),var(--b));--control-bg:rgba(0,0,0,0.18);--text:#f0f0f0;--border:rgba(var(--r),var(--g),var(--b),0.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#111;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial}
body{background:var(--bg);transition:background .12s}
#pad{position:fixed;left:0;top:0;right:50px;bottom:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,var(--control-bg),rgba(0,0,0,0.45));cursor:crosshair;overflow:hidden;z-index:1}
#displayInfo{position:absolute;top:max(20px,env(safe-area-inset-top));left:20px;background:rgba(0,0,0,0.7);color:var(--text);padding:12px 18px;border-radius:16px;border:1px solid var(--border);backdrop-filter:blur(8px);font-size:28px;font-weight:600;min-width:120px;text-align:center}
#motionDisplay,#wahDisplay,#panDisplay{position:absolute;bottom:20px;left:20px;background:rgba(0,0,0,0.7);color:var(--text);padding:8px 12px;border-radius:12px;border:1px solid var(--border);backdrop-filter:blur(8px);font-size:11px;display:none}
#noteRuler{position:absolute;right:0;top:0;bottom:0;width:50px;background:rgba(0,0,0,0.28);border-left:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:6px 0;pointer-events:none}
.ruler-note{display:flex;align-items:center;justify-content:center;flex:1;font-size:9px;color:var(--border);border-bottom:1px solid rgba(255,255,255,0.06)}
#toggleControls{position:fixed;right:0;bottom:0;width:50px;height:50px;border-radius:50% 50% 0 0;background:var(--bg);border:2px solid var(--border);border-bottom:0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2000;font-size:20px}
#controls{position:fixed;left:0;right:0;bottom:0;padding:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;background:rgba(0,0,0,0.95);backdrop-filter:blur(14px);border-top:2px solid var(--border);max-height:50vh;overflow-y:auto;transform:translateY(calc(100% - 50px));transition:transform .28s;z-index:1999}
#controls.expanded{transform:translateY(0)}
button,select,input[type=range],input[type=number],label{font-family:inherit;font-size:11px;border-radius:6px;border:1px solid var(--border);background:var(--control-bg);color:var(--text);padding:6px}
button{cursor:pointer;transition:all .15s;padding:6px 8px}
button:active{transform:scale(.95)}
button.active{background:var(--bg);color:#111;font-weight:700}
input[type=range]{cursor:pointer;padding:3px}
input[type=number]{width:50px;text-align:center;padding:4px}
.control-group{display:flex;flex-direction:column;align-items:center;gap:3px}
.control-group label{font-size:9px;color:#888}
.control-group select{padding:4px}
.rhythm-section{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:rgba(0,0,0,0.4);padding:8px;border-radius:6px;border:1px solid var(--border)}
.rhythm-controls{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(0,0,0,0.3);padding:6px;border-radius:6px}
.effect-section{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(0,0,0,0.4);padding:8px;border-radius:6px;border:1px solid var(--border)}
.delay-section{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(0,0,0,0.4);padding:8px;border-radius:6px;border:1px solid var(--border)}
#statusMessage{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;background:rgba(0,0,0,0.9);padding:6px 12px;border-radius:8px;opacity:0;transition:opacity .2s;color:#fff;font-size:11px;pointer-events:none;z-index:2001}
#statusMessage.show{opacity:1}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:3000}
.modal-content{background:rgba(30,30,30,0.98);padding:16px;border-radius:12px;border:1px solid var(--border);max-width:85%}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(.96)}100%{transform:scale(1)}}
.pulse{animation:pulse .28s}
@keyframes flash{0%{background:rgba(255,255,255,.1)}50%{background:rgba(255,255,255,.02)}}
.flash{animation:flash .12s}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:rgba(0,0,0,0.3)}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.3);border-radius:3px}
</style>
</head>
<body>
<div id="pad">
<div id="displayInfo">C4</div>
<div id="motionDisplay">Tilt:0°</div>
<div id="wahDisplay">Wah:ON</div>
<div id="panDisplay">Pan:0%</div>
<div id="noteRuler"></div>
</div>
<button id="toggleControls">⚙️</button>
<div id="controls">
<button id="startBtn" style="grid-column:1/3">Start</button>
<button id="stopBtn" disabled style="grid-column:3/5">Stop</button>
<button id="motionBtn" style="grid-column:5/7">Motion</button>
<button id="panBtn" style="grid-column:7/9">Pan</button>
<button id="octDown" style="grid-column:9/10">Oct−</button>
<button id="octUp" style="grid-column:10/11">Oct+</button>
<div class="control-group" style="grid-column:1/3">
<label>Wave</label>
<select id="waveSelect">
<option value="sawtooth">Saw</option>
<option value="triangle">Tri</option>
<option value="square">Sqr</option>
<option value="sine">Sin</option>
<option value="pulse">Pls</option>
<option value="fm">FM</option>
</select>
</div>
<div class="control-group" style="grid-column:3/5">
<label>Detune ¢</label>
<input id="detuneRange" type="range" min="0" max="50" value="15" style="width:100%"/>
</div>
<div class="control-group" style="grid-column:5/7">
<label>FM Hz</label>
<input id="fmDepthRange" type="range" min="0" max="1200" value="0" style="width:100%"/>
</div>
<div class="control-group" style="grid-column:7/9">
<label>Pulse</label>
<input id="pulseWidthRange" type="range" min="0.01" max="0.99" value="0.5" step="0.01" style="width:100%"/>
</div>
<div class="control-group" style="grid-column:9/11">
<label>Filt Hz</label>
<input id="filterFreq" type="range" min="200" max="20000" value="20000" step="100" style="width:100%"/>
</div>
<div class="control-group" style="grid-column:11/13">
<label>Filt Q</label>
<input id="filterReso" type="range" min="0.5" max="10" value="1" step="0.1" style="width:100%"/>
</div>
<div class="control-group" style="grid-column:1/3">
<label>Wah Hz</label>
<input id="autoWahRate" type="range" min="0.1" max="8" value="1" step="0.1" style="width:100%"/>
</div>
<div class="control-group" style="grid-column:3/5">
<label>Wah Dpth</label>
<input id="autoWahDepth" type="range" min="0" max="1200" value="600" style="width:100%"/>
</div>
<div class="rhythm-section" style="grid-column:1/-1">
<div class="control-group" style="grid-column:1/2">
<label>BPM</label>
<input id="bpmInput" type="number" min="1" max="255" value="120"/>
</div>
<input id="bpmSlider" type="range" min="1" max="255" value="120" style="grid-column:2/6;cursor:pointer;margin:auto 0"/>
<button id="rhythmToggle" style="grid-column:6/7">Ritim</button>
</div>
<div class="rhythm-controls" style="grid-column:1/-1">
<button id="rhythm16" style="font-size:10px">16th</button>
<button id="rhythm8" style="font-size:10px">8th</button>
<button id="rhythmTriplet" style="font-size:10px">Trip</button>
<button id="rhythmShuffle" style="font-size:10px">Shuf</button>
<button id="rhythmDotted" style="font-size:10px">Dot</button>
<button id="rhythmStutter" style="font-size:10px">Stut</button>
</div>
<div class="delay-section" style="grid-column:1/-1">
<div class="control-group">
<label>Delay T</label>
<input id="delayTime" type="range" min="0.01" max="1" value="0.3" step="0.01" style="width:100%"/>
</div>
<div class="control-group">
<label>Delay FB</label>
<input id="delayFeedback" type="range" min="0" max="0.8" value="0.45" step="0.05" style="width:100%"/>
</div>
<div class="control-group">
<label>Delay %</label>
<input id="delayMix" type="range" min="0" max="100" value="0" style="width:100%"/>
</div>
</div>
<div class="effect-section" style="grid-column:1/-1">
<button id="toggleDist" style="font-size:10px">Dist</button>
<button id="toggleAutoWah" style="font-size:10px">Wah</button>
<button id="toggleFlanger" style="font-size:10px">Flang</button>
<button id="toggleChorus" style="font-size:10px">Chorus</button>
<button id="toggleTremolo" style="font-size:10px">Trem</button>
<button id="toggleFilter" style="font-size:10px">Filt</button>
<button id="toggleDelay" style="font-size:10px">Dly</button>
<button id="toggleReverb" style="font-size:10px">Rev</button>
</div>
</div>
<div id="statusMessage"></div>
<div id="permissionModal" class="modal">
<div class="modal-content">
<h3>Motion Access</h3>
<p>Device motion sensors gerekli</p>
<div style="display:flex;gap:8px;margin-top:12px;">
<button id="permissionAllow">İzin Ver</button>
<button id="permissionDeny">Reddet</button>
</div>
</div>
</div>
<script>
const workletCode=`class SynthProcessor extends AudioWorkletProcessor{static get parameterDescriptors(){return[{name:'baseFreq',defaultValue:261.63,minValue:20,maxValue:20000,automationRate:'a-rate'},{name:'fmDepth',defaultValue:0,minValue:0,maxValue:5000,automationRate:'a-rate'},{name:'pulseWidth',defaultValue:0.5,minValue:0.01,maxValue:0.99,automationRate:'k-rate'}]}constructor(){super();this.sampleRate=sampleRate;this.numVoices=7;this.phases=new Float32Array(this.numVoices);this.detunes=new Float32Array(this.numVoices);this.wave='sawtooth';this.fmEnabled=false;this.fmPhase=0;this.fmFreq=2;this.twoPI=2*Math.PI;this.port.onmessage=e=>{const d=e.data;if(d.type==='detuneArray'&&d.detuneArray)for(let i=0;i<Math.min(this.numVoices,d.detuneArray.length);i++)this.detunes[i]=d.detuneArray[i];else if(d.type==='wave'){this.wave=d.wave;this.fmEnabled=d.wave==='fm'}else if(d.type==='voices'){const nv=Math.min(12,Math.max(1,d.numVoices));if(nv!==this.numVoices){this.numVoices=nv;this.phases=new Float32Array(this.numVoices);this.detunes=new Float32Array(this.numVoices)}}}}polyBLEP(t,dt){if(t<dt){t/=dt;return t+t-t*t-1}else if(t>1-dt){t=(t-1)/dt;return t*t+t+t+1}return 0}bl_saw(phase,dt){let t=phase%1,v=2*t-1;v-=this.polyBLEP(t,dt);return v}bl_square(phase,duty,dt){let t=phase%1,v=t<duty?1:-1;v+=this.polyBLEP(t,dt);let t2=(t-duty+1)%1;v-=this.polyBLEP(t2,dt);return v}process(inputs,outputs,parameters){const out=outputs[0];if(!out||!out[0])return true;const chCount=out.length,frames=out[0].length,baseFreqArr=parameters.baseFreq,fmDepthArr=parameters.fmDepth,pulseArr=parameters.pulseWidth;const detuneFactors=new Float32Array(this.numVoices);for(let v=0;v<this.numVoices;v++)detuneFactors[v]=Math.pow(2,(this.detunes[v]||0)/1200);for(let i=0;i<frames;i++){const baseFreq=baseFreqArr.length>1?baseFreqArr[i]:baseFreqArr[0],fmDepth=fmDepthArr.length>1?fmDepthArr[i]:fmDepthArr[0],pulseW=pulseArr.length>1?pulseArr[i]:pulseArr[0];const fmInc=(this.fmFreq||2)/this.sampleRate;this.fmPhase+=fmInc;if(this.fmPhase>=1)this.fmPhase-=1;const fmModGlobal=Math.sin(this.twoPI*this.fmPhase)*fmDepth;let maxF=baseFreq*detuneFactors[0];for(let v=1;v<this.numVoices;v++){const f=baseFreq*detuneFactors[v];if(f>maxF)maxF=f}maxF+=Math.abs(fmModGlobal);maxF=Math.min(maxF,this.sampleRate*0.49);const dt=Math.min(0.5,maxF/this.sampleRate);let mix=0;for(let v=0;v<this.numVoices;v++){let freq=baseFreq*detuneFactors[v];if(this.fmEnabled&&fmDepth!==0){freq+=fmModGlobal;freq=Math.max(20,Math.min(freq,this.sampleRate*0.49))}const phaseInc=freq/this.sampleRate;let p=this.phases[v],s=0;switch(this.wave){case'sine':s=Math.sin(this.twoPI*p);break;case'square':s=this.bl_square(p,.5,dt);break;case'pulse':s=this.bl_square(p,pulseW,dt);break;case'sawtooth':s=this.bl_saw(p,dt);break;case'triangle':s=2*Math.abs(2*(p-Math.floor(p+.5)))-1;break;case'fm':s=Math.sin(this.twoPI*p);break;default:s=Math.sin(this.twoPI*p)}mix+=s;p+=phaseInc;if(p>=1)p-=1;this.phases[v]=p}mix=mix/this.numVoices*.85;for(let ch=0;ch<chCount;ch++)out[ch][i]=mix}return true}}registerProcessor('synth-processor',SynthProcessor);`;

const workerCode=`let isRunning=false,tempo=120,step=0.25,tickIndex=0,startTime=0;self.onmessage=e=>{const d=e.data;if(d.type==='start'){isRunning=true;tempo=d.tempo||120;startTime=d.audioTime+.05;tickIndex=0;setPattern(d.pattern||'16');scheduler()}else if(d.type==='stop'){isRunning=false}};function setPattern(p){const quarter=60/tempo,sixteenth=quarter/4;switch(p){case'16':step=sixteenth;break;case'8':step=sixteenth*2;break;case'triplet':step=sixteenth*4/3;break;case'shuffle':step=sixteenth*1.5;break;case'dotted':step=sixteenth*6;break;case'stutter':step=sixteenth*.5;break;default:step=sixteenth}}function scheduler(){if(!isRunning)return;const elapsed=(performance.now()/1000)-startTime,scheduleTime=startTime+tickIndex*step;if(scheduleTime<performance.now()/1000+.1){self.postMessage({type:'beat',relativeTime:tickIndex*step});tickIndex++}setTimeout(()=>scheduler(),25)}`;

const AppState={audioCtx:null,engine:null,workletNode:null,lastVolume:.15,baseFreq:261.63,octaveOffset:0,waveType:'sawtooth',detuneAmount:15,fmDepth:0,pulseWidth:.5,isPlaying:false,motionEnabled:false,panEnabled:false,NUM_VOICES:7,pendingPan:0,pendingTilt:0,smoothedPan:0,smoothedTilt:0,lastDetuneSent:null,schedulerWorker:null,rhythmRunning:false,bpm:120,delayMix:0};

const elements={pad:document.getElementById('pad'),displayInfo:document.getElementById('displayInfo'),motionDisplay:document.getElementById('motionDisplay'),wahDisplay:document.getElementById('wahDisplay'),panDisplay:document.getElementById('panDisplay'),startBtn:document.getElementById('startBtn'),stopBtn:document.getElementById('stopBtn'),motionBtn:document.getElementById('motionBtn'),panBtn:document.getElementById('panBtn'),statusMessage:document.getElementById('statusMessage'),controls:document.getElementById('controls'),toggleControls:document.getElementById('toggleControls'),noteRuler:document.getElementById('noteRuler'),permissionModal:document.getElementById('permissionModal'),bpmInput:document.getElementById('bpmInput'),bpmSlider:document.getElementById('bpmSlider'),rhythmToggle:document.getElementById('rhythmToggle'),delayTime:document.getElementById('delayTime'),delayFeedback:document.getElementById('delayFeedback'),delayMix:document.getElementById('delayMix')};

const noteFrequencies={'A#2':116.54,'B2':123.47,'C3':130.81,'C#3':138.59,'D3':146.83,'D#3':155.56,'E3':164.81,'F3':174.61,'F#3':185,'G3':196,'G#3':207.65,'A3':220,'A#3':233.08,'B3':246.94,'C4':261.63,'C#4':277.18,'D4':293.66};
const noteNames=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

function showStatus(msg,dur=1500){elements.statusMessage.textContent=msg;elements.statusMessage.classList.add('show');clearTimeout(showStatus._t);showStatus._t=setTimeout(()=>elements.statusMessage.classList.remove('show'),dur)}
function updateButtonStates(){elements.startBtn.disabled=AppState.isPlaying;elements.stopBtn.disabled=!AppState.isPlaying;elements.rhythmToggle.textContent=AppState.rhythmRunning?'Durdur':'Ritim';elements.rhythmToggle.classList.toggle('active',AppState.rhythmRunning)}

class AdvancedSynthEngine{constructor(){this.audioContext=null;this.workletNode=null;this.audioNodes={};this.dryWet={};this.effects={dist:false,autoWah:false,flanger:false,chorus:false,tremolo:false,filter:true,delay:false,reverb:false};this.effectLFOs={}}async init(){this.audioContext=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive',sampleRate:44100});await this._addWorkletModuleSafe();this._createNodes();this._connectGraph();this._postInitialParams()}async _addWorkletModuleSafe(){const blob=new Blob([workletCode],{type:'application/javascript'}),url=URL.createObjectURL(blob);try{await this.audioContext.audioWorklet.addModule(url)}catch(e){URL.revokeObjectURL(url);throw e}URL.revokeObjectURL(url)}_createNodes(){const ctx=this.audioContext;this.audioNodes.masterGain=ctx.createGain();this.audioNodes.masterGain.gain.value=AppState.lastVolume;this.audioNodes.tremoloGain=ctx.createGain();this.audioNodes.tremoloGain.gain.value=1;this.audioNodes.panner=ctx.createStereoPanner();this.audioNodes.filter=ctx.createBiquadFilter();this.audioNodes.filter.type='lowpass';this.audioNodes.filter.frequency.value=20000;this.audioNodes.filter.Q.value=1;this.audioNodes.distortion=this._createWaveShaper(50);this.audioNodes.delay=ctx.createDelay(2);this.audioNodes.delay.delayTime.value=.3;this.audioNodes.delayFeedback=ctx.createGain();this.audioNodes.delayFeedback.gain.value=.45;this.audioNodes.delayDry=ctx.createGain();this.audioNodes.delayDry.gain.value=1;this.audioNodes.delayWet=ctx.createGain();this.audioNodes.delayWet.gain.value=0;this.audioNodes.reverb=ctx.createConvolver();if(!window._cachedReverbBuffer){this._createImpulseAsync(ctx,.5).then(buf=>{window._cachedReverbBuffer=buf;this.audioNodes.reverb.buffer=buf}).catch(()=>{})}else{this.audioNodes.reverb.buffer=window._cachedReverbBuffer}this.audioNodes.autoWah=ctx.createBiquadFilter();this.audioNodes.autoWah.type='bandpass';this.audioNodes.autoWah.frequency.value=800;this.audioNodes.autoWah.Q.value=5;this.audioNodes.chorusDelay=ctx.createDelay(.05);this.audioNodes.chorusFeedback=ctx.createGain();this.audioNodes.chorusMix=ctx.createGain();this.audioNodes.chorusFeedback.gain.value=.12;this.audioNodes.chorusMix.gain.value=0;this.audioNodes.flangerDelay=ctx.createDelay(.01);this.audioNodes.flangerFeedback=ctx.createGain();this.audioNodes.flangerMix=ctx.createGain();this.audioNodes.flangerFeedback.gain.value=.45;this.audioNodes.flangerMix.gain.value=0;this.dryWet.distDry=ctx.createGain();this.dryWet.distWet=ctx.createGain();this.dryWet.reverbDry=ctx.createGain();this.dryWet.reverbWet=ctx.createGain();this.dryWet.chorusDry=ctx.createGain();this.dryWet.chorusWet=ctx.createGain();this.dryWet.flangerDry=ctx.createGain();this.dryWet.flangerWet=ctx.createGain();this.dryWet.finalMerge=ctx.createGain();this.dryWet.distDry.gain.value=1;this.dryWet.distWet.gain.value=0;this.dryWet.reverbDry.gain.value=1;this.dryWet.reverbWet.gain.value=0;this.dryWet.chorusDry.gain.value=1;this.dryWet.chorusWet.gain.value=0;this.dryWet.flangerDry.gain.value=1;this.dryWet.flangerWet.gain.value=0}async _createImpulseAsync(ctx,seconds=.5){const len=Math.floor(ctx.sampleRate*seconds),buf=ctx.createBuffer(2,len,ctx.sampleRate),chunk=16384;for(let c=0;c<2;c++){const data=buf.getChannelData(c);for(let i=0;i<len;i+=chunk){const to=Math.min(len,i+chunk);for(let j=i;j<to;j++)data[j]=(Math.random()*2-1)*Math.pow(1-j/len,2.5)*.6;await new Promise(r=>setTimeout(r,0))}}return buf}_connectGraph(){const ctx=this.audioContext;this.workletNode=new AudioWorkletNode(ctx,'synth-processor',{outputChannelCount:[2]});this.workletNode.connect(this.audioNodes.tremoloGain);this.audioNodes.tremoloGain.connect(this.audioNodes.masterGain);const master=this.audioNodes.masterGain;master.connect(this.dryWet.distDry);master.connect(this.audioNodes.distortion);this.audioNodes.distortion.connect(this.dryWet.distWet);const postDist=ctx.createGain();this.dryWet.distDry.connect(postDist);this.dryWet.distWet.connect(postDist);postDist
