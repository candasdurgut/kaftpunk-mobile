<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Synth</title>
<style>
:root {
--r:100;--g:100;--b:100;
--bg-color:rgb(var(--r),var(--g),var(--b));
--control-bg:rgba(0,0,0,0.2);
--text-color:#f0f0f0;
--border-color:rgba(var(--r),var(--g),var(--b),0.5);
--safe-area-inset-top:env(safe-area-inset-top);
--safe-area-inset-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background-color:#111;color:var(--text-color);font-family:-apple-system,sans-serif;font-weight:400;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;overflow:hidden;}
body{background-color:var(--bg-color);}
#app-container{height:100%;display:flex;flex-direction:column;}
#pad{width:100%;height:100vh;position:relative;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at center,var(--control-bg),rgba(0,0,0,0.5));cursor:crosshair;}
#noteDisplay,#octaveDisplay,#motionDisplay,#wahDisplay,#panDisplay{position:absolute;background-color:rgba(0,0,0,0.7);color:var(--text-color);pointer-events:none;z-index:10;border:1px solid var(--border-color);backdrop-filter:blur(10px);padding:8px 16px;border-radius:20px;font-size:14px;font-weight:500;}
#noteDisplay{top:max(20px,var(--safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:24px;text-shadow:0 0 15px var(--bg-color);}
#octaveDisplay{top:max(20px,var(--safe-area-inset-top));right:20px;}
#motionDisplay,#wahDisplay,#panDisplay{bottom:20px;left:50%;transform:translateX(-50%);display:none;}
#wahDisplay{bottom:60px;}#panDisplay{bottom:100px;}
#noteRuler{position:absolute;right:0;top:0;bottom:0;width:60px;background:rgba(0,0,0,0.3);border-left:1px solid var(--border-color);display:flex;flex-direction:column;justify-content:space-between;padding:10px 0;pointer-events:none;z-index:5;}
.ruler-note{display:flex;align-items:center;justify-content:center;flex:1;font-size:11px;color:var(--border-color);border-bottom:1px solid rgba(255,255,255,0.1);}
#controls{position:fixed;bottom:0;left:0;right:0;max-height:70vh;background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);border-top:1px solid var(--border-color);transform:translateY(calc(100% - 50px));transition:transform 0.3s ease;overflow-y:auto;padding:15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;}
#controls.expanded{transform:translateY(0);}
#toggleControls{position:fixed;bottom:10px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--bg-color);border:2px solid var(--border-color);color:#111;font-size:20px;font-weight:bold;cursor:pointer;z-index:1000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(0,0,0,0.5);}
button,select,input[type=range],label{font-family:inherit;font-size:12px;font-weight:500;border-radius:8px;border:1px solid var(--border-color);background:var(--control-bg);color:var(--text-color);-webkit-appearance:none;appearance:none;transition:all 0.2s ease;outline:none;}
button{padding:10px 12px;cursor:pointer;min-height:40px;}
button.active{background:var(--bg-color);color:#111;font-weight:600;}
.control-group{display:flex;flex-direction:column;align-items:center;}
label{font-size:10px;margin-bottom:3px;text-align:center;}
input[type=range]{width:100%;height:4px;background:rgba(var(--r),var(--g),var(--b),0.2);border:none;margin:5px 0;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--bg-color);cursor:pointer;border-radius:50%;box-shadow:0 0 10px var(--bg-color);}
select{padding:8px;cursor:pointer;min-height:40px;width:100%;}
#statusMessage{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:white;padding:8px 16px;border-radius:8px;font-size:12px;z-index:100;opacity:0;transition:opacity 0.3s;pointer-events:none;}
#statusMessage.show{opacity:1;}
.effect-group{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0;padding:8px;background:rgba(0,0,0,0.3);border-radius:8px;border:1px solid var(--border-color);}
.effect-group-title{grid-column:1/-1;text-align:center;font-size:11px;font-weight:600;color:var(--border-color);margin-bottom:3px;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:1000;justify-content:center;align-items:center;}
.modal-content{background:rgba(30,30,30,0.95);padding:20px;border-radius:15px;max-width:80%;text-align:center;backdrop-filter:blur(20px);border:1px solid var(--border-color);}
.modal-buttons{display:flex;gap:8px;margin-top:15px;}
.modal-buttons button{flex:1;}
</style>
</head>
<body>
<div id="app-container">
<div id="pad">
<div id="noteDisplay">C4</div>
<div id="octaveDisplay">Oct:0</div>
<div id="motionDisplay">Tilt:0°</div>
<div id="wahDisplay">Wah:ON</div>
<div id="panDisplay">Pan:0%</div>
<div id="noteRuler"></div>
</div>
<button id="toggleControls">⚙️</button>
<div id="controls">
<button id="startBtn">Start</button>
<button id="stopBtn" disabled>Stop</button>
<button id="motionBtn">Motion</button>
<button id="panBtn">Pan</button>
<button id="octDown">Oct-</button>
<button id="octUp">Oct+</button>
<div class="control-group">
<label>Wave</label>
<select id="waveSelect">
<option value="sawtooth">Saw</option>
<option value="triangle">Tri</option>
<option value="square">Sqr</option>
<option value="sine">Sine</option>
</select>
</div>
<div class="control-group">
<label>Detune</label>
<input type="range" id="detuneRange" min="0" max="50" value="15">
</div>
<div class="effect-group">
<div class="effect-group-title">EFFECTS</div>
<button id="toggleDist">Distortion</button>
<button id="toggleAutoWah">Auto Wah</button>
<button id="toggleFlanger">Flanger</button>
<button id="toggleChorus">Chorus</button>
<button id="toggleTremolo">Tremolo</button>
<button id="toggleFilter">Filter</button>
<button id="toggleDelay">Delay</button>
<button id="toggleReverb">Reverb</button>
</div>
<div class="effect-group">
<div class="effect-group-title">FILTER CONTROLS</div>
<div class="control-group">
<label>Filter Freq</label>
<input type="range" id="filterFreq" min="200" max="20000" value="20000" step="100">
</div>
<div class="control-group">
<label>Filter Reso</label>
<input type="range" id="filterReso" min="0.5" max="20" value="1" step="0.5">
</div>
<div class="control-group">
<label>Wah Rate</label>
<input type="range" id="autoWahRate" min="0.1" max="5" value="1" step="0.1">
</div>
<div class="control-group">
<label>Wah Depth</label>
<input type="range" id="autoWahDepth" min="100" max="1500" value="800">
</div>
</div>
</div>
</div>
<div id="statusMessage"></div>
<div id="permissionModal" class="modal">
<div class="modal-content">
<h3>Motion Access</h3>
<p>Need motion sensor access</p>
<div class="modal-buttons">
<button id="permissionAllow">Allow</button>
<button id="permissionDeny">Deny</button>
</div>
</div>
</div>
<script>
const AppState={audioCtx:null,oscillators:[],masterGain:null,baseFreq:261.63,octaveOffset:0,tiltBend:0,detuneAmount:15,waveType:"sawtooth",isPlaying:false,motionEnabled:false,panEnabled:false,NUM_OSC:7};
const effects={dist:false,autoWah:false,flanger:false,chorus:false,tremolo:false,filter:false,delay:false,reverb:false};
let audioNodes={};
const noteColors={'C':[255,100,100],'C#':[255,150,100],'D':[255,255,100],'D#':[150,255,100],'E':[100,255,100],'F':[100,255,150],'F#':[100,255,255],'G':[100,150,255],'G#':[100,100,255],'A':[150,100,255],'A#':[255,100,255],'B':[255,100,150]};
const elements={
pad:document.getElementById("pad"),noteDisplay:document.getElementById("noteDisplay"),
octaveDisplay:document.getElementById("octaveDisplay"),motionDisplay:document.getElementById("motionDisplay"),
wahDisplay:document.getElementById("wahDisplay"),panDisplay:document.getElementById("panDisplay"),
startBtn:document.getElementById("startBtn"),stopBtn:document.getElementById("stopBtn"),
motionBtn:document.getElementById("motionBtn"),panBtn:document.getElementById("panBtn"),
statusMessage:document.getElementById("statusMessage"),permissionModal:document.getElementById("permissionModal"),
controls:document.getElementById("controls"),toggleControls:document.getElementById("toggleControls"),
noteRuler:document.getElementById("noteRuler")
};
const noteNames=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function isAudioContextValid(){return AppState.audioCtx&&AppState.audioCtx.state==='running';}
function safeAudioOperation(op){if(!isAudioContextValid()){showStatus('Audio not ready');return false;}try{op();return true}catch(e){console.error(e);showStatus('Audio error');return false;}}
function showStatus(msg,dur=1500){elements.statusMessage.textContent=msg;elements.statusMessage.classList.add('show');setTimeout(()=>elements.statusMessage.classList.remove('show'),dur);}
function updateButtonStates(){elements.startBtn.disabled=AppState.isPlaying;elements.stopBtn.disabled=!AppState.isPlaying;}
function cleanupOscillators(){if(AppState.oscillators.length>0){AppState.oscillators.forEach(o=>{try{o.stop();o.disconnect();}catch(e){}});AppState.oscillators=[];}}
function startSynth(){if(isAudioContextValid()){showStatus('Already running');return;}
try{AppState.audioCtx=new (window.AudioContext||window.webkitAudioContext)();createAudioNodes();AppState.isPlaying=true;updateButtonStates();showStatus('Started');}catch(e){console.error(e);showStatus('Start failed');}}
function createAudioNodes(){
cleanupOscillators();AppState.masterGain=AppState.audioCtx.createGain();AppState.masterGain.gain.value=0.2;
audioNodes.panner=AppState.audioCtx.createStereoPanner();audioNodes.panner.pan.value=0;
audioNodes.distortion=createWaveShaper(3);audioNodes.distortionGain=AppState.audioCtx.createGain();audioNodes.distortionGain.gain.value=0;
audioNodes.autoWah=AppState.audioCtx.createBiquadFilter();audioNodes.autoWah.type="bandpass";audioNodes.autoWah.frequency.value=800;audioNodes.autoWah.Q.value=5;
audioNodes.autoWahLFO=AppState.audioCtx.createOscillator();audioNodes.autoWahLFO.frequency.value=1;
audioNodes.autoWahGain=AppState.audioCtx.createGain();audioNodes.autoWahGain.gain.value=600;
audioNodes.autoWahLFO.connect(audioNodes.autoWahGain);audioNodes.autoWahGain.connect(audioNodes.autoWah.frequency);audioNodes.autoWahLFO.start();
audioNodes.flangerDelay=AppState.audioCtx.createDelay(0.02);audioNodes.flangerDelay.delayTime.value=0.005;
audioNodes.flangerLFO=AppState.audioCtx.createOscillator();audioNodes.flangerLFO.frequency.value=0.2;
audioNodes.flangerGain=AppState.audioCtx.createGain();audioNodes.flangerGain.gain.value=0.005;
audioNodes.flangerFeedback=AppState.audioCtx.createGain();audioNodes.flangerFeedback.gain.value=0.5;
audioNodes.flangerLFO.connect(audioNodes.flangerGain);audioNodes.flangerGain.connect(audioNodes.flangerDelay.delayTime);audioNodes.flangerLFO.start();
audioNodes.flangerDry=AppState.audioCtx.createGain();audioNodes.flangerDry.gain.value=0;
audioNodes.chorusDelay=AppState.audioCtx.createDelay(0.05);audioNodes.chorusDelay.delayTime.value=0.025;
audioNodes.chorusLFO=AppState.audioCtx.createOscillator();audioNodes.chorusLFO.frequency.value=0.5;
audioNodes.chorusGain=AppState.audioCtx.createGain();audioNodes.chorusGain.gain.value=0.01;
audioNodes.chorusDry=AppState.audioCtx.createGain();audioNodes.chorusDry.gain.value=0;
audioNodes.chorusLFO.connect(audioNodes.chorusGain);audioNodes.chorusGain.connect(audioNodes.chorusDelay.delayTime);audioNodes.chorusLFO.start();
audioNodes.tremoloGain=AppState.audioCtx.createGain();audioNodes.tremoloGain.gain.value=0;
audioNodes.tremoloLFO=AppState.audioCtx.createOscillator();audioNodes.tremoloLFO.frequency.value=5;
audioNodes.tremoloLFO.connect(audioNodes.tremoloGain);audioNodes.tremoloLFO.start();
audioNodes.filter=AppState.audioCtx.createBiquadFilter();audioNodes.filter.type="lowpass";audioNodes.filter.frequency.value=20000;audioNodes.filter.Q.value=1;
audioNodes.delay=AppState.audioCtx.createDelay(2);audioNodes.delay.delayTime.value=0.3;audioNodes.delayGain=AppState.audioCtx.createGain();audioNodes.delayGain.gain.value=0;
audioNodes.reverb=AppState.audioCtx.createConvolver();const buffer=AppState.audioCtx.createBuffer(2,AppState.audioCtx.sampleRate*2,AppState.audioCtx.sampleRate);for(let c=0;c<2;c++){const d=buffer.getChannelData(c);for(let i=0;i<buffer.length;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/buffer.length,2);}}audioNodes.reverb.buffer=buffer;audioNodes.reverbGain=AppState.audioCtx.createGain();audioNodes.reverbGain.gain.value=0;
createOscillators();connectAudioGraph();}
function createWaveShaper(amount){
const ws=AppState.audioCtx.createWaveShaper();const n=44100;const curve=new Float32Array(n);for(let i=0;i<n;i++){const x=(i-n/2)/(n/2);curve[i]=Math.tanh(x*amount)*0.8;}ws.curve=curve;return ws;}
function createOscillators(){const now=AppState.audioCtx.currentTime;for(let i=0;i<AppState.NUM_OSC;i++){const osc=AppState.audioCtx.createOscillator();osc.type=AppState.waveType;osc.detune.value=(i-Math.floor(AppState.NUM_OSC/2))*AppState.detuneAmount;osc.start(now);osc.connect(AppState.masterGain);AppState.oscillators.push(osc);}}
function connectAudioGraph(){
let input=AppState.masterGain;
function bypassable(node,gainNode,key){gainNode.gain.value=effects[key]?1:0;input.connect(node);node.connect(gainNode);gainNode.connect(audioNodes.filter);input=node;}
bypassable(audioNodes.distortion,audioNodes.distortionGain,'dist');
bypassable(audioNodes.autoWah,audioNodes.autoWahGain,'autoWah');
bypassable(audioNodes.flangerDelay,audioNodes.flangerDry,'flanger');
bypassable(audioNodes.chorusDelay,audioNodes.chorusDry,'chorus');
bypassable(audioNodes.tremoloGain,audioNodes.tremoloGain,'tremolo');
audioNodes.filter.connect(audioNodes.delay);audioNodes.delay.connect(audioNodes.delayGain);audioNodes.delayGain.connect(audioNodes
audioNodes.delayGain.connect(audioNodes.reverb); // delay -> reverb
audioNodes.reverb.connect(audioNodes.reverbGain);
audioNodes.reverbGain.connect(audioNodes.panner);
audioNodes.panner.connect(AppState.audioCtx.destination);
}

function stopSynth(){
cleanupOscillators();
if(AppState.audioCtx){
AppState.audioCtx.close();
AppState.audioCtx=null;
}
AppState.isPlaying=false;
updateButtonStates();
showStatus('Stopped');
}

// Event listeners
elements.startBtn.addEventListener('click',()=>{startSynth();});
elements.stopBtn.addEventListener('click',()=>{stopSynth();});

// Waveform change
document.getElementById('waveSelect').addEventListener('change',(e)=>{
AppState.waveType=e.target.value;
AppState.oscillators.forEach(o=>{o.type=AppState.waveType;});
showStatus('Wave: '+AppState.waveType);
});

// Detune
document.getElementById('detuneRange').addEventListener('input',(e)=>{
AppState.detuneAmount=parseFloat(e.target.value);
AppState.oscillators.forEach((o,i)=>{
o.detune.value=(i-Math.floor(AppState.NUM_OSC/2))*AppState.detuneAmount;
});
});

// Octave
document.getElementById('octDown').addEventListener('click',()=>{
AppState.octaveOffset--;elements.octaveDisplay.textContent='Oct:'+AppState.octaveOffset;
});
document.getElementById('octUp').addEventListener('click',()=>{
AppState.octaveOffset++;elements.octaveDisplay.textContent='Oct:'+AppState.octaveOffset;
});

// Effect toggles
function toggleEffect(name,buttonId){
const btn=document.getElementById(buttonId);
btn.addEventListener('click',()=>{
effects[name]=!effects[name];
btn.classList.toggle('active',effects[name]);
connectAudioGraph();
showStatus(name+' '+(effects[name]?'ON':'OFF'));
});
}
toggleEffect('dist','toggleDist');
toggleEffect('autoWah','toggleAutoWah');
toggleEffect('flanger','toggleFlanger');
toggleEffect('chorus','toggleChorus');
toggleEffect('tremolo','toggleTremolo');
toggleEffect('filter','toggleFilter');
toggleEffect('delay','toggleDelay');
toggleEffect('reverb','toggleReverb');

// Filter controls
document.getElementById('filterFreq').addEventListener('input',e=>{
audioNodes.filter.frequency.value=parseFloat(e.target.value);
});
document.getElementById('filterReso').addEventListener('input',e=>{
audioNodes.filter.Q.value=parseFloat(e.target.value);
});
document.getElementById('autoWahRate').addEventListener('input',e=>{
audioNodes.autoWahLFO.frequency.value=parseFloat(e.target.value);
});
document.getElementById('autoWahDepth').addEventListener('input',e=>{
audioNodes.autoWahGain.gain.value=parseFloat(e.target.value);
});

// Toggle controls panel
elements.toggleControls.addEventListener('click',()=>{
elements.controls.classList.toggle('expanded');
});

// Motion / Pan toggles (placeholder, can expand with DeviceOrientation)
elements.motionBtn.addEventListener('click',()=>{
AppState.motionEnabled=!AppState.motionEnabled;
elements.motionDisplay.style.display=AppState.motionEnabled?'block':'none';
});
elements.panBtn.addEventListener('click',()=>{
AppState.panEnabled=!AppState.panEnabled;
elements.panDisplay.style.display=AppState.panEnabled?'block':'none';
});

// Populate note ruler
noteNames.forEach(note=>{
const div=document.createElement('div');
div.className='ruler-note';
div.textContent=note;
elements.noteRuler.appendChild(div);
});

// Helper: show permission modal (for motion, etc.)
document.getElementById('permissionAllow').addEventListener('click',()=>{
elements.permissionModal.style.display='none';
showStatus('Motion allowed');
});
document.getElementById('permissionDeny').addEventListener('click',()=>{
elements.permissionModal.style.display='none';
showStatus('Motion denied');
});

</script>
</body>
</html>
