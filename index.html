<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Synth Pro</title>
<style>
:root{--r:255;--g:100;--b:100;--bg-color:rgba(var(--r),var(--g),var(--b),0.3);--control-bg:rgba(var(--r),var(--g),var(--b),0.4);--text-color:rgba(255,255,255,0.95);--border-color:rgba(var(--r),var(--g),var(--b),0.8);--safe-area-inset-top:env(safe-area-inset-top);--safe-area-inset-bottom:env(safe-area-inset-bottom);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background-color:#111;color:var(--text-color);font-family:-apple-system,sans-serif;font-weight:400;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;overflow:hidden;}
body{background-color:var(--bg-color);transition:background-color 0.1s ease;}
#app-container{height:100%;display:flex;flex-direction:column;}
#pad{width:100%;height:100vh;position:relative;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at center,var(--control-bg),rgba(0,0,0,0.4));cursor:crosshair;}
#noteDisplay,#motionDisplay,#wahDisplay,#panDisplay{position:absolute;background-color:var(--control-bg);color:var(--text-color);pointer-events:none;z-index:10;border:2px solid var(--border-color);backdrop-filter:blur(20px);padding:8px 16px;border-radius:20px;font-size:14px;font-weight:500;transition:all 0.1s ease;}
#noteDisplay{top:max(20px,var(--safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:24px;text-shadow:0 0 20px var(--border-color);}
#motionDisplay,#wahDisplay,#panDisplay{bottom:20px;left:50%;transform:translateX(-50%);display:none;}
#wahDisplay{bottom:60px;}#panDisplay{bottom:100px;}#motionDisplay{bottom:140px;}
#noteRuler{position:absolute;right:0;top:0;bottom:0;width:60px;background:var(--control-bg);border-left:2px solid var(--border-color);display:flex;flex-direction:column;justify-content:space-between;padding:10px 0;pointer-events:none;z-index:5;}
.ruler-note{display:flex;align-items:center;justify-content:center;flex:1;font-size:11px;color:var(--text-color);border-bottom:1px solid var(--border-color);}
#controls{position:fixed;bottom:0;left:0;right:0;max-height:70vh;background:var(--control-bg);backdrop-filter:blur(30px);border-top:2px solid var(--border-color);transform:translateY(calc(100% - 50px));transition:transform 0.3s ease;overflow-y:auto;padding:15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;z-index:100;-ms-overflow-style:none;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-y;}
#controls::-webkit-scrollbar{display:none;}
#controls.expanded{transform:translateY(0);}
#toggleControls{position:fixed;bottom:10px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--control-bg);border:2px solid var(--border-color);color:var(--text-color);font-size:20px;font-weight:bold;cursor:pointer;z-index:1000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 25px var(--border-color);transition:all 0.1s ease;}
button,select,input[type=range],label{font-family:inherit;font-size:12px;font-weight:500;border-radius:8px;border:2px solid var(--border-color);background:var(--control-bg);color:var(--text-color);-webkit-appearance:none;appearance:none;transition:all 0.1s ease;outline:none;}
button{padding:10px 12px;cursor:pointer;min-height:40px;}
button.active{background:var(--border-color);color:#111;font-weight:600;box-shadow:0 0 15px var(--border-color);}
.control-group{display:flex;flex-direction:column;align-items:center;}
label{font-size:10px;margin-bottom:3px;text-align:center;}
input[type=range]{width:100%;height:6px;background:var(--border-color);border:none;margin:5px 0;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:var(--text-color);cursor:pointer;border-radius:50%;box-shadow:0 0 15px var(--border-color);}
select{padding:8px;cursor:pointer;min-height:40px;width:100%;}
#statusMessage{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--control-bg);color:var(--text-color);padding:8px 16px;border-radius:8px;font-size:12px;z-index:100;opacity:0;transition:opacity 0.3s;pointer-events:none;backdrop-filter:blur(15px);border:2px solid var(--border-color);}
#statusMessage.show{opacity:1;}
.effect-group{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0;padding:8px;background:var(--control-bg);border-radius:8px;border:2px solid var(--border-color);}
.effect-group-title{grid-column:1/-1;text-align:center;font-size:11px;font-weight:600;color:var(--text-color);margin-bottom:3px;}
.rhythm-panel{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin:8px 0;padding:12px;background:var(--control-bg);border-radius:8px;border:2px solid var(--border-color);}
.rhythm-title{text-align:center;font-size:11px;font-weight:600;color:var(--text-color);margin-bottom:5px;}
.rhythm-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.kick-panel{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin:8px 0;padding:12px;background:var(--control-bg);border-radius:8px;border:2px solid var(--border-color);}
.kick-title{text-align:center;font-size:11px;font-weight:600;color:var(--text-color);margin-bottom:5px;}
.kick-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:var(--control-bg);z-index:1000;justify-content:center;align-items:center;}
.modal-content{background:var(--control-bg);padding:20px;border-radius:15px;max-width:80%;text-align:center;backdrop-filter:blur(25px);border:2px solid var(--border-color);}
.modal-buttons{display:flex;gap:8px;margin-top:15px;}
.modal-buttons button{flex:1;}
#waveAnimation{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}
.animation-panel{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin:8px 0;padding:12px;background:var(--control-bg);border-radius:8px;border:2px solid var(--border-color);}
.animation-title{text-align:center;font-size:11px;font-weight:600;color:var(--text-color);margin-bottom:5px;}
.animation-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
</style>
</head>
<body>
<div id="app-container">
<div id="pad">
<div id="noteDisplay">C4</div>

<select id="animationSelect">
<option value="none">None</option>

</div>
<div id="statusMessage"></div>
<div id="permissionModal" class="modal">
<div class="modal-content">
<h3>Motion Access Required</h3>

<button id="permissionAllow">Allow</button>

</div>
</div>
</div>

<script>
// ===================================================================
// AUDIO WORKLET PROCESSORS (as strings for Blob URL creation)
// ===================================================================

const oscillatorProcessorCode = `
class OscillatorProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.phase = 0;
    this.prevPhase = 0;
  }

  process(inputs, outputs, parameters) {
    const output = outputs[0];
    const frequency = parameters.frequency[0];
    const waveType = parameters.waveType[0];
    const sampleRate = sampleRate;

    for (let channel = 0; channel < output.length; ++channel) {
      const outputChannel = output[channel];
      for (let i = 0; i < outputChannel.length; ++i) {
        const phaseIncrement = frequency / sampleRate;
        this.prevPhase = this.phase;
        this.phase += phaseIncrement;
        if (this.phase >= 1) this.phase -= 1;

        let value = 0;
        const t = this.phase;

        switch (waveType) {
          case 'sine':
            value = Math.sin(2 * Math.PI * t);
            break;
          case 'square':
            value = (t < 0.5) ? 1 : -1;
            value -= this.polyBLEP(t, phaseIncrement);
            break;
          case 'sawtooth':
            value = (t < 0.5) ? (2 * t) : (2 * t - 2);
            value -= this.polyBLEP(t, phaseIncrement);
            break;
          case 'triangle':
            const sq = (t < 0.5) ? 1 : -1;
            value = 2 * Math.abs(sq - 2 * t) - 1;
            value += this.polyBLEP(t, phaseIncrement) - this.polyBLEP((t + 0.5) % 1, phaseIncrement);
            break;
        }
        outputChannel[i] = value * 0.5; // Gain staging
      }
    }
    return true;
  }

  polyBLEP(t, dt) {
    if (t < dt) {
      t /= dt;
      return t + t - t * t - 1;
    }
    if (t > 1 - dt) {
      t = (t - 1) / dt;
      return t * t + t + t + 1;
    }
    return 0;
  }

  static get parameterDescriptors() {
    return [
      { name: 'frequency', defaultValue: 440, minValue: 20, maxValue: 20000, automationRate: 'a-rate' },
      { name: 'waveType', defaultValue: 'sawtooth', automationRate: 'k-rate' }
    ];
  }
}
registerProcessor('oscillator-processor', OscillatorProcessor);
`;

const filterProcessorCode = `
class FilterProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.sampleRate = sampleRate;
    this.cutoff = 1000;
    this.resonance = 1;
    this.z1 = 0; this.z2 = 0; this.z3 = 0; this.z4 = 0;
  }

  process(inputs, outputs, parameters) {
    const output = outputs[0];
    const input = inputs[0];
    const cutoff = parameters.cutoff[0];
    const resonance = parameters.resonance[0];

    if (cutoff !== this.cutoff || resonance !== this.resonance) {
        this.cutoff = cutoff;
        this.resonance = resonance;
    }

    const g = Math.tan(Math.PI * this.cutoff / this.sampleRate);
    const r = 1 - (this.resonance * 0.99);

    for (let channel = 0; channel < output.length; ++channel) {
      const inputChannel = input ? input[channel] : null;
      const outputChannel = output[channel];
      for (let i = 0; i < outputChannel.length; ++i) {
        const x = inputChannel ? inputChannel[i] * 0.5 : 0;
        const y1 = (g * x + this.z1) / (1 + g);
        const y2 = (g * y1 + this.z2) / (1 + g);
        const y3 = (g * y2 + this.z3) / (1 + g);
        const y4 = (g * y3 + this.z4) / (1 + g);
        
        this.z1 = 2 * y1 - this.z1;
        this.z2 = 2 * y2 - this.z2;
        this.z3 = 2 * y3 - this.z3;
        this.z4 = 2 * y4 - this.z4;
        
        outputChannel[i] = y4 * 0.8; // Gain staging
      }
    }
    return true;
  }

  static get parameterDescriptors() {
    return [
      { name: 'cutoff', defaultValue: 1000, minValue: 20, maxValue: 20000, automationRate: 'a-rate' },
      { name: 'resonance', defaultValue: 1, minValue: 0.1, maxValue: 20, automationRate: 'a-rate' }
    ];
  }
}
registerProcessor('filter-processor', FilterProcessor);
`;

const limiterProcessorCode = `
class LimiterProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.envelope = 0;
    this.gainReduction = 1;
    this.ceiling = 0.95;
    this.releaseRate = Math.exp(-1 / (0.1 * sampleRate));
  }

  process(inputs, outputs, parameters) {
    const output = outputs[0];
    const input = inputs[0];
    for (let channel = 0; channel < output.length; ++channel) {
      const inputChannel = input ? input[channel] : null;
      const outputChannel = output[channel];
      for (let i = 0; i < outputChannel.length; ++i) {
        const inputSample = inputChannel ? inputChannel[i] : 0;
        const inputLevel = Math.abs(inputSample);
        if (inputLevel > this.envelope) {
          this.envelope = inputLevel;
        } else {
          this.envelope = inputLevel + (this.envelope - inputLevel) * this.releaseRate;
        }
        if (this.envelope > this.ceiling) {
          this.gainReduction = this.ceiling / this.envelope;
        } else {
          this.gainReduction = 1 + (this.gainReduction - 1) * this.releaseRate;
        }
        outputChannel[i] = inputSample * this.gainReduction;
      }
    }
    return true;
  }
}
registerProcessor('limiter-processor', LimiterProcessor);
`;

// ===================================================================
// MAIN APPLICATION SCRIPT
// ===================================================================

const AppState = {
    audioCtx: null,
    audioNodes: {},
    isPlaying: false,
    baseFreq: 261.63,
    octaveOffset: 0,
    motionEnabled: false,
    panEnabled: false,
    rhythmActive: false,
    rhythmSpeed: 120,
    rhythmIntensity: 50,
    currentAnimation: "network",
    animationSpeed: 1,
    animationIntensity: 1,
    kickSettings: { volume: 80, pattern: '4/4', punch: 60, bass: 100, distortion: 40, sweep: 100 }
};

const effects = { dist: false, autoWah: false, flanger: false, chorus: false, tremolo: false, filter: true, delay: false, reverb: false };

let rhythmInterval = null;
let animationFrameId = null;
let animationHue = 0;

const noteColors = [[255,100,100],[255,150,80],[255,220,80],[220,255,80],[120,255,100],[80,255,180],[80,220,255],[100,150,255],[150,100,255],[220,80,255],[255,80,220],[255,80,120]];
const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const patternMap = {'4/4':[1,1,1,1,1,1,1,1],'2/4':[1,0,1,0,1,0,1,0],'breakbeat':[1,0,1,0,1,0,0,1],'offbeat':[0,1,0,1,0,1,0,1],'techno':[1,0,0,1,1,0,0,1]};

const elements = {
    pad: document.getElementById("pad"), noteDisplay: document.getElementById("noteDisplay"), motionDisplay: document.getElementById("motionDisplay"),
    wahDisplay: document.getElementById("wahDisplay"), panDisplay: document.getElementById("panDisplay"), startBtn: document.getElementById("startBtn"),
    stopBtn: document.getElementById("stopBtn"), motionBtn: document.getElementById("motionBtn"), panBtn: document.getElementById("panBtn"),
    statusMessage: document.getElementById("statusMessage"), permissionModal: document.getElementById("permissionModal"), controls: document.getElementById("controls"),
    toggleControls: document.getElementById("toggleControls"), noteRuler: document.getElementById("noteRuler"), startRhythmBtn: document.getElementById("startRhythmBtn"),
    stopRhythmBtn: document.getElementById("stopRhythmBtn"), kickVolume: document.getElementById("kickVolume"), kickPattern: document.getElementById("kickPattern"),
    kickPunch: document.getElementById("kickPunch"), kickBass: document.getElementById("kickBass"), kickDistortion: document.getElementById("kickDistortion"),
    kickSweep: document.getElementById("kickSweep"), waveCanvas: document.getElementById("waveAnimation"), animSpeed: document.getElementById("animSpeed"),
    animIntensity: document.getElementById("animIntensity"), animationSelect: document.getElementById("animationSelect")
};

// --- HELPER FUNCTIONS ---
function showStatus(msg, dur = 800) {
    elements.statusMessage.textContent = msg;
    elements.statusMessage.classList.add('show');
    setTimeout(() => elements.statusMessage.classList.remove('show'), dur);
}
function updateButtonStates() {
    elements.startBtn.disabled = AppState.isPlaying;
    elements.stopBtn.disabled = !AppState.isPlaying;
}
function freqToNote(freq) {
    const A4 = 440, semitonesFromA4 = 12 * Math.log2(freq / A4);
    const noteIndex = Math.round(semitonesFromA4 + 9) % 12;
    const octave = Math.floor((semitonesFromA4 + 9) / 12);
    const noteName = noteNames[(noteIndex + 12) % 12];
    return { name: noteName, octave: octave, fullName: `${noteName}${octave}` };
}
function updateThemeColor(color) {
    document.documentElement.style.setProperty('--r', color[0]);
    document.documentElement.style.setProperty('--g', color[1]);
    document.documentElement.style.setProperty('--b', color[2]);
    const r = color[0] / 255, g = color[1] / 255, b = color[2] / 255;
    let h, s, l = (Math.max(r, g, b) + Math.min(r, g, b)) / 2;
    if (Math.max(r, g, b) === Math.min(r, g, b)) { h = s = 0; } else {
        const d = Math.max(r, g, b) - Math.min(r, g, b);
        s = l > 0.5 ? d / (2 - Math.max(r, g, b) - Math.min(r, g, b)) : d / (Math.max(r, g, b) + Math.min(r, g, b));
        switch (Math.max(r, g, b)) {
            case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
            case g: h = ((b - r) / d + 2) / 6; break;
            case b: h = ((r - g) / d + 4) / 6; break;
        }
    }
    animationHue = Math.round(h * 360);
}
function noteFromPad(y) {
    const padHeight = window.innerHeight;
    const ratio = 1 - (y / padHeight);
    const baseFreq = 65.41 * Math.pow(2, AppState.octaveOffset);
    return baseFreq * Math.pow(2, (ratio * 24) / 12);
}
function createSmoothedParameter(audioParam, targetValue, smoothingTime = 0.02) {
    audioParam.linearRampToValueAtTime(targetValue, AppState.audioCtx.currentTime + smoothingTime);
}
function createThrottledHandler(handler, delay) {
    let lastCall = 0;
    return function (...args) {
        const now = performance.now();
        if (now - lastCall >= delay) {
            lastCall = now;
            handler.apply(this, args);
        }
    };
}

// --- AUDIO INITIALIZATION ---
async function initAudioContext() {
    try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
        if (audioContext.state === 'suspended') await audioContext.resume();
        const dummyOsc = audioContext.createOscillator();
        dummyOsc.connect(audioContext.destination);
        dummyOsc.start();
        dummyOsc.stop(audioContext.currentTime + 0.01);
        return audioContext;
    } catch (error) { console.error('AudioContext init failed:', error); return null; }
}

async function loadAudioWorklets(audioContext) {
    const oscillatorBlob = new Blob([oscillatorProcessorCode], { type: 'application/javascript' });
    const filterBlob = new Blob([filterProcessorCode], { type: 'application/javascript' });
    const limiterBlob = new Blob([limiterProcessorCode], { type: 'application/javascript' });

    const oscillatorURL = URL.createObjectURL(oscillatorBlob);
    const filterURL = URL.createObjectURL(filterBlob);
    const limiterURL = URL.createObjectURL(limiterBlob);

    try {
        await audioContext.audioWorklet.addModule(oscillatorURL);
        await audioContext.audioWorklet.addModule(filterURL);
        await audioContext.audioWorklet.addModule(limiterURL);
        return true;
    } catch (error) { console.error('Failed to load worklets:', error); return false; }
}

function createStaticAudioGraph(audioContext) {
    const nodes = {};
    nodes.oscillator = new AudioWorkletNode(audioContext, 'oscillator-processor');
    nodes.filter = new AudioWorkletNode(audioContext, 'filter-processor');
    nodes.limiter = new AudioWorkletNode(audioContext, 'limiter-processor');

    nodes.distortion = audioContext.createWaveShaper();
    nodes.distortion.curve = makeDistortionCurve(50);
    nodes.distortion.oversample = '4x';
    
    nodes.autoWah = audioContext.createBiquadFilter();
    nodes.autoWah.type = "bandpass";
    nodes.autoWah.frequency.value = 800;
    nodes.autoWah.Q.value = 5;
    nodes.autoWahLFO = audioContext.createOscillator();
    nodes.autoWahLFOSweep = audioContext.createGain();
    nodes.autoWahLFO.connect(nodes.autoWahLFOSweep);
    nodes.autoWahLFOSweep.connect(nodes.autoWah.frequency);
    nodes.autoWahLFO.start();

    nodes.delay = audioContext.createDelay(2);
    nodes.delay.delayTime.value = 0.3;
    nodes.delayFeedback = audioContext.createGain();
    nodes.delayFeedback.gain.value = 0.5;
    nodes.delay.connect(nodes.delayFeedback);
    nodes.delayFeedback.connect(nodes.delay);

    nodes.reverb = audioContext.createConvolver();
    nodes.reverb.buffer = createReverbImpulseResponse(audioContext, 2, 2);
    
    nodes.panner = audioContext.createStereoPanner();
    nodes.masterGain = audioContext.createGain();

    // Static connections
    nodes.oscillator.connect(nodes.filter);
    nodes.filter.connect(nodes.distortion);
    nodes.distortion.connect(nodes.autoWah);
    nodes.autoWah.connect(nodes.delay);
    nodes.delay.connect(nodes.reverb);
    nodes.reverb.connect(nodes.panner);
    nodes.panner.connect(nodes.masterGain);
    nodes.masterGain.connect(nodes.limiter);
    nodes.limiter.connect(audioContext.destination);

    // Kick drum nodes
    nodes.kickOsc = audioContext.createOscillator();
    nodes.kickGain = audioContext.createGain();
    nodes.kickOsc.connect(nodes.kickGain);
    nodes.kickGain.connect(nodes.limiter);
    nodes.kickOsc.start();
    
    return nodes;
}

function makeDistortionCurve(amount) {
    const samples = 44100, curve = new Float32Array(samples), deg = Math.PI / 180;
    for (let i = 0; i < samples; i++) {
        const x = (i * 2) / samples - 1;
        curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
    }
    return curve;
}
function createReverbImpulseResponse(audioContext, duration, decay) {
    const sampleRate = audioContext.sampleRate, length = sampleRate * duration, impulse = audioContext.createBuffer(2, length, sampleRate);
    for (let channel = 0; channel < 2; channel++) {
        const channelData = impulse.getChannelData(channel);
        for (let i = 0; i < length; i++) channelData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
    }
    return impulse;
}


// --- CORE SYNTH FUNCTIONS ---
function startSynth() {
    if (AppState.isPlaying) { showStatus('Already running'); return; }
    showStatus('Initializing...');
    initAudioContext().then(ctx => {
        if (!ctx) { showStatus('Audio init failed'); return; }
        AppState.audioCtx = ctx;
        loadAudioWorklets(ctx).then(success => {
            if (!success) { showStatus('Worklet load failed'); return; }
            AppState.audioNodes = createStaticAudioGraph(ctx);
            AppState.isPlaying = true;
            updateButtonStates();
            startWaveAnimation();
            showStatus('Started - Try effects!');
        });
    });
}
function stopSynth() {
    if (!AppState.audioCtx) { showStatus('No synth running'); return; }
    AppState.audioCtx.close().then(() => {
        AppState.audioCtx = null;
        AppState.audioNodes = {};
        AppState.isPlaying = false;
        stopRhythm();
        stopWaveAnimation();
        updateButtonStates();
        showStatus('Stopped');
    });
}

// --- EVENT HANDLERS ---
const throttledTouchHandler = createThrottledHandler(handleTouch, 1000 / 60);
const throttledMotionHandler = createThrottledHandler(handleMotion, 1000 / 30);

function handleTouch(e) {
    if (!AppState.isPlaying) { showStatus('Start synth first'); return; }
    e.preventDefault();
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    AppState.baseFreq = noteFromPad(clientY);
    const volume = clientX / window.innerWidth;

    createSmoothedParameter(AppState.audioNodes.oscillator.parameters.get('frequency'), AppState.baseFreq);
    createSmoothedParameter(AppState.audioNodes.masterGain.gain, volume * 0.4);

    const noteInfo = freqToNote(AppState.baseFreq);
    elements.noteDisplay.textContent = noteInfo.fullName;
    const colorIndex = noteNames.indexOf(noteInfo.name);
    if (colorIndex !== -1) updateThemeColor(noteColors[colorIndex]);
}
function handleMotion(e) {
    if (!AppState.isPlaying || e.beta === null) return;
    const tilt = e.beta, pan = e.gamma;
    if (AppState.motionEnabled) {
        const tiltBend = tilt / 45 * 12;
        const baseFreq = 65.41 * Math.pow(2, AppState.octaveOffset);
        const frequency = baseFreq * Math.pow(2, tiltBend / 12);
        createSmoothedParameter(AppState.audioNodes.oscillator.parameters.get('frequency'), frequency);
        elements.motionDisplay.textContent = `Tilt:${Math.round(tiltBend * 10) / 10}st`;
    }
    if (AppState.panEnabled && pan !== null) {
        const panValue = Math.max(-1, Math.min(1, pan / 90));
        createSmoothedParameter(AppState.audioNodes.panner.pan, panValue);
        const panPercent = Math.round(panValue * 100);
        elements.panDisplay.textContent = `Pan:${panPercent}%`;
    }
}
function toggleControls() {
    elements.controls.classList.toggle('expanded');
    elements.toggleControls.textContent = elements.controls.classList.contains('expanded') ? '✕' : '⚙️';
}
function requestMotionPermission() {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        elements.permissionModal.style.display = 'flex';
    } else {
        startMotionControl();
    }
}
function startMotionControl() {
    window.addEventListener("deviceorientation", throttledMotionHandler);
    AppState.motionEnabled = true;
    elements.motionBtn.textContent = "Motion ON";
    elements.motionBtn.classList.add('active');
    elements.motionDisplay.style.display = 'block';
    showStatus('Motion enabled - Tilt device!');
}
function disableMotion() {
    window.removeEventListener("deviceorientation", throttledMotionHandler);
    AppState.motionEnabled = false;
    elements.motionBtn.textContent = "Motion OFF";
    elements.motionBtn.classList.remove('active');
    elements.motionDisplay.style.display = 'none';
    showStatus('Motion disabled');
}
function togglePan() {
    AppState.panEnabled = !AppState.panEnabled;
    elements.panBtn.textContent = AppState.panEnabled ? "Pan ON" : "Pan OFF";
    elements.panBtn.classList.toggle('active', AppState.panEnabled);
    elements.panDisplay.style.display = AppState.panEnabled ? 'block' : 'none';
    if (!AppState.panEnabled) createSmoothedParameter(AppState.audioNodes.panner.pan, 0);
    showStatus(AppState.panEnabled ? 'Pan enabled' : 'Pan disabled');
}

// --- RHYTHM & KICK ---
function playKick(beat) {
    const pattern = patternMap[AppState.kickSettings.pattern];
    if (!pattern[beat % pattern.length]) return;
    const now = AppState.audioCtx.currentTime;
    const volume = AppState.kickSettings.volume / 100;
    const punch = AppState.kickSettings.punch / 100;
    const sweep = AppState.kickSettings.sweep / 100;
    const baseFreq = 80 + 40 * punch;
    const endFreq = 30 + 20 * (1 - sweep);
    const sweepTime = 0.08 + 0.07 * sweep;

    AppState.audioNodes.kickOsc.frequency.setValueAtTime(baseFreq, now);
    AppState.audioNodes.kickOsc.frequency.exponentialRampToValueAtTime(endFreq, now + sweepTime);
    AppState.audioNodes.kickGain.gain.setValueAtTime(volume, now);
    AppState.audioNodes.kickGain.gain.exponentialRampToValueAtTime(0.001, now + sweepTime + 0.1);
}
function startRhythm() {
    if (!AppState.isPlaying) { showStatus('Start synth first'); return; }
    stopRhythm();
    AppState.rhythmActive = true;
    elements.startRhythmBtn.disabled = true;
    elements.stopRhythmBtn.disabled = false;
    let beat = 0;
    rhythmInterval = setInterval(() => {
        if (!AppState.isPlaying) return;
        const intensity = AppState.rhythmIntensity / 100;
        const baseGain = 0.1 + intensity * 0.3;
        const pattern = [baseGain, baseGain * 0.2, baseGain * 0.8, baseGain * 0.1, baseGain, baseGain * 0.3, baseGain * 0.7, baseGain * 0.2];
        createSmoothedParameter(AppState.audioNodes.masterGain.gain, pattern[beat % 8], 0.01);
        playKick(beat);
        const randomColor = noteColors[Math.floor(Math.random() * noteColors.length)];
        updateThemeColor(randomColor);
        beat++;
    }, 60000 / AppState.rhythmSpeed);
    showStatus('Rhythm Started');
}
function stopRhythm() {
    AppState.rhythmActive = false;
    elements.startRhythmBtn.disabled = false;
    elements.stopRhythmBtn.disabled = true;
    if (rhythmInterval) { clearInterval(rhythmInterval); rhythmInterval = null; }
    showStatus('Rhythm Stopped');
}

// --- INITIALIZATION ---
function initializeEventListeners() {
    elements.pad.addEventListener("touchstart", throttledTouchHandler, { passive: false });
    elements.pad.addEventListener("touchmove", throttledTouchHandler, { passive: false });
    elements.pad.addEventListener("mousedown", throttledTouchHandler);
    elements.pad.addEventListener("mousemove", e => { if (e.buttons === 1) throttledTouchHandler(e); });

    elements.startBtn.addEventListener("click", startSynth);
    elements.stopBtn.addEventListener("click", stopSynth);
    elements.motionBtn.addEventListener("click", () => AppState.motionEnabled ? disableMotion() : requestMotionPermission());
    elements.panBtn.addEventListener("click", togglePan);
    elements.toggleControls.addEventListener("click", toggleControls);

    elements.startRhythmBtn.addEventListener("click", startRhythm);
    elements.stopRhythmBtn.addEventListener("click", stopRhythm);
    
    // Wave & Filter
    document.getElementById("waveSelect").addEventListener("change", e => {
        createSmoothedParameter(AppState.audioNodes.oscillator.parameters.get('waveType'), e.target.value);
        showStatus('Wave: ' + e.target.value);
    });
    document.getElementById("filterFreq").addEventListener("input", e => {
        createSmoothedParameter(AppState.audioNodes.filter.parameters.get('cutoff'), parseFloat(e.target.value));
    });
    document.getElementById("filterReso").addEventListener("input", e => {
        createSmoothedParameter(AppState.audioNodes.filter.parameters.get('resonance'), parseFloat(e.target.value));
    });

    // Effects
    document.getElementById("toggleDist").addEventListener("click", () => {
        effects.dist = !effects.dist; document.getElementById("toggleDist").classList.toggle('active', effects.dist);
        AppState.audioNodes.distortion.curve = effects.dist ? makeDistortionCurve(50) : null;
        showStatus('Distortion ' + (effects.dist ? 'ON' : 'OFF'));
    });
    document.getElementById("toggleAutoWah").addEventListener("click", () => {
        effects.autoWah = !effects.autoWah; document.getElementById("toggleAutoWah").classList.toggle('active', effects.autoWah);
        createSmoothedParameter(AppState.audioNodes.autoWahLFOSweep.gain, effects.autoWah ? 800 : 0);
        elements.wahDisplay.style.display = effects.autoWah ? 'block' : 'none';
        showStatus('Auto Wah ' + (effects.autoWah ? 'ON' : 'OFF'));
    });
    document.getElementById("toggleFilter").addEventListener("click", () => {
        effects.filter = !effects.filter; document.getElementById("toggleFilter").classList.toggle('active', effects.filter);
        // In this static graph, filter is always in the chain. We could bypass it with a gain node if needed.
        showStatus('Filter ' + (effects.filter ? 'ON' : 'OFF'));
    });
    document.getElementById("toggleDelay").addEventListener("click", () => {
        effects.delay = !effects.delay; document.getElementById("toggleDelay").classList.toggle('active', effects.delay);
        createSmoothedParameter(AppState.audioNodes.delayFeedback.gain, effects.delay ? 0.5 : 0);
        showStatus('Delay ' + (effects.delay ? 'ON' : 'OFF'));
    });
    document.getElementById("toggleReverb").addEventListener("click", () => {
        effects.reverb = !effects.reverb; document.getElementById("toggleReverb").classList.toggle('active', effects.reverb);
        // Reverb is always connected. Bypass would require a gain node.
        showStatus('Reverb ' + (effects.reverb ? 'ON' : 'OFF'));
    });

    // Rhythm & Kick Controls
    document.getElementById("rhythmSpeed").addEventListener("input", e => { AppState.rhythmSpeed = parseInt(e.target.value); if (AppState.rhythmActive) { stopRhythm(); startRhythm(); }});
    document.getElementById("rhythmIntensity").addEventListener("input", e => { AppState.rhythmIntensity = parseInt(e.target.value); });
    document.getElementById("kickVolume").addEventListener("input", e => { AppState.kickSettings.volume = parseInt(e.target.value); });
    document.getElementById("kickPattern").addEventListener("change", e => { AppState.kickSettings.pattern = e.target.value; });
    document.getElementById("kickPunch").addEventListener("input", e => { AppState.kickSettings.punch = parseInt(e.target.value); });
    document.getElementById("kickSweep").addEventListener("input", e => { AppState.kickSettings.sweep = parseInt(e.target.value); });
    
    // Octave controls
    document.getElementById("octUp").addEventListener("click", () => { AppState.octaveOffset++; applyPitch(); createNoteRuler(); });
    document.getElementById("octDown").addEventListener("click", () => { AppState.octaveOffset--; applyPitch(); createNoteRuler(); });
    
    // Permission Modal
    document.getElementById("permissionAllow").addEventListener("click", () => {
        DeviceOrientationEvent.requestPermission().then(response => {
            elements.permissionModal.style.display = 'none';
            if (response === 'granted') startMotionControl();
            else showStatus('Motion permission denied');
        }).catch(e => { elements.permissionModal.style.display = 'none'; showStatus('Permission error'); });
    });
    document.getElementById("permissionDeny").addEventListener("click", () => {
        elements.permissionModal.style.display = 'none'; showStatus('Motion disabled');
    });
    
    // Animation controls
    elements.animationSelect.addEventListener("change", e => setAnimation(e.target.value));
    elements.animSpeed.addEventListener("input", e => AppState.animationSpeed = parseFloat(e.target.value));
    elements.animIntensity.addEventListener("input", e => AppState.animationIntensity = parseFloat(e.target.value));

    document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); AppState.rhythmActive ? stopRhythm() : startRhythm(); } });
}

function createNoteRuler() {
    const notes = ['C6','B5','A#5','A5','G#5','G5','F#5','F5','E5','D#5','D5','C#5','C5','B4','A#4','A4','G#4','G4','F#4','F4','E4','D#4','D4','C#4','C4'];
    elements.noteRuler.innerHTML = '';
    notes.forEach(note => {
        const div = document.createElement('div'); div.className = 'ruler-note'; div.textContent = note; elements.noteRuler.appendChild(div);
    });
}
function applyPitch() {
    if (!AppState.isPlaying) return;
    createSmoothedParameter(AppState.audioNodes.oscillator.parameters.get('frequency'), AppState.baseFreq);
    const noteInfo = freqToNote(AppState.baseFreq);
    elements.noteDisplay.textContent = noteInfo.fullName;
    const colorIndex = noteNames.indexOf(noteInfo.name);
    if (colorIndex !== -1) updateThemeColor(noteColors[colorIndex]);
}

window.addEventListener('load', () => {
    updateThemeColor([255, 100, 100]);
    initializeEventListeners();
    updateButtonStates();
    createNoteRuler();
    showStatus('Ready - Click Start then try effects! SPACE for rhythm');
});
window.addEventListener("contextmenu", e => e.preventDefault());
