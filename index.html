<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pro Synth</title>
<style>
:root {
  --r: 255; --g: 100; --b: 100;
  --bg-color: rgba(var(--r), var(--g), var(--b), 0.3);
  --control-bg: rgba(var(--r), var(--g), var(--b), 0.4);
  --text-color: rgba(255, 255, 255, 0.95);
  --border-color: rgba(var(--r), var(--g), var(--b), 0.8);
  --safe-area-inset-top: env(safe-area-inset-top);
  --safe-area-inset-bottom: env(safe-area-inset-bottom);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  background-color: #111;
  color: var(--text-color);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-weight: 400;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  overscroll-behavior: none;
  overflow: hidden;
}

body {
  background-color: var(--bg-color);
  transition: background-color 0.1s ease;
}

#app-container {
  height: 100%;
  display: flex;
  flex-direction: column;
}

#pad {
  width: 100%;
  height: 100vh;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at center, var(--control-bg), rgba(0,0,0,0.4));
  cursor: crosshair;
  overflow: hidden;
}

#touchFeedback {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
  pointer-events: none;
  z-index: 5;
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: opacity 0.2s, width 0.2s, height 0.2s;
}

#noteDisplay, #motionDisplay, #wahDisplay, #panDisplay {
  position: absolute;
  background-color: var(--control-bg);
  color: var(--text-color);
  pointer-events: none;
  z-index: 10;
  border: 2px solid var(--border-color);
  backdrop-filter: blur(20px);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.1s ease;
}

#noteDisplay {
  top: max(20px, var(--safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  font-size: 24px;
  text-shadow: 0 0 20px var(--border-color);
}

#motionDisplay, #wahDisplay, #panDisplay {
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
}

#wahDisplay { bottom: 60px; }
#panDisplay { bottom: 100px; }
#motionDisplay { bottom: 140px; }

#noteRuler {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 60px;
  background: var(--control-bg);
  border-left: 2px solid var(--border-color);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 10px 0;
  pointer-events: none;
  z-index: 5;
}

.ruler-note {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  font-size: 11px;
  color: var(--text-color);
  border-bottom: 1px solid var(--border-color);
}

#controls {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-height: 70vh;
  background: var(--control-bg);
  backdrop-filter: blur(30px);
  border-top: 2px solid var(--border-color);
  transform: translateY(calc(100% - 50px));
  transition: transform 0.3s ease;
  overflow-y: auto;
  padding: 15px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 8px;
  z-index: 100;
  -ms-overflow-style: none;
  scrollbar-width: none;
}

#controls::-webkit-scrollbar { display: none; }
#controls.expanded { transform: translateY(0); }

#toggleControls {
  position: fixed;
  bottom: 10px;
  right: 20px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: var(--control-bg);
  border: 2px solid var(--border-color);
  color: var(--text-color);
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 25px var(--border-color);
  transition: all 0.1s ease;
}

button, select, input[type=range], label {
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  border-radius: 8px;
  border: 2px solid var(--border-color);
  background: var(--control-bg);
  color: var(--text-color);
  -webkit-appearance: none;
  appearance: none;
  transition: all 0.1s ease;
  outline: none;
}

button {
  padding: 10px 12px;
  cursor: pointer;
  min-height: 40px;
}

button.active {
  background: var(--border-color);
  color: #111;
  font-weight: 600;
  box-shadow: 0 0 15px var(--border-color);
}

.control-group {
  display: flex;
  flex-direction: column;
  align-items: center;
}

label {
  font-size: 10px;
  margin-bottom: 3px;
  text-align: center;
}

input[type=range] {
  width: 100%;
  height: 6px;
  background: var(--border-color);
  border: none;
  margin: 5px 0;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  background: var(--text-color);
  cursor: pointer;
  border-radius: 50%;
  box-shadow: 0 0 15px var(--border-color);
}

select {
  padding: 8px;
  cursor: pointer;
  min-height: 40px;
  width: 100%;
}

#statusMessage {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--control-bg);
  color: var(--text-color);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 12px;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  backdrop-filter: blur(15px);
  border: 2px solid var(--border-color);
}

#statusMessage.show { opacity: 1; }

.effect-group {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 8px;
  margin: 8px 0;
  padding: 8px;
  background: var(--control-bg);
  border-radius: 8px;
  border: 2px solid var(--border-color);
}

.effect-group-title {
  grid-column: 1 / -1;
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-color);
  margin-bottom: 3px;
}

.rhythm-panel {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 8px 0;
  padding: 12px;
  background: var(--control-bg);
  border-radius: 8px;
  border: 2px solid var(--border-color);
}

.rhythm-title {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-color);
  margin-bottom: 5px;
}

.rhythm-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.kick-panel {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 8px 0;
  padding: 12px;
  background: var(--control-bg);
  border-radius: 8px;
  border: 2px solid var(--border-color);
}

.kick-title {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-color);
  margin-bottom: 5px;
}

.kick-controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: var(--control-bg);
  padding: 20px;
  border-radius: 15px;
  max-width: 80%;
  text-align: center;
  backdrop-filter: blur(25px);
  border: 2px solid var(--border-color);
}

.modal-buttons {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.modal-buttons button { flex: 1; }

#waveAnimation {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.animation-panel {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 8px 0;
  padding: 12px;
  background: var(--control-bg);
  border-radius: 8px;
  border: 2px solid var(--border-color);
}

.animation-title {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-color);
  margin-bottom: 5px;
}

.animation-controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.performance-indicator {
  position: fixed;
  top: 10px;
  right: 10px;
  background: var(--control-bg);
  border: 2px solid var(--border-color);
  border-radius: 8px;
  padding: 4px 8px;
  font-size: 10px;
  z-index: 20;
  backdrop-filter: blur(10px);
}

.preset-panel {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 8px 0;
  padding: 12px;
  background: var(--control-bg);
  border-radius: 8px;
  border: 2px solid var(--border-color);
}

.preset-title {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-color);
  margin-bottom: 5px;
}

.preset-controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.adsr-panel {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 8px 0;
  padding: 12px;
  background: var(--control-bg);
  border-radius: 8px;
  border: 2px solid var(--border-color);
}

.adsr-title {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-color);
  margin-bottom: 5px;
}

.adsr-controls {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 8px;
}

@media (max-width: 768px) {
  #controls {
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 6px;
    padding: 10px;
  }
  
  .effect-group {
    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
  }
  
  .kick-controls, .animation-controls, .preset-controls, .adsr-controls {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<div id="app-container">
  <div id="pad">
    <div id="touchFeedback"></div>
    <div id="noteDisplay">C4</div>
    <div id="motionDisplay">Tilt:0°</div>
    <div id="wahDisplay">Wah:ON</div>
    <div id="panDisplay">Pan:0%</div>
    <div id="noteRuler"></div>
    <canvas id="waveAnimation"></canvas>
  </div>
  
  <div class="performance-indicator" id="perfIndicator">CPU: 0% | Latency: 0ms</div>
  
  <button id="toggleControls">⚙️</button>
  
  <div id="controls">
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
    <button id="motionBtn">Motion</button>
    <button id="panBtn">Pan</button>
    <button id="octDown">Oct-</button>
    <button id="octUp">Oct+</button>
    
    <div class="control-group">
      <label>Wave</label>
      <select id="waveSelect">
        <option value="sawtooth">Sawtooth</option>
        <option value="triangle">Triangle</option>
        <option value="square">Square</option>
        <option value="sine">Sine</option>
        <option value="pulse">Pulse</option>
        <option value="fm">FM</option>
        <option value="wavetable">Wavetable</option>
      </select>
    </div>
    
    <div class="control-group">
      <label>Detune</label>
      <input type="range" id="detuneRange" min="0" max="50" value="15">
    </div>
    
    <div class="adsr-panel">
      <div class="adsr-title">ADSR ENVELOPE</div>
      <div class="adsr-controls">
        <div class="control-group">
          <label>Attack</label>
          <input type="range" id="attackRange" min="0.001" max="2" value="0.01" step="0.001">
        </div>
        <div class="control-group">
          <label>Decay</label>
          <input type="range" id="decayRange" min="0.001" max="2" value="0.1" step="0.001">
        </div>
        <div class="control-group">
          <label>Sustain</label>
          <input type="range" id="sustainRange" min="0" max="1" value="0.7" step="0.01">
        </div>
        <div class="control-group">
          <label>Release</label>
          <input type="range" id="releaseRange" min="0.001" max="2" value="0.3" step="0.001">
        </div>
      </div>
    </div>
    
    <div class="control-group">
      <label>Filter Freq</label>
      <input type="range" id="filterFreq" min="200" max="20000" value="20000" step="100">
    </div>
    
    <div class="control-group">
      <label>Filter Reso</label>
      <input type="range" id="filterReso" min="0.5" max="20" value="1" step="0.5">
    </div>
    
    <div class="control-group">
      <label>Wah Rate</label>
      <input type="range" id="autoWahRate" min="0.1" max="5" value="1" step="0.1">
    </div>
    
    <div class="control-group">
      <label>Wah Depth</label>
      <input type="range" id="autoWahDepth" min="100" max="1500" value="800">
    </div>
    
    <div class="rhythm-panel">
      <div class="rhythm-title">DYNAMIC RHYTHM</div>
      <div class="control-group">
        <label>Speed</label>
        <input type="range" id="rhythmSpeed" min="30" max="2000" value="120">
      </div>
      <div class="control-group">
        <label>Intensity</label>
        <input type="range" id="rhythmIntensity" min="0" max="100" value="50">
      </div>
      <div class="rhythm-buttons">
        <button id="startRhythmBtn">Start Rhythm</button>
        <button id="stopRhythmBtn" disabled>Stop Rhythm</button>
      </div>
    </div>
    
    <div class="kick-panel">
      <div class="kick-title">KICK CONTROL</div>
      <div class="kick-controls">
        <div class="control-group">
          <label>Volume</label>
          <input type="range" id="kickVolume" min="0" max="100" value="80">
        </div>
        <div class="control-group">
          <label>Pattern</label>
          <select id="kickPattern">
            <option value="4/4">4/4</option>
            <option value="2/4">2/4</option>
            <option value="breakbeat">Breakbeat</option>
            <option value="offbeat">Offbeat</option>
            <option value="techno">Techno</option>
          </select>
        </div>
        <div class="control-group">
          <label>Punch</label>
          <input type="range" id="kickPunch" min="0" max="100" value="60">
        </div>
        <div class="control-group">
          <label>Bass Layer</label>
          <input type="range" id="kickBass" min="0" max="100" value="100">
        </div>
        <div class="control-group">
          <label>Distortion</label>
          <input type="range" id="kickDistortion" min="0" max="100" value="40">
        </div>
        <div class="control-group">
          <label>Freq Sweep</label>
          <input type="range" id="kickSweep" min="0" max="100" value="100">
        </div>
      </div>
    </div>
    
    <div class="effect-group">
      <div class="effect-group-title">EFFECTS</div>
      <button id="toggleDist">Distortion</button>
      <button id="toggleAutoWah">Auto Wah</button>
      <button id="toggleFlanger">Flanger</button>
      <button id="toggleChorus">Chorus</button>
      <button id="toggleTremolo">Tremolo</button>
      <button id="toggleFilter">Filter</button>
      <button id="toggleDelay">Delay</button>
      <button id="toggleReverb">Reverb</button>
    </div>
    
    <div class="preset-panel">
      <div class="preset-title">PRESET SYSTEM</div>
      <div class="preset-controls">
        <button id="savePresetBtn">Save Preset</button>
        <button id="loadPresetBtn">Load Preset</button>
        <button id="randomPresetBtn">Random</button>
        <button id="exportPresetBtn">Export</button>
      </div>
    </div>
    
    <div class="animation-panel">
      <div class="animation-title">VISUAL ANIMATIONS</div>
      <div class="control-group">
        <select id="animationSelect">
          <option value="none">None</option>
          <option value="psychedelic">Psychedelic</option>
          <option value="cosmicDust">Cosmic Dust</option>
          <option value="network" selected>Network</option>
          <option value="metaballs">Metaballs</option>
          <option value="oscilloscope">Oscilloscope</option>
          <option value="equalizer">Equalizer</option>
          <option value="circularWave">Circular Wave</option>
          <option value="kaleidoscope">Kaleidoscope</option>
          <option value="spiral">Spiral</option>
          <option value="matrix">Matrix</option>
        </select>
      </div>
      <div class="animation-controls">
        <div class="control-group">
          <label>Animation Speed</label>
          <input type="range" id="animSpeed" min="0.1" max="3" value="1" step="0.1">
        </div>
        <div class="control-group">
          <label>Intensity</label>
          <input type="range" id="animIntensity" min="0.1" max="2" value="1" step="0.1">
        </div>
      </div>
    </div>
  </div>
</div>

<div id="statusMessage"></div>

<div id="permissionModal" class="modal">
  <div class="modal-content">
    <h3>Motion Access Required</h3>
    <p>This feature needs access to your device's motion sensors for tilt control.</p>
    <div class="modal-buttons">
      <button id="permissionAllow">Allow</button>
      <button id="permissionDeny">Deny</button>
    </div>
  </div>
</div>

<script>
// ==================== PROFESYONEL AUDIO ENGINE ====================
class ProSynthEngine {
  constructor() {
    this.audioCtx = null;
    this.isPlaying = false;
    this.lowPowerMode = false;
    this.performanceMonitor = new PerformanceMonitor();
    this.presetManager = new PresetManager();
    
    // State management
    this.state = {
      baseFreq: 261.63,
      octaveOffset: 0,
      tiltBend: 0,
      detuneAmount: 15,
      waveType: "sawtooth",
      motionEnabled: false,
      panEnabled: false,
      NUM_OSC: 4,
      pulseWidth: 0.5,
      rhythmActive: false,
      rhythmSpeed: 120,
      rhythmIntensity: 50,
      currentAnimation: "network",
      animationSpeed: 1,
      animationIntensity: 1,
      kickSettings: {
        volume: 80, pattern: '4/4', punch: 60,
        bass: 100, distortion: 40, sweep: 100
      },
      adsr: {
        attack: 0.01,
        decay: 0.1,
        sustain: 0.7,
        release: 0.3
      }
    };
    
    this.effects = {
      dist: false, autoWah: false, flanger: false,
      chorus: false, tremolo: false, filter: true,
      delay: false, reverb: false
    };
    
    // Audio nodes
    this.nodes = {};
    this.oscillators = [];
    this.precomputedCurves = this.precomputeDistortionCurves();
    
    // Timing
    this.rhythmInterval = null;
    this.lastTouchTime = 0;
    this.lastOrientationTime = 0;
    this.touchThrottle = 16;
    this.motionThrottle = 33;
    
    // Visual
    this.animationFrameId = null;
    this.animationHue = 0;
    this.touchPoint = {x: 0, y: 0};
    
    // Performance
    this.latency = 0;
    this.lastLatencyCheck = 0;
    
    // ADSR
    this.envelopeGain = null;
    this.gate = 0;
  }

  // ==================== AUDIO CONTEXT & STATIC GRAPH ====================
  initializeAudioContext() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.audioCtx = new AudioContext({
        latencyHint: 'interactive'
      });
      
      this.unlockAudioForIOS();
      this.createStaticAudioGraph();
      return true;
    } catch (error) {
      console.error('AudioContext initialization failed:', error);
      return false;
    }
  }

  unlockAudioForIOS() {
    const unlock = () => {
      if (this.audioCtx && this.audioCtx.state === 'suspended') {
        const oscillator = this.audioCtx.createOscillator();
        const gainNode = this.audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(this.audioCtx.destination);
        gainNode.gain.value = 0.001;
        oscillator.start();
        oscillator.stop(this.audioCtx.currentTime + 0.001);
        
        this.audioCtx.resume().then(() => {
          console.log('AudioContext unlocked for iOS');
        });
      }
    };
    
    document.addEventListener('touchstart', unlock, { once: true });
    document.addEventListener('touchend', unlock, { once: true });
  }

  createStaticAudioGraph() {
    if (!this.audioCtx) return;
    
    this.cleanupAudioNodes();
    
    // Create master chain with proper gain staging
    this.nodes.masterGain = this.audioCtx.createGain();
    this.nodes.masterGain.gain.value = 0.15;
    
    // Create ADSR envelope
    this.envelopeGain = this.audioCtx.createGain();
    this.envelopeGain.gain.value = 0;
    
    // Create all effect nodes with bypass system
    this.createEffectNodes();
    this.createKickNodes();
    this.createOscillators();
    
    // Connect static audio graph - NO MORE RECONNECTING
    this.connectStaticGraph();
    
    console.log('Static audio graph created');
  }

  createEffectNodes() {
    // Distortion with precomputed curves and bypass
    this.nodes.distortion = this.audioCtx.createWaveShaper();
    this.nodes.distortion.curve = this.precomputedCurves.medium;
    this.nodes.distortionBypass = this.audioCtx.createGain();
    this.nodes.distortionBypass.gain.value = 0;
    
    // Auto Wah with bypass
    this.nodes.autoWah = this.audioCtx.createBiquadFilter();
    this.nodes.autoWah.type = "bandpass";
    this.nodes.autoWah.frequency.value = 800;
    this.nodes.autoWah.Q.value = 5;
    this.nodes.autoWahBypass = this.audioCtx.createGain();
    this.nodes.autoWahBypass.gain.value = 0;
    
    this.nodes.autoWahLFO = this.audioCtx.createOscillator();
    this.nodes.autoWahLFO.frequency.value = 1;
    this.nodes.autoWahGain = this.audioCtx.createGain();
    this.nodes.autoWahGain.gain.value = 600;
    this.nodes.autoWahLFO.connect(this.nodes.autoWahGain);
    this.nodes.autoWahGain.connect(this.nodes.autoWah.frequency);
    this.nodes.autoWahLFO.start();
    
    // Flanger with bypass
    this.nodes.flangerDelay = this.audioCtx.createDelay(0.02);
    this.nodes.flangerDelay.delayTime.value = 0.005;
    this.nodes.flangerBypass = this.audioCtx.createGain();
    this.nodes.flangerBypass.gain.value = 0;
    
    this.nodes.flangerLFO = this.audioCtx.createOscillator();
    this.nodes.flangerLFO.frequency.value = 0.2;
    this.nodes.flangerGain = this.audioCtx.createGain();
    this.nodes.flangerGain.gain.value = 0.005;
    this.nodes.flangerFeedback = this.audioCtx.createGain();
    this.nodes.flangerFeedback.gain.value = 0.5;
    this.nodes.flangerLFO.connect(this.nodes.flangerGain);
    this.nodes.flangerGain.connect(this.nodes.flangerDelay.delayTime);
    this.nodes.flangerLFO.start();
    
    // Chorus with bypass
    this.nodes.chorusDelay = this.audioCtx.createDelay(0.05);
    this.nodes.chorusDelay.delayTime.value = 0.025;
    this.nodes.chorusBypass = this.audioCtx.createGain();
    this.nodes.chorusBypass.gain.value = 0;
    
    this.nodes.chorusLFO = this.audioCtx.createOscillator();
    this.nodes.chorusLFO.frequency.value = 0.5;
    this.nodes.chorusGain = this.audioCtx.createGain();
    this.nodes.chorusGain.gain.value = 0.01;
    this.nodes.chorusLFO.connect(this.nodes.chorusGain);
    this.nodes.chorusGain.connect(this.nodes.chorusDelay.delayTime);
    this.nodes.chorusLFO.start();
    
    // Tremolo with bypass
    this.nodes.tremoloLFO = this.audioCtx.createOscillator();
    this.nodes.tremoloLFO.frequency.value = 5;
    this.nodes.tremoloGain = this.audioCtx.createGain();
    this.nodes.tremoloGain.gain.value = 0;
    this.nodes.tremoloLFO.connect(this.nodes.tremoloGain);
    this.nodes.tremoloLFO.start();
    
    // Filter (always on but with smoothing)
    this.nodes.filter = this.audioCtx.createBiquadFilter();
    this.nodes.filter.type = "lowpass";
    this.nodes.filter.frequency.value = 20000;
    this.nodes.filter.Q.value = 1;
    
    // Delay with bypass
    this.nodes.delay = this.audioCtx.createDelay(2);
    this.nodes.delay.delayTime.value = 0.3;
    this.nodes.delayBypass = this.audioCtx.createGain();
    this.nodes.delayBypass.gain.value = 0;
    
    this.nodes.delayFeedback = this.audioCtx.createGain();
    this.nodes.delayFeedback.gain.value = 0.5;
    
    // Reverb with bypass
    this.nodes.reverb = this.audioCtx.createConvolver();
    this.nodes.reverbBypass = this.audioCtx.createGain();
    this.nodes.reverbBypass.gain.value = 0;
    
    const buffer = this.audioCtx.createBuffer(2, this.audioCtx.sampleRate * 1.5, this.audioCtx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buffer.getChannelData(c);
      for (let i = 0; i < buffer.length; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / buffer.length, 2);
      }
    }
    this.nodes.reverb.buffer = buffer;
    
    // Panner with smoothing
    this.nodes.panner = this.audioCtx.createStereoPanner();
    this.nodes.panner.pan.value = 0;
    
    // Safety limiter (ALWAYS ON)
    this.nodes.limiter = this.audioCtx.createDynamicsCompressor();
    this.nodes.limiter.threshold.value = -1;
    this.nodes.limiter.knee.value = 0;
    this.nodes.limiter.ratio.value = 20;
    this.nodes.limiter.attack.value = 0.003;
    this.nodes.limiter.release.value = 0.05;
  }

  connectStaticGraph() {
    // Main signal chain - PERMANENTLY CONNECTED
    // Oscillators -> Envelope -> Effects chain
    this.envelopeGain.connect(this.nodes.distortionBypass);
    this.nodes.distortionBypass.connect(this.nodes.distortion);
    this.nodes.distortion.connect(this.nodes.autoWahBypass);
    this.nodes.autoWahBypass.connect(this.nodes.autoWah);
    this.nodes.autoWah.connect(this.nodes.flangerBypass);
    this.nodes.flangerBypass.connect(this.nodes.flangerDelay);
    this.nodes.flangerDelay.connect(this.nodes.chorusBypass);
    this.nodes.chorusBypass.connect(this.nodes.chorusDelay);
    this.nodes.chorusDelay.connect(this.nodes.filter);
    this.nodes.filter.connect(this.nodes.delayBypass);
    this.nodes.delayBypass.connect(this.nodes.delay);
    this.nodes.delay.connect(this.nodes.reverbBypass);
    this.nodes.reverbBypass.connect(this.nodes.reverb);
    this.nodes.reverb.connect(this.nodes.panner);
    this.nodes.panner.connect(this.nodes.limiter);
    this.nodes.limiter.connect(this.audioCtx.destination);
    
    // Effect feedback loops (static)
    this.nodes.flangerDelay.connect(this.nodes.flangerFeedback);
    this.nodes.flangerFeedback.connect(this.nodes.flangerDelay);
    
    this.nodes.delay.connect(this.nodes.delayFeedback);
    this.nodes.delayFeedback.connect(this.nodes.delay);
    
    // Tremolo modulation (static)
    this.nodes.tremoloGain.connect(this.nodes.masterGain.gain);
  }

  // ==================== ADSR ENVELOPE SYSTEM ====================
  triggerEnvelope() {
    if (!this.audioCtx || !this.envelopeGain) return;
    
    const now = this.audioCtx.currentTime;
    this.gate = 1;
    
    // Reset envelope
    this.envelopeGain.gain.cancelScheduledValues(now);
    this.envelopeGain.gain.setValueAtTime(0, now);
    
    // Attack
    this.envelopeGain.gain.linearRampToValueAtTime(1, now + this.state.adsr.attack);
    
    // Decay to sustain
    this.envelopeGain.gain.linearRampToValueAtTime(
      this.state.adsr.sustain, 
      now + this.state.adsr.attack + this.state.adsr.decay
    );
  }

  releaseEnvelope() {
    if (!this.audioCtx || !this.envelopeGain) return;
    
    const now = this.audioCtx.currentTime;
    this.gate = 0;
    
    // Release
    this.envelopeGain.gain.cancelScheduledValues(now);
    this.envelopeGain.gain.setTargetAtTime(0, now, this.state.adsr.release * 0.3);
  }

  updateADSRParameters() {
    // This will be called when ADSR sliders change
    if (this.gate === 1) {
      // If currently in sustain phase, update the sustain level
      if (this.audioCtx && this.envelopeGain) {
        const now = this.audioCtx.currentTime;
        this.envelopeGain.gain.cancelScheduledValues(now);
        this.envelopeGain.gain.setValueAtTime(this.state.adsr.sustain, now);
      }
    }
  }

  updateEffectBypasses() {
    const now = this.audioCtx.currentTime;
    
    // Smooth bypass transitions (20ms)
    this.nodes.distortionBypass.gain.setTargetAtTime(
      this.effects.dist ? 1 : 0, now, 0.02
    );
    this.nodes.autoWahBypass.gain.setTargetAtTime(
      this.effects.autoWah ? 1 : 0, now, 0.02
    );
    this.nodes.flangerBypass.gain.setTargetAtTime(
      this.effects.flanger ? 1 : 0, now, 0.02
    );
    this.nodes.chorusBypass.gain.setTargetAtTime(
      this.effects.chorus ? 1 : 0, now, 0.02
    );
    this.nodes.delayBypass.gain.setTargetAtTime(
      this.effects.delay ? 1 : 0, now, 0.02
    );
    this.nodes.reverbBypass.gain.setTargetAtTime(
      this.effects.reverb ? 1 : 0, now, 0.02
    );
    
    // Tremolo depth
    this.nodes.tremoloGain.gain.setTargetAtTime(
      this.effects.tremolo ? 0.3 : 0, now, 0.02
    );
  }

  // ==================== ADVANCED OSCILLATORS ====================
  createOscillators() {
    this.cleanupOscillators();
    const now = this.audioCtx.currentTime;
    
    for (let i = 0; i < this.state.NUM_OSC; i++) {
      let osc;
      
      if (this.state.waveType === 'fm') {
        osc = this.createFMOscillator(now);
      } else if (this.state.waveType === 'pulse') {
        osc = this.createPulseOscillator(now);
      } else if (this.state.waveType === 'wavetable') {
        osc = this.createWavetableOscillator(now);
      } else {
        osc = this.audioCtx.createOscillator();
        osc.type = this.state.waveType;
      }
      
      // Apply detune with PolyBLEP-style smoothing
      this.applyAdvancedDetune(osc, i, now);
      
      if (this.state.waveType === 'pulse') {
        const pulseWidth = this.createPulseShaper();
        osc.connect(pulseWidth);
        pulseWidth.connect(this.envelopeGain);
      } else {
        osc.connect(this.envelopeGain);
      }
      
      osc.start(now);
      this.oscillators.push(osc);
    }
  }

  createWavetableOscillator(now) {
    const osc = this.audioCtx.createOscillator();
    // Simple wavetable simulation using custom wave
    const real = new Float32Array(256);
    const imag = new Float32Array(256);
    
    // Create a rich wavetable with multiple harmonics
    for (let i = 0; i < 256; i++) {
      const phase = (i / 256) * 2 * Math.PI;
      // Add multiple harmonics for richer sound
      real[i] = Math.sin(phase) + 0.5 * Math.sin(2 * phase) + 0.25 * Math.sin(3 * phase);
      imag[i] = 0;
    }
    
    const wave = this.audioCtx.createPeriodicWave(real, imag);
    osc.setPeriodicWave(wave);
    return osc;
  }

  applyAdvancedDetune(osc, index, now) {
    const detune = (index - Math.floor(this.state.NUM_OSC / 2)) * this.state.detuneAmount;
    
    // Use exponential smoothing for more musical detune
    osc.detune.setValueAtTime(osc.detune.value, now);
    osc.detune.exponentialRampToValueAtTime(detune, now + 0.05);
  }

  // ==================== PERFORMANCE OPTIMIZATIONS ====================
  precomputeDistortionCurves() {
    const curves = {};
    const types = {
      soft: 20,
      medium: 50,
      hard: 100,
      extreme: 200
    };
    
    Object.entries(types).forEach(([name, amount]) => {
      const n = 44100;
      const curve = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const x = (i - n / 2) / (n / 2);
        // Improved distortion curve with anti-aliasing
        curve[i] = Math.tanh(x * (3 + amount * 0.1)) * (1 + amount * 0.01);
      }
      curves[name] = curve;
    });
    
    return curves;
  }

  applySmoothParamChange(param, targetValue, rampTime = 0.02) {
    if (!this.audioCtx) return;
    const now = this.audioCtx.currentTime;
    param.cancelScheduledValues(now);
    param.linearRampToValueAtTime(targetValue, now + rampTime);
  }

  measureLatency() {
    if (!this.audioCtx || performance.now() - this.lastLatencyCheck < 1000) return;
    
    this.lastLatencyCheck = performance.now();
    const startTime = this.audioCtx.currentTime;
    
    // Simple latency measurement
    const oscillator = this.audioCtx.createOscillator();
    const gainNode = this.audioCtx.createGain();
    gainNode.gain.value = 0.001;
    
    oscillator.connect(gainNode);
    gainNode.connect(this.audioCtx.destination);
    
    oscillator.start(startTime);
    oscillator.stop(startTime + 0.001);
    
    this.latency = Math.round((this.audioCtx.currentTime - startTime) * 1000);
  }

  // ==================== PRESET SYSTEM ====================
  savePreset(name = `preset_${Date.now()}`) {
    const preset = {
      name,
      state: {...this.state},
      effects: {...this.effects},
      timestamp: Date.now()
    };
    
    this.presetManager.savePreset(preset);
    return preset;
  }

  loadPreset(preset) {
    this.state = {...preset.state};
    this.effects = {...preset.effects};
    
    // Update audio engine
    if (this.isPlaying) {
      this.createOscillators();
      this.updateEffectBypasses();
    }
    
    // Update UI
    this.updateUIFromPreset();
  }

  randomizePreset() {
    // Randomize synth parameters
    this.state.detuneAmount = Math.random() * 50;
    this.state.waveType = ['sawtooth', 'square', 'triangle', 'sine', 'pulse'][Math.floor(Math.random() * 5)];
    
    // Randomize effects
    Object.keys(this.effects).forEach(key => {
      this.effects[key] = Math.random() > 0.5;
    });
    
    if (this.isPlaying) {
      this.createOscillators();
      this.updateEffectBypasses();
    }
    
    this.updateUIFromPreset();
  }

  updateUIFromPreset() {
    // Update UI elements to match current state
    document.getElementById('detuneRange').value = this.state.detuneAmount;
    document.getElementById('waveSelect').value = this.state.waveType;
    
    // Update effect buttons
    Object.keys(this.effects).forEach(effect => {
      const button = document.getElementById(`toggle${effect.charAt(0).toUpperCase() + effect.slice(1)}`);
      if (button) {
        button.classList.toggle('active', this.effects[effect]);
      }
    });
  }

  // ==================== CLEANUP ====================
  cleanupAudioNodes() {
    Object.values(this.nodes).forEach(node => {
      if (node && node.disconnect) node.disconnect();
    });
    this.nodes = {};
  }

  cleanupOscillators() {
    this.oscillators.forEach(osc => {
      try { osc.stop(); osc.disconnect(); } catch (e) {}
    });
    this.oscillators = [];
  }

  // ==================== PUBLIC API ====================
  async start() {
    if (this.isPlaying) return false;
    
    if (!this.audioCtx) {
      if (!this.initializeAudioContext()) return false;
    }
    
    this.createStaticAudioGraph();
    this.isPlaying = true;
    this.performanceMonitor.start();
    return true;
  }

  stop() {
    if (!this.isPlaying) return;
    
    this.stopRhythm();
    this.performanceMonitor.stop();
    this.cleanupOscillators();
    this.cleanupAudioNodes();
    
    if (this.audioCtx) {
      this.audioCtx.close().then(() => {
        this.audioCtx = null;
        this.isPlaying = false;
      }).catch(console.error);
    }
  }

  setFrequency(freq) {
    if (!this.isPlaying || !this.oscillators.length) return;
    
    this.state.baseFreq = freq;
    const now = this.audioCtx.currentTime;
    
    this.oscillators.forEach((osc, i) => {
      if (osc.frequency) {
        osc.frequency.cancelScheduledValues(now);
        osc.frequency.linearRampToValueAtTime(freq, now + 0.01);
      }
    });
  }

  setVolume(volume) {
    if (!this.isPlaying || !this.nodes.masterGain) return;
    this.applySmoothParamChange(this.nodes.masterGain.gain, volume * 0.15);
  }

  setPan(pan) {
    if (!this.isPlaying || !this.nodes.panner) return;
    this.applySmoothParamChange(this.nodes.panner.pan, pan);
  }

  startPerformanceMonitoring() {
    this.performanceMonitor.start();
  }

  stopPerformanceMonitoring() {
    this.performanceMonitor.stop();
  }

  // Placeholder methods for compatibility
  createFMOscillator(now) {
    const osc = this.audioCtx.createOscillator();
    osc.type = 'sine';
    return osc;
  }

  createPulseOscillator(now) {
    const osc = this.audioCtx.createOscillator();
    osc.type = 'square';
    return osc;
  }

  createPulseShaper() {
    return this.audioCtx.createGain();
  }

  stopRhythm() {
    if (this.rhythmInterval) {
      clearInterval(this.rhythmInterval);
      this.rhythmInterval = null;
    }
  }
}

// ==================== PRESET MANAGER ====================
class PresetManager {
  constructor() {
    this.storageKey = 'synthPresets';
    this.presets = this.loadPresets();
  }

  savePreset(preset) {
    this.presets[preset.name] = preset;
    this.saveToStorage();
    return preset;
  }

  loadPreset(name) {
    return this.presets[name];
  }

  deletePreset(name) {
    delete this.presets[name];
    this.saveToStorage();
  }

  getAllPresets() {
    return Object.values(this.presets);
  }

  loadPresets() {
    try {
      return JSON.parse(localStorage.getItem(this.storageKey)) || {};
    } catch (e) {
      return {};
    }
  }

  saveToStorage() {
    localStorage.setItem(this.storageKey, JSON.stringify(this.presets));
  }

  exportPresets() {
    const data = JSON.stringify(this.presets, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    return URL.createObjectURL(blob);
  }

  importPresets(jsonData) {
    try {
      const imported = JSON.parse(jsonData);
      this.presets = { ...this.presets, ...imported };
      this.saveToStorage();
      return true;
    } catch (e) {
      return false;
    }
  }
}

// ==================== PERFORMANCE MONITOR ====================
class PerformanceMonitor {
  constructor() {
    this.cpuUsage = 0;
    this.frameTime = 0;
    this.monitoring = false;
    this.lastTime = performance.now();
    this.frameCount = 0;
    this.animationId = null;
  }

  start() {
    this.monitoring = true;
    this.lastTime = performance.now();
    this.frameCount = 0;
    this.update();
  }

  stop() {
    this.monitoring = false;
    if (this.animationId) cancelAnimationFrame(this.animationId);
  }

  update() {
    if (!this.monitoring) return;
    
    const now = performance.now();
    this.frameCount++;
    
    if (now - this.lastTime >= 1000) {
      this.cpuUsage = Math.min(100, Math.round(this.frameCount * 16.67));
      this.frameCount = 0;
      this.lastTime = now;
      
      const indicator = document.getElementById('perfIndicator');
      if (indicator) {
        const latency = synthEngine.latency || 0;
        indicator.textContent = `CPU: ${this.cpuUsage}% | Latency: ${latency}ms`;
        indicator.style.background = this.cpuUsage > 80 ? 'rgba(255,50,50,0.8)' : 'var(--control-bg)';
      }
    }
    
    this.animationId = requestAnimationFrame(() => this.update());
  }
}

];

const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const patternMap = {

// ==================== UI FUNCTIONS ====================
function showStatus(msg, duration = 800) {
  elements.statusMessage.textContent = msg;
  elements.statusMessage.classList.add('show');
  setTimeout(() => elements.statusMessage.classList.remove('show'), duration);
}

function updateButtonStates() {
  elements.startBtn.disabled = synthEngine.isPlaying;
  elements.stopBtn.disabled = !synthEngine.isPlaying;
}

function updateThemeColor(color) {
  document.documentElement.style.setProperty('--r', color[0]);
  document.documentElement.style.setProperty('--g', color[1]);
  document.documentElement.style.setProperty('--b', color[2]);
  
  const r = color[0]/255, g = color[1]/255, b = color[2]/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max + min)/2;
  
  if (max === min) {
    h = s = 0;
  } else {
    const d = max - min;
    s = l > 0.5 ? d/(2 - max - min) : d/(max + min);
    switch(max) {
      case r: h = ((g - b)/d + (g < b ? 6 : 0))/6; break;
      case g: h = ((b - r)/d + 2)/6; break;
      case b: h = ((r - g)/d + 4)/6; break;
    }
  }
  synthEngine.animationHue = Math.round(h * 360);
}

function freqToNote(freq) {
  const A4 = 440;
  const semitonesFromA4 = 12 * Math.log2(freq/A4);
  const noteIndex = Math.round(semitonesFromA4 + 9) % 12;
  const octave = Math.floor((semitonesFromA4 + 9)/12);
  const noteName = noteNames[(noteIndex + 12) % 12];
  return {name: noteName, octave: octave, fullName: `${noteName}${octave}`};
}

function noteFromPad(y) {
  const padHeight = window.innerHeight;
  const ratio = 1 - (y/padHeight);
  const baseFreq = 65.41 * Math.pow(2, synthEngine.state.octaveOffset);
  return baseFreq * Math.pow(2, (ratio * 24)/12);
}

function createNoteRuler() {
  const notes = ['C6','B5','A#5','A5','G#5','G5','F#5','F5','E5','D#5','D5','C#5','C5','B4','A#4','A4','G#4','G4','F#4','F4','E4','D#4','D4','C#4','C4'];
  elements.noteRuler.innerHTML = '';
  notes.forEach(note => {
    const div = document.createElement('div');
    div.className = 'ruler-note';
    div.textContent = note;
    elements.noteRuler.appendChild(div);
  });
}

// ==================== TOUCH HANDLING ====================
function handleTouchStart(e) {
  e.preventDefault();
  const now = performance.now();
  if (now - synthEngine.lastTouchTime < synthEngine.touchThrottle) return;
  synthEngine.lastTouchTime = now;
  
  if (!synthEngine.isPlaying) {
    showStatus('Start synth first');
    return;
  }
  
  const touch = e.touches ? e.touches[0] : e;
  updateTouchPosition(touch.clientX, touch.clientY);
  
  // Trigger ADSR envelope
  synthEngine.triggerEnvelope();
  
  // Calculate frequency and sustain
  const freq = noteFromPad(touch.clientY);
  const sustain = touch.clientX / window.innerWidth;
  
  synthEngine.setFrequency(freq);
  synthEngine.state.adsr.sustain = sustain;
  synthEngine.updateADSRParameters();
  
  // Update display
  const noteInfo = freqToNote(freq);
  elements.noteDisplay.textContent = noteInfo.fullName;
  const colorIndex = noteNames.indexOf(noteInfo.name);
  if (colorIndex !== -1) updateThemeColor(noteColors[colorIndex]);
}

function handleTouchMove(e) {
  e.preventDefault();
  const now = performance.now();
  if (now - synthEngine.lastTouchTime < synthEngine.touchThrottle) return;
  synthEngine.lastTouchTime = now;
  
  if (!synthEngine.isPlaying) return;
  
  const touch = e.touches ? e.touches[0] : e;
  updateTouchPosition(touch.clientX, touch.clientY);
  
  // Update frequency and sustain while touching
  const freq = noteFromPad(touch.clientY);
  const sustain = touch.clientX / window.innerWidth;
  
  synthEngine.setFrequency(freq);
  synthEngine.state.adsr.sustain = sustain;
  synthEngine.updateADSRParameters();
  
  // Update display
  const noteInfo = freqToNote(freq);
  elements.noteDisplay.textContent = noteInfo.fullName;
  const colorIndex = noteNames.indexOf(noteInfo.name);
  if (colorIndex !== -1) updateThemeColor(noteColors[colorIndex]);
}

function handleTouchEnd(e) {
  e.preventDefault();
  if (!synthEngine.isPlaying) return;
  
  // Release ADSR envelope
  synthEngine.releaseEnvelope();
  
  // Hide touch feedback
  const touchFeedback = document.getElementById('touchFeedback');
  touchFeedback.style.opacity = '0';
}

function updateTouchPosition(x, y) {
  // Update touch feedback
  const touchFeedback = document.getElementById('touchFeedback');
  touchFeedback.style.left = x + 'px';
  touchFeedback.style.top = y + 'px';
  touchFeedback.style.width = '80px';
  touchFeedback.style.height = '80px';
  touchFeedback.style.opacity = '1';
}

// ==================== PRESET SYSTEM UI ====================
function setupPresetSystem() {
  elements.savePresetBtn.addEventListener('click', () => {
    const name = prompt('Preset name:', `preset_${Date.now()}`);
    if (name) {
      const preset = synthEngine.savePreset(name);
      showStatus(`Preset "${name}" saved`);
    }
  });
  
  elements.loadPresetBtn.addEventListener('click', () => {
    const presets = synthEngine.presetManager.getAllPresets();
    if (presets.length === 0) {
      showStatus('No presets saved');
      return;
    }
    
    const presetNames = presets.map(p => p.name).join('\n');
    const name = prompt(`Available presets:\n${presetNames}\n\nEnter preset name to load:`);
    if (name && synthEngine.presetManager.loadPreset(name)) {
      synthEngine.loadPreset(synthEngine.presetManager.loadPreset(name));
      showStatus(`Preset "${name}" loaded`);
    }
  });
  
  elements.randomPresetBtn.addEventListener('click', () => {
    synthEngine.randomizePreset();
    showStatus('Random preset applied');
  });
  
  elements.exportPresetBtn.addEventListener('click', () => {
    const url = synthEngine.presetManager.exportPresets();
    const a = document.createElement('a');
    a.href = url;
    a.download = 'synth_presets.json';
    a.click();
    showStatus('Presets exported');
  });
}

// ==================== ANIMATIONS ====================
const animations = {
  none: {
    init() {},
    draw(ctx, time) {
      ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    }
  },
  
  psychedelic: {
    init() {},
    draw(ctx, time) {
      const w = ctx.canvas.width, h = ctx.canvas.height;
      ctx.fillStyle = 'rgba(0,0,0,0.1)';
      ctx.fillRect(0,0,w,h);
      const centerX = w/2, centerY = h/2;
      for(let i=0;i<5;i++){
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(time*(0.1+i*0.05)*synthEngine.state.animationSpeed);
        const hue = (synthEngine.animationHue+i*30+time*20)%360;
        ctx.strokeStyle = `hsla(${hue},100%,60%,${0.15-i*0.02})`;
        ctx.lineWidth = 2-i*0.3;
        ctx.beginPath();
        for(let j=0;j<6;j++){
          const angle = (j/6)*Math.PI*2;
          const radius = 100+Math.sin(time*2+i)*50*synthEngine.state.animationIntensity+i*20;
          const x = Math.cos(angle+time)*radius;
          const y = Math.sin(angle+time)*radius;
          if(j===0) ctx.moveTo(x,y);
          else {
            const cpx = Math.cos(angle-0.5+time)*(radius*1.5);
            const cpy = Math.sin(angle-0.5+time)*(radius*1.5);
            ctx.quadraticCurveTo(cpx, cpy, x, y);
          }
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }
    }
  },
  
  cosmicDust: {
    particles: [],
    init() {
      this.particles = [];
      for(let i=0;i<150;i++) this.particles.push({
        x: Math.random()*elements.waveCanvas.width,
        y: Math.random()*elements.waveCanvas.height,
        size: Math.random()*2+0.5,
        sx: (Math.random()*0.5-0.25)*synthEngine.state.animationSpeed,
        sy: (Math.random()*0.5-0.25)*synthEngine.state.animationSpeed
      });
    },
    draw(ctx, time) {
      ctx.fillStyle = 'rgba(0,0,0,0.05)';
      ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
      this.particles.forEach(p => {
        p.x += p.sx; p.y += p.sy;
        if(p.x > ctx.canvas.width) p.x = 0;
        if(p.x < 0) p.x = ctx.canvas.width;
        if(p.y > ctx.canvas.height) p.y = 0;
        if(p.y < 0) p.y = ctx.canvas.height;
        ctx.fillStyle = `hsl(${synthEngine.animationHue},100%,70%)`;
        ctx.shadowBlur = 10*synthEngine.state.animationIntensity;
        ctx.shadowColor = `hsl(${synthEngine.animationHue},100%,70%)`;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
      });
      ctx.shadowBlur = 0;
    }
  },
  
  network: {
    nodes: [],
    init() {
      this.nodes = [];
      for(let i=0;i<60;i++) this.nodes.push({
        x: Math.random()*elements.waveCanvas.width,
        y: Math.random()*elements.waveCanvas.height,
        vx: (Math.random()-0.5)*0.5*synthEngine.state.animationSpeed,
        vy: (Math.random()-0.5)*0.5*synthEngine.state.animationSpeed
      });
    },
    draw(ctx, time) {
      ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);
      this.nodes.forEach(n => {
        n.x += n.vx; n.y += n.vy;
        if(n.x < 0 || n.x > ctx.canvas.width) n.vx = -n.vx;
        if(n.y < 0 || n.y > ctx.canvas.height) n.vy = -n.vy;
      });
      
      for(let i=0;i<this.nodes.length;i++) {
        for(let j=i+1;j<this.nodes.length;j++) {
          const dx = this.nodes[i].x-this.nodes[j].x, dy = this.nodes[i].y-this.nodes[j].y;
          const dist = Math.sqrt(dx*dx+dy*dy);
          if(dist < 150) {
            const opacity = (1-(dist/150))*synthEngine.state.animationIntensity;
            ctx.strokeStyle = `hsla(${synthEngine.animationHue},100%,60%,${opacity*0.5})`;
            ctx.beginPath();
            ctx.moveTo(this.nodes[i].x,this.nodes[i].y);
            ctx.lineTo(this.nodes[j].x,this.nodes[j].y);
            ctx.stroke();
          }
        }
      }
      
      this.nodes.forEach(n => {
        ctx.fillStyle = `hsla(${synthEngine.animationHue},100%,80%,0.8)`;
        ctx.beginPath();
        ctx.arc(n.x,n.y,2,0,Math.PI*2);
        ctx.fill();
      });
    }
  }
};

function startWaveAnimation() {
  const canvas = elements.waveCanvas;
  const ctx = canvas.getContext('2d');
  
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const currentAnimation = animations[synthEngine.state.currentAnimation];
    if (currentAnimation && currentAnimation.init) {
      currentAnimation.init();
    }
  }
  
  resize();
  window.addEventListener('resize', resize);
  
  function animate() {
    if (!synthEngine.isPlaying) return;
    synthEngine.animationFrameId = requestAnimationFrame(animate);
    const time = Date.now() * 0.001;
    const currentAnimation = animations[synthEngine.state.currentAnimation];
    if (currentAnimation && currentAnimation.draw) {
      currentAnimation.draw(ctx, time);
    }
    
    // Measure latency periodically
    synthEngine.measureLatency();
  }
  
  animate();
}

function stopWaveAnimation() {
  if (synthEngine.animationFrameId) {
    cancelAnimationFrame(synthEngine.animationFrameId);
    synthEngine.animationFrameId = null;
  }
  const ctx = elements.waveCanvas.getContext('2d');
  ctx.clearRect(0, 0, elements.waveCanvas.width, elements.waveCanvas.height);
}

// ==================== EVENT LISTENERS ====================
function initializeEventListeners() {
  // Touch and mouse events with ADSR
  elements.pad.addEventListener("touchstart", handleTouchStart, {passive: false});
  elements.pad.addEventListener("touchmove", handleTouchMove, {passive: false});
  elements.pad.addEventListener("touchend", handleTouchEnd, {passive: false});
  elements.pad.addEventListener("mousedown", handleTouchStart);
  elements.pad.addEventListener("mousemove", e => {
    if (e.buttons === 1) handleTouchMove(e);
  });
  elements.pad.addEventListener("mouseup", handleTouchEnd);
  elements.pad.addEventListener("mouseleave", handleTouchEnd);
  
  // Control buttons
  elements.startBtn.addEventListener("click", async () => {
    if (await synthEngine.start()) {
      updateButtonStates();
      startWaveAnimation();
      showStatus('Started - Try effects!');
    } else {
      showStatus('Start failed - Check browser permissions');
    }
  });
  
  elements.stopBtn.addEventListener("click", () => {
    synthEngine.stop();
    updateButtonStates();
    stopWaveAnimation();
    showStatus('Stopped');
  });
  
  // Control panel toggle
  elements.toggleControls.addEventListener("click", () => {
    elements.controls.classList.toggle("expanded");
  });
  
  // ADSR controls
  document.getElementById('attackRange').addEventListener('input', (e) => {
    synthEngine.state.adsr.attack = parseFloat(e.target.value);
    synthEngine.updateADSRParameters();
  });
  
  document.getElementById('decayRange').addEventListener('input', (e) => {
    synthEngine.state.adsr.decay = parseFloat(e.target.value);
    synthEngine.updateADSRParameters();
  });
  
  document.getElementById('sustainRange').addEventListener('input', (e) => {
    synthEngine.state.adsr.sustain = parseFloat(e.target.value);
    synthEngine.updateADSRParameters();
  });
  
  document.getElementById('releaseRange').addEventListener('input', (e) => {
    synthEngine.state.adsr.release = parseFloat(e.target.value);
    synthEngine.updateADSRParameters();
  });
  
  // Other controls...
  document.getElementById('detuneRange').addEventListener('input', (e) => {
    synthEngine.state.detuneAmount = parseFloat(e.target.value);
    if (synthEngine.isPlaying) {
      synthEngine.createOscillators();
    }
  });
  
  document.getElementById('waveSelect').addEventListener('change', (e) => {
    synthEngine.state.waveType = e.target.value;
    if (synthEngine.isPlaying) {
      synthEngine.createOscillators();
    }
  });
  
  // Effect toggles
  document.getElementById('toggleDist').addEventListener('click', (e) => {
    synthEngine.effects.dist = !synthEngine.effects.dist;
    e.target.classList.toggle('active', synthEngine.effects.dist);
    synthEngine.updateEffectBypasses();
  });
  
  document.getElementById('toggleAutoWah').addEventListener('click', (e) => {
    synthEngine.effects.autoWah = !synthEngine.effects.autoWah;
    e.target.classList.toggle('active', synthEngine.effects.autoWah);
    synthEngine.updateEffectBypasses();
  });
  
  // Add more effect toggles as needed...
  
  // Preset system
  setupPresetSystem();
}

// ==================== INITIALIZATION ====================
window.addEventListener('load', () => {
  updateThemeColor([255, 100, 100]);
  initializeEventListeners();
  updateButtonStates();
  createNoteRuler();
  showStatus('Ready - Click Start then try effects! Touch to play notes.');
  
  // Low power mode detection
  if ('hardwareConcurrency' in navigator && navigator.hardwareConcurrency <= 4) {
    synthEngine.lowPowerMode = true;
    synthEngine.state.NUM_OSC = 2;
  }
});

window.addEventListener("contextmenu", e => e.preventDefault());
</script>
