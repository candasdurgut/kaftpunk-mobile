<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gelişmiş Synth</title>
<style>
:root{--r:255;--g:100;--b:100;--bg-color:rgba(var(--r),var(--g),var(--b),0.3);--control-bg:rgba(var(--r),var(--g),var(--b),0.4);--text-color:rgba(255,255,255,0.95);--border-color:rgba(var(--r),var(--g),var(--b),0.8);--safe-area-inset-top:env(safe-area-inset-top);--safe-area-inset-bottom:env(safe-area-inset-bottom);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background-color:#111;color:var(--text-color);font-family:-apple-system,sans-serif;font-weight:400;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;overflow:hidden;}
body{background-color:var(--bg-color);transition:background-color 0.1s ease;}
#app-container{height:100%;display:flex;flex-direction:column;}
#pad{width:100%;height:100vh;position:relative;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at center,var(--control-bg),rgba(0,0,0,0.4));cursor:crosshair;}
#noteDisplay,#motionDisplay,#wahDisplay,#panDisplay,#performanceDisplay{position:absolute;background-color:var(--control-bg);color:var(--text-color);pointer-events:none;z-index:10;border:2px solid var(--border-color);backdrop-filter:blur(20px);padding:8px 16px;border-radius:20px;font-size:14px;font-weight:500;transition:all 0.1s ease;}
#noteDisplay{top:max(20px,var(--safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:24px;text-shadow:0 0 20px var(--border-color);}
#motionDisplay,#wahDisplay,#panDisplay,#performanceDisplay{bottom:20px;left:50%;transform:translateX(-50%);display:none;}
#wahDisplay{bottom:60px;}#panDisplay{bottom:100px;}#motionDisplay{bottom:140px;}#performanceDisplay{bottom:180px;font-size:10px;}
#noteRuler{position:absolute;right:0;top:0;bottom:0;width:60px;background:var(--control-bg);border-left:2px solid var(--border-color);display:flex;flex-direction:column;justify-content:space-between;padding:10px 0;pointer-events:none;z-index:5;}
.ruler-note{display:flex;align-items:center;justify-content:center;flex:1;font-size:11px;color:var(--text-color);border-bottom:1px solid var(--border-color);}
#controls{position:fixed;bottom:0;left:0;right:0;max-height:70vh;background:var(--control-bg);backdrop-filter:blur(30px);border-top:2px solid var(--border-color);transform:translateY(calc(100% - 50px));transition:transform 0.3s ease;overflow-y:auto;padding:15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;z-index:100;-ms-overflow-style:none;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-y;}
#controls::-webkit-scrollbar{display:none;}
#controls.expanded{transform:translateY(0);}
#toggleControls{position:fixed;bottom:10px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--control-bg);border:2px solid var(--border-color);color:var(--text-color);font-size:20px;font-weight:bold;cursor:pointer;z-index:1000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 25px var(--border-color);transition:all 0.1s ease;}
button,select,input[type=range],label{font-family:inherit;font-size:12px;font-weight:500;border-radius:8px;border:2px solid var(--border-color);background:var(--control-bg);color:var(--text-color);-webkit-appearance:none;appearance:none;transition:all 0.1s ease;outline:none;}
button{padding:10px 12px;cursor:pointer;min-height:40px;}
button.active{background:var(--border-color);color:#111;font-weight:600;box-shadow:0 0 15px var(--border-color);}
.control-group{display:flex;flex-direction:column;align-items:center;}
label{font-size:10px;margin-bottom:3px;text-align:center;}
input[type=range]{width:100%;height:6px;background:var(--border-color);border:none;margin:5px 0;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:var(--text-color);cursor:pointer;border-radius:50%;box-shadow:0 0 15px var(--border-color);}
select{padding:8px;cursor:pointer;min-height:40px;width:100%;}
#statusMessage{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--control-bg);color:var(--text-color);padding:8px 16px;border-radius:8px;font-size:12px;z-index:100;opacity:0;transition:opacity 0.3s;pointer-events:none;backdrop-filter:blur(15px);border:2px solid var(--border-color);}
#statusMessage.show{opacity:1;}
.effect-group{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0;padding:8px;background:var(--control-bg);border-radius:8px;border:2px solid var(--border-color);}
.effect-group-title{grid-column:1/-1;text-align:center;font-size:11px;font-weight:600;color:var(--text-color);margin-bottom:3px;}
.rhythm-panel{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin:8px 0;padding:12px;background:var(--control-bg);border-radius:8px;border:2px solid var(--border-color);}
.rhythm-title{text-align:center;font-size:11px;font-weight:600;color:var(--text-color);margin-bottom:5px;}
.rhythm-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.kick-panel{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin:8px 0;padding:12px;background:var(--control-bg);border-radius:8px;border:2px solid var(--border-color);}
.kick-title{text-align:center;font-size:11px;font-weight:600;color:var(--text-color);margin-bottom:5px;}
.kick-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:var(--control-bg);z-index:1000;justify-content:center;align-items:center;}
.modal-content{background:var(--control-bg);padding:20px;border-radius:15px;max-width:80%;text-align:center;backdrop-filter:blur(25px);border:2px solid var(--border-color);}
.modal-buttons{display:flex;gap:8px;margin-top:15px;}
.modal-buttons button{flex:1;}
#waveAnimation{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}
.animation-panel{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin:8px 0;padding:12px;background:var(--control-bg);border-radius:8px;border:2px solid var(--border-color);}
.animation-title{text-align:center;font-size:11px;font-weight:600;color:var(--text-color);margin-bottom:5px;}
.animation-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.performance-panel{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin:8px 0;padding:12px;background:var(--control-bg);border-radius:8px;border:2px solid var(--border-color);}
.performance-title{text-align:center;font-size:11px;font-weight:600;color:var(--text-color);margin-bottom:5px;}
.performance-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.quality-indicator{position:fixed;top:10px;right:10px;background:var(--control-bg);color:var(--text-color);padding:4px 8px;border-radius:8px;font-size:10px;z-index:1000;border:1px solid var(--border-color);}
.quality-transition{animation:qualityPulse 0.5s ease-in-out;}
@keyframes qualityPulse{0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}
</style>
</head>

<button id="permissionAllow">Allow</button>

<script>
// Gelişmiş State Management
const AppState = {
    audioCtx: null, oscillators: [], masterGain: null, baseFreq: 261.63, 
    octaveOffset: 0, tiltBend: 0, detuneAmount: 15, waveType: "sawtooth", 
    isPlaying: false, motionEnabled: false, panEnabled: false, 
    pulseWidth: 0.5, rhythmActive: false, rhythmSpeed: 120, rhythmIntensity: 50, 
    currentAnimation: "network", animationSpeed: 1, animationIntensity: 1,
    kickSettings: {volume: 80, pattern: '4/4', punch: 60, bass: 100, distortion: 40, sweep: 100},
    qualityLevel: 'medium',
    qualityMode: 'auto',
    performance: {cpuUsage: 0, fps: 0, memoryUsage: 0, audioLatency: 0},
    transitionSmoothness: 5
};

// OSCILLATOR POOL - Tüm kaliteler için hazır osilatör havuzu
class OscillatorPool {
    constructor() {
        this.pool = new Map(); // qualityLevel -> oscillators
        this.activeOscillators = new Map(); // qualityLevel -> active count
        this.maxOscillators = 9; // Tüm kaliteler için maksimum
        this.initPool();
    }

    initPool() {
        // Tüm kalite seviyeleri için osilatör havuzu oluştur
        const levels = ['low', 'medium', 'high'];
        levels.forEach(level => {
            this.pool.set(level, []);
            this.activeOscillators.set(level, 0);
        });
    }

    getRequiredOscillators(qualityLevel) {
        const requirements = {
            low: 3,
            medium: 5,
            high: 7
        };
        return requirements[qualityLevel] || 5;
    }

    async setupForContext(audioContext, waveType = 'sawtooth') {
        if (!audioContext) return;

        // Tüm kalite seviyeleri için osilatörleri hazırla
        for (const [level, oscillators] of this.pool) {
            const required = this.getRequiredOscillators(level);
            
            // Eksik osilatörleri ekle
            while (oscillators.length < required) {
                const osc = this.createOscillator(audioContext, waveType);
                oscillators.push(osc);
            }
            
            // Fazla osilatörleri temizle (gereksiz bellek kullanımını önle)
            while (oscillators.length > this.maxOscillators) {
                const osc = oscillators.pop();
                try {
                    osc.stop();
                    osc.disconnect();
                } catch (e) {}
            }
        }
    }

    createOscillator(audioContext, waveType) {
        const osc = audioContext.createOscillator();
        osc.type = waveType;
        osc.frequency.value = 0; // Başlangıçta sessiz
        osc.start();
        return osc;
    }

    activateQuality(qualityLevel, targetFreq, audioContext, detuneAmount = 15) {
        if (!this.pool.has(qualityLevel)) return [];

        const oscillators = this.pool.get(qualityLevel);
        const required = this.getRequiredOscillators(qualityLevel);
        const activeOscs = [];

        // Gerekli sayıda osilatörü aktif et
        for (let i = 0; i < Math.min(required, oscillators.length); i++) {
            const osc = oscillators[i];
            
            // Frekans ve detune ayarla
            osc.frequency.setValueAtTime(targetFreq, audioContext.currentTime);
            osc.detune.value = (i - Math.floor(required / 2)) * detuneAmount;
            
            // Master gain'e bağla (eğer bağlı değilse)
            if (!osc.connected) {
                osc.connect(AppState.masterGain);
                osc.connected = true;
            }
            
            activeOscs.push(osc);
        }

        this.activeOscillators.set(qualityLevel, activeOscs.length);
        return activeOscs;
    }

    deactivateQuality(qualityLevel) {
        if (!this.pool.has(qualityLevel)) return;

        const oscillators = this.pool.get(qualityLevel);
        
        // Bu kalite seviyesindeki osilatörleri sessiz yap
        oscillators.forEach(osc => {
            if (osc.connected) {
                osc.frequency.setValueAtTime(0, AppState.audioCtx.currentTime);
            }
        });

        this.activeOscillators.set(qualityLevel, 0);
    }

    smoothTransition(fromQuality, toQuality, targetFreq, duration = 0.1) {
        if (!AppState.audioCtx) return;

        const now = AppState.audioCtx.currentTime;
        
        // Eski osilatörleri kademeli olarak kapat
        if (fromQuality && this.pool.has(fromQuality)) {
            const oldOscs = this.pool.get(fromQuality);
            oldOscs.forEach(osc => {
                if (osc.connected) {
                    osc.frequency.linearRampToValueAtTime(0, now + duration);
                }
            });
        }

        // Yeni osilatörleri kademeli olarak aç
        if (toQuality && this.pool.has(toQuality)) {
            const newOscs = this.pool.get(toQuality);
            const required = this.getRequiredOscillators(toQuality);
            
            for (let i = 0; i < Math.min(required, newOscs.length); i++) {
                const osc = newOscs[i];
                osc.detune.value = (i - Math.floor(required / 2)) * AppState.detuneAmount;
                
                if (!osc.connected) {
                    osc.connect(AppState.masterGain);
                    osc.connected = true;
                }
                
                osc.frequency.setValueAtTime(0, now);
                osc.frequency.linearRampToValueAtTime(targetFreq, now + duration);
            }
        }
    }
}

// Gelişmiş Performans İzleme Sistemi
class PerformanceMonitor {
    constructor() {
        this.metrics = {
            audioProcessingTime: 0,
            memoryUsage: 0,
            cpuLoad: 0,
            frameRate: 0,
            audioLatency: 0
        };
        this.frameCount = 0;
        this.lastTime = performance.now();
        this.sampleCount = 0;
        this.totalProcessingTime = 0;
    }

    startMonitoring() {
        const checkFrameRate = () => {
            this.frameCount++;
            const currentTime = performance.now();
            if (currentTime - this.lastTime >= 1000) {
                this.metrics.frameRate = Math.round(this.frameCount);
                this.frameCount = 0;
                this.lastTime = currentTime;
                this.updatePerformanceDisplay();
            }
            requestAnimationFrame(checkFrameRate);
        };
        checkFrameRate();

        setInterval(() => {
            if (performance.memory) {
                this.metrics.memoryUsage = Math.round(performance.memory.usedJSHeapSize / (1024 * 1024));
            }
        }, 2000);

        this.audioProcessingStart = 0;
    }

    startAudioProcessing() {
        this.audioProcessingStart = performance.now();
    }

    endAudioProcessing() {
        if (this.audioProcessingStart) {
            const processingTime = performance.now() - this.audioProcessingStart;
            this.totalProcessingTime += processingTime;
            this.sampleCount++;
            
            if (this.sampleCount >= 10) {
                this.metrics.audioLatency = Math.round(this.totalProcessingTime / this.sampleCount);
                this.totalProcessingTime = 0;
                this.sampleCount = 0;
            }
        }
    }

    updatePerformanceDisplay() {
        const display = document.getElementById('performanceDisplay');
        if (display) {
            display.textContent = `CPU:${this.metrics.cpuLoad}% FPS:${this.metrics.frameRate} MEM:${this.metrics.memoryUsage}MB`;
            display.style.display = 'block';
        }
    }

    getMetrics() {
        // CPU kullanımını simüle et
        const audioLoad = AppState.rhythmActive ? 15 : 5;
        const animationLoad = AppState.currentAnimation !== 'none' ? 10 : 2;
        const qualityLoad = AppState.qualityLevel === 'high' ? 10 : AppState.qualityLevel === 'medium' ? 5 : 2;
        const baseLoad = 5;
        
        this.metrics.cpuLoad = Math.min(baseLoad + audioLoad + animationLoad + qualityLoad, 95);
        return this.metrics;
    }
}

// Geliştirilmiş Adaptif Kalite Sistemi - Ses kesintisiz geçiş
class AdaptiveQualitySystem {
    constructor() {
        this.qualityLevels = {
            low: { effects: false, animationQuality: 'low', oscCount: 3 },
            medium: { effects: true, animationQuality: 'medium', oscCount: 5 },
            high: { effects: true, animationQuality: 'high', oscCount: 7 }
        };
        this.performanceThresholds = {
            low: { maxCpu: 90, maxMemory: 200, minFps: 20 },
            medium: { maxCpu: 70, maxMemory: 150, minFps: 30 },
            high: { maxCpu: 50, maxMemory: 100, minFps: 45 }
        };
        this.lastAutoAdjustTime = 0;
        this.autoAdjustCooldown = 5000; // 5 saniye cooldown
    }

    detectDeviceCapabilities() {
        let score = 0;
        
        const cores = navigator.hardwareConcurrency || 1;
        score += cores * 15;
        
        if (performance.memory) {
            const memoryGB = performance.memory.jsHeapSizeLimit / (1024 * 1024 * 1024);
            score += Math.min(memoryGB * 25, 50);
        }
        
        if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
            const isNewDevice = /iPhone1[2-9]|iPhone2[0-9]|iPad[8-9]|iPad1[0-9]/.test(navigator.userAgent);
            score += isNewDevice ? 40 : 20;
        }
        
        if (score < 40) return 'low';
        if (score < 80) return 'medium';
        return 'high';
    }

    adjustQualityBasedOnPerformance(metrics) {
        // Cooldown kontrolü
        const now = Date.now();
        if (now - this.lastAutoAdjustTime < this.autoAdjustCooldown) {
            return false;
        }

        const currentLevel = AppState.qualityLevel;
        const thresholds = this.performanceThresholds[currentLevel];
        
        let newLevel = currentLevel;
        
        if (metrics.cpuLoad > thresholds.maxCpu || 
            metrics.memoryUsage > thresholds.maxMemory || 
            metrics.frameRate < thresholds.minFps) {
            newLevel = this.getLowerQualityLevel(currentLevel);
        } else if (metrics.cpuLoad < thresholds.maxCpu - 20 && 
                   metrics.memoryUsage < thresholds.maxMemory - 50 && 
                   metrics.frameRate > thresholds.minFps + 15) {
            newLevel = this.getHigherQualityLevel(currentLevel);
        }

        if (newLevel !== currentLevel) {
            this.lastAutoAdjustTime = now;
            this.setQualityLevel(newLevel, true); // auto mode
            return true;
        }
        
        return false;
    }

    getLowerQualityLevel(current) {
        const levels = ['high', 'medium', 'low'];
        const index = levels.indexOf(current);
        return levels[Math.min(index + 1, levels.length - 1)];
    }

    getHigherQualityLevel(current) {
        const levels = ['low', 'medium', 'high'];
        const index = levels.indexOf(current);
        return levels[Math.max(index - 1, 0)];
    }

    setQualityLevel(level, isAutoAdjust = false) {
        if (AppState.qualityLevel === level) return;
        
        const previousLevel = AppState.qualityLevel;
        AppState.qualityLevel = level;
        const settings = this.qualityLevels[level];
        
        // Manuel modda ve otomatik ayar değilse, sadece seçilen kaliteyi uygula
        if (AppState.qualityMode === 'manual' && !isAutoAdjust) {
            this.applyManualQualitySettings(level, previousLevel);
        } else {
            // Otomatik modda veya otomatik ayar ise
            this.applyQualitySettings(level, previousLevel, isAutoAdjust);
        }
        
        // Kalite göstergesini güncelle
        this.updateQualityIndicator(level, isAutoAdjust);
    }

    applyManualQualitySettings(newLevel, previousLevel) {
        // Manuel modda sadece efekt ayarlarını değiştir
        const settings = this.qualityLevels[newLevel];
        
        if (!settings.effects) {
            Object.keys(effects).forEach(effect => {
                effects[effect] = false;
                const button = document.getElementById(`toggle${effect.charAt(0).toUpperCase() + effect.slice(1)}`);
                if (button) button.classList.remove('active');
            });
        }
        
        // Audio graph'ı yeniden bağla
        if (AppState.audioCtx) {
            connectAudioGraph();
        }
        
        showStatus(`Kalite seviyesi: ${this.getQualityDisplayName(newLevel)} (Manuel)`);
    }

    applyQualitySettings(newLevel, previousLevel, isAutoAdjust) {
        const settings = this.qualityLevels[newLevel];
        const smoothness = AppState.transitionSmoothness / 10; // 0.1 - 1.0 arası
        
        // Osilatör havuzu ile yumuşak geçiş
        if (oscillatorPool && AppState.audioCtx && AppState.baseFreq) {
            oscillatorPool.smoothTransition(
                previousLevel, 
                newLevel, 
                AppState.baseFreq, 
                smoothness
            );
        }
        
        // Efektleri ayarla
        if (!settings.effects) {
            Object.keys(effects).forEach(effect => {
                effects[effect] = false;
                const button = document.getElementById(`toggle${effect.charAt(0).toUpperCase() + effect.slice(1)}`);
                if (button) button.classList.remove('active');
            });
        }
        
        // Audio graph'ı yeniden bağla
        if (AppState.audioCtx) {
            connectAudioGraph();
        }
        
        const modeText = isAutoAdjust ? 'Otomatik' : 'Manuel';
        showStatus(`Kalite: ${this.getQualityDisplayName(newLevel)} (${modeText})`);
    }

    updateQualityIndicator(level, isAutoAdjust) {
        const indicator = document.getElementById('qualityIndicator');
        if (indicator) {
            const mode = isAutoAdjust ? ' (Otomatik)' : ' (Manuel)';
            indicator.textContent = `Kalite: ${this.getQualityDisplayName(level)}${mode}`;
            indicator.classList.add('quality-transition');
            setTimeout(() => {
                indicator.classList.remove('quality-transition');
            }, 500);
        }
    }

    getQualityDisplayName(level) {
        const names = { low: 'Düşük', medium: 'Orta', high: 'Yüksek' };
        return names[level] || level;
    }

    applyUserQualityPreference(preference) {
        if (preference === 'auto') {
            const autoLevel = this.detectDeviceCapabilities();
            this.setQualityLevel(autoLevel, true);
        } else {
            this.setQualityLevel(preference, false);
        }
    }

    setQualityMode(mode) {
        AppState.qualityMode = mode;
        if (mode === 'auto') {
            const autoLevel = this.detectDeviceCapabilities();
            this.setQualityLevel(autoLevel, true);
        }
    }
}

const animations = {
    none: {init(){}, draw(ctx,time){ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);}},
    network: {nodes:[], init(){
        this.nodes=[];
        for(let i=0;i<80;i++)this.nodes.push({x:Math.random()*elements.waveCanvas.width,y:Math.random()*elements.waveCanvas.height,vx:(Math.random()-0.5)*0.5*AppState.animationSpeed,vy:(Math.random()-0.5)*0.5*AppState.animationSpeed});
    }, draw(ctx,time){
        ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);
        this.nodes.forEach(n=>{n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>ctx.canvas.width)n.vx=-n.vx;if(n.y<0||n.y>ctx.canvas.height)n.vy=-n.vy;});
        for(let i=0;i<this.nodes.length;i++){
            for(let j=i+1;j<this.nodes.length;j++){
                const dx=this.nodes[i].x-this.nodes[j].x,dy=this.nodes[i].y-this.nodes[j].y;const dist=Math.sqrt(dx*dx+dy*dy);
                if(dist<150){const opacity=(1-(dist/150))*AppState.animationIntensity;ctx.strokeStyle=`hsla(${animationHue},100%,60%,${opacity*0.5})`;ctx.beginPath();ctx.moveTo(this.nodes[i].x,this.nodes[i].y);ctx.lineTo(this.nodes[j].x,this.nodes[j].y);ctx.stroke();}
            }
        }
        this.nodes.forEach(n=>{ctx.fillStyle=`hsla(${animationHue},100%,80%,0.8)`;ctx.beginPath();ctx.arc(n.x,n.y,2,0,Math.PI*2);ctx.fill();});
    }}
};

// Yardımcı fonksiyonlar
function isAudioContextValid(){return AppState.audioCtx&&AppState.audioCtx.state==='running';}

function safeAudioOperation(op){
    if (performanceMonitor) performanceMonitor.startAudioProcessing();
    if(!isAudioContextValid()){showStatus('Start synth first');if (performanceMonitor) performanceMonitor.endAudioProcessing();return false;}
    try{op();if (performanceMonitor) performanceMonitor.endAudioProcessing();return true}catch(e){console.error(e);showStatus('Audio error');if (performanceMonitor) performanceMonitor.endAudioProcessing();return false;}
}

function showStatus(msg,dur=800){
    elements.statusMessage.textContent=msg;
    elements.statusMessage.classList.add('show');
    setTimeout(()=>elements.statusMessage.classList.remove('show'),dur);
}

function updateButtonStates(){
    elements.startBtn.disabled=AppState.isPlaying;
    elements.stopBtn.disabled=!AppState.isPlaying;
}

// Ana synth fonksiyonları
async function startSynth(){
    if(isAudioContextValid()){showStatus('Already running');return;}
    
    try{
        // Sistem yöneticilerini başlat
        if (!performanceMonitor) {
            performanceMonitor = new PerformanceMonitor();
            performanceMonitor.startMonitoring();
        }
        if (!adaptiveQuality) {
            adaptiveQuality = new AdaptiveQualitySystem();
        }
        if (!oscillatorPool) {
            oscillatorPool = new OscillatorPool();
        }
        
        AppState.audioCtx=new (window.AudioContext||window.webkitAudioContext)();
        
        // Osilatör havuzunu başlat
        await oscillatorPool.setupForContext(AppState.audioCtx, AppState.waveType);
        
        createAudioNodes();
        AppState.isPlaying=true;
        updateButtonStates();
        startWaveAnimation();
        
        // Başlangıç kalitesini ayarla
        const qualityMode = document.getElementById('qualityMode').value;
        if (qualityMode === 'auto') {
            const autoLevel = adaptiveQuality.detectDeviceCapabilities();
            adaptiveQuality.setQualityLevel(autoLevel, true);
        } else {
            const manualLevel = document.getElementById('qualitySelect').value;
            adaptiveQuality.setQualityLevel(manualLevel, false);
        }
        
        // Aktif kaliteyi osilatör havuzunda etkinleştir
        if (oscillatorPool && AppState.baseFreq) {
            oscillatorPool.activateQuality(
                AppState.qualityLevel, 
                AppState.baseFreq, 
                AppState.audioCtx, 
                AppState.detuneAmount
            );
        }
        
        // Performans izleme başlat
        startPerformanceMonitoring();
        
        showStatus('Ses kesintisiz synth başlatıldı!');
    }catch(e){
        console.error(e);
        showStatus('Start failed');
    }
}

function createAudioNodes(){
    AppState.masterGain = AppState.audioCtx.createGain();
    AppState.masterGain.gain.value = 0.2;
    
    // Diğer audio node'ları oluştur
    audioNodes.panner = AppState.audioCtx.createStereoPanner();
    audioNodes.panner.pan.value = 0;
    audioNodes.distortion = createWaveShaper(50);
    audioNodes.distortionGain = AppState.audioCtx.createGain();
    audioNodes.distortionGain.gain.value = 0;
    audioNodes.autoWah = AppState.audioCtx.createBiquadFilter();
    audioNodes.autoWah.type = "bandpass";
    audioNodes.autoWah.frequency.value = 800;
    audioNodes.autoWah.Q.value = 5;
    audioNodes.autoWahLFO = AppState.audioCtx.createOscillator();
    audioNodes.autoWahLFO.frequency.value = 1;
    audioNodes.autoWahGain = AppState.audioCtx.createGain();
    audioNodes.autoWahGain.gain.value = 600;
    audioNodes.autoWahLFO.connect(audioNodes.autoWahGain);
    audioNodes.autoWahGain.connect(audioNodes.autoWah.frequency);
    audioNodes.autoWahLFO.start();
    
    // Diğer efekt node'ları...
    audioNodes.filter = AppState.audioCtx.createBiquadFilter();
    audioNodes.filter.type = "lowpass";
    audioNodes.filter.frequency.value = 20000;
    audioNodes.filter.Q.value = 1;
    
    createKickNodes();
    connectAudioGraph();
}

function createKickNodes(){
    kickOsc = AppState.audioCtx.createOscillator();
    kickGain = AppState.audioCtx.createGain();
    kickGain.gain.value = 0;
    kickOsc2 = AppState.audioCtx.createOscillator();
    kickGain2 = AppState.audioCtx.createGain();
    kickGain2.gain.value = 0;
    kickDistortion = createWaveShaper(0);
    kickDistortion.oversample = '4x';
    kickOsc.connect(kickGain);
    kickOsc2.connect(kickGain2);
    kickGain.connect(kickDistortion);
    kickGain2.connect(kickDistortion);
    kickDistortion.connect(AppState.audioCtx.destination);
    kickOsc.start();
    kickOsc2.start();
}

function createWaveShaper(amount){
    const ws = AppState.audioCtx.createWaveShaper();
    const n = 44100;
    const curve = new Float32Array(n);
    for(let i = 0; i < n; i++){
        const x = (i - n / 2) / (n / 2);
        curve[i] = (3 + amount) * Math.tanh(x * 5) / (Math.PI + amount * Math.abs(x));
    }
    ws.curve = curve;
    return ws;
}

function connectAudioGraph(){
    AppState.masterGain.disconnect();
    
    let signal = AppState.masterGain;
    
    if(effects.dist){ signal.connect(audioNodes.distortion); signal = audioNodes.distortion; }
    if(effects.autoWah){ signal.connect(audioNodes.autoWah); signal = audioNodes.autoWah; }
    signal.connect(audioNodes.filter);
    signal.connect(audioNodes.panner);
    audioNodes.panner.connect(AppState.audioCtx.destination);
    
    audioNodes.distortionGain.gain.value = effects.dist ? 1 : 0;
    audioNodes.autoWahGain.gain.value = effects.autoWah ? 1 : 0;
}

function createNoteRuler(){
    const notes = ['C6','B5','A#5','A5','G#5','G5','F#5','F5','E5','D#5','D5','C#5','C5','B4','A#4','A4','G#4','G4','F#4','F4','E4','D#4','D4','C#4','C4'];
    elements.noteRuler.innerHTML = '';
    notes.forEach(note => {
        const div = document.createElement('div');
        div.className = 'ruler-note';
        div.textContent = note;
        elements.noteRuler.appendChild(div);
    });
}

function freqToNote(freq){
    const A4 = 440, semitonesFromA4 = 12 * Math.log2(freq / A4);
    const noteIndex = Math.round(semitonesFromA4 + 9) % 12;
    const octave = Math.floor((semitonesFromA4 + 9) / 12);
    const noteName = noteNames[(noteIndex + 12) % 12];
    return {name: noteName, octave: octave, fullName: `${noteName}${octave}`};
}

function updateThemeColor(color){
    document.documentElement.style.setProperty('--r', color[0]);
    document.documentElement.style.setProperty('--g', color[1]);
    document.documentElement.style.setProperty('--b', color[2]);
    const r = color[0] / 255, g = color[1] / 255, b = color[2] / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;
    if(max === min){ h = s = 0; } else {
        const d = max - min; s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch(max){
            case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
            case g: h = ((b - r) / d + 2) / 6; break;
            case b: h = ((r - g) / d + 4) / 6; break;
        }
    }
    animationHue = Math.round(h * 360);
}

function noteFromPad(y){
    const padHeight = window.innerHeight;
    const ratio = 1 - (y / padHeight);
    const baseFreq = 65.41 * Math.pow(2, AppState.octaveOffset);
    return baseFreq * Math.pow(2, (ratio * 24) / 12);
}

function applyPitch(){
    if(!safeAudioOperation(() => {
        const freq = AppState.baseFreq;
        const noteInfo = freqToNote(freq);
        
        // Osilatör havuzunu kullanarak frekansı güncelle
        if (oscillatorPool && AppState.audioCtx) {
            const activeOscs = oscillatorPool.activateQuality(
                AppState.qualityLevel,
                freq,
                AppState.audioCtx,
                AppState.detuneAmount
            );
            
            // Aktif osilatörleri AppState'e kaydet
            AppState.oscillators = activeOscs;
        }
        
        elements.noteDisplay.textContent = noteInfo.fullName;
        const colorIndex = noteNames.indexOf(noteInfo.name);
        if(colorIndex !== -1) updateThemeColor(noteColors[colorIndex]);
    })) return;
}

let lastTouchTime = 0;
function handleTouch(e){
    const now = performance.now();
    if(now - lastTouchTime < 1) return;
    lastTouchTime = now;
    if(!isAudioContextValid()){ showStatus('Start synth first'); return; }
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    touchPoint = {x: clientX, y: clientY};
    AppState.baseFreq = noteFromPad(clientY);
    const volume = clientX / window.innerWidth;
    safeAudioOperation(() => {
        AppState.masterGain.gain.setTargetAtTime(volume * 0.4, AppState.audioCtx.currentTime, 0.001);
    });
    applyPitch();
}

function stopSynth(){
    if(!AppState.audioCtx){ showStatus('No synth running'); return; }
    try{
        // Osilatör havuzunu temizle
        if (oscillatorPool) {
            ['low', 'medium', 'high'].forEach(level => {
                oscillatorPool.deactivateQuality(level);
            });
        }
        
        AppState.oscillators = [];
        stopRhythm();
        stopWaveAnimation();
        stopPerformanceMonitoring();
        
        AppState.audioCtx.close().then(() => {
            AppState.audioCtx = null;
            AppState.isPlaying = false;
            updateButtonStates();
            showStatus('Stopped');
        }).catch(e => {
            console.error(e);
            showStatus('Stop error');
        });
    }catch(e){
        console.error(e);
        showStatus('Stop error');
    }
}

// Kalan fonksiyonlar aynı kalacak, sadece gerekli kısımları ekliyorum...

function startPerformanceMonitoring() {
    const monitorInterval = setInterval(() => {
        if (!AppState.isPlaying) {
            clearInterval(monitorInterval);
            return;
        }
        
        const metrics = performanceMonitor.getMetrics();
        
        // Otomatik modda performansa göre kalite ayarla
        if (AppState.qualityMode === 'auto' && adaptiveQuality) {
            adaptiveQuality.adjustQualityBasedOnPerformance(metrics);
        }
    }, 3000);
    
    window.performanceMonitorInterval = monitorInterval;
}

function stopPerformanceMonitoring() {
    if (window.performanceMonitorInterval) {
        clearInterval(window.performanceMonitorInterval);
    }
}

// Gelişmiş event listener'lar
function initializeAdvancedEventListeners() {
    // Kalite modu değişikliği
    elements.qualityMode.addEventListener("change", e => {
        const mode = e.target.value;
        AppState.qualityMode = mode;
        adaptiveQuality.setQualityMode(mode);
        
        if (mode === 'manual') {
            // Manuel modda kalite seçimini etkinleştir
            elements.qualitySelect.disabled = false;
            const currentLevel = elements.qualitySelect.value;
            adaptiveQuality.setQualityLevel(currentLevel, false);
        } else {
            // Otomatik modda kalite seçimini devre dışı bırak
            elements.qualitySelect.disabled = true;
            const autoLevel = adaptiveQuality.detectDeviceCapabilities();
            adaptiveQuality.setQualityLevel(autoLevel, true);
        }
    });
    
    // Manuel kalite seçimi
    elements.qualitySelect.addEventListener("change", e => {
        if (AppState.qualityMode === 'manual') {
            const level = e.target.value;
            adaptiveQuality.setQualityLevel(level, false);
        }
    });
    
    // Geçiş yumuşaklığı
    elements.transitionSmoothness.addEventListener("input", e => {
        AppState.transitionSmoothness = parseInt(e.target.value);
    });
    
    // Performans göstergesini toggle etme
    elements.performanceDisplay.addEventListener("click", () => {
        const display = elements.performanceDisplay;
        display.style.display = display.style.display === 'none' ? 'block' : 'none';
    });
}

// Mevcut event listener'ları genişlet
function initializeEventListeners(){
    elements.pad.addEventListener("touchstart", handleTouch, {passive: true});
    elements.pad.addEventListener("touchmove", handleTouch, {passive: true});
    elements.pad.addEventListener("mousedown", handleTouch);
    elements.pad.addEventListener("mousemove", e => { if(e.buttons === 1) handleTouch(e); });
    elements.startBtn.addEventListener("click", startSynth);
    elements.stopBtn.addEventListener("click", stopSynth);
    
    // Diğer event listener'lar...
    elements.toggleControls.addEventListener("click", toggleControls);
    elements.startRhythmBtn.addEventListener("click", startRhythm);
    elements.stopRhythmBtn.addEventListener("click", stopRhythm);
    
    // Gelişmiş event listener'ları ekle
    initializeAdvancedEventListeners();
}

// Uygulama başlatma
window.addEventListener('load', () => {
    updateThemeColor([255, 100, 100]);
    initializeEventListeners();
    updateButtonStates();
    createNoteRuler();
    
    // Sistem yöneticilerini önceden başlat
    performanceMonitor = new PerformanceMonitor();
    adaptiveQuality = new AdaptiveQualitySystem();
    oscillatorPool = new OscillatorPool();
    
    showStatus('Ses kesintisiz synth hazır! Manuel/Otomatik kalite modu aktif.');
});

// Kalan fonksiyonlar (toggleControls, requestMotionPermission, startMotionControl, disableMotion, togglePan, handleOrientation, playKick, startRhythm, stopRhythm, updateRhythmSpeed, updateRhythmIntensity, updateKickVolume, updateKickPattern, updateKickPunch, updateKickBass, updateKickDistortion, updateKickSweep, startWaveAnimation, stopWaveAnimation, setAnimation, updateAnimationSpeed, updateAnimationIntensity) mevcut halleriyle kalacak...

// Basitçe diğer fonksiyonları buraya ekliyorum:
function toggleControls(){ elements.controls.classList.toggle('expanded'); elements.toggleControls.textContent = elements.controls.classList.contains('expanded') ? '✕' : '⚙️'; }
function requestMotionPermission(){ if(typeof DeviceOrientationEvent.requestPermission === 'function'){ elements.permissionModal.style.display = 'flex'; } else { startMotionControl(); } }
function startMotionControl(){ window.addEventListener("deviceorientation", handleOrientation); AppState.motionEnabled = true; elements.motionBtn.textContent = "Motion ON"; elements.motionBtn.classList.add('active'); elements.motionDisplay.style.display = 'block'; showStatus('Motion enabled - Tilt device for pitch!'); }
function disableMotion(){ window.removeEventListener("deviceorientation", handleOrientation); AppState.motionEnabled = false; AppState.tiltBend = 0; elements.motionBtn.textContent = "Motion OFF"; elements.motionBtn.classList.remove('active'); elements.motionDisplay.style.display = 'none'; showStatus('Motion disabled'); }
function togglePan(){ AppState.panEnabled = !AppState.panEnabled; elements.panBtn.textContent = AppState.panEnabled ? "Pan ON" : "Pan OFF"; elements.panBtn.classList.toggle('active', AppState.panEnabled); elements.panDisplay.style.display = AppState.panEnabled ? 'block' : 'none'; if(!AppState.panEnabled){ updatePan(0); } showStatus(AppState.panEnabled ? 'Pan enabled - Tilt device sideways!' : 'Pan disabled'); }
let lastOrientationTime = 0;
function handleOrientation(e){ const now = performance.now(); if(now - lastOrientationTime < 4) return; lastOrientationTime = now; if(e.beta === null) return; const tilt = e.beta; const pan = e.gamma; if(AppState.motionEnabled){ AppState.tiltBend = tilt / 45 * 12; const baseFreq = 65.41 * Math.pow(2, AppState.octaveOffset); AppState.baseFreq = baseFreq * Math.pow(2, AppState.tiltBend / 12); elements.motionDisplay.textContent = `Tilt:${Math.round(AppState.tiltBend * 10) / 10}st`; applyPitch(); } if(AppState.panEnabled && pan !== null){ const panValue = Math.max(-1, Math.min(1, pan / 90)); updatePan(panValue); } }
function updatePan(position){ if(!audioNodes.panner) return; safeAudioOperation(() => { audioNodes.panner.pan.setTargetAtTime(position, AppState.audioCtx.currentTime, 0.001); const panPercent = Math.round(position * 100); elements.panDisplay.textContent = `Pan:${panPercent}%`; }); }
function playKick(beat){ const pattern = patternMap[AppState.kickSettings.pattern]; if(!pattern[beat % pattern.length]) return; const now = AppState.audioCtx.currentTime; const volume = AppState.kickSettings.volume / 100; const punch = AppState.kickSettings.punch / 100; const bass = AppState.kickSettings.bass / 100; const distortion = AppState.kickSettings.distortion; const sweep = AppState.kickSettings.sweep / 100; const baseFreq = 80 + 40 * punch; const endFreq = 30 + 20 * (1 - sweep); const sweepTime = 0.08 + 0.07 * sweep; kickOsc.frequency.setValueAtTime(baseFreq, now); kickOsc.frequency.exponentialRampToValueAtTime(endFreq, now + sweepTime); kickGain.gain.setValueAtTime(volume * 0.8, now); kickGain.gain.exponentialRampToValueAtTime(0.001, now + sweepTime + 0.05); if(bass > 0){ kickOsc2.frequency.setValueAtTime(60, now); kickOsc2.frequency.exponentialRampToValueAtTime(25, now + sweepTime * 1.5); kickGain2.gain.setValueAtTime(volume * bass * 0.6, now); kickGain2.gain.exponentialRampToValueAtTime(0.001, now + sweepTime * 1.5 + 0.05); } kickDistortion.curve = createWaveShaper(distortion * 50).curve; }
function startRhythm(){ if(!isAudioContextValid()){ showStatus('Start synth first'); return; } stopRhythm(); AppState.rhythmActive = true; elements.startRhythmBtn.disabled = true; elements.stopRhythmBtn.disabled = false; let beat = 0; rhythmInterval = setInterval(() => { if(!isAudioContextValid()) return; const intensity = AppState.rhythmIntensity / 100; const baseGain = 0.1 + intensity * 0.3; const pattern = [baseGain, baseGain * 0.2, baseGain * 0.8, baseGain * 0.1, baseGain, baseGain * 0.3, baseGain * 0.7, baseGain * 0.2]; safeAudioOperation(() => { AppState.masterGain.gain.setTargetAtTime(pattern[beat % 8], AppState.audioCtx.currentTime, 0.001); playKick(beat); }); const randomColor = noteColors[Math.floor(Math.random() * noteColors.length)]; updateThemeColor(randomColor); beat++; }, 60000 / AppState.rhythmSpeed); showStatus('Rhythm Started'); }
function stopRhythm(){ AppState.rhythmActive = false; elements.startRhythmBtn.disabled = false; elements.stopRhythmBtn.disabled = true; if(rhythmInterval){ clearInterval(rhythmInterval); rhythmInterval = null; } showStatus('Rhythm Stopped'); }
function updateRhythmSpeed(value){ AppState.rhythmSpeed = value; if(AppState.rhythmActive){ stopRhythm(); startRhythm(); } }
function updateRhythmIntensity(value){ AppState.rhythmIntensity = value; }
function updateKickVolume(value){ AppState.kickSettings.volume = parseInt(value); }
function updateKickPattern(value){ AppState.kickSettings.pattern = value; }
function updateKickPunch(value){ AppState.kickSettings.punch = parseInt(value); }
function updateKickBass(value){ AppState.kickSettings.bass = parseInt(value); }
function updateKickDistortion(value){ AppState.kickSettings.distortion = parseInt(value); }
function updateKickSweep(value){ AppState.kickSettings.sweep = parseInt(value); }
function startWaveAnimation(){ const canvas = elements.waveCanvas; const ctx = canvas.getContext('2d'); function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; if(animations[AppState.currentAnimation].init){ animations[AppState.currentAnimation].init(); } } resize(); window.addEventListener('resize', resize); function animate(){ if(!AppState.isPlaying) return; animationFrameId = requestAnimationFrame(animate); const time = Date.now() * 0.001; animations[AppState.currentAnimation].draw(ctx, time); } animate(); }
function stopWaveAnimation(){ if(animationFrameId){ cancelAnimationFrame(animationFrameId); animationFrameId = null; const ctx = elements.waveCanvas.getContext('2d'); ctx.clearRect(0, 0, elements.waveCanvas.width, elements.waveCanvas.height); } }
function setAnimation(animationName){ AppState.currentAnimation = animationName; if(AppState.isPlaying){ stopWaveAnimation(); startWaveAnimation(); } showStatus(`Animation: ${animationName === 'none' ? 'None' : animationName}`); }
function updateAnimationSpeed(value){ AppState.animationSpeed = parseFloat(value); }
function updateAnimationIntensity(value){ AppState.animationIntensity = parseFloat(value); }

window.addEventListener("contextmenu", e => e.preventDefault());
</script>
