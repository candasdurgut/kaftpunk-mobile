<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Uçurucu Saykadelik Synth</title>
<style>
html, body {
    margin: 0; padding: 0; height: 100%;
    background: #111; color: #fff;
    font-family: 'Courier New', Courier, monospace;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    touch-action: none;
    overscroll-behavior: none;
}

#pad {
    width: 100vw;
    height: 70vh;
    background: linear-gradient(135deg,#222,#333);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    touch-action: none;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

#noteDisplay {
    position: absolute;
    top: 20px;
    left: 20px;
    background-color: rgba(0, 0, 0, 0.6);
    padding: 10px 15px;
    border-radius: 8px;
    font-size: 24px;
    font-weight: bold;
    pointer-events: none; /* Pad'e tıklamayı engellemez */
    z-index: 10;
}

#controls {
    height: 30vh; display: flex;
    flex-wrap: wrap; padding: 10px;
    gap: 10px; justify-content: center; align-items: center;
    box-sizing: border-box;
}

button, select, input[type=range] {
    padding: 8px 14px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    background: #444;
    color: white;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    transition: background-color 0.2s;
}
button.active { background: #06c; }
button.active.distortion { background: #c00; }

label { font-size: 14px; margin-right: 5px; }
.control-group { display: flex; align-items: center; }
</style>
</head>
<body>

<div id="pad">
    <div id="noteDisplay">C4</div>
</div>

<div id="controls">
    <button id="startBtn">Start Synth</button>
    <button id="motionBtn">Enable Motion</button>
    <button id="octDown">Oct -</button>
    <button id="octUp">Oct +</button>
    <div class="control-group">
        <label for="waveSelect">Wave</label>
        <select id="waveSelect">
            <option value="sawtooth">Saw</option>
            <option value="triangle">Triangle</option>
            <option value="square">Square</option>
            <option value="sine">Sine</option>
        </select>
    </div>
    <div class="control-group">
        <label for="detuneRange">Detune</label>
        <input type="range" id="detuneRange" min="0" max="50" value="15">
    </div>
    <div class="control-group">
        <label for="filterReso">Resonance</label>
        <input type="range" id="filterReso" min="0.5" max="20" value="1" step="0.5">
    </div>
    <button id="toggleFlanger">Flanger</button>
    <button id="togglePhaser">Phaser</button>
    <button id="toggleDist">Distortion</button>
</div>

<script>
let audioCtx;
let oscillators = [];
let gainNode, filter, reverb;
let baseFreq = 261.63, octaveOffset = 0, tiltBend = 0;
let isFlanger=false, isPhaser=false, isDist=false;
const NUM_OSC = 7;
let detuneAmount = 15;
let waveType = "sawtooth";

// --- YENİ EFİKT DEĞİŞKENLERİ ---
let flangerDelay, flangerFeedback, flangerDryWet;
let phaserFilter, phaserLFO, phaserDryWet;
let distortionGain, distortionWaveShaper;
let masterGain; // Ana ses seviyesi için

// === Simple Pseudo Reverb ===
function createReverb(ctx) {
    const convolver = ctx.createConvolver();
    const len = 3*ctx.sampleRate;
    const impulse = ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){
        const buf = impulse.getChannelData(c);
        for(let i=0;i<len;i++){
            buf[i]=(Math.random()*2-1)*(1-i/len);
        }
    }
    convolver.buffer = impulse;
    return convolver;
}

// === Flanger Efekti Oluşturucu ===
function createFlanger(ctx) {
    const delay = ctx.createDelay(0.005);
    delay.delayTime.value = 0.0025;
    const feedback = ctx.createGain();
    feedback.gain.value = 0.7;
    const dryWet = ctx.createGain();
    dryWet.gain.value = 0;
    feedback.connect(delay);
    delay.connect(feedback);
    return { delay, feedback, dryWet };
}

// === Phaser Efekti Oluşturucu ===
function createPhaser(ctx) {
    const filter = ctx.createBiquadFilter();
    filter.type = "allpass";
    filter.frequency.value = 1000;
    filter.Q.value = 10;
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.5;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 400;
    lfo.connect(lfoGain);
    lfoGain.connect(filter.frequency);
    lfo.start();
    const dryWet = ctx.createGain();
    dryWet.gain.value = 0;
    return { filter, lfo, dryWet };
}

// === Distortion (Waveshaper) Efekti Oluşturucu ===
function createDistortion(ctx) {
    const waveshaper = ctx.createWaveShaper();
    const amount = 50;
    const samples = 44100;
    const curve = new Float32Array(samples);
    const deg = Math.PI / 180;
    for (let i = 0; i < samples; i++) {
        const x = (i * 2) / samples - 1;
        curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
    }
    waveshaper.curve = curve;
    waveshaper.oversample = '4x';
    return waveshaper;
}

function startSynth(){
    if (audioCtx) {
        audioCtx.close();
    }
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();

    // --- Efektleri Oluştur ---
    const flanger = createFlanger(audioCtx);
    flangerDelay = flanger.delay;
    flangerFeedback = flanger.feedback;
    flangerDryWet = flanger.dryWet;

    const phaser = createPhaser(audioCtx);
    phaserFilter = phaser.filter;
    phaserLFO = phaser.lfo;
    phaserDryWet = phaser.dryWet;

    distortionWaveShaper = createDistortion(audioCtx);
    distortionGain = audioCtx.createGain(); // Distortion için anahtar
    distortionGain.gain.value = 0;

    // --- Ana Ses Düğümleri ---
    gainNode = audioCtx.createGain();
    gainNode.gain.value = 0.15;

    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.5;

    filter = audioCtx.createBiquadFilter();
    filter.type="lowpass";
    filter.frequency.value=9000;
    filter.Q.value=parseFloat(document.getElementById('filterReso').value);

    reverb = createReverb(audioCtx);

    // OSCILLATORS
    oscillators=[];
    for(let i=0;i<NUM_OSC;i++){
        const osc = audioCtx.createOscillator();
        osc.type = waveType;
        const detune = (i-Math.floor(NUM_OSC/2))*(detuneAmount);
        osc.detune.value = detune;
        osc.connect(gainNode);
        osc.start();
        oscillators.push(osc);
    }

    // --- SES YOLUNU (SIGNAL CHAIN) OLUŞTUR ---
    gainNode.connect(filter);

    // Ana Kuru Ses Yolu
    filter.connect(masterGain);

    // Reverb Yolu
    filter.connect(reverb);
    reverb.connect(masterGain);

    // Flanger Yolu
    filter.connect(flangerDelay);
    flangerDelay.connect(flangerDryWet);
    flangerDryWet.connect(masterGain);

    // Phaser Yolu
    filter.connect(phaserFilter);
    phaserFilter.connect(phaserDryWet);
    phaserDryWet.connect(masterGain);

    // Distortion Yolu
    filter.connect(distortionGain);
    distortionGain.connect(distortionWaveShaper);
    distortionWaveShaper.connect(masterGain);

    masterGain.connect(audioCtx.destination);
}

// === Pad X→Pitch Y→Filter & Note Display ===
const pad = document.getElementById("pad");
const noteDisplay = document.getElementById("noteDisplay");

const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

function freqToNote(freq) {
    const A4 = 440;
    const semitonesFromA4 = 12 * Math.log2(freq / A4);
    const noteIndex = Math.round(semitonesFromA4 + 9) % 12;
    const octave = Math.floor((semitonesFromA4 + 9) / 12);
    const noteName = noteNames[(noteIndex + 12) % 12];
    return `${noteName}${octave}`;
}

function noteFromPad(x){
    const c4 = 261.63 * Math.pow(2,octaveOffset);
    const c5 = c4*2;
    const ratio = x/window.innerWidth;
    return c4 + (c5-c4)*ratio;
}

function applyPitch(){
    const freq = baseFreq*Math.pow(2,tiltBend/12);
    oscillators.forEach(osc=>osc.frequency.setTargetAtTime(freq,audioCtx.currentTime,0.01));
    noteDisplay.textContent = freqToNote(freq);
}

pad.addEventListener("touchstart",handleTouch);
pad.addEventListener("touchmove",handleTouch);
pad.addEventListener("mousedown",handleTouch); // Mouse desteği için
pad.addEventListener("mousemove", e => { if (e.buttons === 1) handleTouch(e);}); // Sadece basılıyken

function handleTouch(e){
    e.preventDefault();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    baseFreq = noteFromPad(clientX);
    filter.frequency.value = 500+((window.innerHeight-clientY)/window.innerHeight)*8000;
    applyPitch();
}

// === DeviceOrientation Whammy ===
function enableMotion(){
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
        DeviceOrientationEvent.requestPermission().then(res=>{
            if(res==='granted'){
                window.addEventListener("deviceorientation", e=>{
                    if(e.beta !== null) {
                        const norm = e.beta/45;
                        tiltBend = norm*24; // ±2 octaves
                        applyPitch();
                    }
                });
            }
        });
    } else {
        // İzin gerektirmeyen cihazlar için (genellikle Android/PC)
        window.addEventListener("deviceorientation", e=>{
            if(e.beta !== null) {
                const norm = e.beta/45;
                tiltBend = norm*24;
                applyPitch();
            }
        });
    }
}

// === Octave Buttons ===
document.getElementById("octUp").onclick = ()=>{ octaveOffset++; applyPitch(); };
document.getElementById("octDown").onclick = ()=>{ octaveOffset--; applyPitch(); };

// === Waveform select ===
document.getElementById("waveSelect").onchange = e=>{
    waveType = e.target.value;
    oscillators.forEach(osc=>osc.type=waveType);
};

// === Detune control ===
document.getElementById("detuneRange").oninput = e=>{
    detuneAmount = parseFloat(e.target.value);
    oscillators.forEach((osc,i)=>{
        const det = (i-Math.floor(NUM_OSC/2))*detuneAmount;
        osc.detune.setValueAtTime(det,audioCtx.currentTime);
    });
};

// === Filter Resonance ===
document.getElementById("filterReso").oninput = e=>{
    if(filter) filter.Q.value=parseFloat(e.target.value);
};

// === Toggle Effects ===
document.getElementById("toggleFlanger").onclick = () => {
    isFlanger = !isFlanger;
    flangerDryWet.gain.setTargetAtTime(isFlanger ? 0.7 : 0, audioCtx.currentTime, 0.01);
    document.getElementById("toggleFlanger").classList.toggle('active', isFlanger);
};

document.getElementById("togglePhaser").onclick = () => {
    isPhaser = !isPhaser;
    phaserDryWet.gain.setTargetAtTime(isPhaser ? 0.7 : 0, audioCtx.currentTime, 0.01);
    document.getElementById("togglePhaser").classList.toggle('active', isPhaser);
};

document.getElementById("toggleDist").onclick = () => {
    isDist = !isDist;
    distortionGain.gain.setTargetAtTime(isDist ? 1 : 0, audioCtx.currentTime, 0.01);
    document.getElementById("toggleDist").classList.toggle('active', isDist);
    document.getElementById("toggleDist").classList.toggle('distortion', isDist);
};

// === Buttons ===
document.getElementById("startBtn").onclick = ()=>startSynth();
document.getElementById("motionBtn").onclick = ()=>enableMotion();

// Prevent context menu globally
window.addEventListener("contextmenu", e=>e.preventDefault());
</script>
</body>
</html>
