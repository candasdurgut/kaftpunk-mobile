<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover" />
<title>Synth Pro — Fixed</title>
<style>
:root{--r:100;--g:100;--b:100;--bg:rgb(var(--r),var(--g),var(--b));--control-bg:rgba(0,0,0,0.18);--text:#f0f0f0;--border:rgba(var(--r),var(--g),var(--b),0.45)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#111;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial}
body{background:var(--bg);transition:background .12s}
#pad{height:100vh;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at center,var(--control-bg),rgba(0,0,0,0.45));cursor:crosshair}
#noteDisplay,#octaveDisplay,#motionDisplay,#wahDisplay,#panDisplay{position:absolute;background:rgba(0,0,0,0.7);color:var(--text);padding:8px 12px;border-radius:16px;border:1px solid var(--border);backdrop-filter:blur(8px);z-index:10}
#noteDisplay{top:max(20px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:20px}
#octaveDisplay{top:max(20px,env(safe-area-inset-top));right:16px}
#motionDisplay,#wahDisplay,#panDisplay{bottom:18px;left:50%;transform:translateX(-50%);display:none}
#noteRuler{position:absolute;right:0;top:0;bottom:0;width:60px;background:rgba(0,0,0,0.28);border-left:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:8px 0;pointer-events:none}
.ruler-note{display:flex;align-items:center;justify-content:center;flex:1;font-size:11px;color:var(--border);border-bottom:1px solid rgba(255,255,255,0.06)}
#controls{position:fixed;left:0;right:0;bottom:0;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;background:rgba(0,0,0,0.92);backdrop-filter:blur(14px);border-top:1px solid var(--border);transform:translateY(calc(100% - 50px));transition:transform .28s}
#controls.expanded{transform:translateY(0)}
#toggleControls{position:fixed;right:18px;bottom:12px;width:50px;height:50px;border-radius:50%;background:var(--bg);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1000}
button,select,input[type=range],label{font-family:inherit;font-size:12px;border-radius:8px;border:1px solid var(--border);background:var(--control-bg);color:var(--text);padding:8px}
button{cursor:pointer}
button.active{background:var(--bg);color:#111;font-weight:700}
.control-group{display:flex;flex-direction:column;align-items:center}
.rhythm-panel{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px;border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,0.3)}
.effect-group{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:8px;border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,0.32)}
#statusMessage{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:rgba(0,0,0,0.85);padding:8px 12px;border-radius:8px;opacity:0;transition:opacity .2s;color:#fff}
#statusMessage.show{opacity:1}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:2000}
.modal-content{background:rgba(30,30,30,0.98);padding:18px;border-radius:12px;border:1px solid var(--border)}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(.96)}100%{transform:scale(1)}}
.pulse{animation:pulse .28s}
.flash{animation:flash .12s}
</style>
</head>
<body>
<div id="pad">
  <div id="noteDisplay">C4</div>
  <div id="octaveDisplay">Oct:0</div>
  <div id="motionDisplay">Tilt:0°</div>
  <div id="wahDisplay">Wah:ON</div>
  <div id="panDisplay">Pan:0%</div>
  <div id="noteRuler"></div>
</div>

<button id="toggleControls">⚙️</button>

<div id="controls">
  <button id="startBtn">Start</button>
  <button id="stopBtn" disabled>Stop</button>
  <button id="motionBtn">Motion</button>
  <button id="panBtn">Pan</button>
  <button id="octDown">Oct-</button>
  <button id="octUp">Oct+</button>

  <div class="control-group">
    <label>Wave</label>
    <select id="waveSelect">
      <option value="sawtooth">Sawtooth</option>
      <option value="triangle">Triangle</option>
      <option value="square">Square</option>
      <option value="sine">Sine</option>
      <option value="pulse">Pulse</option>
      <option value="fm">FM</option>
    </select>
  </div>

  <div class="control-group">
    <label>Unison Detune (cents)</label>
    <input id="detuneRange" type="range" min="0" max="50" value="15" />
  </div>

  <div class="control-group">
    <label>FM Depth (Hz)</label>
    <input id="fmDepthRange" type="range" min="0" max="1200" value="0" />
  </div>

  <div class="control-group">
    <label>Filter Freq</label>
    <input id="filterFreq" type="range" min="200" max="20000" value="20000" step="100" />
  </div>

  <div class="control-group">
    <label>Filter Reso (Q)</label>
    <input id="filterReso" type="range" min="0.5" max="20" value="1" step="0.1" />
  </div>

  <div class="control-group">
    <label>Wah Rate</label>
    <input id="autoWahRate" type="range" min="0.1" max="8" value="1" step="0.1" />
  </div>

  <div class="control-group">
    <label>Wah Depth</label>
    <input id="autoWahDepth" type="range" min="0" max="1200" value="600" />
  </div>

  <div class="rhythm-panel">
    <button id="rhythm4">1/4</button>
    <button id="rhythm8">1/8</button>
    <button id="rhythm16">1/16</button>
    <button id="rhythm32">1/32</button>
    <button id="rhythmStop">Stop</button>
    <button id="rhythmTriplet">Triplet</button>
    <button id="rhythmShuffle">Shuffle</button>
    <button id="rhythmDotted">Dotted</button>
    <button id="rhythmStutter">Stutter</button>
    <button id="rhythmRandom">Random</button>
  </div>

  <div class="effect-group">
    <button id="toggleDist">Distortion</button>
    <button id="toggleAutoWah">Auto Wah</button>
    <button id="toggleFlanger">Flanger</button>
    <button id="toggleChorus">Chorus</button>
    <button id="toggleTremolo">Tremolo</button>
    <button id="toggleFilter">Filter</button>
    <button id="toggleDelay">Delay</button>
    <button id="toggleReverb">Reverb</button>
  </div>
</div>

<div id="statusMessage"></div>

<div id="permissionModal" class="modal">
  <div class="modal-content">
    <h3>Motion Access Required</h3>
    <p>This feature needs access to your device's motion sensors for tilt control.</p>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button id="permissionAllow">Allow</button>
      <button id="permissionDeny">Deny</button>
    </div>
  </div>
</div>

<script>
/* ============================
   DSP Worklet (string)
   - No masterGain param here (master controlled in main graph)
   - parameters: baseFreq, fmDepth, pulseWidth
   - PolyBLEP uses phaseInc-based dt
   - FM implemented via global fmPhase (simple sinusoidal mod)
   ============================ */
const workletCode = `
class SynthProcessor extends AudioWorkletProcessor {
  static get parameterDescriptors() {
    return [
      { name: 'baseFreq', defaultValue: 261.63, minValue: 20, maxValue: 20000, automationRate: 'a-rate' },
      { name: 'fmDepth', defaultValue: 0, minValue: 0, maxValue: 5000, automationRate: 'a-rate' },
      { name: 'pulseWidth', defaultValue: 0.5, minValue: 0.01, maxValue: 0.99, automationRate: 'k-rate' }
    ];
  }

  constructor() {
    super();
    this.sampleRate = sampleRate;
    this.numVoices = 7;
    this.phases = new Float32Array(this.numVoices);
    this.detunes = new Float32Array(this.numVoices);
    this.wave = 'sawtooth';
    this.fmEnabled = false;
    this.fmPhase = 0;
    this.fmFreq = 2.0; // Hz for FM carrier modulator (global)
    this.twoPI = 2 * Math.PI;
    this.port.onmessage = (e) => {
      const d = e.data;
      if (d.type === 'detuneArray' && d.detuneArray) {
        for (let i = 0; i < Math.min(this.numVoices, d.detuneArray.length); i++) this.detunes[i] = d.detuneArray[i];
      } else if (d.type === 'wave') {
        this.wave = d.wave;
        this.fmEnabled = (d.wave === 'fm');
      } else if (d.type === 'voices') {
        if (d.numVoices) {
          const nv = Math.min(12, Math.max(1, d.numVoices));
          if (nv !== this.numVoices) {
            this.numVoices = nv;
            this.phases = new Float32Array(this.numVoices);
            this.detunes = new Float32Array(this.numVoices);
          }
        }
      } else if (d.type === 'fmFreq') {
        if (typeof d.fmFreq === 'number') this.fmFreq = d.fmFreq;
      }
    };
  }

  // PolyBLEP helper
  polyBLEP(t, dt) {
    if (t < dt) {
      t = t / dt;
      return t + t - t * t - 1.0;
    } else if (t > 1.0 - dt) {
      t = (t - 1.0) / dt;
      return t * t + t + t + 1.0;
    } else {
      return 0.0;
    }
  }

  bl_saw(phase, dt) {
    let t = phase % 1.0;
    let v = 2.0 * t - 1.0;
    v -= this.polyBLEP(t, dt);
    return v;
  }

  bl_square(phase, duty, dt) {
    let t = phase % 1.0;
    let v = t < duty ? 1.0 : -1.0;
    v += this.polyBLEP(t, dt);
    let t2 = (t - duty + 1.0) % 1.0;
    v -= this.polyBLEP(t2, dt);
    return v;
  }

  process(inputs, outputs, parameters) {
    const out = outputs[0];
    if (!out || !out[0]) return true;
    const chCount = out.length;
    const frames = out[0].length;

    const baseFreqArr = parameters.baseFreq;
    const fmDepthArr = parameters.fmDepth;
    const pulseArr = parameters.pulseWidth;

    // Precompute detune multipliers once per block
    const detuneFactors = new Float32Array(this.numVoices);
    for (let v = 0; v < this.numVoices; v++) {
      detuneFactors[v] = Math.pow(2, (this.detunes[v] || 0) / 1200);
    }

    for (let i = 0; i < frames; i++) {
      const baseFreq = baseFreqArr.length > 1 ? baseFreqArr[i] : baseFreqArr[0];
      const fmDepth = fmDepthArr.length > 1 ? fmDepthArr[i] : fmDepthArr[0];
      const pulseW = pulseArr.length > 1 ? pulseArr[i] : pulseArr[0];

      // advance fmPhase (global simple sine modulator) per sample
      const fmInc = (this.fmFreq || 2.0) / this.sampleRate;
      this.fmPhase += fmInc;
      if (this.fmPhase >= 1.0) this.fmPhase -= 1.0;
      const fmModGlobal = Math.sin(this.twoPI * this.fmPhase) * fmDepth; // interpreted in Hz

      // determine dt for polyblep: use max voice phaseInc approx
      // compute max freq across voices quickly
      let maxF = baseFreq * detuneFactors[0];
      for (let v = 1; v < this.numVoices; v++) {
        const f = baseFreq * detuneFactors[v];
        if (f > maxF) maxF = f;
      }
      // include fm
      maxF += Math.abs(fmModGlobal);
      const dt = Math.min(0.5, (maxF / this.sampleRate)); // small normalized value

      let mix = 0.0;
      for (let v = 0; v < this.numVoices; v++) {
        let freq = baseFreq * detuneFactors[v];
        if (this.fmEnabled && fmDepth !== 0) {
          freq += fmModGlobal;
        }
        const phaseInc = freq / this.sampleRate;
        let p = this.phases[v];
        let s = 0;
        switch (this.wave) {
          case 'sine':
            s = Math.sin(2 * Math.PI * p);
            break;
          case 'square':
            s = this.bl_square(p, 0.5, dt);
            break;
          case 'pulse':
            s = this.bl_square(p, pulseW, dt);
            break;
          case 'sawtooth':
            s = this.bl_saw(p, dt);
            break;
          case 'triangle':
            s = 2.0 * Math.abs(2.0 * (p - Math.floor(p + 0.5))) - 1.0;
            break;
          case 'fm':
            s = Math.sin(2 * Math.PI * p);
            break;
          default:
            s = Math.sin(2 * Math.PI * p);
        }
        mix += s;
        p += phaseInc;
        if (p >= 1.0) p -= 1.0;
        this.phases[v] = p;
      }

      mix = mix / this.numVoices;

      for (let ch = 0; ch < chCount; ch++) {
        out[ch][i] = mix * 0.8; // leave headroom, master is on main thread
      }
    }

    return true;
  }
}

registerProcessor('synth-processor', SynthProcessor);
`;

/* ============================
   App State and UI references
   ============================ */
const AppState = {
  audioCtx: null,
  engine: null,
  workletNode: null,
  lastVolume: 0.15,
  baseFreq: 261.63,
  octaveOffset: 0,
  waveType: 'sawtooth',
  detuneAmount: 15,
  fmDepth: 0,
  isPlaying: false,
  motionEnabled: false,
  panEnabled: false,
  NUM_VOICES: 7,
  pendingPan: 0,
  pendingTilt: 0,
  smoothedPan: 0,
  smoothedTilt: 0,
  lastDetuneSent: null
};

const elements = {
  pad: document.getElementById('pad'),
  noteDisplay: document.getElementById('noteDisplay'),
  octaveDisplay: document.getElementById('octaveDisplay'),
  motionDisplay: document.getElementById('motionDisplay'),
  wahDisplay: document.getElementById('wahDisplay'),
  panDisplay: document.getElementById('panDisplay'),
  startBtn: document.getElementById('startBtn'),
  stopBtn: document.getElementById('stopBtn'),
  motionBtn: document.getElementById('motionBtn'),
  panBtn: document.getElementById('panBtn'),
  statusMessage: document.getElementById('statusMessage'),
  controls: document.getElementById('controls'),
  toggleControls: document.getElementById('toggleControls'),
  noteRuler: document.getElementById('noteRuler'),
  permissionModal: document.getElementById('permissionModal')
};

const noteFrequencies = {
  'A#2':116.54,'B2':123.47,'C3':130.81,'C#3':138.59,'D3':146.83,'D#3':155.56,'E3':164.81,
  'F3':174.61,'F#3':185.00,'G3':196.00,'G#3':207.65,'A3':220.00,'A#3':233.08,'B3':246.94,
  'C4':261.63,'C#4':277.18,'D4':293.66
};
const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

function showStatus(msg, dur = 1500) {
  elements.statusMessage.textContent = msg;
  elements.statusMessage.classList.add('show');
  clearTimeout(showStatus._t);
  showStatus._t = setTimeout(()=>elements.statusMessage.classList.remove('show'), dur);
}
function updateButtonStates() {
  elements.startBtn.disabled = AppState.isPlaying;
  elements.stopBtn.disabled = !AppState.isPlaying;
}

/* ============================
   Engine: graph creation, worklet init, effect management
   ============================ */
class AdvancedSynthEngine {
  constructor() {
    this.audioContext = null;
    this.workletNode = null;
    this.audioNodes = {};
    this.dryWet = {};
    this.effects = {
      dist: false, autoWah: false, flanger: false, chorus: false,
      tremolo: false, filter: true, delay: false, reverb: false
    };
    this.effectLFOs = {};
  }

  async init() {
    this.audioContext = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive', sampleRate: 44100 });
    await this._addWorkletModuleSafe();
    this._createNodes();
    this._connectGraph();
    this._postInitialParams();
  }

  async _addWorkletModuleSafe() {
    const blob = new Blob([workletCode], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    try {
      await this.audioContext.audioWorklet.addModule(url);
    } catch (e) {
      console.warn('Worklet addModule failed, will rethrow', e);
      URL.revokeObjectURL(url);
      throw e;
    }
    URL.revokeObjectURL(url);
  }

  _createNodes() {
    const ctx = this.audioContext;
    this.audioNodes.masterGain = ctx.createGain();
    this.audioNodes.masterGain.gain.value = AppState.lastVolume;
    this.audioNodes.tremoloGain = ctx.createGain();
    this.audioNodes.tremoloGain.gain.value = 1;
    this.audioNodes.panner = ctx.createStereoPanner();
    // filter
    this.audioNodes.filter = ctx.createBiquadFilter();
    this.audioNodes.filter.type = 'lowpass';
    this.audioNodes.filter.frequency.value = 20000;
    this.audioNodes.filter.Q.value = 1;
    // distortion
    this.audioNodes.distortion = this._createWaveShaper(50);
    // delay
    this.audioNodes.delay = ctx.createDelay(2.0);
    this.audioNodes.delay.delayTime.value = 0.3;
    this.audioNodes.delayFeedback = ctx.createGain();
    this.audioNodes.delayFeedback.gain.value = 0.45;
    this.audioNodes.delayMix = ctx.createGain();
    // reverb with cached async generator
    this.audioNodes.reverb = ctx.createConvolver();
    if (!window._cachedReverbBuffer) {
      // create impulse asynchronously so init isn't too blocking
      this._createImpulseAsync(ctx, 0.45).then(buf => { window._cachedReverbBuffer = buf; this.audioNodes.reverb.buffer = buf; }).catch(()=>{});
    } else {
      this.audioNodes.reverb.buffer = window._cachedReverbBuffer;
    }
    // autoWah
    this.audioNodes.autoWah = ctx.createBiquadFilter();
    this.audioNodes.autoWah.type = 'bandpass';
    this.audioNodes.autoWah.frequency.value = 800;
    this.audioNodes.autoWah.Q.value = 5;
    // chorus/flanger nodes
    this.audioNodes.chorusDelay = ctx.createDelay(0.05);
    this.audioNodes.chorusFeedback = ctx.createGain();
    this.audioNodes.chorusMix = ctx.createGain();
    this.audioNodes.chorusFeedback.gain.value = 0.12;
    this.audioNodes.chorusMix.gain.value = 0;
    this.audioNodes.flangerDelay = ctx.createDelay(0.01);
    this.audioNodes.flangerFeedback = ctx.createGain();
    this.audioNodes.flangerMix = ctx.createGain();
    this.audioNodes.flangerFeedback.gain.value = 0.45;
    this.audioNodes.flangerMix.gain.value = 0;
    // tremoloGain already created
    // dry/wet merges
    this.dryWet.distDry = ctx.createGain(); this.dryWet.distWet = ctx.createGain();
    this.dryWet.delayDry = ctx.createGain(); this.dryWet.delayWet = ctx.createGain();
    this.dryWet.reverbDry = ctx.createGain(); this.dryWet.reverbWet = ctx.createGain();
    this.dryWet.finalMerge = ctx.createGain();
    this.dryWet.distDry.gain.value = 1; this.dryWet.distWet.gain.value = 0;
    this.dryWet.delayDry.gain.value = 1; this.dryWet.delayWet.gain.value = 0;
    this.dryWet.reverbDry.gain.value = 1; this.dryWet.reverbWet.gain.value = 0;
  }

  async _createImpulseAsync(ctx, seconds = 0.5) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    // fill in chunks to avoid blocking
    const chunk = 16384;
    for (let c = 0; c < 2; c++) {
      const data = buf.getChannelData(c);
      for (let i = 0; i < len; i += chunk) {
        const to = Math.min(len, i + chunk);
        for (let j = i; j < to; j++) {
          data[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / len, 2.5) * 0.6;
        }
        // yield
        await new Promise(r => setTimeout(r, 0));
      }
    }
    return buf;
  }

  _connectGraph() {
    const ctx = this.audioContext;
    // worklet -> tremoloGain -> masterGain chain
    this.workletNode = new AudioWorkletNode(ctx, 'synth-processor', { outputChannelCount: [2] });
    // connect worklet to tremoloGain (tremolo applied here)
    this.workletNode.connect(this.audioNodes.tremoloGain);
    this.audioNodes.tremoloGain.connect(this.audioNodes.masterGain);

    const master = this.audioNodes.masterGain;

    // distortion path
    master.connect(this.dryWet.distDry);
    master.connect(this.audioNodes.distortion);
    this.audioNodes.distortion.connect(this.dryWet.distWet);
    const postDist = ctx.createGain();
    this.dryWet.distDry.connect(postDist);
    this.dryWet.distWet.connect(postDist);

    // postDist -> autoWah -> filter
    postDist.connect(this.audioNodes.autoWah);
    this.audioNodes.autoWah.connect(this.audioNodes.filter);

    const filterOut = this.audioNodes.filter;
    // delay path
    filterOut.connect(this.dryWet.delayDry);
    filterOut.connect(this.audioNodes.delay);
    this.audioNodes.delay.connect(this.dryWet.delayWet);
    this.audioNodes.delay.connect(this.audioNodes.delayFeedback);
    this.audioNodes.delayFeedback.connect(this.audioNodes.delay);
    this.dryWet.delayDry.connect(this.dryWet.finalMerge);
    this.dryWet.delayWet.connect(this.dryWet.finalMerge);

    // reverb with splitter
    const reverbSplitter = ctx.createGain();
    filterOut.connect(reverbSplitter);
    reverbSplitter.connect(this.dryWet.reverbDry);
    reverbSplitter.connect(this.audioNodes.reverb);
    this.audioNodes.reverb.connect(this.dryWet.reverbWet);
    this.dryWet.reverbDry.connect(this.dryWet.finalMerge);
    this.dryWet.reverbWet.connect(this.dryWet.finalMerge);

    // connect chorus & flanger inputs (post filter)
    filterOut.connect(this.audioNodes.chorusDelay);
    filterOut.connect(this.audioNodes.flangerDelay);
    // feedback loops for chorus/flanger
    this.audioNodes.chorusDelay.connect(this.audioNodes.chorusFeedback);
    this.audioNodes.chorusFeedback.connect(this.audioNodes.chorusDelay);
    this.audioNodes.chorusDelay.connect(this.audioNodes.chorusMix);
    this.audioNodes.chorusMix.connect(this.dryWet.finalMerge);
    this.audioNodes.flangerDelay.connect(this.audioNodes.flangerFeedback);
    this.audioNodes.flangerFeedback.connect(this.audioNodes.flangerDelay);
    this.audioNodes.flangerDelay.connect(this.audioNodes.flangerMix);
    this.audioNodes.flangerMix.connect(this.dryWet.finalMerge);

    // finally merge dry signal (filter dry) too
    filterOut.connect(this.dryWet.finalMerge);

    // final merge -> panner -> destination
    this.dryWet.finalMerge.connect(this.audioNodes.panner);
    this.audioNodes.panner.connect(ctx.destination);

    // expose params reference
    this.params = this.workletNode.parameters;
  }

  _createWaveShaper(amount) {
    const ctx = this.audioContext;
    const ws = ctx.createWaveShaper();
    const N = 2048;
    const curve = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const x = (i / (N - 1)) * 2 - 1;
      curve[i] = Math.tanh(x * (1 + amount / 50));
    }
    ws.curve = curve;
    ws.oversample = '4x';
    return ws;
  }

  _postInitialParams() {
    if (!this.workletNode) return;
    try {
      const detunes = [];
      const center = Math.floor(AppState.NUM_VOICES / 2);
      for (let i = 0; i < AppState.NUM_VOICES; i++) detunes.push((i - center) * AppState.detuneAmount);
      // send detune only if changed (simple check)
      const key = detunes.join(',');
      if (AppState.lastDetuneSent !== key) {
        this.workletNode.port.postMessage({ type: 'detuneArray', detuneArray: detunes });
        AppState.lastDetuneSent = key;
      }
      this.workletNode.port.postMessage({ type: 'wave', wave: AppState.waveType });
      this.workletNode.port.postMessage({ type: 'voices', numVoices: AppState.NUM_VOICES });
      this.workletNode.port.postMessage({ type: 'fmFreq', fmFreq: 2.0 });
      // set AudioParams
      const now = this.audioContext.currentTime;
      try { this.workletNode.parameters.get('baseFreq').setValueAtTime(AppState.baseFreq, now); } catch(e){}
      try { this.workletNode.parameters.get('fmDepth').setValueAtTime(AppState.fmDepth, now); } catch(e){}
      try { this.workletNode.parameters.get('pulseWidth').setValueAtTime(AppState.pulseWidth || 0.5, now); } catch(e){}
    } catch (e) { console.warn('postInitialParams failed', e); }
  }

  enableAutoWah(on) {
    const ctx = this.audioContext;
    if (on) {
      if (!this.effectLFOs.autoWah) {
        const lfo = ctx.createOscillator();
        const g = ctx.createGain();
        lfo.type = 'sine';
        lfo.frequency.value = parseFloat(document.getElementById('autoWahRate').value || 1);
        g.gain.value = parseFloat(document.getElementById('autoWahDepth').value || 600);
        lfo.connect(g);
        g.connect(this.audioNodes.autoWah.frequency);
        try { lfo.start(); } catch (e) {}
        this.effectLFOs.autoWah = { lfo, gain: g };
      }
    } else {
      if (this.effectLFOs.autoWah) {
        try { this.effectLFOs.autoWah.lfo.disconnect(); this.effectLFOs.autoWah.gain.disconnect(); } catch(e){}
        try { this.effectLFOs.autoWah.lfo.stop(); } catch(e){}
        this.effectLFOs.autoWah = null;
      }
    }
  }

  enableFlanger(on) {
    const ctx = this.audioContext;
    if (on) {
      if (!this.effectLFOs.flanger) {
        const lfo = ctx.createOscillator();
        const g = ctx.createGain();
        lfo.type = 'sine'; lfo.frequency.value = 0.25;
        g.gain.value = 0.005;
        lfo.connect(g); g.connect(this.audioNodes.flangerDelay.delayTime);
        try { lfo.start(); } catch(e){}
        this.effectLFOs.flanger = { lfo, gain: g };
        this.audioNodes.flangerMix.gain.value = 0.5;
      }
    } else {
      if (this.effectLFOs.flanger) {
        try { this.effectLFOs.flanger.lfo.disconnect(); this.effectLFOs.flanger.gain.disconnect(); } catch(e){}
        try { this.effectLFOs.flanger.lfo.stop(); } catch(e){}
        this.effectLFOs.flanger = null;
        this.audioNodes.flangerMix.gain.value = 0;
      }
    }
  }

  enableChorus(on) {
    const ctx = this.audioContext;
    if (on) {
      if (!this.effectLFOs.chorus) {
        const lfo = ctx.createOscillator();
        const g = ctx.createGain();
        lfo.type = 'sine'; lfo.frequency.value = 0.6;
        g.gain.value = 0.01;
        lfo.connect(g); g.connect(this.audioNodes.chorusDelay.delayTime);
        try { lfo.start(); } catch(e){}
        this.effectLFOs.chorus = { lfo, gain: g };
        this.audioNodes.chorusMix.gain.value = 0.3;
      }
    } else {
      if (this.effectLFOs.chorus) {
        try { this.effectLFOs.chorus.lfo.disconnect(); this.effectLFOs.chorus.gain.disconnect(); } catch(e){}
        try { this.effectLFOs.chorus.lfo.stop(); } catch(e){}
        this.effectLFOs.chorus = null;
        this.audioNodes.chorusMix.gain.value = 0;
      }
    }
  }

  enableTremolo(on) {
    const ctx = this.audioContext;
    if (on) {
      if (!this.effectLFOs.tremolo) {
        const lfo = ctx.createOscillator();
        const g = ctx.createGain();
        const offset = ctx.createConstantSource();
        lfo.type = 'sine'; lfo.frequency.value = 5.0;
        g.gain.value = 0.5;
        offset.offset.value = 0.5;
        lfo.connect(g);
        g.connect(this.audioNodes.tremoloGain.gain);
        offset.connect(this.audioNodes.tremoloGain.gain);
        try { lfo.start(); offset.start(); } catch(e){}
        this.effectLFOs.tremolo = { lfo, gain: g, offset };
      }
    } else {
      if (this.effectLFOs.tremolo) {
        try { this.effectLFOs.tremolo.lfo.disconnect(); this.effectLFOs.tremolo.gain.disconnect(); this.effectLFOs.tremolo.offset.disconnect(); } catch(e){}
        try { this.effectLFOs.tremolo.lfo.stop(); this.effectLFOs.tremolo.offset.stop(); } catch(e){}
        this.effectLFOs.tremolo = null;
        this.audioNodes.tremoloGain.gain.value = 1;
      }
    }
  }

  updateEffectParameters() {
    const ef = this.effects;
    this.dryWet.distWet.gain.value = ef.dist ? 1 : 0;
    this.dryWet.distDry.gain.value = ef.dist ? 0 : 1;
    this.dryWet.delayWet.gain.value = ef.delay ? 0.28 : 0;
    this.dryWet.delayDry.gain.value = ef.delay ? 0.72 : 1;
    this.dryWet.reverbWet.gain.value = ef.reverb ? 0.4 : 0;
    this.dryWet.reverbDry.gain.value = ef.reverb ? 0.6 : 1;
    this.enableAutoWah(ef.autoWah);
    this.enableFlanger(ef.flanger);
    this.enableChorus(ef.chorus);
    this.enableTremolo(ef.tremolo);
  }

  dispose() {
    try {
      if (this.workletNode) {
        try { this.workletNode.port.postMessage({ type: 'dispose' }); } catch(e){}
        try { this.workletNode.disconnect(); } catch(e){}
        this.workletNode = null;
      }
      ['autoWah','flanger','chorus','tremolo'].forEach(k => {
        if (this.effectLFOs[k]) {
          try { this.effectLFOs[k].lfo.disconnect(); } catch(e){}
          try { this.effectLFOs[k].gain && this.effectLFOs[k].gain.disconnect(); } catch(e){}
          try { this.effectLFOs[k].offset && this.effectLFOs[k].offset.disconnect(); } catch(e){}
          try { this.effectLFOs[k].lfo.stop(); } catch(e){}
          this.effectLFOs[k] = null;
        }
      });
    } catch (e) {}
  }
}

/* ============================
   Scheduler: tick-index, integer scheduling (no long drift)
   ============================ */
class LookaheadScheduler {
  constructor() {
    this.isRunning = false;
    this.tempo = 120;
    this.lookahead = 25;
    this.scheduleAheadTime = 0.1;
    this.timerID = null;
    this.patternUnits = 1;
    this.step = 0.0;
    this.tickIndex = 0;
    this.startTime = 0;
    this.patternTickMask = [];
  }

  start(callback, pattern = '16') {
    if (!AppState.engine || !AppState.audioCtx) return;
    this.stop();
    this.isRunning = true;
    this.startTime = AppState.audioCtx.currentTime + 0.05;
    this.tickIndex = 0;
    this._setPattern(pattern);
    this._scheduler(callback);
  }

  stop() { this.isRunning = false; if (this.timerID) { clearTimeout(this.timerID); this.timerID = null; } }

  _setPattern(pattern) {
    switch (pattern) {
      case '4': this.patternUnits = 4; break;
      case '8': this.patternUnits = 2; break;
      case '16': this.patternUnits = 1; break;
      case '32': this.patternUnits = 0.5; break;
      case 'triplet': this.patternUnits = 4/3; break;
      case 'shuffle': this.patternUnits = 1.5; break;
      case 'dotted': this.patternUnits = 6; break;
      case 'stutter': this.patternUnits = 0.5; break;
      case 'random': this.patternUnits = 1; break;
      default: this.patternUnits = 1; break;
    }
    const quarter = 60.0 / this.tempo;
    const sixteenth = quarter / 4.0;
    this.step = sixteenth * this.patternUnits;
    // build tick mask for one bar (16 16th subdivisions)
    const ticksPerBar = 16;
    this.patternTickMask = new Array(ticksPerBar).fill(false);
    // mark ticks according to patternUnits
    if (pattern === 'random') {
      for (let i = 0; i < ticksPerBar; i++) this.patternTickMask[i] = Math.random() < 0.5;
    } else {
      for (let i = 0; i < ticksPerBar; i += Math.max(1, this.patternUnits)) this.patternTickMask[Math.floor(i)] = true;
    }
  }

  _scheduler(callback) {
    if (!this.isRunning) return;
    const currentTime = AppState.audioCtx.currentTime;
    while (this.startTime + this.tickIndex * this.step < currentTime + this.scheduleAheadTime) {
      const t = this.startTime + this.tickIndex * this.step;
      const tickInBar = this.tickIndex % 16;
      if (this.patternTickMask[tickInBar]) callback(t);
      this.tickIndex++;
    }
    this.timerID = setTimeout(()=>this._scheduler(callback), this.lookahead);
  }
}

/* ============================
   UI handlers, automation, smoothing, validations
   ============================ */

const scheduler = new LookaheadScheduler();

function isAudioRunning() { return AppState.audioCtx && AppState.audioCtx.state === 'running'; }

function createEngineAndStart() {
  if (AppState.isPlaying) { showStatus('Already running'); return; }
  // Create engine inside user gesture to satisfy iOS
  AppState.engine = new AdvancedSynthEngine();
  AppState.engine.init().then(() => {
    AppState.audioCtx = AppState.engine.audioContext;
    AppState.workletNode = AppState.engine.workletNode;
    AppState.isPlaying = true;
    updateButtonStates();
    showStatus('Started — AudioWorklet active');
    // post initial params
    AppState.engine._postInitialParams();
    // start CPU monitor
    startCPUMonitor();
  }).catch(err => {
    console.error('Engine init failed', err);
    showStatus('Audio init failed — falling back not implemented');
  });
}

function stopSynth() {
  if (!AppState.audioCtx) { showStatus('No synth running'); return; }
  try {
    scheduler.stop();
    AppState.engine.dispose();
    AppState.audioCtx.close().then(()=> {
      AppState.audioCtx = null;
      AppState.engine = null;
      AppState.workletNode = null;
      AppState.isPlaying = false;
      updateButtonStates();
      showStatus('Stopped');
      stopCPUMonitor();
    }).catch(e => {
      console.error(e);
      showStatus('Stop error');
    });
  } catch (e) {
    console.error(e);
    showStatus('Stop error');
  }
}

/* map pad Y -> freq */
function noteFromPad(y) {
  const padHeight = window.innerHeight;
  const ratio = 1 - (y / padHeight);
  const notes = Object.keys(noteFrequencies);
  const idx = Math.max(0, Math.min(notes.length - 1, Math.floor(ratio * (notes.length - 1))));
  return noteFrequencies[notes[idx]];
}

/* apply pitch via AudioParam automation */
function applyPitchToWorklet(freq) {
  if (!AppState.engine || !AppState.engine.workletNode || !AppState.audioCtx) return;
  try {
    const param = AppState.engine.workletNode.parameters.get('baseFreq');
    const t = AppState.audioCtx.currentTime;
    param.cancelScheduledValues(t);
    param.setValueAtTime(param.value || freq, t);
    param.linearRampToValueAtTime(freq, t + 0.03);
    const noteInfo = freqToNote(freq);
    elements.noteDisplay.textContent = noteInfo.fullName;
    elements.octaveDisplay.textContent = `Oct:${AppState.octaveOffset}`;
    updateThemeColor(noteInfo.name);
  } catch (e) { console.warn('applyPitch error', e); }
}

/* apply FM depth param */
function applyFMDepthToWorklet(depth) {
  if (!AppState.engine || !AppState.engine.workletNode || !AppState.audioCtx) return;
  try {
    const param = AppState.engine.workletNode.parameters.get('fmDepth');
    const t = AppState.audioCtx.currentTime;
    param.cancelScheduledValues(t);
    param.setValueAtTime(depth, t);
  } catch (e) { console.warn('applyFMDepth error', e); }
}

/* set pulse width */
function applyPulseWidthToWorklet(pw) {
  if (!AppState.engine || !AppState.engine.workletNode || !AppState.audioCtx) return;
  try {
    const param = AppState.engine.workletNode.parameters.get('pulseWidth');
    param.setValueAtTime(pw, AppState.audioCtx.currentTime);
  } catch (e) {}
}

/* touch handler - throttled and uses AudioParam (no postMessage flooding) */
let lastTouchTime = 0;
function handleTouch(e) {
  const now = performance.now();
  if (now - lastTouchTime < 8) return;
  lastTouchTime = now;
  if (!isAudioRunning()) { showStatus('Start synth first'); return; }
  const touch = e.touches ? e.touches[0] : e;
  const cx = touch.clientX, cy = touch.clientY;
  const freq = noteFromPad(cy) * Math.pow(2, AppState.octaveOffset);
  AppState.baseFreq = freq;
  applyPitchToWorklet(freq);
  const targetVolume = (cx / window.innerWidth) * 0.45;
  AppState.lastVolume += (targetVolume - AppState.lastVolume) * 0.1;
  try {
    if (AppState.engine && AppState.engine.audioNodes && AppState.engine.audioNodes.masterGain) {
      AppState.engine.audioNodes.masterGain.gain.setTargetAtTime(AppState.lastVolume, AppState.audioCtx.currentTime, 0.02);
    }
  } catch (e) {}
  e.preventDefault && e.preventDefault();
}

/* pan smoothing via RAF loop - set pendingPan and pendingTilt from events */
function updatePan(pos) { AppState.pendingPan = pos; }

/* click sound */
function createClickSound(time) {
  if (!AppState.audioCtx) return;
  const ctx = AppState.audioCtx;
  const t = time || ctx.currentTime;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(1000, t);
  g.gain.setValueAtTime(0.14, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t); osc.stop(t + 0.09);
}

/* rhythm */
function rhythmBeat(time) {
  if (!AppState.engine) return;
  try {
    const g = AppState.engine.audioNodes.masterGain;
    g.gain.setTargetAtTime(0.28, time, 0.01);
    setTimeout(()=> {
      if (isAudioRunning()) g.gain.setTargetAtTime(AppState.lastVolume, AppState.audioCtx.currentTime, 0.02);
    }, 55);
  } catch (e) {}
  triggerVisualFeedback();
  createClickSound(time);
}
function startRhythm(pattern) {
  if (!isAudioRunning()) { showStatus('Start synth first'); return; }
  scheduler.start((time)=>rhythmBeat(time), pattern);
  showStatus('Rhythm: '+pattern);
}
function stopRhythm(){ scheduler.stop(); showStatus('Rhythm stopped'); }

/* orientation & motion handlers + RAF smoothing */
function handleOrientationEvent(e) {
  if (e.beta !== undefined && e.gamma !== undefined) {
    AppState.pendingTilt = e.beta;
    AppState.pendingPan = e.gamma / 90;
  }
}
function handleMotionEvent(e) {
  // optional: use accelerationIncludingGravity fallback
}
function orientationRAF() {
  const alpha = 0.12;
  AppState.smoothedPan = AppState.smoothedPan + (AppState.pendingPan - AppState.smoothedPan) * alpha;
  AppState.smoothedTilt = AppState.smoothedTilt + ((AppState.pendingTilt || 0) - AppState.smoothedTilt) * alpha;
  if (AppState.motionEnabled) {
    const tilt = AppState.smoothedTilt;
    const bend = (tilt / 45) * 12;
    const base = 130.81 * Math.pow(2, AppState.octaveOffset);
    const freq = base * Math.pow(2, bend / 12);
    AppState.baseFreq = freq;
    applyPitchToWorklet(freq);
    elements.motionDisplay.style.display = 'block';
    elements.motionDisplay.textContent = `Tilt:${Math.round(bend*10)/10}st`;
  }
  if (AppState.panEnabled && AppState.engine && AppState.engine.audioNodes && AppState.audioCtx) {
    const ctx = AppState.audioCtx;
    AppState.engine.audioNodes.panner.pan.setTargetAtTime(AppState.smoothedPan, ctx.currentTime, 0.02);
    elements.panDisplay.style.display = 'block';
    elements.panDisplay.textContent = `Pan:${Math.round(AppState.smoothedPan*100)}%`;
  }
  requestAnimationFrame(orientationRAF);
}
requestAnimationFrame(orientationRAF);

/* visual feedback */
function triggerVisualFeedback() {
  document.body.classList.add('flash');
  setTimeout(()=>document.body.classList.remove('flash'),120);
  document.querySelectorAll('button').forEach(btn => {
    btn.classList.add('pulse');
    setTimeout(()=>btn.classList.remove('pulse'),300);
  });
}

/* freq->note */
function freqToNote(freq) {
  const A4 = 440;
  const semitonesFromA4 = 12 * Math.log2(freq / A4);
  const noteIndex = Math.round(semitonesFromA4 + 9) % 12;
  const octave = Math.floor((semitonesFromA4 + 9) / 12) + 4;
  const noteName = noteNames[(noteIndex + 12) % 12];
  return { name: noteName, octave, fullName: `${noteName}${octave}` };
}

/* theme */
let uiRAF = null;
function updateThemeColor(noteName) {
  if (uiRAF) cancelAnimationFrame(uiRAF);
  uiRAF = requestAnimationFrame(()=>{
    const map = {
      'C':[255,100,100],'C#':[255,150,100],'D':[255,255,100],'D#':[150,255,100],
      'E':[100,255,100],'F':[100,255,150],'F#':[100,255,255],'G':[100,150,255],
      'G#':[100,100,255],'A':[150,100,255],'A#':[255,100,255],'B':[255,100,150]
    };
    const color = map[noteName] || [100,100,100];
    document.documentElement.style.setProperty('--r', color[0]);
    document.documentElement.style.setProperty('--g', color[1]);
    document.documentElement.style.setProperty('--b', color[2]);
  });
}

/* create note ruler */
function createNoteRuler() {
  const notes = ['D4','C#4','C4','B3','A#3','A3','G#3','G3','F#3','F3','E3','D#3','D3','C#3','C3','B2','A#2'];
  elements.noteRuler.innerHTML = '';
  notes.forEach(n => {
    const d = document.createElement('div');
    d.className = 'ruler-note';
    d.textContent = n;
    elements.noteRuler.appendChild(d);
  });
}

/* CPU monitor & dynamic voice scaling (simple heuristic) */
let cpuMonitorInterval = null;
let lastMonitorTime = performance.now();
let dynamicScale = { enabled: true, minVoices: 2, maxVoices: 7 };
function startCPUMonitor() {
  if (cpuMonitorInterval) return;
  lastMonitorTime = performance.now();
  cpuMonitorInterval = setInterval(()=> {
    const now = performance.now();
    const delta = now - lastMonitorTime;
    lastMonitorTime = now;
    // if interval drift > threshold -> system overloaded
    if (delta > 250) { // heavy
      if (AppState.NUM_VOICES > dynamicScale.minVoices) {
        AppState.NUM_VOICES = Math.max(dynamicScale.minVoices, AppState.NUM_VOICES - 2);
        try { AppState.engine && AppState.engine.workletNode && AppState.engine.workletNode.port.postMessage({ type:'voices', numVoices: AppState.NUM_VOICES }); } catch(e){}
        showStatus('High CPU: reducing voices to '+AppState.NUM_VOICES, 1200);
      }
    } else if (delta < 160 && AppState.NUM_VOICES < dynamicScale.maxVoices) {
      // try to increase slowly
      AppState.NUM_VOICES = Math.min(dynamicScale.maxVoices, AppState.NUM_VOICES + 1);
      try { AppState.engine && AppState.engine.workletNode && AppState.engine.workletNode.port.postMessage({ type:'voices', numVoices: AppState.NUM_VOICES }); } catch(e){}
      showStatus('Restoring voices to '+AppState.NUM_VOICES, 800);
    }
  }, 2000);
}
function stopCPUMonitor() { if (cpuMonitorInterval) { clearInterval(cpuMonitorInterval); cpuMonitorInterval = null; } }

/* initialize event listeners */

      for (let i = 0; i < AppState.NUM_VOICES; i++) detunes.push((i - center) * AppState.detuneAmount);
      try {
        const key = detunes.join(',');
        if (AppState.lastDetuneSent !== key) {
          AppState.engine.workletNode.port.postMessage({ type: 'detuneArray', detuneArray: detunes });
          AppState.lastDetuneSent = key;

  });

    }

  document.getElementById('autoWahRate').addEventListener('input', e => {
    if (AppState.engine && AppState.engine.effectLFOs && AppState.engine.effectLFOs.autoWah) {
      AppState.engine.effectLFOs.autoWah.lfo.frequency.value = parseFloat(e.target.value);
    }
  });

  document.getElementById('autoWahDepth').addEventListener('input', e => {
    if (AppState.engine && AppState.engine.effectLFOs && AppState.engine.effectLFOs.autoWah) {
      AppState.engine.effectLFOs.autoWah.gain.gain.value = parseFloat(e.target.value);
    }
  });

  const toggleMap = { toggleDist:'dist', toggleAutoWah:'autoWah', toggleFlanger:'flanger', toggleChorus:'chorus', toggleTremolo:'tremolo', toggleFilter:'filter', toggleDelay:'delay', toggleReverb:'reverb' };
  Object.entries(toggleMap).forEach(([id, effect]) => {
    document.getElementById(id).addEventListener('click', ()=> {
      if (!AppState.engine) { showStatus('Start first'); return; }
      AppState.engine.effects[effect] = !AppState.engine.effects[effect];
      document.getElementById(id).classList.toggle('active', AppState.engine.effects[effect]);
      AppState.engine.updateEffectParameters();
      showStatus(effect + ' ' + (AppState.engine.effects[effect] ? 'ON' : 'OFF'));
      if (effect === 'autoWah') {
        elements.wahDisplay.style.display = AppState.engine.effects.autoWah ? 'block' : 'none';
        elements.wahDisplay.textContent = 'Wah:' + (AppState.engine.effects.autoWah ? 'ON' : 'OFF');
      }
    });
  });

  document.getElementById('rhythm4').addEventListener('click', ()=> startRhythm('4'));
  document.getElementById('rhythm8').addEventListener('click', ()=> startRhythm('8'));
  document.getElementById('rhythm16').addEventListener('click', ()=> startRhythm('16'));
  document.getElementById('rhythm32').addEventListener('click', ()=> startRhythm('32'));
  document.getElementById('rhythmTriplet').addEventListener('click', ()=> startRhythm('triplet'));
  document.getElementById('rhythmShuffle').addEventListener('click', ()=> startRhythm('shuffle'));
  document.getElementById('rhythmDotted').addEventListener('click', ()=> startRhythm('dotted'));
  document.getElementById('rhythmStutter').addEventListener('click', ()=> startRhythm('stutter'));
  document.getElementById('rhythmRandom').addEventListener('click', ()=> startRhythm('random'));
  document.getElementById('rhythmStop').addEventListener('click', ()=> stopRhythm());

  elements.motionBtn.addEventListener('click', () => {
    if (AppState.motionEnabled) {
      window.removeEventListener('deviceorientation', handleOrientationEvent);
      window.removeEventListener('devicemotion', handleMotionEvent);
      AppState.motionEnabled = false;
      elements.motionBtn.classList.remove('active');
      elements.motionBtn.textContent = 'Motion';
      elements.motionDisplay.style.display = 'none';
      showStatus('Motion disabled');
    } else {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        elements.permissionModal.style.display = 'flex';
      } else {
        window.addEventListener('deviceorientation', handleOrientationEvent, { passive: true });
        window.addEventListener('devicemotion', handleMotionEvent, { passive: true });
        AppState.motionEnabled = true;
        elements.motionBtn.classList.add('active');
        elements.motionBtn.textContent = 'Motion ON';
        showStatus('Motion enabled');
      }
    }
  });

  document.getElementById('permissionAllow').addEventListener('click', ()=> {
    DeviceOrientationEvent.requestPermission().then(res => {
      elements.permissionModal.style.display = 'none';
      if (res === 'granted') {
        window.addEventListener('deviceorientation', handleOrientationEvent, { passive: true });
        window.addEventListener('devicemotion', handleMotionEvent, { passive: true });
        AppState.motionEnabled = true;
        elements.motionBtn.classList.add('active');
        elements.motionBtn.textContent = 'Motion ON';
        showStatus('Motion enabled');
      } else {
        showStatus('Motion permission denied');
      }
    }).catch(e => {
      elements.permissionModal.style.display = 'none';
      showStatus('Permission error');
    });
  });
  document.getElementById('permissionDeny').addEventListener('click', ()=> {
    elements.permissionModal.style.display = 'none';
    showStatus('Motion disabled');
  });

  elements.panBtn.addEventListener('click', ()=> {
    AppState.panEnabled = !AppState.panEnabled;
    elements.panBtn.classList.toggle('active', AppState.panEnabled);
    elements.panBtn.textContent = AppState.panEnabled ? 'Pan ON' : 'Pan';
    elements.panDisplay.style.display = AppState.panEnabled ? 'block' : 'none';
    if (!AppState.panEnabled && AppState.engine && AppState.engine.audioNodes) {
      AppState.engine.audioNodes.panner.pan.setTargetAtTime(0, AppState.audioCtx.currentTime, 0.01);
    }
  });
}

/* init */
window.addEventListener('load', ()=> {
  createNoteRuler();
  initializeEventListeners();
  updateButtonStates();
  showStatus('Ready — Click Start');
});
window.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
