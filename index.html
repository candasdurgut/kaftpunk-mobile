<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>Synth Pro — Final</title>
<style>
:root{--r:100;--g:100;--b:100;--bg:rgb(var(--r),var(--g),var(--b));--control-bg:rgba(0,0,0,0.18);--text:#f0f0f0;--border:rgba(var(--r),var(--g),var(--b),0.45)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#111;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial}
body{background:var(--bg);transition:background .12s}
#pad{height:100vh;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at center,var(--control-bg),rgba(0,0,0,0.45));cursor:crosshair;touch-action:none}
#noteDisplay{position:absolute;top:max(20px,env(safe-area-inset-top));left:16px;background:rgba(0,0,0,0.7);color:var(--text);padding:8px 12px;border-radius:16px;border:1px solid var(--border);backdrop-filter:blur(8px);z-index:10;font-size:20px}
#motionDisplay,#wahDisplay,#panDisplay{bottom:20px;left:50%;transform:translateX(-50%);display:none;background:rgba(0,0,0,0.7);color:var(--text);padding:8px 12px;border-radius:16px;border:1px solid var(--border);backdrop-filter:blur(8px);z-index:10}
#wahDisplay{bottom:60px;}#panDisplay{bottom:100px;}#motionDisplay{bottom:140px;}
#noteRuler{position:absolute;right:0;top:0;bottom:0;width:60px;background:rgba(0,0,0,0.28);border-left:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:8px 0;pointer-events:none}
.ruler-note{display:flex;align-items:center;justify-content:center;flex:1;font-size:11px;color:var(--border);border-bottom:1px solid rgba(255,255,255,0.06)}
#controls{position:fixed;left:0;right:0;bottom:0;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;background:rgba(0,0,0,0.92);backdrop-filter:blur(14px);border-top:1px solid var(--border);transform:translateY(calc(100% - 50px));transition:transform .28s;max-height:70vh;overflow-y:auto}
#controls.expanded{transform:translateY(0)}
#toggleControls{position:fixed;right:18px;bottom:12px;width:50px;height:50px;border-radius:50%;background:var(--bg);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1000}
button,select,input[type=range],label{font-family:inherit;font-size:12px;border-radius:8px;border:1px solid var(--border);background:var(--control-bg);color:var(--text);padding:8px}
button{cursor:pointer;transition:all .15s}
button:active{transform:scale(.95)}
button.active{background:var(--bg);color:#111;font-weight:700}
.control-group{display:flex;flex-direction:column;align-items:center;gap:4px}
.control-group label{font-size:11px;color:#aaa}
.rhythm-panel,.effect-group{grid-column:1/-1;display:grid;padding:8px;border-radius:8px;border:1px solid var(--border);gap:8px}
.rhythm-panel{grid-template-columns:repeat(4,1fr);background:rgba(0,0,0,0.3)}
.effect-group{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));background:rgba(0,0,0,0.32)}
#statusMessage{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:rgba(0,0,0,0.85);padding:8px 12px;border-radius:8px;opacity:0;transition:opacity .2s;color:#fff;font-size:12px;pointer-events:none}
#statusMessage.show{opacity:1}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:2000}
.modal-content{background:rgba(30,30,30,0.98);padding:18px;border-radius:12px;border:1px solid var(--border)}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(.96)}100%{transform:scale(1)}}
.pulse{animation:pulse .28s}
@keyframes flash{0%{background:rgba(255,255,255,.1)}50%{background:rgba(255,255,255,.02)}}
.flash{animation:flash .12s}
.visual-pulse{position:absolute;top:50%;left:50%;width:100px;height:100px;background:radial-gradient(circle,var(--border),transparent 70%);border-radius:50%;transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none}
.visual-pulse.active{animation:pulse-visual .3s ease-out}
@keyframes pulse-visual{0%{transform:translate(-50%,-50%) scale(0);opacity:0.7}100%{transform:translate(-50%,-50%) scale(2);opacity:0}}
</style>
</head>
<body>
<div id="pad">
<div id="noteDisplay">C4 (Oct:0)</div>
<div id="motionDisplay">Tilt:0°</div>
<div id="wahDisplay">Wah:ON</div>
<div id="panDisplay">Pan:0%</div>
<div id="noteRuler"></div>
<div id="visualPulse" class="visual-pulse"></div>
</div>
<button id="toggleControls">⚙️</button>
<div id="controls">
<button id="startBtn">Start</button>
<button id="stopBtn" disabled>Stop</button>
<button id="motionBtn">Motion</button>
<button id="panBtn">Pan</button>
<button id="octDown">Oct−</button>
<button id="octUp">Oct+</button>
<div class="control-group">
<label>Wave</label>
<select id="waveSelect">
<option value="sawtooth">Sawtooth</option>
<option value="triangle">Triangle</option>
<option value="square">Square</option>
<option value="sine">Sine</option>
<option value="pulse">Pulse</option>
<option value="fm">FM</option>
</select>
</div>
<div class="control-group">
<label>Detune</label>
<input id="detuneRange" type="range" min="0" max="50" value="15"/>
</div>
<div class="control-group">
<label>Filter Freq</label>
<input id="filterFreq" type="range" min="200" max="20000" value="20000" step="100"/>
</div>
<div class="control-group">
<label>Filter Reso</label>
<input id="filterReso" type="range" min="0.5" max="20" value="1" step="0.5"/>
</div>
<div class="control-group">
<label>Wah Rate</label>
<input id="autoWahRate" type="range" min="0.1" max="5" value="1" step="0.1"/>
</div>
<div class="control-group">
<label>Wah Depth</label>
<input id="autoWahDepth" type="range" min="100" max="1500" value="800"/>
</div>

<div class="rhythm-panel">
<button id="rhythm4">1/4</button>
<button id="rhythm8">1/8</button>
<button id="rhythm16">1/16</button>
<button id="rhythmStop">Stop</button>
</div>

<div class="effect-group">
<button id="toggleDist">Distortion</button>
<button id="toggleAutoWah">Auto Wah</button>
<button id="toggleFlanger">Flanger</button>
<button id="toggleChorus">Chorus</button>
<button id="toggleTremolo">Tremolo</button>
<button id="toggleFilter">Filter</button>
<button id="toggleDelay">Delay</button>
<button id="toggleReverb">Reverb</button>
</div>
</div>
<div id="statusMessage"></div>
<div id="permissionModal" class="modal">
<div class="modal-content">
<h3>Motion Access Required</h3>
<p>This feature needs access to your device's motion sensors for tilt control.</p>
<div style="display:flex;gap:8px;margin-top:12px;">
<button id="permissionAllow">Allow</button>
<button id="permissionDeny">Deny</button>
</div>
</div>
</div>
<script>
const workletCode = `class SynthProcessor extends AudioWorkletProcessor {
    static get parameterDescriptors() {
        return [
            { name: 'baseFreq', defaultValue: 261.63, minValue: 20, maxValue: 20000 },
            { name: 'fmDepth', defaultValue: 0, minValue: 0, maxValue: 5000 },
            { name: 'pulseWidth', defaultValue: 0.5, minValue: 0.01, maxValue: 0.99 }
        ];
    }

    constructor() {
        super();
        this.sampleRate = sampleRate;
        this.numVoices = 7;
        this.phases = new Float32Array(this.numVoices);
        this.fmPhases = new Float32Array(this.numVoices);
        this.detunes = new Float32Array(this.numVoices);
        this.wave = 'sawtooth';
        this.fmEnabled = false;
        this.fmRatio = 1.0;
        this.twoPI = 2 * Math.PI;
        
        this.port.onmessage = e => {
            const d = e.data;
            if (d.type === 'detuneArray' && d.detuneArray) {
                for (let i = 0; i < Math.min(this.numVoices, d.detuneArray.length); i++) {
                    this.detunes[i] = d.detuneArray[i];
                }
            } else if (d.type === 'wave') {
                this.wave = d.wave;
                this.fmEnabled = d.wave === 'fm';
            } else if (d.type === 'voices') {
                const nv = Math.min(12, Math.max(1, d.numVoices));
                if (nv !== this.numVoices) {
                    this.numVoices = nv;
                    this.phases = new Float32Array(this.numVoices);
                    this.fmPhases = new Float32Array(this.numVoices);
                    this.detunes = new Float32Array(this.numVoices);
                }
            }
        };
    }

    polyBLEP(t, dt) {
        if (t < dt) {
            t /= dt;
            return t + t - t * t - 1;
        } else if (t > 1 - dt) {
            t = (t - 1) / dt;
            return t * t + t + t + 1;
        }
        return 0;
    }

    bl_saw(phase, dt) {
        let t = phase % 1;
        let v = 2 * t - 1;
        v -= this.polyBLEP(t, dt);
        return v;
    }

    bl_square(phase, duty, dt) {
        let t = phase % 1;
        let v = t < duty ? 1 : -1;
        v += this.polyBLEP(t, dt);
        let t2 = (t - duty + 1) % 1;
        v -= this.polyBLEP(t2, dt);
        return v;
    }

    process(inputs, outputs, parameters) {
        const out = outputs[0];
        if (!out || !out[0]) return true;

        const chCount = out.length;
        const frames = out[0].length;
        const baseFreqArr = parameters.baseFreq;
        const fmDepthArr = parameters.fmDepth;
        const pulseArr = parameters.pulseWidth;

        const detuneFactors = new Float32Array(this.numVoices);
        for (let v = 0; v < this.numVoices; v++) {
            detuneFactors[v] = Math.pow(2, (this.detunes[v] || 0) / 1200);
        }

        for (let i = 0; i < frames; i++) {
            const baseFreq = baseFreqArr.length > 1 ? baseFreqArr[i] : baseFreqArr[0];
            const fmDepth = fmDepthArr.length > 1 ? fmDepthArr[i] : fmDepthArr[0];
            const pulseW = pulseArr.length > 1 ? pulseArr[i] : pulseArr[0];

            let maxF = baseFreq * detuneFactors[0];
            for (let v = 1; v < this.numVoices; v++) {
                const f = baseFreq * detuneFactors[v];
                if (f > maxF) maxF = f;
            }
            maxF += fmDepth;
            maxF = Math.min(maxF, this.sampleRate * 0.45);
            const dt = maxF / this.sampleRate;

            let mix = 0;
            for (let v = 0; v < this.numVoices; v++) {
                let freq = baseFreq * detuneFactors[v];
                
                if (this.fmEnabled && fmDepth !== 0) {
                    const fmFreq = freq * this.fmRatio;
                    const fmInc = fmFreq / this.sampleRate;
                    this.fmPhases[v] += fmInc;
                    if (this.fmPhases[v] >= 1) this.fmPhases[v] -= 1;
                    
                    const fmMod = Math.sin(this.twoPI * this.fmPhases[v]) * fmDepth;
                    freq += fmMod;
                    freq = Math.max(20, Math.min(freq, this.sampleRate * 0.45));
                }

                const phaseInc = freq / this.sampleRate;
                let p = this.phases[v];
                let s = 0;

                switch (this.wave) {
                    case 'sine':
                        s = Math.sin(this.twoPI * p);
                        break;
                    case 'square':
                        s = this.bl_square(p, 0.5, dt);
                        break;
                    case 'pulse':
                        s = this.bl_square(p, pulseW, dt);
                        break;
                    case 'sawtooth':
                        s = this.bl_saw(p, dt);
                        break;
                    case 'triangle':
                        s = 2 * Math.abs(2 * (p - Math.floor(p + 0.5))) - 1;
                        break;
                    case 'fm':
                        const carrierPhase = p;
                        const modulator = Math.sin(this.twoPI * this.fmPhases[v]);
                        s = Math.sin(this.twoPI * (carrierPhase + fmDepth * modulator / 1000));
                        break;
                    default:
                        s = Math.sin(this.twoPI * p);
                }
                
                mix += s;
                p += phaseInc;
                if (p >= 1) p -= 1;
                this.phases[v] = p;
            }
            
            mix = mix / this.numVoices * 0.85;
            
            for (let ch = 0; ch < chCount; ch++) {
                out[ch][i] = mix;
            }
        }
        return true;
    }
}

registerProcessor('synth-processor', SynthProcessor);`;

const AppState = {
    audioCtx: null, engine: null, workletNode: null, lastVolume: 0.2,
    baseFreq: 261.63, octaveOffset: 0, waveType: 'sawtooth', detuneAmount: 15,
    fmDepth: 0, pulseWidth: 0.5, isPlaying: false, motionEnabled: false,
    panEnabled: false, NUM_VOICES: 7, tiltBend: 0
};

const elements = {
    pad: document.getElementById('pad'), noteDisplay: document.getElementById('noteDisplay'),
    motionDisplay: document.getElementById('motionDisplay'), wahDisplay: document.getElementById('wahDisplay'),
    panDisplay: document.getElementById('panDisplay'), startBtn: document.getElementById('startBtn'),
    stopBtn: document.getElementById('stopBtn'), motionBtn: document.getElementById('motionBtn'),
    panBtn: document.getElementById('panBtn'), statusMessage: document.getElementById('statusMessage'),
    controls: document.getElementById('controls'), toggleControls: document.getElementById('toggleControls'),
    noteRuler: document.getElementById('noteRuler'), permissionModal: document.getElementById('permissionModal'),
    visualPulse: document.getElementById('visualPulse')
};

const noteFrequencies = {
    'A#2':116.54,'B2':123.47,'C3':130.81,'C#3':138.59,'D3':146.83,'D#3':155.56,
    'E3':164.81,'F3':174.61,'F#3':185,'G3':196,'G#3':207.65,'A3':220,'A#3':233.08,
    'B3':246.94,'C4':261.63,'C#4':277.18,'D4':293.66
};
const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const noteColors = {
    'C':[255,100,100],'C#':[255,150,100],'D':[255,255,100],'D#':[150,255,100],
    'E':[100,255,100],'F':[100,255,150],'F#':[100,255,255],'G':[100,150,255],
    'G#':[100,100,255],'A':[150,100,255],'A#':[255,100,255],'B':[255,100,150]
};

let rhythmInterval = null;
let audioNodes = {};
const effects = {
    dist: false, autoWah: false, flanger: false, chorus: false,
    tremolo: false, filter: true, delay: false, reverb: false
};

function showStatus(msg, dur = 1500) {
    elements.statusMessage.textContent = msg;
    elements.statusMessage.classList.add('show');
    clearTimeout(showStatus._t);
    showStatus._t = setTimeout(() => elements.statusMessage.classList.remove('show'), dur);
}

function updateButtonStates() {
    elements.startBtn.disabled = AppState.isPlaying;
    elements.stopBtn.disabled = !AppState.isPlaying;
}

function isAudioContextValid() {
    return AppState.audioCtx && AppState.audioCtx.state === 'running';
}

function safeAudioOperation(op) {
    if (!isAudioContextValid()) {
        showStatus('Start synth first');
        return false;
    }
    try {
        op();
        return true;
    } catch (e) {
        console.error(e);
        showStatus('Audio error');
        return false;
    }
}

class AdvancedSynthEngine {
    constructor() {
        this.audioContext = null;
        this.workletNode = null;
        this.audioNodes = {};
    }

    async init() {
        this.audioContext = new (window.AudioContext || window.webkitAudioContext)({
            latencyHint: 'interactive',
            sampleRate: 44100
        });
        
        await this._addWorkletModuleSafe();
        this._createNodes();
        this._connectGraph();
        this._postInitialParams();
    }

    async _addWorkletModuleSafe() {
        const blob = new Blob([workletCode], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        try {
            await this.audioContext.audioWorklet.addModule(url);
        } catch (e) {
            URL.revokeObjectURL(url);
            throw e;
        }
        URL.revokeObjectURL(url);
    }

    _createNodes() {
        const ctx = this.audioContext;
        
        this.audioNodes.masterGain = ctx.createGain();
        this.audioNodes.masterGain.gain.value = AppState.lastVolume;
        
        this.audioNodes.panner = ctx.createStereoPanner();
        this.audioNodes.panner.pan.value = 0;
        
        this.audioNodes.distortion = this._createWaveShaper(50);
        this.audioNodes.distortionGain = ctx.createGain();
        this.audioNodes.distortionGain.gain.value = 0;
        
        this.audioNodes.autoWah = ctx.createBiquadFilter();
        this.audioNodes.autoWah.type = "bandpass";
        this.audioNodes.autoWah.frequency.value = 800;
        this.audioNodes.autoWah.Q.value = 5;
        
        this.audioNodes.autoWahLFO = ctx.createOscillator();
        this.audioNodes.autoWahLFO.frequency.value = 1;
        this.audioNodes.autoWahGain = ctx.createGain();
        this.audioNodes.autoWahGain.gain.value = 600;
        
        this.audioNodes.flangerDelay = ctx.createDelay(0.02);
        this.audioNodes.flangerDelay.delayTime.value = 0.005;
        this.audioNodes.flangerLFO = ctx.createOscillator();
        this.audioNodes.flangerLFO.frequency.value = 0.2;
        this.audioNodes.flangerGain = ctx.createGain();
        this.audioNodes.flangerGain.gain.value = 0.005;
        this.audioNodes.flangerFeedback = ctx.createGain();
        this.audioNodes.flangerFeedback.gain.value = 0.5;
        
        this.audioNodes.chorusDelay = ctx.createDelay(0.05);
        this.audioNodes.chorusDelay.delayTime.value = 0.025;
        this.audioNodes.chorusLFO = ctx.createOscillator();
        this.audioNodes.chorusLFO.frequency.value = 0.5;
        this.audioNodes.chorusGain = ctx.createGain();
        this.audioNodes.chorusGain.gain.value = 0.01;
        
        this.audioNodes.tremoloLFO = ctx.createOscillator();
        this.audioNodes.tremoloLFO.frequency.value = 5;
        this.audioNodes.tremoloGain = ctx.createGain();
        this.audioNodes.tremoloGain.gain.value = 0;
        
        this.audioNodes.filter = ctx.createBiquadFilter();
        this.audioNodes.filter.type = "lowpass";
        this.audioNodes.filter.frequency.value = 20000;
        this.audioNodes.filter.Q.value = 1;
        
        this.audioNodes.delay = ctx.createDelay(2);
        this.audioNodes.delay.delayTime.value = 0.3;
        this.audioNodes.delayFeedback = ctx.createGain();
        this.audioNodes.delayFeedback.gain.value = 0.5;
        
        this.audioNodes.reverb = ctx.createConvolver();
        const buffer = ctx.createBuffer(2, ctx.sampleRate * 2, ctx.sampleRate);
        for (let c = 0; c < 2; c++) {
            const data = buffer.getChannelData(c);
            for (let i = 0; i < buffer.length; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / buffer.length, 2);
            }
        }
        this.audioNodes.reverb.buffer = buffer;
        
        this.audioNodes.autoWahLFO.connect(this.audioNodes.autoWahGain);
        this.audioNodes.autoWahGain.connect(this.audioNodes.autoWah.frequency);
        this.audioNodes.autoWahLFO.start();
        
        this.audioNodes.flangerLFO.connect(this.audioNodes.flangerGain);
        this.audioNodes.flangerGain.connect(this.audioNodes.flangerDelay.delayTime);
        this.audioNodes.flangerLFO.start();
        
        this.audioNodes.chorusLFO.connect(this.audioNodes.chorusGain);
        this.audioNodes.chorusGain.connect(this.audioNodes.chorusDelay.delayTime);
        this.audioNodes.chorusLFO.start();
        
        this.audioNodes.tremoloLFO.connect(this.audioNodes.tremoloGain);
        this.audioNodes.tremoloLFO.start();
    }

    _connectGraph() {
        const ctx = this.audioContext;
        
        this.workletNode = new AudioWorkletNode(ctx, 'synth-processor', {
            outputChannelCount: [2]
        });
        
        this.workletNode.connect(this.audioNodes.masterGain);
        
        let signal = this.audioNodes.masterGain;

        if (effects.dist) {
            signal.connect(this.audioNodes.distortion);
            signal = this.audioNodes.distortion;
        }
        
        if (effects.autoWah) {
            signal.connect(this.audioNodes.autoWah);
            signal = this.audioNodes.autoWah;
        }
        
        if (effects.flanger) {
            signal.connect(this.audioNodes.flangerDelay);
            this.audioNodes.flangerDelay.connect(this.audioNodes.flangerFeedback);
            this.audioNodes.flangerFeedback.connect(this.audioNodes.flangerDelay);
            signal = this.audioNodes.flangerDelay;
        }
        
        if (effects.chorus) {
            signal.connect(this.audioNodes.chorusDelay);
            signal = this.audioNodes.chorusDelay;
        }
        
        signal.connect(this.audioNodes.filter);
        
        if (effects.delay) {
            this.audioNodes.filter.connect(this.audioNodes.delay);
            this.audioNodes.delay.connect(this.audioNodes.delayFeedback);
            this.audioNodes.delayFeedback.connect(this.audioNodes.delay);
            signal = this.audioNodes.delay;
        }
        
        if (effects.reverb) {
            signal.connect(this.audioNodes.reverb);
            signal = this.audioNodes.reverb;
        }
        
        if (effects.tremolo) {
            this.audioNodes.tremoloGain.connect(this.audioNodes.masterGain.gain);
        }
        
        signal.connect(this.audioNodes.panner);
        this.audioNodes.panner.connect(ctx.destination);
        
        this.audioNodes.distortionGain.gain.value = effects.dist ? 1 : 0;
        this.audioNodes.autoWahGain.gain.value = effects.autoWah ? 1 : 0;
        this.audioNodes.tremoloGain.gain.value = effects.tremolo ? 0.5 : 0;
    }

    _createWaveShaper(amount) {
        const ctx = this.audioContext;
        const ws = ctx.createWaveShaper();
        const n = 44100;
        const curve = new Float32Array(n);
        for (let i = 0; i < n; i++) {
            const x = (i - n / 2) / (n / 2);
            curve[i] = (3 + amount) * x * 20 * 0.0174533 / (Math.PI + amount * Math.abs(x));
        }
        ws.curve = curve;
        ws.oversample = '4x';
        return ws;
    }

    _postInitialParams() {
        if (!this.workletNode) return;
        
        try {
            const detunes = [];
            const center = Math.floor(AppState.NUM_VOICES / 2);
            for (let i = 0; i < AppState.NUM_VOICES; i++) {
                detunes.push((i - center) * AppState.detuneAmount);
            }
            
            this.workletNode.port.postMessage({ type: 'detuneArray', detuneArray: detunes });
            this.workletNode.port.postMessage({ type: 'wave', wave: AppState.waveType });
            this.workletNode.port.postMessage({ type: 'voices', numVoices: AppState.NUM_VOICES });
            
        } catch (e) {
            console.warn('postInitialParams:', e);
        }
    }

    dispose() {
        try {
            if (this.workletNode) {
                try { this.workletNode.disconnect(); } catch (e) {}
                this.workletNode = null;
            }
        } catch (e) {
            console.error('Dispose error:', e);
        }
    }
}

function createEngineAndStart() {
    if (AppState.isPlaying) {
        showStatus('Already running');
        return;
    }
    
    AppState.engine = new AdvancedSynthEngine();
    AppState.engine.init().then(() => {
        AppState.audioCtx = AppState.engine.audioContext;
        AppState.workletNode = AppState.engine.workletNode;
        AppState.isPlaying = true;
        updateButtonStates();
        showStatus('Started ✓');
        AppState.engine._postInitialParams();
    }).catch(err => {
        console.error('Engine init failed', err);
        showStatus('Audio init failed');
    });
}

function stopSynth() {
    if (!AppState.audioCtx) {
        showStatus('No synth running');
        return;
    }
    
    try {
        stopRhythm();
        AppState.engine.dispose();
        AppState.audioCtx.close().then(() => {
            AppState.audioCtx = null;
            AppState.engine = null;
            AppState.workletNode = null;
            AppState.isPlaying = false;
            updateButtonStates();
            showStatus('Stopped');
        }).catch(e => {
            console.error(e);
            showStatus('Stop error');
        });
    } catch (e) {
        console.error(e);
        showStatus('Stop error');
    }
}

function noteFromPad(y) {
    const padHeight = window.innerHeight;
    const ratio = 1 - (y / padHeight);
    const baseFreq = 130.81 * Math.pow(2, AppState.octaveOffset);
    return baseFreq * Math.pow(2, (ratio * 17) / 12);
}

function applyPitchToWorklet(freq) {
    if (!AppState.engine || !AppState.engine.workletNode || !AppState.audioCtx) return;
    
    try {
        const param = AppState.engine.workletNode.parameters.get('baseFreq');
        const t = AppState.audioCtx.currentTime;
        
        let currentValue;
        try {
            currentValue = param.value;
        } catch (e) {
            currentValue = freq;
        }
        
        param.cancelScheduledValues(t);
        param.setValueAtTime(currentValue, t);
        param.linearRampToValueAtTime(freq, t + 0.005);
        
        const noteInfo = freqToNote(freq);
        elements.noteDisplay.textContent = `${noteInfo.fullName} (Oct:${AppState.octaveOffset})`;
        updateThemeColor(noteInfo.name);
    } catch (e) {
        console.warn('Pitch apply error:', e);
    }
}

function applyPitch() {
    if (!safeAudioOperation(() => {
        const freq = AppState.baseFreq;
        applyPitchToWorklet(freq);
    })) return;
}

let isTouching = false;
let lastTouchTime = 0;

function handleTouchStart(e) {
    e.preventDefault();
    isTouching = true;
    handleTouchMove(e);
}

function handleTouchMove(e) {
    if (!isTouching && !(e.type === 'mousemove' && e.buttons === 1)) return;
    
    const now = performance.now();
    if (now - lastTouchTime < 4) return;
    lastTouchTime = now;
    
    if (!isAudioContextValid()) {
        showStatus('Start synth first');
        return;
    }
    
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    
    AppState.baseFreq = noteFromPad(clientY);
    const volume = clientX / window.innerWidth;
    
    safeAudioOperation(() => {
        AppState.engine.audioNodes.masterGain.gain.setTargetAtTime(volume * 0.4, AppState.audioCtx.currentTime, 0.005);
    });
    
    applyPitch();
}

function handleTouchEnd() {
    isTouching = false;
}

function updatePan(position) {
    if (!AppState.engine || !AppState.engine.audioNodes.panner) return;
    
    safeAudioOperation(() => {
        AppState.engine.audioNodes.panner.pan.setTargetAtTime(position, AppState.audioCtx.currentTime, 0.005);
        const panPercent = Math.round(position * 100);
        elements.panDisplay.textContent = `Pan:${panPercent}%`;
    });
}

let lastOrientationTime = 0;

function handleOrientation(e) {
    const now = performance.now();
    if (now - lastOrientationTime < 16) return;
    lastOrientationTime = now;
    
    if (e.beta === null) return;
    const tilt = e.beta;
    const pan = e.gamma;
    
    if (AppState.motionEnabled) {
        AppState.tiltBend = tilt / 45 * 12;
        const baseFreq = 130.81 * Math.pow(2, AppState.octaveOffset);
        AppState.baseFreq = baseFreq * Math.pow(2, AppState.tiltBend / 12);
        elements.motionDisplay.textContent = `Tilt:${Math.round(AppState.tiltBend * 10) / 10}st`;
        applyPitch();
    }
    
    if (AppState.panEnabled && pan !== null) {
        const panValue = Math.max(-1, Math.min(1, pan / 90));
        updatePan(panValue);
    }
}

function requestMotionPermission() {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        elements.permissionModal.style.display = 'flex';
    } else {
        startMotionControl();
    }
}

function startMotionControl() {
    window.addEventListener("deviceorientation", handleOrientation);
    AppState.motionEnabled = true;
    elements.motionBtn.textContent = "Motion ON";
    elements.motionBtn.classList.add('active');
    elements.motionDisplay.style.display = 'block';
    showStatus('Motion enabled - Tilt device for pitch!');
}

function disableMotion() {
    window.removeEventListener("deviceorientation", handleOrientation);
    AppState.motionEnabled = false;
    AppState.tiltBend = 0;
    elements.motionBtn.textContent = "Motion";
    elements.motionBtn.classList.remove('active');
    elements.motionDisplay.style.display = 'none';
    showStatus('Motion disabled');
}

function togglePan() {
    AppState.panEnabled = !AppState.panEnabled;
    elements.panBtn.textContent = AppState.panEnabled ? "Pan ON" : "Pan";
    elements.panBtn.classList.toggle('active', AppState.panEnabled);
    elements.panDisplay.style.display = AppState.panEnabled ? 'block' : 'none';
    if (!AppState.panEnabled) {
        updatePan(0);
    }
    showStatus(AppState.panEnabled ? 'Pan enabled - Tilt device sideways!' : 'Pan disabled');
}

function startRhythm(pattern) {
    if (!isAudioContextValid()) {
        showStatus('Start synth first');
        return;
    }
    
    stopRhythm();
    let interval;
    switch (pattern) {
        case '4': interval = 500; break;
        case '8': interval = 250; break;
        case '16': interval = 125; break;
    }
    
    rhythmInterval = setInterval(() => {
        safeAudioOperation(() => {
            AppState.engine.audioNodes.masterGain.gain.setTargetAtTime(0.3, AppState.audioCtx.currentTime, 0.01);
            setTimeout(() => {
                if (isAudioContextValid()) {
                    AppState.engine.audioNodes.masterGain.gain.setTargetAtTime(0.05, AppState.audioCtx.currentTime, 0.01);
                }
            }, 50);
        });
    }, interval);
}

function stopRhythm() {
    if (rhythmInterval) {
        clearInterval(rhythmInterval);
        rhythmInterval = null;
    }
}

function triggerVisualFeedback() {
    document.body.classList.add('flash');
    setTimeout(() => document.body.classList.remove('flash'), 120);
    elements.visualPulse.classList.add('active');
    setTimeout(() => elements.visualPulse.classList.remove('active'), 300);
}

function freqToNote(freq) {
    const A4 = 440;
    const semitonesFromA4 = 12 * Math.log2(freq / A4);
    const noteIndex = Math.round(semitonesFromA4 + 9) % 12;
    const octave = Math.floor((semitonesFromA4 + 9) / 12);
    const noteName = noteNames[(noteIndex + 12) % 12];
    return { name: noteName, octave: octave, fullName: `${noteName}${octave}` };
}

function updateThemeColor(noteName) {
    const color = noteColors[noteName] || [100, 100, 100];
    document.documentElement.style.setProperty('--r', color[0]);
    document.documentElement.style.setProperty('--g', color[1]);
    document.documentElement.style.setProperty('--b', color[2]);
}

function createNoteRuler() {
    const notes = ['D4','C#4','C4','B3','A#3','A3','G#3','G3','F#3','F3','E3','D#3','D3','C#3','C3','B2','A#2'];
    elements.noteRuler.innerHTML = '';
    notes.forEach(note => {
        const div = document.createElement('div');
        div.className = 'ruler-note';
        div.textContent = note;
        elements.noteRuler.appendChild(div);
    });
}

function toggleControls() {
    elements.controls.classList.toggle('expanded');
    elements.toggleControls.textContent = elements.controls.classList.contains('expanded') ? '✕' : '⚙️';
}

function initializeEventListeners() {
    elements.pad.addEventListener("touchstart", handleTouchStart, { passive: false });
    elements.pad.addEventListener("touchmove", handleTouchMove, { passive: false });
    elements.pad.addEventListener("touchend", handleTouchEnd);
    elements.pad.addEventListener("mousedown", handleTouchStart);
    elements.pad.addEventListener("mousemove", handleTouchMove);
    elements.pad.addEventListener("mouseup", handleTouchEnd);
    elements.pad.addEventListener("mouseleave", handleTouchEnd);
    
    elements.startBtn.addEventListener("click", createEngineAndStart);
    elements.stopBtn.addEventListener("click", stopSynth);
    elements.motionBtn.addEventListener("click", () => {
        AppState.motionEnabled ? disableMotion() : requestMotionPermission();
    });
    elements.panBtn.addEventListener("click", togglePan);
    elements.toggleControls.addEventListener("click", toggleControls);
    
    document.getElementById("octUp").addEventListener("click", () => {
        AppState.octaveOffset++;
        applyPitch();
        createNoteRuler();
    });
    document.getElementById("octDown").addEventListener("click", () => {
        AppState.octaveOffset--;
        applyPitch();
        createNoteRuler();
    });
    
    document.getElementById("permissionAllow").addEventListener("click", () => {
        DeviceOrientationEvent.requestPermission().then(r => {
            elements.permissionModal.style.display = 'none';
            if (r === 'granted') {
                startMotionControl();
            } else {
                showStatus('Motion permission denied');
            }
        }).catch(e => {
            elements.permissionModal.style.display = 'none';
            showStatus('Permission error');
        });
    });
    
    document.getElementById("permissionDeny").addEventListener("click", () => {
        elements.permissionModal.style.display = 'none';
        showStatus('Motion disabled');
    });
    
    document.getElementById("waveSelect").addEventListener("change", e => {
        AppState.waveType = e.target.value;
        if (AppState.engine && AppState.engine.workletNode) {
            try {
                AppState.engine.workletNode.port.postMessage({ type: 'wave', wave: AppState.waveType });
            } catch (e) {}
        }
        showStatus('Wave: ' + AppState.waveType);
    });
    
    document.getElementById("detuneRange").addEventListener("input", e => {
        AppState.detuneAmount = parseFloat(e.target.value);
        if (AppState.engine && AppState.engine.workletNode) {
            const detunes = [];
            const center = Math.floor(AppState.NUM_VOICES / 2);
            for (let i = 0; i < AppState.NUM_VOICES; i++) {
                detunes.push((i - center) * AppState.detuneAmount);
            }
            try {
                AppState.engine.workletNode.port.postMessage({ type: 'detuneArray', detuneArray: detunes });
            } catch (e) {}
        }
    });
    
    document.getElementById("filterFreq").addEventListener("input", e => {
        if (AppState.engine && AppState.engine.audioNodes.filter && effects.filter) {
            AppState.engine.audioNodes.filter.frequency.value = parseFloat(e.target.value);
        }
    });
    
    document.getElementById("filterReso").addEventListener("input", e => {
        if (AppState.engine && AppState.engine.audioNodes.filter) {
            AppState.engine.audioNodes.filter.Q.value = parseFloat(e.target.value);
        }
    });
    
    document.getElementById("autoWahRate").addEventListener("input", e => {
        if (AppState.engine && AppState.engine.audioNodes.autoWahLFO) {
            AppState.engine.audioNodes.autoWahLFO.frequency.value = parseFloat(e.target.value);
        }
    });
    
    document.getElementById("autoWahDepth").addEventListener("input", e => {
        if (AppState.engine && AppState.engine.audioNodes.autoWahGain) {
            AppState.engine.audioNodes.autoWahGain.gain.value = parseFloat(e.target.value);
        }
    });
    
    const toggleMap = {
        toggleDist: 'dist', toggleAutoWah: 'autoWah', toggleFlanger: 'flanger',
        toggleChorus: 'chorus', toggleTremolo: 'tremolo', toggleFilter: 'filter',
        toggleDelay: 'delay', toggleReverb: 'reverb'
    };
    
    Object.entries(toggleMap).forEach(([id, effect]) => {
        document.getElementById(id).addEventListener("click", () => {
            if (!AppState.engine) {
                showStatus('Start first');
                return;
            }
            effects[effect] = !effects[effect];
            document.getElementById(id).classList.toggle('active', effects[effect]);
            AppState.engine._connectGraph();
            showStatus(effect + ' ' + (effects[effect] ? 'ON' : 'OFF'));
            
            if (effect === 'autoWah') {
                elements.wahDisplay.style.display = effects[effect] ? 'block' : 'none';
                elements.wahDisplay.textContent = 'Wah:' + (effects[effect] ? 'ON' : 'OFF');
            }
        });
    });
    
    document.getElementById("rhythm4").addEventListener("click", () => {
        startRhythm('4');
        showStatus('1/4 Rhythm');
    });
    document.getElementById("rhythm8").addEventListener("click", () => {
        startRhythm('8');
        showStatus('1/8 Rhythm');
    });
    document.getElementById("rhythm16").addEventListener("click", () => {
        startRhythm('16');
        showStatus('1/16 Rhythm');
    });
    document.getElementById("rhythmStop").addEventListener("click", () => {
        stopRhythm();
        showStatus('Rhythm Stopped');
    });
}

window.addEventListener('load', () => {
    updateThemeColor('C');
    initializeEventListeners();
    updateButtonStates();
    createNoteRuler();
    showStatus('Ready - Click Start then try effects!');
});

window.addEventListener("contextmenu", e => e.preventDefault());
</script>
</body>
</html>
