<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sensor Synth Pad Start/Stop</title>
<style>
html, body {
    margin: 0; padding: 0; height: 100%;
    background: #111; color: #fff;
    font-family: sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    touch-action: none;
    overscroll-behavior: none;
}

#noteDisplay {
    height: 8vh; line-height: 8vh;
    text-align: center; font-size: 18px;
    background: #222; color: #0f0;
}

#pad {
    width: 100vw;
    height: 72vh;
    background: linear-gradient(135deg,#222,#333);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    touch-action: none;
    position: relative;
}

#controls {
    height: 20vh; display: flex;
    flex-wrap: wrap; padding: 10px;
    gap: 10px; justify-content: center; align-items: center;
}

button, select {
    padding: 8px 14px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    background: #444;
    color: white;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
label { font-size: 14px; margin-right: 5px; }
.control-group { display: flex; align-items: center; }
</style>
</head>
<body>

<div id="noteDisplay">Octave: 0 | Note: –</div>
<div id="pad"></div>

<div id="controls">
    <button id="octDown">Oct -</button>
    <button id="octUp">Oct +</button>
</div>

<script>
let audioCtx;
let osc;
let gainNode;
let baseFreq = 261.63;
let octaveOffset = 0;
let tiltBend = 0;
let isPlaying = false;

// Simple pseudo reverb
function createReverb(ctx) {
    const convolver = ctx.createConvolver();
    const len = 2.5*ctx.sampleRate;
    const impulse = ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){
        const buf = impulse.getChannelData(c);
        for(let i=0;i<len;i++){
            buf[i]=(Math.random()*2-1)*(1-i/len);
        }
    }
    convolver.buffer = impulse;
    return convolver;
}

// Start synth
function startSynth(){
    if(audioCtx)return;
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();

    osc = audioCtx.createOscillator();
    osc.type="sawtooth";

    const filter = audioCtx.createBiquadFilter();
    filter.type="lowpass";
    filter.frequency.value=8000;
    filter.Q.value=1;

    const reverb = createReverb(audioCtx);

    gainNode = audioCtx.createGain();
    gainNode.gain.value=0.15;

    osc.connect(filter);
    filter.connect(reverb);
    reverb.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    osc.start();
}

// Stop synth
function stopSynth(){
    if(!osc)return;
    osc.stop();
    osc.disconnect();
    osc=null;
}

// Pad control
const pad = document.getElementById("pad");
const noteDisplay = document.getElementById("noteDisplay");

const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

function freqToNote(freq){
    const A4 = 440;
    const semitones = Math.round(12*Math.log2(freq/ A4));
    const noteIndex = (semitones+9+12*100)%12; // C4=261Hz base
    const octave = 4 + Math.floor((semitones+9)/12);
    return {note: NOTES[noteIndex], octave};
}

function noteFromPad(x){
    const c4 = 261.63*Math.pow(2,octaveOffset);
    const c5 = c4*2;
    const ratio = x/window.innerWidth;
    return c4 + (c5-c4)*ratio;
}

function applyPitch(){
    if(!osc)return;
    const freq = baseFreq*Math.pow(2,tiltBend/12);
    osc.frequency.setTargetAtTime(freq,audioCtx.currentTime,0.01);

    const {note, octave} = freqToNote(freq);
    noteDisplay.textContent = `Octave: ${octaveOffset} | Note: ${note}`;
}

// Touch events: start on touchstart, stop on touchend
pad.addEventListener("touchstart",e=>{
    if(!audioCtx)startSynth();
    isPlaying=true;
    const touch = e.touches[0];
    baseFreq = noteFromPad(touch.clientX);
    applyPitch();
});

pad.addEventListener("touchmove",e=>{
    if(!isPlaying)return;
    const touch = e.touches[0];
    baseFreq = noteFromPad(touch.clientX);
    applyPitch();
});

pad.addEventListener("touchend",e=>{
    isPlaying=false;
    stopSynth();
    noteDisplay.textContent = `Octave: ${octaveOffset} | Note: –`;
});

// Octave buttons
document.getElementById("octUp").onclick = ()=>{ octaveOffset++; };
document.getElementById("octDown").onclick = ()=>{ octaveOffset--; };

// Disable context menu globally
window.addEventListener("contextmenu", e=>e.preventDefault());
</script>

</body>
</html>
