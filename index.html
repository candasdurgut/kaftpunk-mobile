<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fast Sensor Synth</title>
<style>
html, body {
    margin:0; padding:0; height:100%;
    background:#111; color:#fff;
    font-family:sans-serif;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:rgba(0,0,0,0);
    touch-action:none;
    overscroll-behavior:none;
}

#noteDisplay {
    height:8vh; line-height:8vh;
    text-align:center; font-size:18px;
    background:#222; color:#0f0;
}

#pad {
    width:100vw;
    height:72vh;
    background:linear-gradient(135deg,#222,#333);
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:rgba(0,0,0,0);
    touch-action:none;
    position:relative;
}

#controls {
    height:20vh; display:flex;
    flex-wrap:wrap; padding:10px;
    gap:10px; justify-content:center; align-items:center;
}

button, select {
    padding:8px 14px;
    font-size:16px;
    border-radius:8px;
    border:none;
    background:#444;
    color:white;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}
label { font-size:14px; margin-right:5px; }
.control-group { display:flex; align-items:center; }
</style>
</head>
<body>

<div id="noteDisplay">Octave: 3 | Note: –</div>
<div id="pad"></div>

<div id="controls">
    <button id="octDown">Oct -</button>
    <button id="octUp">Oct +</button>
    <div class="control-group">
        <label for="waveSelect">Wave</label>
        <select id="waveSelect">
            <option value="sawtooth">Saw</option>
            <option value="triangle">Triangle</option>
            <option value="square">Square</option>
            <option value="sine">Sine</option>
        </select>
    </div>
</div>

<script>
let audioCtx;
let osc;
let gainNode;
let baseFreq = 130.81; // C3
let octaveOffset = 0;
let tiltBend = 0;
let isPlaying = false;
let waveType = "sawtooth";

const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const noteDisplay = document.getElementById("noteDisplay");

// Frequency → Note
function freqToNote(freq){
    const A4 = 440;
    const semitones = Math.round(12*Math.log2(freq/ A4));
    const noteIndex = (semitones+9+12*100)%12;
    const octave = 4 + Math.floor((semitones+9)/12);
    return {note: NOTES[noteIndex], octave};
}

// Start Synth
function startSynth(){
    if(audioCtx) return;

    audioCtx = new (window.AudioContext||window.webkitAudioContext)();

    osc = audioCtx.createOscillator();
    osc.type = waveType;

    gainNode = audioCtx.createGain();
    gainNode.gain.value=0.2;

    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    osc.start();
}

// Stop Synth
function stopSynth(){
    if(!osc) return;
    osc.stop();
    osc.disconnect();
    osc = null;
}

// Map X → frequency
function noteFromPad(x){
    const c3 = 130.81*Math.pow(2,octaveOffset);
    const c4 = c3*2;
    const ratio = x/window.innerWidth;
    return c3 + (c4-c3)*ratio;
}

// Apply pitch to oscillator
function applyPitch(){
    if(!osc) return;
    const freq = baseFreq*Math.pow(2,tiltBend/12);
    osc.frequency.setTargetAtTime(freq,audioCtx.currentTime,0.001);
    const {note, octave} = freqToNote(freq);
    noteDisplay.textContent = `Octave: ${3+octaveOffset} | Note: ${note}`;
}

// Touch events
const pad = document.getElementById("pad");

pad.addEventListener("touchstart",e=>{
    if(!audioCtx) startSynth();
    isPlaying = true;
    const touch = e.touches[0];
    baseFreq = noteFromPad(touch.clientX);
    applyPitch();
});

pad.addEventListener("touchmove",e=>{
    if(!isPlaying) return;
    const touch = e.touches[0];
    baseFreq = noteFromPad(touch.clientX);
    applyPitch();
});

pad.addEventListener("touchend",e=>{
    isPlaying=false;
    stopSynth();
    noteDisplay.textContent = `Octave: ${3+octaveOffset} | Note: –`;
});

// Octave buttons
document.getElementById("octUp").onclick = ()=>{ octaveOffset++; };
document.getElementById("octDown").onclick = ()=>{ octaveOffset--; };

// Waveform select
document.getElementById("waveSelect").onchange = e=>{
    waveType = e.target.value;
    if(osc) osc.type=waveType;
};

// Disable context menu
window.addEventListener("contextmenu", e=>e.preventDefault());
</script>

</body>
</html>
