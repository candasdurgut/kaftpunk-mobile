<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Uçurucu Saykadelik Synth</title>
<style>
html, body {
    margin: 0; padding: 0; height: 100%;
    background: #111; color: #fff;
    font-family: sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    touch-action: none;
    overscroll-behavior: none;
}

#pad {
    width: 100vw;
    height: 70vh;
    background: linear-gradient(135deg,#222,#333);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    touch-action: none;
    position: relative;
}

#controls {
    height: 30vh; display: flex;
    flex-wrap: wrap; padding: 10px;
    gap: 10px; justify-content: center; align-items: center;
}

button, select, input[type=range] {
    padding: 8px 14px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    background: #444;
    color: white;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
label { font-size: 14px; margin-right: 5px; }
.control-group { display: flex; align-items: center; }
</style>
</head>
<body>

<div id="pad"></div>

<div id="controls">
    <button id="startBtn">Start Synth</button>
    <button id="motionBtn">Enable Motion</button>
    <button id="octDown">Oct -</button>
    <button id="octUp">Oct +</button>
    <div class="control-group">
        <label for="waveSelect">Wave</label>
        <select id="waveSelect">
            <option value="sawtooth">Saw</option>
            <option value="triangle">Triangle</option>
            <option value="square">Square</option>
            <option value="sine">Sine</option>
        </select>
    </div>
    <div class="control-group">
        <label for="detuneRange">Detune</label>
        <input type="range" id="detuneRange" min="0" max="50" value="15">
    </div>
    <div class="control-group">
        <label for="filterReso">Resonance</label>
        <input type="range" id="filterReso" min="0.5" max="20" value="1" step="0.5">
    </div>
    <button id="toggleFlanger">Flanger</button>
    <button id="togglePhaser">Phaser</button>
    <button id="toggleDist">Distortion</button>
</div>

<script>
let audioCtx;
let oscillators = [];
let gainNode, filter, reverb;
let baseFreq = 261.63, octaveOffset = 0, tiltBend = 0;
let isFlanger=false, isPhaser=false, isDist=false;
const NUM_OSC = 7;
let detuneAmount = 15;
let waveType = "sawtooth";

// === Simple Pseudo Reverb ===
function createReverb(ctx) {
    const convolver = ctx.createConvolver();
    const len = 3*ctx.sampleRate;
    const impulse = ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){
        const buf = impulse.getChannelData(c);
        for(let i=0;i<len;i++){
            buf[i]=(Math.random()*2-1)*(1-i/len);
        }
    }
    convolver.buffer = impulse;
    return convolver;
}

function startSynth(){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();

    gainNode = audioCtx.createGain();
    gainNode.gain.value=0.15;

    filter = audioCtx.createBiquadFilter();
    filter.type="lowpass";
    filter.frequency.value=9000;
    filter.Q.value=1;

    reverb = createReverb(audioCtx);

    // OSCILLATORS
    oscillators=[];
    for(let i=0;i<NUM_OSC;i++){
        const osc = audioCtx.createOscillator();
        osc.type = waveType;
        const detune = (i-Math.floor(NUM_OSC/2))*(detuneAmount);
        osc.detune.value = detune;
        osc.connect(filter);
        osc.start();
        oscillators.push(osc);
    }

    filter.connect(reverb);
    reverb.connect(gainNode);
    gainNode.connect(audioCtx.destination);
}

// === Pad X→Pitch Y→Filter ===
const pad = document.getElementById("pad");
function noteFromPad(x){
    const c4 = 261.63 * Math.pow(2,octaveOffset);
    const c5 = c4*2;
    const ratio = x/window.innerWidth;
    return c4 + (c5-c4)*ratio;
}

function applyPitch(){
    const freq = baseFreq*Math.pow(2,tiltBend/12);
    oscillators.forEach(osc=>osc.frequency.setTargetAtTime(freq,audioCtx.currentTime,0.01));
}

pad.addEventListener("touchstart",handleTouch);
pad.addEventListener("touchmove",handleTouch);
function handleTouch(e){
    const touch = e.touches[0]||e.changedTouches[0];
    baseFreq = noteFromPad(touch.clientX);
    filter.frequency.value = 500+((window.innerHeight-touch.clientY)/window.innerHeight)*8000;
    applyPitch();
}

// === DeviceOrientation Whammy ===
function enableMotion(){
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
        DeviceOrientationEvent.requestPermission().then(res=>{
            if(res==='granted'){
                window.addEventListener("deviceorientation", e=>{
                    const norm = e.beta/45;
                    tiltBend = norm*24; // ±2 octaves
                    applyPitch();
                });
            }
        });
    }
}

// === Octave Buttons ===
document.getElementById("octUp").onclick = ()=>{ octaveOffset++; };
document.getElementById("octDown").onclick = ()=>{ octaveOffset--; };

// === Waveform select ===
document.getElementById("waveSelect").onchange = e=>{
    waveType = e.target.value;
    oscillators.forEach(osc=>osc.type=waveType);
};

// === Detune control ===
document.getElementById("detuneRange").oninput = e=>{
    detuneAmount = parseFloat(e.target.value);
    oscillators.forEach((osc,i)=>{
        const det = (i-Math.floor(NUM_OSC/2))*detuneAmount;
        osc.detune.setValueAtTime(det,audioCtx.currentTime);
    });
};

// === Filter Resonance ===
document.getElementById("filterReso").oninput = e=>{
    filter.Q.value=parseFloat(e.target.value);
};

// === Toggle Effects ===
document.getElementById("toggleFlanger").onclick = ()=>{ isFlanger=!isFlanger; }
document.getElementById("togglePhaser").onclick = ()=>{ isPhaser=!isPhaser; }
document.getElementById("toggleDist").onclick = ()=>{ isDist=!isDist; }

// === Buttons ===
document.getElementById("startBtn").onclick = ()=>startSynth();
document.getElementById("motionBtn").onclick = ()=>enableMotion();

// Prevent context menu globally
window.addEventListener("contextmenu", e=>e.preventDefault());
</script>
</body>
</html>
