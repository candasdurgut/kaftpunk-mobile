<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Uçurucu Saykadelik Synth</title>
<style>
html, body {
    margin: 0; padding: 0; height: 100%;
    background: #111; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    touch-action: none;
    overscroll-behavior: none;
    overflow: hidden;
}

#pad {
    width: 100vw;
    height: 65vh;
    background: linear-gradient(135deg,#222,#333);
    position: relative;
}

#display {
    position: absolute;
    top: 15px;
    left: 15px;
    background: rgba(0,0,0,0.8);
    padding: 12px 15px;
    border-radius: 12px;
    font-size: 16px;
    z-index: 10;
    border: 1px solid #444;
}

#display div {
    margin: 3px 0;
    font-weight: 500;
}

#controls {
    height: 35vh;
    display: flex;
    flex-wrap: wrap;
    padding: 8px;
    gap: 8px;
    justify-content: center;
    align-content: flex-start;
    overflow-y: auto;
}

button, select, input[type=range] {
    padding: 10px 12px;
    font-size: 15px;
    border-radius: 10px;
    border: none;
    background: #444;
    color: white;
    min-height: 44px;
}

button {
    min-width: 80px;
}

select {
    min-width: 100px;
}

input[type=range] {
    min-width: 80px;
    padding: 10px 5px;
}

label { 
    font-size: 13px; 
    margin-right: 5px; 
    white-space: nowrap;
}

.control-group { 
    display: flex; 
    align-items: center; 
    flex-shrink: 0;
}

.active {
    background: #ff6b6b !important;
    color: white !important;
    box-shadow: 0 0 10px rgba(255,107,107,0.5);
}

.effect-controls {
    display: none;
    position: absolute;
    bottom: 100%;
    left: 0;
    right: 0;
    background: rgba(0,0,0,0.95);
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 8px;
    border: 1px solid #555;
    z-index: 20;
}

.effect-group {
    position: relative;
}

.effect-group:active .effect-controls,
.effect-group:focus-within .effect-controls {
    display: block;
}

.slider-group {
    margin: 8px 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.slider-group label {
    font-size: 12px;
    color: #ccc;
}

.control-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-bottom: 5px;
}

#startBtn, #motionBtn {
    background: #007AFF;
    font-weight: 600;
}

#startBtn.active, #motionBtn.active {
    background: #0056CC;
}

/* iPhone 12 specific optimizations */
@media (max-width: 390px) {
    #controls {
        gap: 6px;
        padding: 6px;
    }
    
    button, select {
        padding: 8px 10px;
        font-size: 14px;
        min-height: 42px;
    }
    
    .control-group {
        flex: 1;
        min-width: calc(50% - 12px);
        justify-content: center;
    }
}

/* Scrollbar styling for controls */
#controls::-webkit-scrollbar {
    width: 3px;
}

#controls::-webkit-scrollbar-track {
    background: #222;
}

#controls::-webkit-scrollbar-thumb {
    background: #444;
    border-radius: 3px;
}
</style>
</head>
<body>

<div id="pad">
    <div id="display">
        <div id="noteDisplay">Nota: --</div>
        <div id="octaveDisplay">Oktav: 4</div>
        <div id="freqDisplay">Frekans: 0 Hz</div>
    </div>
</div>

<div id="controls">
    <div class="control-row">
        <button id="startBtn">Start Synth</button>
        <button id="motionBtn">Enable Motion</button>
        <button id="octDown">Oct -</button>
        <button id="octUp">Oct +</button>
    </div>
    
    <div class="control-row">
        <div class="control-group">
            <label for="waveSelect">Wave</label>
            <select id="waveSelect">
                <option value="sawtooth">Saw</option>
                <option value="triangle">Triangle</option>
                <option value="square">Square</option>
                <option value="sine">Sine</option>
            </select>
        </div>
        
        <div class="control-group">
            <label for="detuneRange">Detune</label>
            <input type="range" id="detuneRange" min="0" max="50" value="15">
        </div>
        
        <div class="control-group">
            <label for="filterReso">Resonance</label>
            <input type="range" id="filterReso" min="0.5" max="20" value="1" step="0.5">
        </div>
    </div>
    
    <div class="control-row">
        <div class="control-group effect-group">
            <button id="toggleFlanger">Flanger</button>
            <div class="effect-controls">
                <div class="slider-group">
                    <label>Depth</label>
                    <input type="range" id="flangerDepth" min="0.001" max="0.01" value="0.005" step="0.001">
                </div>
                <div class="slider-group">
                    <label>Rate</label>
                    <input type="range" id="flangerRate" min="0.1" max="5" value="0.5" step="0.1">
                </div>
            </div>
        </div>
        
        <div class="control-group effect-group">
            <button id="togglePhaser">Phaser</button>
            <div class="effect-controls">
                <div class="slider-group">
                    <label>Freq</label>
                    <input type="range" id="phaserFreq" min="200" max="1500" value="350" step="50">
                </div>
                <div class="slider-group">
                    <label>Q</label>
                    <input type="range" id="phaserQ" min="1" max="20" value="10" step="1">
                </div>
            </div>
        </div>
        
        <div class="control-group effect-group">
            <button id="toggleDist">Distortion</button>
            <div class="effect-controls">
                <div class="slider-group">
                    <label>Amount</label>
                    <input type="range" id="distortionAmount" min="0" max="100" value="50" step="5">
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let audioCtx;
let oscillators = [];
let gainNode, filter, reverb;
let baseFreq = 261.63, octaveOffset = 0, tiltBend = 0;
let isFlanger=false, isPhaser=false, isDist=false;
let flangerNode, phaserNodes = [], distortionNode;
const NUM_OSC = 7;
let detuneAmount = 15;
let waveType = "sawtooth";

// === Note Display ===
function updateDisplay(freq) {
    const noteInfo = getNoteFromFrequency(freq);
    document.getElementById('noteDisplay').textContent = `Nota: ${noteInfo.note}`;
    document.getElementById('octaveDisplay').textContent = `Oktav: ${noteInfo.octave}`;
    document.getElementById('freqDisplay').textContent = `Frekans: ${freq.toFixed(1)} Hz`;
}

function getNoteFromFrequency(freq) {
    const A4 = 440;
    const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    
    if (freq === 0) return { note: "--", octave: 4 };
    
    const noteNum = 12 * Math.log2(freq / A4) + 69;
    const noteIndex = Math.round(noteNum) % 12;
    const octave = Math.floor(noteNum / 12) - 1;
    
    return { note: noteNames[noteIndex], octave: octave };
}

// === Effects ===
function createFlanger(ctx) {
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();
    const delay = ctx.createDelay();
    const inputGain = ctx.createGain();
    const outputGain = ctx.createGain();
    const feedback = ctx.createGain();
    
    delay.delayTime.value = 0.005;
    gain.gain.value = 0.005;
    oscillator.frequency.value = 0.5;
    oscillator.type = 'sine';
    feedback.gain.value = 0.5;
    
    // Flanger routing
    inputGain.connect(delay);
    inputGain.connect(outputGain);
    delay.connect(outputGain);
    delay.connect(feedback);
    feedback.connect(delay);
    
    oscillator.connect(gain);
    gain.connect(delay.delayTime);
    oscillator.start();
    
    return {
        input: inputGain,
        output: outputGain,
        setDepth: (val) => gain.gain.value = val,
        setRate: (val) => oscillator.frequency.value = val,
        setFeedback: (val) => feedback.gain.value = val
    };
}

function createPhaser(ctx) {
    const nodes = [];
    const input = ctx.createGain();
    const output = ctx.createGain();
    
    // Create 4 allpass filters
    for(let i = 0; i < 4; i++) {
        const allpass = ctx.createBiquadFilter();
        allpass.type = "allpass";
        allpass.frequency.value = 350;
        allpass.Q.value = 10;
        nodes.push(allpass);
    }
    
    // Connect in series
    input.connect(nodes[0]);
    for(let i = 0; i < nodes.length - 1; i++) {
        nodes[i].connect(nodes[i + 1]);
    }
    nodes[nodes.length - 1].connect(output);
    
    // Also connect dry signal
    input.connect(output);
    
    return {
        input: input,
        output: output,
        setFrequency: (freq) => nodes.forEach(node => node.frequency.value = freq),
        setQ: (q) => nodes.forEach(node => node.Q.value = q)
    };
}

function createDistortion(ctx) {
    const distortion = ctx.createWaveShaper();
    const input = ctx.createGain();
    const output = ctx.createGain();
    
    input.connect(distortion);
    distortion.connect(output);
    
    function makeDistortionCurve(amount) {
        const k = typeof amount === 'number' ? amount : 50;
        const samples = 44100;
        const curve = new Float32Array(samples);
        const deg = Math.PI / 180;
        
        for (let i = 0; i < samples; i++) {
            const x = i * 2 / samples - 1;
            curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
        }
        return curve;
    }
    
    distortion.curve = makeDistortionCurve(50);
    distortion.oversample = '4x';
    
    return {
        input: input,
        output: output,
        setAmount: (amount) => {
            distortion.curve = makeDistortionCurve(amount);
        }
    };
}

// === Audio Routing ===
function updateEffectsRouting() {
    if (!filter || !reverb) return;
    
    // Disconnect everything first
    filter.disconnect();
    
    let currentNode = filter;
    
    // Connect effects in series based on activation
    if (isFlanger && flangerNode) {
        currentNode.connect(flangerNode.input);
        currentNode = flangerNode.output;
    }
    
    if (isPhaser && phaserNodes.input) {
        currentNode.connect(phaserNodes.input);
        currentNode = phaserNodes.output;
    }
    
    if (isDist && distortionNode) {
        currentNode.connect(distortionNode.input);
        currentNode = distortionNode.output;
    }
    
    // Always end with reverb
    currentNode.connect(reverb);
}

// === Simple Pseudo Reverb ===
function createReverb(ctx) {
    const convolver = ctx.createConvolver();
    const len = 3*ctx.sampleRate;
    const impulse = ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){
        const buf = impulse.getChannelData(c);
        for(let i=0;i<len;i++){
            buf[i]=(Math.random()*2-1)*(1-i/len);
        }
    }
    convolver.buffer = impulse;
    return convolver;
}

function startSynth(){
    if (audioCtx) {
        audioCtx.close();
    }
    
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();

    gainNode = audioCtx.createGain();
    gainNode.gain.value = 0.2; // Increased volume

    filter = audioCtx.createBiquadFilter();
    filter.type="lowpass";
    filter.frequency.value=9000;
    filter.Q.value=1;

    reverb = createReverb(audioCtx);
    
    // Create effects
    flangerNode = createFlanger(audioCtx);
    phaserNodes = createPhaser(audioCtx);
    distortionNode = createDistortion(audioCtx);

    // OSCILLATORS
    oscillators=[];
    for(let i=0;i<NUM_OSC;i++){
        const osc = audioCtx.createOscillator();
        osc.type = waveType;
        const detune = (i-Math.floor(NUM_OSC/2))*(detuneAmount);
        osc.detune.value = detune;
        osc.connect(filter);
        osc.start();
        oscillators.push(osc);
    }

    updateEffectsRouting();
    reverb.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    // Update start button
    document.getElementById('startBtn').classList.add('active');
    document.getElementById('startBtn').textContent = 'Synth Active';
    
    // Initial display update
    updateDisplay(baseFreq);
    
    console.log('Synth started successfully');
}

// === Pad X→Pitch Y→Filter ===
const pad = document.getElementById("pad");
function noteFromPad(x){
    const c4 = 261.63 * Math.pow(2,octaveOffset);
    const c5 = c4*2;
    const ratio = x/window.innerWidth;
    return c4 + (c5-c4)*ratio;
}

function applyPitch(){
    if (!audioCtx || oscillators.length === 0) return;
    
    const freq = baseFreq*Math.pow(2,tiltBend/12);
    oscillators.forEach(osc=>osc.frequency.setTargetAtTime(freq,audioCtx.currentTime,0.01));
    updateDisplay(freq);
}

pad.addEventListener("touchstart",handleTouch);
pad.addEventListener("touchmove",handleTouch);
function handleTouch(e){
    e.preventDefault();
    if (!audioCtx) {
        startSynth(); // Auto-start on first touch
    }
    const touch = e.touches[0]||e.changedTouches[0];
    baseFreq = noteFromPad(touch.clientX);
    filter.frequency.value = 500+((window.innerHeight-touch.clientY)/window.innerHeight)*8000;
    applyPitch();
}

// === DeviceOrientation Whammy ===
function enableMotion(){
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
        DeviceOrientationEvent.requestPermission().then(res=>{
            if(res==='granted'){
                window.addEventListener("deviceorientation", e=>{
                    const norm = e.beta/45;
                    tiltBend = norm*24; // ±2 octaves
                    applyPitch();
                });
                document.getElementById('motionBtn').classList.add('active');
                document.getElementById('motionBtn').textContent = 'Motion On';
            }
        });
    } else {
        window.addEventListener("deviceorientation", e=>{
            const norm = e.beta/45;
            tiltBend = norm*24;
            applyPitch();
        });
        document.getElementById('motionBtn').classList.add('active');
        document.getElementById('motionBtn').textContent = 'Motion On';
    }
}

// === Octave Buttons ===
document.getElementById("octUp").onclick = ()=>{ 
    octaveOffset++; 
    applyPitch();
};
document.getElementById("octDown").onclick = ()=>{ 
    octaveOffset--; 
    applyPitch();
};

// === Waveform select ===
document.getElementById("waveSelect").onchange = e=>{
    waveType = e.target.value;
    if (oscillators.length > 0) {
        oscillators.forEach(osc=>osc.type=waveType);
    }
};

// === Detune control ===
document.getElementById("detuneRange").oninput = e=>{
    detuneAmount = parseFloat(e.target.value);
    if (oscillators.length > 0) {
        oscillators.forEach((osc,i)=>{
            const det = (i-Math.floor(NUM_OSC/2))*detuneAmount;
            osc.detune.setValueAtTime(det,audioCtx.currentTime);
        });
    }
};

// === Filter Resonance ===
document.getElementById("filterReso").oninput = e=>{
    if (filter) {
        filter.Q.value=parseFloat(e.target.value);
    }
};

// === Effect Controls ===
document.getElementById("flangerDepth").oninput = e=>{
    if (flangerNode) flangerNode.setDepth(parseFloat(e.target.value));
};
document.getElementById("flangerRate").oninput = e=>{
    if (flangerNode) flangerNode.setRate(parseFloat(e.target.value));
};
document.getElementById("phaserFreq").oninput = e=>{
    if (phaserNodes) phaserNodes.setFrequency(parseFloat(e.target.value));
};
document.getElementById("phaserQ").oninput = e=>{
    if (phaserNodes) phaserNodes.setQ(parseFloat(e.target.value));
};
document.getElementById("distortionAmount").oninput = e=>{
    if (distortionNode) distortionNode.setAmount(parseFloat(e.target.value));
};

// === Toggle Effects ===
function toggleEffect(effect, buttonId) {
    effect = !effect;
    document.getElementById(buttonId).classList.toggle('active', effect);
    if (audioCtx) {
        updateEffectsRouting();
    }
    return effect;
}

document.getElementById("toggleFlanger").onclick = ()=>{ 
    isFlanger = toggleEffect(isFlanger, "toggleFlanger");
};
document.getElementById("togglePhaser").onclick = ()=>{ 
    isPhaser = toggleEffect(isPhaser, "togglePhaser");
};
document.getElementById("toggleDist").onclick = ()=>{ 
    isDist = toggleEffect(isDist, "toggleDist");
};

// === Buttons ===
document.getElementById("startBtn").onclick = ()=>startSynth();
document.getElementById("motionBtn").onclick = ()=>enableMotion();

// Prevent context menu globally
window.addEventListener("contextmenu", e=>e.preventDefault());

// Auto-start on first interaction for better UX
document.addEventListener('touchstart', function() {
    if (!audioCtx) {
        // Start synth on first touch anywhere
        startSynth();
    }
}, { once: true });
</script>
</body>
</html>
