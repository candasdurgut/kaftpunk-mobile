<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pro Synth</title>
<style>
:root {
  --r: 255; --g: 100; --b: 100;
  --bg-color: rgba(var(--r), var(--g), var(--b), 0.3);
  --control-bg: rgba(var(--r), var(--g), var(--b), 0.4);
  --text-color: rgba(255, 255, 255, 0.95);
  --border-color: rgba(var(--r), var(--g), var(--b), 0.8);
  --safe-area-inset-top: env(safe-area-inset-top);
  --safe-area-inset-bottom: env(safe-area-inset-bottom);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  background-color: #111;
  color: var(--text-color);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-weight: 400;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  overscroll-behavior: none;
  overflow: hidden;
}

body {
  background-color: var(--bg-color);
  transition: background-color 0.1s ease;
}

#app-container {
  height: 100%;
  display: flex;
  flex-direction: column;
}

#pad {
  width: 100%;
  height: 100vh;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at center, var(--control-bg), rgba(0,0,0,0.4));
  cursor: crosshair;
  overflow: hidden;
}

#touchFeedback {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
  pointer-events: none;
  z-index: 5;
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: opacity 0.2s, width 0.2s, height 0.2s;
}

#noteDisplay, #motionDisplay, #wahDisplay, #panDisplay {
  position: absolute;
  background-color: var(--control-bg);
  color: var(--text-color);
  pointer-events: none;
  z-index: 10;
  border: 2px solid var(--border-color);
  backdrop-filter: blur(20px);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.1s ease;
}

#noteDisplay {
  top: max(20px, var(--safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  font-size: 24px;
  text-shadow: 0 0 20px var(--border-color);
}

#motionDisplay, #wahDisplay, #panDisplay {
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
}

#wahDisplay { bottom: 60px; }
#panDisplay { bottom: 100px; }
#motionDisplay { bottom: 140px; }

#noteRuler {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 60px;
  background: var(--control-bg);
  border-left: 2px solid var(--border-color);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 10px 0;
  pointer-events: none;
  z-index: 5;
}

.ruler-note {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  font-size: 11px;
  color: var(--text-color);
  border-bottom: 1px solid var(--border-color);
}

#controls {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-height: 70vh;
  background: var(--control-bg);
  backdrop-filter: blur(30px);
  border-top: 2px solid var(--border-color);
  transform: translateY(calc(100% - 50px));
  transition: transform 0.3s ease;
  overflow-y: auto;
  padding: 15px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 8px;
  z-index: 100;
  -ms-overflow-style: none;
  scrollbar-width: none;
}

#controls::-webkit-scrollbar { display: none; }
#controls.expanded { transform: translateY(0); }

#toggleControls {
  position: fixed;
  bottom: 10px;
  right: 20px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: var(--control-bg);
  border: 2px solid var(--border-color);
  color: var(--text-color);
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 25px var(--border-color);
  transition: all 0.1s ease;
}

button, select, input[type=range], label {
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  border-radius: 8px;
  border: 2px solid var(--border-color);
  background: var(--control-bg);
  color: var(--text-color);
  -webkit-appearance: none;
  appearance: none;
  transition: all 0.1s ease;
  outline: none;
}

button {
  padding: 10px 12px;
  cursor: pointer;
  min-height: 40px;
}

button.active {
  background: var(--border-color);
  color: #111;
  font-weight: 600;
  box-shadow: 0 0 15px var(--border-color);
}

.control-group {
  display: flex;
  flex-direction: column;
  align-items: center;
}

label {
  font-size: 10px;
  margin-bottom: 3px;
  text-align: center;
}

input[type=range] {
  width: 100%;
  height: 6px;
  background: var(--border-color);
  border: none;
  margin: 5px 0;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  background: var(--text-color);
  cursor: pointer;
  border-radius: 50%;
  box-shadow: 0 0 15px var(--border-color);
}

select {
  padding: 8px;
  cursor: pointer;
  min-height: 40px;
  width: 100%;
}

#statusMessage {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--control-bg);
  color: var(--text-color);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 12px;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  backdrop-filter: blur(15px);
  border: 2px solid var(--border-color);
}

#statusMessage.show { opacity: 1; }

.effect-group {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 8px;
  margin: 8px 0;
  padding: 8px;
  background: var(--control-bg);
  border-radius: 8px;
  border: 2px solid var(--border-color);
}

.effect-group-title {
  grid-column: 1 / -1;
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-color);
  margin-bottom: 3px;
}

.rhythm-panel {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 8px 0;
  padding: 12px;
  background: var(--control-bg);
  border-radius: 8px;
  border: 2px solid var(--border-color);
}

.rhythm-title {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-color);
  margin-bottom: 5px;
}

.rhythm-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.kick-panel {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 8px 0;
  padding: 12px;
  background: var(--control-bg);
  border-radius: 8px;
  border: 2px solid var(--border-color);
}

.kick-title {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-color);
  margin-bottom: 5px;
}

.kick-controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: var(--control-bg);
  padding: 20px;
  border-radius: 15px;
  max-width: 80%;
  text-align: center;
  backdrop-filter: blur(25px);
  border: 2px solid var(--border-color);
}

.modal-buttons {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.modal-buttons button { flex: 1; }

#waveAnimation {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.animation-panel {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 8px 0;
  padding: 12px;
  background: var(--control-bg);
  border-radius: 8px;
  border: 2px solid var(--border-color);
}

.animation-title {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-color);
  margin-bottom: 5px;
}

.animation-controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.performance-indicator {
  position: fixed;
  top: 10px;
  right: 10px;
  background: var(--control-bg);
  border: 2px solid var(--border-color);
  border-radius: 8px;
  padding: 4px 8px;
  font-size: 10px;
  z-index: 20;
  backdrop-filter: blur(10px);
}

@media (max-width: 768px) {
  #controls {
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 6px;
    padding: 10px;
  }
  
  .effect-group {
    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
  }
  
  .kick-controls, .animation-controls {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<div id="app-container">
  <div id="pad">
    <div id="touchFeedback"></div>
    <div id="noteDisplay">C4</div>
    <div id="motionDisplay">Tilt:0°</div>
    <div id="wahDisplay">Wah:ON</div>
    <div id="panDisplay">Pan:0%</div>
    <div id="noteRuler"></div>
    <canvas id="waveAnimation"></canvas>
  </div>
  
  <div class="performance-indicator" id="perfIndicator">CPU: 0%</div>
  
  <button id="toggleControls">⚙️</button>
  
  <div id="controls">
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
    <button id="motionBtn">Motion</button>
    <button id="panBtn">Pan</button>
    <button id="octDown">Oct-</button>
    <button id="octUp">Oct+</button>
    
    <div class="control-group">
      <label>Wave</label>
      <select id="waveSelect">
        <option value="sawtooth">Sawtooth</option>
        <option value="triangle">Triangle</option>
        <option value="square">Square</option>
        <option value="sine">Sine</option>
        <option value="pulse">Pulse</option>
        <option value="fm">FM</option>
      </select>
    </div>
    
    <div class="control-group">
      <label>Detune</label>
      <input type="range" id="detuneRange" min="0" max="50" value="15">
    </div>
    
    <div class="control-group">
      <label>Filter Freq</label>
      <input type="range" id="filterFreq" min="200" max="20000" value="20000" step="100">
    </div>
    
    <div class="control-group">
      <label>Filter Reso</label>
      <input type="range" id="filterReso" min="0.5" max="20" value="1" step="0.5">
    </div>
    
    <div class="control-group">
      <label>Wah Rate</label>
      <input type="range" id="autoWahRate" min="0.1" max="5" value="1" step="0.1">
    </div>
    
    <div class="control-group">
      <label>Wah Depth</label>
      <input type="range" id="autoWahDepth" min="100" max="1500" value="800">
    </div>
    
    <div class="rhythm-panel">
      <div class="rhythm-title">DYNAMIC RHYTHM</div>
      <div class="control-group">
        <label>Speed</label>
        <input type="range" id="rhythmSpeed" min="30" max="2000" value="120">
      </div>
      <div class="control-group">
        <label>Intensity</label>
        <input type="range" id="rhythmIntensity" min="0" max="100" value="50">
      </div>
      <div class="rhythm-buttons">
        <button id="startRhythmBtn">Start Rhythm</button>
        <button id="stopRhythmBtn" disabled>Stop Rhythm</button>
      </div>
    </div>
    
    <div class="kick-panel">
      <div class="kick-title">KICK CONTROL</div>
      <div class="kick-controls">
        <div class="control-group">
          <label>Volume</label>
          <input type="range" id="kickVolume" min="0" max="100" value="80">
        </div>
        <div class="control-group">
          <label>Pattern</label>
          <select id="kickPattern">
            <option value="4/4">4/4</option>
            <option value="2/4">2/4</option>
            <option value="breakbeat">Breakbeat</option>
            <option value="offbeat">Offbeat</option>
            <option value="techno">Techno</option>
          </select>
        </div>
        <div class="control-group">
          <label>Punch</label>
          <input type="range" id="kickPunch" min="0" max="100" value="60">
        </div>
        <div class="control-group">
          <label>Bass Layer</label>
          <input type="range" id="kickBass" min="0" max="100" value="100">
        </div>
        <div class="control-group">
          <label>Distortion</label>
          <input type="range" id="kickDistortion" min="0" max="100" value="40">
        </div>
        <div class="control-group">
          <label>Freq Sweep</label>
          <input type="range" id="kickSweep" min="0" max="100" value="100">
        </div>
      </div>
    </div>
    
    <div class="effect-group">
      <div class="effect-group-title">EFFECTS</div>
      <button id="toggleDist">Distortion</button>
      <button id="toggleAutoWah">Auto Wah</button>
      <button id="toggleFlanger">Flanger</button>
      <button id="toggleChorus">Chorus</button>
      <button id="toggleTremolo">Tremolo</button>
      <button id="toggleFilter">Filter</button>
      <button id="toggleDelay">Delay</button>
      <button id="toggleReverb">Reverb</button>
    </div>
    
    <div class="animation-panel">
      <div class="animation-title">VISUAL ANIMATIONS</div>
      <div class="control-group">
        <select id="animationSelect">
          <option value="none">None</option>
          <option value="psychedelic">Psychedelic</option>
          <option value="cosmicDust">Cosmic Dust</option>
          <option value="network" selected>Network</option>
          <option value="metaballs">Metaballs</option>
          <option value="oscilloscope">Oscilloscope</option>
          <option value="equalizer">Equalizer</option>
          <option value="circularWave">Circular Wave</option>
          <option value="kaleidoscope">Kaleidoscope</option>
          <option value="spiral">Spiral</option>
          <option value="matrix">Matrix</option>
        </select>
      </div>
      <div class="animation-controls">
        <div class="control-group">
          <label>Animation Speed</label>
          <input type="range" id="animSpeed" min="0.1" max="3" value="1" step="0.1">
        </div>
        <div class="control-group">
          <label>Intensity</label>
          <input type="range" id="animIntensity" min="0.1" max="2" value="1" step="0.1">
        </div>
      </div>
    </div>
  </div>
</div>

<div id="statusMessage"></div>

<div id="permissionModal" class="modal">
  <div class="modal-content">
    <h3>Motion Access Required</h3>
    <p>This feature needs access to your device's motion sensors for tilt control.</p>
    <div class="modal-buttons">
      <button id="permissionAllow">Allow</button>
      <button id="permissionDeny">Deny</button>
    </div>
  </div>
</div>

<script>
// ==================== PROFESYONEL AUDIO ENGINE ====================
class ProSynthEngine {
  constructor() {
    this.audioCtx = null;
    this.isPlaying = false;
    this.lowPowerMode = false;
    this.performanceMonitor = new PerformanceMonitor();
    
    // State management
    this.state = {
      baseFreq: 261.63,
      octaveOffset: 0,
      tiltBend: 0,
      detuneAmount: 15,
      waveType: "sawtooth",
      motionEnabled: false,
      panEnabled: false,
      NUM_OSC: 4, // Reduced for performance
      pulseWidth: 0.5,
      rhythmActive: false,
      rhythmSpeed: 120,
      rhythmIntensity: 50,
      currentAnimation: "network",
      animationSpeed: 1,
      animationIntensity: 1,
      kickSettings: {
        volume: 80, pattern: '4/4', punch: 60,
        bass: 100, distortion: 40, sweep: 100
      }
    };
    
    this.effects = {
      dist: false, autoWah: false, flanger: false,
      chorus: false, tremolo: false, filter: true,
      delay: false, reverb: false
    };
    
    // Audio nodes
    this.nodes = {};
    this.oscillators = [];
    this.precomputedCurves = this.precomputeDistortionCurves();
    
    // Timing
    this.rhythmInterval = null;
    this.lastTouchTime = 0;
    this.lastOrientationTime = 0;
    this.touchThrottle = 16; // 60Hz
    this.motionThrottle = 33; // 30Hz
    
    // Visual
    this.animationFrameId = null;
    this.animationHue = 0;
    this.touchPoint = {x: 0, y: 0};
  }

  // ==================== AUDIO CONTEXT MANAGEMENT ====================
  initializeAudioContext() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.audioCtx = new AudioContext({
        latencyHint: 'interactive'
      });
      
      // iOS audio unlock
      this.unlockAudioForIOS();
      return true;
    } catch (error) {
      console.error('AudioContext initialization failed:', error);
      return false;
    }
  }

  unlockAudioForIOS() {
    const unlock = () => {
      if (this.audioCtx && this.audioCtx.state === 'suspended') {
        const oscillator = this.audioCtx.createOscillator();
        const gainNode = this.audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(this.audioCtx.destination);
        gainNode.gain.value = 0.001;
        oscillator.start();
        oscillator.stop(this.audioCtx.currentTime + 0.001);
        
        this.audioCtx.resume().then(() => {
          console.log('AudioContext unlocked for iOS');
        });
      }
    };
    
    document.addEventListener('touchstart', unlock, { once: true });
    document.addEventListener('touchend', unlock, { once: true });
  }

  // ==================== STATIC AUDIO GRAPH ====================
  createStaticAudioGraph() {
    if (!this.audioCtx) return;
    
    // Cleanup existing nodes
    this.cleanupAudioNodes();
    
    // Create master chain with proper gain staging
    this.nodes.masterGain = this.audioCtx.createGain();
    this.nodes.masterGain.gain.value = 0.15; // -12dB
    
    // Create all effect nodes (always connected, controlled via gain)
    this.createEffectNodes();
    this.createKickNodes();
    this.createOscillators();
    
    // Connect static audio graph
    this.connectStaticGraph();
    
    console.log('Static audio graph created');
  }

  createEffectNodes() {
    // Distortion with precomputed curves
    this.nodes.distortion = this.audioCtx.createWaveShaper();
    this.nodes.distortion.curve = this.precomputedCurves.medium;
    this.nodes.distortionBypass = this.audioCtx.createGain();
    this.nodes.distortionBypass.gain.value = 0;
    
    // Auto Wah
    this.nodes.autoWah = this.audioCtx.createBiquadFilter();
    this.nodes.autoWah.type = "bandpass";
    this.nodes.autoWah.frequency.value = 800;
    this.nodes.autoWah.Q.value = 5;
    this.nodes.autoWahBypass = this.audioCtx.createGain();
    this.nodes.autoWahBypass.gain.value = 0;
    
    this.nodes.autoWahLFO = this.audioCtx.createOscillator();
    this.nodes.autoWahLFO.frequency.value = 1;
    this.nodes.autoWahGain = this.audioCtx.createGain();
    this.nodes.autoWahGain.gain.value = 600;
    this.nodes.autoWahLFO.connect(this.nodes.autoWahGain);
    this.nodes.autoWahGain.connect(this.nodes.autoWah.frequency);
    this.nodes.autoWahLFO.start();
    
    // Flanger
    this.nodes.flangerDelay = this.audioCtx.createDelay(0.02);
    this.nodes.flangerDelay.delayTime.value = 0.005;
    this.nodes.flangerBypass = this.audioCtx.createGain();
    this.nodes.flangerBypass.gain.value = 0;
    
    this.nodes.flangerLFO = this.audioCtx.createOscillator();
    this.nodes.flangerLFO.frequency.value = 0.2;
    this.nodes.flangerGain = this.audioCtx.createGain();
    this.nodes.flangerGain.gain.value = 0.005;
    this.nodes.flangerFeedback = this.audioCtx.createGain();
    this.nodes.flangerFeedback.gain.value = 0.5;
    this.nodes.flangerLFO.connect(this.nodes.flangerGain);
    this.nodes.flangerGain.connect(this.nodes.flangerDelay.delayTime);
    this.nodes.flangerLFO.start();
    
    // Chorus
    this.nodes.chorusDelay = this.audioCtx.createDelay(0.05);
    this.nodes.chorusDelay.delayTime.value = 0.025;
    this.nodes.chorusBypass = this.audioCtx.createGain();
    this.nodes.chorusBypass.gain.value = 0;
    
    this.nodes.chorusLFO = this.audioCtx.createOscillator();
    this.nodes.chorusLFO.frequency.value = 0.5;
    this.nodes.chorusGain = this.audioCtx.createGain();
    this.nodes.chorusGain.gain.value = 0.01;
    this.nodes.chorusLFO.connect(this.nodes.chorusGain);
    this.nodes.chorusGain.connect(this.nodes.chorusDelay.delayTime);
    this.nodes.chorusLFO.start();
    
    // Tremolo
    this.nodes.tremoloLFO = this.audioCtx.createOscillator();
    this.nodes.tremoloLFO.frequency.value = 5;
    this.nodes.tremoloGain = this.audioCtx.createGain();
    this.nodes.tremoloGain.gain.value = 0;
    this.nodes.tremoloLFO.connect(this.nodes.tremoloGain);
    this.nodes.tremoloLFO.start();
    
    // Filter (always on)
    this.nodes.filter = this.audioCtx.createBiquadFilter();
    this.nodes.filter.type = "lowpass";
    this.nodes.filter.frequency.value = 20000;
    this.nodes.filter.Q.value = 1;
    
    // Delay
    this.nodes.delay = this.audioCtx.createDelay(2);
    this.nodes.delay.delayTime.value = 0.3;
    this.nodes.delayBypass = this.audioCtx.createGain();
    this.nodes.delayBypass.gain.value = 0;
    
    this.nodes.delayFeedback = this.audioCtx.createGain();
    this.nodes.delayFeedback.gain.value = 0.5;
    
    // Reverb
    this.nodes.reverb = this.audioCtx.createConvolver();
    this.nodes.reverbBypass = this.audioCtx.createGain();
    this.nodes.reverbBypass.gain.value = 0;
    
    const buffer = this.audioCtx.createBuffer(2, this.audioCtx.sampleRate * 1.5, this.audioCtx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buffer.getChannelData(c);
      for (let i = 0; i < buffer.length; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / buffer.length, 2);
      }
    }
    this.nodes.reverb.buffer = buffer;
    
    // Panner
    this.nodes.panner = this.audioCtx.createStereoPanner();
    this.nodes.panner.pan.value = 0;
    
    // Safety limiter
    this.nodes.limiter = this.audioCtx.createDynamicsCompressor();
    this.nodes.limiter.threshold.value = -1;
    this.nodes.limiter.knee.value = 0;
    this.nodes.limiter.ratio.value = 20;
    this.nodes.limiter.attack.value = 0.003;
    this.nodes.limiter.release.value = 0.05;
  }

  createKickNodes() {
    this.kickOsc = this.audioCtx.createOscillator();
    this.kickGain = this.audioCtx.createGain();
    this.kickGain.gain.value = 0;
    
    this.kickOsc2 = this.audioCtx.createOscillator();
    this.kickGain2 = this.audioCtx.createGain();
    this.kickGain2.gain.value = 0;
    
    this.kickDistortion = this.audioCtx.createWaveShaper();
    this.kickDistortion.curve = this.precomputedCurves.soft;
    this.kickDistortion.oversample = '4x';
    
    this.kickOsc.connect(this.kickGain);
    this.kickOsc2.connect(this.kickGain2);
    this.kickGain.connect(this.kickDistortion);
    this.kickGain2.connect(this.kickDistortion);
    this.kickDistortion.connect(this.audioCtx.destination);
    
    this.kickOsc.start();
    this.kickOsc2.start();
  }

  createOscillators() {
    this.cleanupOscillators();
    const now = this.audioCtx.currentTime;
    
    for (let i = 0; i < this.state.NUM_OSC; i++) {
      let osc;
      
      if (this.state.waveType === 'fm') {
        osc = this.audioCtx.createOscillator();
        osc.type = 'sine';
        const modulator = this.audioCtx.createOscillator();
        modulator.type = 'sine';
        modulator.frequency.value = this.state.baseFreq * 2;
        const modGain = this.audioCtx.createGain();
        modGain.gain.value = 100;
        modulator.connect(modGain);
        modGain.connect(osc.frequency);
        modulator.start(now);
      } else if (this.state.waveType === 'pulse') {
        osc = this.audioCtx.createOscillator();
        osc.type = 'square';
      } else {
        osc = this.audioCtx.createOscillator();
        osc.type = this.state.waveType;
      }
      
      // Apply detune with smoothing
      osc.detune.value = (i - Math.floor(this.state.NUM_OSC / 2)) * this.state.detuneAmount;
      
      if (this.state.waveType === 'pulse') {
        const pulseWidth = this.audioCtx.createWaveShaper();
        const pulseCurve = new Float32Array(256);
        for (let j = 0; j < 256; j++) {
          pulseCurve[j] = j < 128 * this.state.pulseWidth ? -1 : 1;
        }
        pulseWidth.curve = pulseCurve;
        osc.connect(pulseWidth);
        pulseWidth.connect(this.nodes.masterGain);
      } else {
        osc.connect(this.nodes.masterGain);
      }
      
      osc.start(now);
      this.oscillators.push(osc);
    }
  }

  connectStaticGraph() {
    // Main signal chain with bypass controls
    this.nodes.masterGain.connect(this.nodes.distortionBypass);
    this.nodes.distortionBypass.connect(this.nodes.distortion);
    this.nodes.distortion.connect(this.nodes.autoWahBypass);
    this.nodes.autoWahBypass.connect(this.nodes.autoWah);
    this.nodes.autoWah.connect(this.nodes.flangerBypass);
    this.nodes.flangerBypass.connect(this.nodes.flangerDelay);
    this.nodes.flangerDelay.connect(this.nodes.chorusBypass);
    this.nodes.chorusBypass.connect(this.nodes.chorusDelay);
    this.nodes.chorusDelay.connect(this.nodes.filter);
    this.nodes.filter.connect(this.nodes.delayBypass);
    this.nodes.delayBypass.connect(this.nodes.delay);
    this.nodes.delay.connect(this.nodes.reverbBypass);
    this.nodes.reverbBypass.connect(this.nodes.reverb);
    this.nodes.reverb.connect(this.nodes.panner);
    this.nodes.panner.connect(this.nodes.limiter);
    this.nodes.limiter.connect(this.audioCtx.destination);
    
    // Effect feedback loops (static)
    this.nodes.flangerDelay.connect(this.nodes.flangerFeedback);
    this.nodes.flangerFeedback.connect(this.nodes.flangerDelay);
    
    this.nodes.delay.connect(this.nodes.delayFeedback);
    this.nodes.delayFeedback.connect(this.nodes.delay);
    
    // Tremolo modulation (static connection)
    this.nodes.tremoloGain.connect(this.nodes.masterGain.gain);
  }

  // ==================== EFFECT BYPASS CONTROL ====================
  updateEffectBypasses() {
    const now = this.audioCtx.currentTime;
    
    // Smooth bypass transitions (20ms)
    this.nodes.distortionBypass.gain.setTargetAtTime(
      this.effects.dist ? 1 : 0, now, 0.02
    );
    this.nodes.autoWahBypass.gain.setTargetAtTime(
      this.effects.autoWah ? 1 : 0, now, 0.02
    );
    this.nodes.flangerBypass.gain.setTargetAtTime(
      this.effects.flanger ? 1 : 0, now, 0.02
    );
    this.nodes.chorusBypass.gain.setTargetAtTime(
      this.effects.chorus ? 1 : 0, now, 0.02
    );
    this.nodes.delayBypass.gain.setTargetAtTime(
      this.effects.delay ? 1 : 0, now, 0.02
    );
    this.nodes.reverbBypass.gain.setTargetAtTime(
      this.effects.reverb ? 1 : 0, now, 0.02
    );
    
    // Tremolo depth
    this.nodes.tremoloGain.gain.setTargetAtTime(
      this.effects.tremolo ? 0.3 : 0, now, 0.02
    );
  }

  // ==================== PERFORMANCE OPTIMIZATIONS ====================
  precomputeDistortionCurves() {
    const curves = {};
    const types = {
      soft: 20,
      medium: 50,
      hard: 100,
      extreme: 200
    };
    
    Object.entries(types).forEach(([name, amount]) => {
      const n = 44100;
      const curve = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const x = (i - n / 2) / (n / 2);
        curve[i] = (3 + amount) * Math.tanh(x * 5) / (Math.PI + amount * Math.abs(x));
      }
      curves[name] = curve;
    });
    
    return curves;
  }

  applySmoothParamChange(param, targetValue, rampTime = 0.02) {
    if (!this.audioCtx) return;
    const now = this.audioCtx.currentTime;
    param.cancelScheduledValues(now);
    param.linearRampToValueAtTime(targetValue, now + rampTime);
  }

  // ==================== CLEANUP ====================
  cleanupAudioNodes() {
    // Disconnect all nodes
    Object.values(this.nodes).forEach(node => {
      if (node && node.disconnect) {
        node.disconnect();
      }
    });
    this.nodes = {};
  }

  cleanupOscillators() {
    this.oscillators.forEach(osc => {
      try {
        osc.stop();
        osc.disconnect();
      } catch (e) {}
    });
    this.oscillators = [];
  }

  // ==================== PUBLIC API ====================
  start() {
    if (this.isPlaying) return false;
    
    if (!this.audioCtx) {
      if (!this.initializeAudioContext()) {
        return false;
      }
    }
    
    this.createStaticAudioGraph();
    this.isPlaying = true;
    this.startPerformanceMonitoring();
    return true;
  }

  stop() {
    if (!this.isPlaying) return;
    
    this.stopRhythm();
    this.stopPerformanceMonitoring();
    this.cleanupOscillators();
    this.cleanupAudioNodes();
    
    if (this.audioCtx) {
      this.audioCtx.close().then(() => {
        this.audioCtx = null;
        this.isPlaying = false;
      }).catch(console.error);
    }
  }

  setFrequency(freq) {
    if (!this.isPlaying || !this.oscillators.length) return;
    
    this.state.baseFreq = freq;
    const now = this.audioCtx.currentTime;
    
    this.oscillators.forEach((osc, i) => {
      if (osc.frequency) {
        // Smooth frequency changes to prevent clicks
        osc.frequency.cancelScheduledValues(now);
        osc.frequency.linearRampToValueAtTime(freq, now + 0.01);
      }
    });
  }

  setVolume(volume) {
    if (!this.isPlaying || !this.nodes.masterGain) return;
    this.applySmoothParamChange(this.nodes.masterGain.gain, volume * 0.15);
  }

  setPan(pan) {
    if (!this.isPlaying || !this.nodes.panner) return;
    this.applySmoothParamChange(this.nodes.panner.pan, pan);
  }

  startPerformanceMonitoring() {
    this.performanceMonitor.start();
  }

  stopPerformanceMonitoring() {
    this.performanceMonitor.stop();
  }
}

// ==================== PERFORMANCE MONITOR ====================
class PerformanceMonitor {
  constructor() {
    this.cpuUsage = 0;
    this.frameTime = 0;
    this.monitoring = false;
    this.lastTime = performance.now();
    this.frameCount = 0;
    this.animationId = null;
  }

  start() {
    this.monitoring = true;
    this.lastTime = performance.now();
    this.frameCount = 0;
    this.update();
  }

  stop() {
    this.monitoring = false;
    if (this.animationId) {
      cancelAnimationFrame(this.animationId);
    }
  }

  update() {
    if (!this.monitoring) return;
    
    const now = performance.now();
    this.frameCount++;
    
    if (now - this.lastTime >= 1000) {
      this.cpuUsage = Math.min(100, Math.round(this.frameCount * 16.67));
      this.frameCount = 0;
      this.lastTime = now;
      
      // Update performance indicator
      const indicator = document.getElementById('perfIndicator');
      if (indicator) {
        indicator.textContent = `CPU: ${this.cpuUsage}%`;
        indicator.style.background = this.cpuUsage > 80 ? 'rgba(255,50,50,0.8)' : 'var(--control-bg)';
      }
    }
    
    this.animationId = requestAnimationFrame(() => this.update());
  }
}

// ==================== MAIN APPLICATION ====================
const synthEngine = new ProSynthEngine();

// UI Elements
const elements = {
  pad: document.getElementById("pad"),
  noteDisplay: document.getElementById("noteDisplay"),
  motionDisplay: document.getElementById("motionDisplay"),
  wahDisplay: document.getElementById("wahDisplay"),
  panDisplay: document.getElementById("panDisplay"),
  startBtn: document.getElementById("startBtn"),
  stopBtn: document.getElementById("stopBtn"),
  motionBtn: document.getElementById("motionBtn"),
  panBtn: document.getElementById("panBtn"),
  statusMessage: document.getElementById("statusMessage"),
  permissionModal: document.getElementById("permissionModal"),
  controls: document.getElementById("controls"),
  toggleControls: document.getElementById("toggleControls"),
  noteRuler: document.getElementById("noteRuler"),
  startRhythmBtn: document.getElementById("startRhythmBtn"),
  stopRhythmBtn: document.getElementById("stopRhythmBtn"),
  waveCanvas: document.getElementById("waveAnimation"),
  perfIndicator: document.getElementById("perfIndicator")
};

// Constants
const noteColors = [
  [255,100,100], [255,150,80], [255,220,80], [220,255,80],
  [120,255,100], [80,255,180], [80,220,255], [100,150,255],
  [150,100,255], [220,80,255], [255,80,220], [255,80,120]
];

const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const patternMap = {
  '4/4': [1,1,1,1,1,1,1,1],
  '2/4': [1,0,1,0,1,0,1,0],
  'breakbeat': [1,0,1,0,1,0,0,1],
  'offbeat': [0,1,0,1,0,1,0,1],
  'techno': [1,0,0,1,1,0,0,1]
};

// ==================== UI FUNCTIONS ====================
function showStatus(msg, duration = 800) {
  elements.statusMessage.textContent = msg;
  elements.statusMessage.classList.add('show');
  setTimeout(() => elements.statusMessage.classList.remove('show'), duration);
}

function updateButtonStates() {
  elements.startBtn.disabled = synthEngine.isPlaying;
  elements.stopBtn.disabled = !synthEngine.isPlaying;
}

function updateThemeColor(color) {
  document.documentElement.style.setProperty('--r', color[0]);
  document.documentElement.style.setProperty('--g', color[1]);
  document.documentElement.style.setProperty('--b', color[2]);
  
  const r = color[0]/255, g = color[1]/255, b = color[2]/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max + min)/2;
  
  if (max === min) {
    h = s = 0;
  } else {
    const d = max - min;
    s = l > 0.5 ? d/(2 - max - min) : d/(max + min);
    switch(max) {
      case r: h = ((g - b)/d + (g < b ? 6 : 0))/6; break;
      case g: h = ((b - r)/d + 2)/6; break;
      case b: h = ((r - g)/d + 4)/6; break;
    }
  }
  synthEngine.animationHue = Math.round(h * 360);
}

function freqToNote(freq) {
  const A4 = 440;
  const semitonesFromA4 = 12 * Math.log2(freq/A4);
  const noteIndex = Math.round(semitonesFromA4 + 9) % 12;
  const octave = Math.floor((semitonesFromA4 + 9)/12);
  const noteName = noteNames[(noteIndex + 12) % 12];
  return {name: noteName, octave: octave, fullName: `${noteName}${octave}`};
}

function noteFromPad(y) {
  const padHeight = window.innerHeight;
  const ratio = 1 - (y/padHeight);
  const baseFreq = 65.41 * Math.pow(2, synthEngine.state.octaveOffset);
  return baseFreq * Math.pow(2, (ratio * 24)/12);
}

function createNoteRuler() {
  const notes = ['C6','B5','A#5','A5','G#5','G5','F#5','F5','E5','D#5','D5','C#5','C5','B4','A#4','A4','G#4','G4','F#4','F4','E4','D#4','D4','C#4','C4'];
  elements.noteRuler.innerHTML = '';
  notes.forEach(note => {
    const div = document.createElement('div');
    div.className = 'ruler-note';
    div.textContent = note;
    elements.noteRuler.appendChild(div);
  });
}

// ==================== TOUCH HANDLING ====================
function handleTouch(e) {
  const now = performance.now();
  if (now - synthEngine.lastTouchTime < synthEngine.touchThrottle) return;
  synthEngine.lastTouchTime = now;
  
  if (!synthEngine.isPlaying) {
    showStatus('Start synth first');
    return;
  }
  
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  
  // Update touch feedback
  const touchFeedback = document.getElementById('touchFeedback');
  touchFeedback.style.left = clientX + 'px';
  touchFeedback.style.top = clientY + 'px';
  touchFeedback.style.width = '80px';
  touchFeedback.style.height = '80px';
  touchFeedback.style.opacity = '1';
  
  setTimeout(() => {
    touchFeedback.style.opacity = '0';
    touchFeedback.style.width = '0px';
    touchFeedback.style.height = '0px';
  }, 200);
  
  // Calculate frequency and volume
  const freq = noteFromPad(clientY);
  const volume = clientX / window.innerWidth;
  
  synthEngine.setFrequency(freq);
  synthEngine.setVolume(volume);
  
  // Update display
  const noteInfo = freqToNote(freq);
  elements.noteDisplay.textContent = noteInfo.fullName;
  const colorIndex = noteNames.indexOf(noteInfo.name);
  if (colorIndex !== -1) updateThemeColor(noteColors[colorIndex]);
}

// ==================== MOTION CONTROL ====================
function requestMotionPermission() {
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    elements.permissionModal.style.display = 'flex';
  } else {
    startMotionControl();
  }
}

function startMotionControl() {
  window.addEventListener("deviceorientation", handleOrientation);
  synthEngine.state.motionEnabled = true;
  elements.motionBtn.textContent = "Motion ON";
  elements.motionBtn.classList.add('active');
  elements.motionDisplay.style.display = 'block';
  showStatus('Motion enabled - Tilt device for pitch!');
}

function disableMotion() {
  window.removeEventListener("deviceorientation", handleOrientation);
  synthEngine.state.motionEnabled = false;
  synthEngine.state.tiltBend = 0;
  elements.motionBtn.textContent = "Motion OFF";
  elements.motionBtn.classList.remove('active');
  elements.motionDisplay.style.display = 'none';
  showStatus('Motion disabled');
}

function handleOrientation(e) {
  const now = performance.now();
  if (now - synthEngine.lastOrientationTime < synthEngine.motionThrottle) return;
  synthEngine.lastOrientationTime = now;
  
  if (e.beta === null) return;
  const tilt = e.beta;
  const pan = e.gamma;
  
  if (synthEngine.state.motionEnabled) {
    synthEngine.state.tiltBend = tilt / 45 * 12;
    const baseFreq = 65.41 * Math.pow(2, synthEngine.state.octaveOffset);
    const newFreq = baseFreq * Math.pow(2, synthEngine.state.tiltBend/12);
    synthEngine.setFrequency(newFreq);
    
    elements.motionDisplay.textContent = `Tilt:${Math.round(synthEngine.state.tiltBend*10)/10}st`;
    
    const noteInfo = freqToNote(newFreq);
    elements.noteDisplay.textContent = noteInfo.fullName;
    const colorIndex = noteNames.indexOf(noteInfo.name);
    if (colorIndex !== -1) updateThemeColor(noteColors[colorIndex]);
  }
  
  if (synthEngine.state.panEnabled && pan !== null) {
    const panValue = Math.max(-1, Math.min(1, pan/90));
    synthEngine.setPan(panValue);
    elements.panDisplay.textContent = `Pan:${Math.round(panValue*100)}%`;
  }
}

function togglePan() {
  synthEngine.state.panEnabled = !synthEngine.state.panEnabled;
  elements.panBtn.textContent = synthEngine.state.panEnabled ? "Pan ON" : "Pan OFF";
  elements.panBtn.classList.toggle('active', synthEngine.state.panEnabled);
  elements.panDisplay.style.display = synthEngine.state.panEnabled ? 'block' : 'none';
  
  if (!synthEngine.state.panEnabled) {
    synthEngine.setPan(0);
  }
  showStatus(synthEngine.state.panEnabled ? 'Pan enabled - Tilt device sideways!' : 'Pan disabled');
}

// ==================== RHYTHM SYSTEM ====================
function playKick(beat) {
  if (!synthEngine.isPlaying) return;
  
  const pattern = patternMap[synthEngine.state.kickSettings.pattern];
  if (!pattern[beat % pattern.length]) return;
  
  const now = synthEngine.audioCtx.currentTime;
  const volume = synthEngine.state.kickSettings.volume / 100;
  const punch = synthEngine.state.kickSettings.punch / 100;
  const bass = synthEngine.state.kickSettings.bass / 100;
  const distortion = synthEngine.state.kickSettings.distortion;
  const sweep = synthEngine.state.kickSettings.sweep / 100;
  
  const baseFreq = 80 + 40 * punch;
  const endFreq = 30 + 20 * (1 - sweep);
  const sweepTime = 0.08 + 0.07 * sweep;
  
  // Main kick
  synthEngine.kickOsc.frequency.setValueAtTime(baseFreq, now);
  synthEngine.kickOsc.frequency.exponentialRampToValueAtTime(endFreq, now + sweepTime);
  synthEngine.kickGain.gain.setValueAtTime(volume * 0.8, now);
  synthEngine.kickGain.gain.exponentialRampToValueAtTime(0.001, now + sweepTime + 0.05);
  
  // Bass layer
  if (bass > 0) {
    synthEngine.kickOsc2.frequency.setValueAtTime(60, now);
    synthEngine.kickOsc2.frequency.exponentialRampToValueAtTime(25, now + sweepTime * 1.5);
    synthEngine.kickGain2.gain.setValueAtTime(volume * bass * 0.6, now);
    synthEngine.kickGain2.gain.exponentialRampToValueAtTime(0.001, now + sweepTime * 1.5 + 0.05);
  }
  
  // Distortion
  synthEngine.kickDistortion.curve = synthEngine.precomputedCurves[
    distortion > 70 ? 'hard' : distortion > 40 ? 'medium' : 'soft'
  ];
}

function startRhythm() {
  if (!synthEngine.isPlaying) {
    showStatus('Start synth first');
    return;
  }
  
  stopRhythm();
  synthEngine.state.rhythmActive = true;
  elements.startRhythmBtn.disabled = true;
  elements.stopRhythmBtn.disabled = false;
  
  let beat = 0;
  synthEngine.rhythmInterval = setInterval(() => {
    if (!synthEngine.isPlaying) return;
    
    const intensity = synthEngine.state.rhythmIntensity / 100;
    const baseGain = 0.1 + intensity * 0.3;
    const pattern = [
      baseGain, baseGain * 0.2, baseGain * 0.8, baseGain * 0.1,
      baseGain, baseGain * 0.3, baseGain * 0.7, baseGain * 0.2
    ];
    
    synthEngine.setVolume(pattern[beat % 8]);
    playKick(beat);
    
    // Random color change for visual feedback
    const randomColor = noteColors[Math.floor(Math.random() * noteColors.length)];
    updateThemeColor(randomColor);
    
    beat++;
  }, 60000 / synthEngine.state.rhythmSpeed);
  
  showStatus('Rhythm Started');
}

function stopRhythm() {
  synthEngine.state.rhythmActive = false;
  elements.startRhythmBtn.disabled = false;
  elements.stopRhythmBtn.disabled = true;
  
  if (synthEngine.rhythmInterval) {
    clearInterval(synthEngine.rhythmInterval);
    synthEngine.rhythmInterval = null;
  }
  showStatus('Rhythm Stopped');
}

// ==================== ANIMATIONS ====================
const animations = {
  none: {
    init() {},
    draw(ctx, time) {
      ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    }
  },
  
  psychedelic: {
    init() {},
    draw(ctx, time) {
      const w = ctx.canvas.width, h = ctx.canvas.height;
      ctx.fillStyle = 'rgba(0,0,0,0.1)';
      ctx.fillRect(0,0,w,h);
      const centerX = w/2, centerY = h/2;
      for(let i=0;i<5;i++){
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(time*(0.1+i*0.05)*synthEngine.state.animationSpeed);
        const hue = (synthEngine.animationHue+i*30+time*20)%360;
        ctx.strokeStyle = `hsla(${hue},100%,60%,${0.15-i*0.02})`;
        ctx.lineWidth = 2-i*0.3;
        ctx.beginPath();
        for(let j=0;j<6;j++){
          const angle = (j/6)*Math.PI*2;
          const radius = 100+Math.sin(time*2+i)*50*synthEngine.state.animationIntensity+i*20;
          const x = Math.cos(angle+time)*radius;
          const y = Math.sin(angle+time)*radius;
          if(j===0) ctx.moveTo(x,y);
          else {
            const cpx = Math.cos(angle-0.5+time)*(radius*1.5);
            const cpy = Math.sin(angle-0.5+time)*(radius*1.5);
            ctx.quadraticCurveTo(cpx, cpy, x, y);
          }
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }
    }
  },
  
  cosmicDust: {
    particles: [],
    init() {
      this.particles = [];
      for(let i=0;i<150;i++) this.particles.push({
        x: Math.random()*elements.waveCanvas.width,
        y: Math.random()*elements.waveCanvas.height,
        size: Math.random()*2+0.5,
        sx: (Math.random()*0.5-0.25)*synthEngine.state.animationSpeed,
        sy: (Math.random()*0.5-0.25)*synthEngine.state.animationSpeed
      });
    },
    draw(ctx, time) {
      ctx.fillStyle = 'rgba(0,0,0,0.05)';
      ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
      this.particles.forEach(p => {
        p.x += p.sx; p.y += p.sy;
        if(p.x > ctx.canvas.width) p.x = 0;
        if(p.x < 0) p.x = ctx.canvas.width;
        if(p.y > ctx.canvas.height) p.y = 0;
        if(p.y < 0) p.y = ctx.canvas.height;
        ctx.fillStyle = `hsl(${synthEngine.animationHue},100%,70%)`;
        ctx.shadowBlur = 10*synthEngine.state.animationIntensity;
        ctx.shadowColor = `hsl(${synthEngine.animationHue},100%,70%)`;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
      });
      ctx.shadowBlur = 0;
    }
  },
  
  network: {
    nodes: [],
    init() {
      this.nodes = [];
      for(let i=0;i<60;i++) this.nodes.push({
        x: Math.random()*elements.waveCanvas.width,
        y: Math.random()*elements.waveCanvas.height,
        vx: (Math.random()-0.5)*0.5*synthEngine.state.animationSpeed,
        vy: (Math.random()-0.5)*0.5*synthEngine.state.animationSpeed
      });
    },
    draw(ctx, time) {
      ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);
      this.nodes.forEach(n => {
        n.x += n.vx; n.y += n.vy;
        if(n.x < 0 || n.x > ctx.canvas.width) n.vx = -n.vx;
        if(n.y < 0 || n.y > ctx.canvas.height) n.vy = -n.vy;
      });
      
      for(let i=0;i<this.nodes.length;i++) {
        for(let j=i+1;j<this.nodes.length;j++) {
          const dx = this.nodes[i].x-this.nodes[j].x, dy = this.nodes[i].y-this.nodes[j].y;
          const dist = Math.sqrt(dx*dx+dy*dy);
          if(dist < 150) {
            const opacity = (1-(dist/150))*synthEngine.state.animationIntensity;
            ctx.strokeStyle = `hsla(${synthEngine.animationHue},100%,60%,${opacity*0.5})`;
            ctx.beginPath();
            ctx.moveTo(this.nodes[i].x,this.nodes[i].y);
            ctx.lineTo(this.nodes[j].x,this.nodes[j].y);
            ctx.stroke();
          }
        }
      }
      
      this.nodes.forEach(n => {
        ctx.fillStyle = `hsla(${synthEngine.animationHue},100%,80%,0.8)`;
        ctx.beginPath();
        ctx.arc(n.x,n.y,2,0,Math.PI*2);
        ctx.fill();
      });
    }
  },
  
  metaballs: {
    balls: [],
    init() {
      this.balls = [];
      for(let i=0;i<6;i++) this.balls.push({
        x: Math.random()*elements.waveCanvas.width,
        y: Math.random()*elements.waveCanvas.height,
        vx: (Math.random()-0.5)*2*synthEngine.state.animationSpeed,
        vy: (Math.random()-0.5)*2*synthEngine.state.animationSpeed,
        r: Math.random()*50+30
      });
    },
    draw(ctx, time) {
      ctx.fillStyle = 'rgba(0,0,0,0.1)';
      ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
      ctx.globalCompositeOperation = 'lighter';
      this.balls.forEach(b => {
        b.x += b.vx; b.y += b.vy;
        if(b.x+b.r > ctx.canvas.width || b.x-b.r < 0) b.vx = -b.vx;
        if(b.y+b.r > ctx.canvas.height || b.y-b.r < 0) b.vy = -b.vy;
        const gradient = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
        gradient.addColorStop(0, `hsla(${synthEngine.animationHue},100%,70%,0.8)`);
        gradient.addColorStop(1, `hsla(${synthEngine.animationHue},100%,50%,0)`);
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
        ctx.fill();
      });
      ctx.globalCompositeOperation = 'source-over';
    }
  },
  
  oscilloscope: {
    init() {},
    draw(ctx, time) {
      ctx.fillStyle = 'rgba(10,10,10,0.1)';
      ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
      ctx.strokeStyle = `hsl(${synthEngine.animationHue},100%,60%)`;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 10*synthEngine.state.animationIntensity;
      ctx.shadowColor = `hsl(${synthEngine.animationHue},100%,60%)`;
      ctx.beginPath();
      for(let i=0;i<ctx.canvas.width;i++) {
        const y = ctx.canvas.height/2 + Math.sin(i*0.01+time*synthEngine.state.animationSpeed)*ctx.canvas.height/4*Math.sin(time*0.5*synthEngine.state.animationSpeed);
        i===0 ? ctx.moveTo(i,y) : ctx.lineTo(i,y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  },
  
  equalizer: {
    bars: [],
    init() {
      this.bars = new Array(32).fill(0);
    },
    draw(ctx, time) {
      ctx.fillStyle = 'rgba(17,17,17,0.2)';
      ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
      const barW = ctx.canvas.width/32;
      for(let i=0;i<32;i++) {
        const barH = Math.abs(Math.sin(i*0.2+time*synthEngine.state.animationSpeed)*ctx.canvas.height*0.5*synthEngine.state.animationIntensity)+20;
        const hue = (i/32*360+synthEngine.animationHue)%360;
        ctx.fillStyle = `hsl(${hue},100%,60%)`;
        ctx.fillRect(i*barW, ctx.canvas.height-barH, barW-2, barH);
      }
    }
  },
  
  circularWave: {
    init() {},
    draw(ctx, time) {
      ctx.fillStyle = 'rgba(10,10,10,0.1)';
      ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
      const centerX = ctx.canvas.width/2, centerY = ctx.canvas.height/2, r = ctx.canvas.height*0.4;
      ctx.strokeStyle = `hsl(${synthEngine.animationHue},100%,60%)`;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 15*synthEngine.state.animationIntensity;
      ctx.shadowColor = `hsl(${synthEngine.animationHue},100%,60%)`;
      ctx.beginPath();
      for(let i=0;i<360;i++) {
        const angle = i*Math.PI/180;
        const waveOffset = Math.sin(i*0.1+time*2*synthEngine.state.animationSpeed)*30*synthEngine.state.animationIntensity;
        const rr = r+waveOffset;
        const x = centerX+Math.cos(angle)*rr;
        const y = centerY+Math.sin(angle)*rr;
        i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }
};

function startWaveAnimation() {
  const canvas = elements.waveCanvas;
  const ctx = canvas.getContext('2d');
  
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const currentAnimation = animations[synthEngine.state.currentAnimation];
    if (currentAnimation && currentAnimation.init) {
      currentAnimation.init();
    }
  }
  
  resize();
  window.addEventListener('resize', resize);
  
  function animate() {
    if (!synthEngine.isPlaying) return;
    synthEngine.animationFrameId = requestAnimationFrame(animate);
    const time = Date.now() * 0.001;
    const currentAnimation = animations[synthEngine.state.currentAnimation];
    if (currentAnimation && currentAnimation.draw) {
      currentAnimation.draw(ctx, time);
    }
  }
  
  animate();
}

function stopWaveAnimation() {
  if (synthEngine.animationFrameId) {
    cancelAnimationFrame(synthEngine.animationFrameId);
    synthEngine.animationFrameId = null;
  }
  const ctx = elements.waveCanvas.getContext('2d');
  ctx.clearRect(0, 0, elements.waveCanvas.width, elements.waveCanvas.height);
}

// ==================== EVENT LISTENERS ====================
function initializeEventListeners() {
  // Touch and mouse events
  elements.pad.addEventListener("touchstart", handleTouch, {passive: false});
  elements.pad.addEventListener("touchmove", handleTouch, {passive: false});
  elements.pad.addEventListener("mousedown", handleTouch);
  elements.pad.addEventListener("mousemove", e => {
    if (e.buttons === 1) handleTouch(e);
  });
  
  // Control buttons
  elements.startBtn.addEventListener("click", () => {
    if (synthEngine.start()) {
      updateButtonStates();
      startWaveAnimation();
      showStatus('Started - Try effects!');
    } else {
      showStatus('Start failed - Check browser permissions');
    }
  });
  
  elements.stopBtn.addEventListener("click", () => {
    synthEngine.stop();
    updateButtonStates();
    stopWaveAnimation();
    showStatus('Stopped');
  });
  
  elements.motionBtn.addEventListener("click", () => {
    synthEngine.state.motionEnabled ? disableMotion() : requestMotionPermission();
  });
  
  elements.panBtn.addEventListener("click", togglePan);
  elements.toggleControls.addEventListener("click", () => {
    elements.controls.classList.toggle('expanded');
    elements.toggleControls.textContent = elements.controls.classList.contains('expanded') ? '✕' : '⚙️';
  });
  
  // Rhythm controls
  elements.startRhythmBtn.addEventListener("click", startRhythm);
  elements.stopRhythmBtn.addEventListener("click", stopRhythm);
  
  // Kick controls
  document.getElementById("kickVolume").addEventListener("input", e => {
    synthEngine.state.kickSettings.volume = parseInt(e.target.value);
  });
  document.getElementById("kickPattern").addEventListener("change", e => {
    synthEngine.state.kickSettings.pattern = e.target.value;
  });
  document.getElementById("kickPunch").addEventListener("input", e => {
    synthEngine.state.kickSettings.punch = parseInt(e.target.value);
  });
  document.getElementById("kickBass").addEventListener("input", e => {
    synthEngine.state.kickSettings.bass = parseInt(e.target.value);
  });
  document.getElementById("kickDistortion").addEventListener("input", e => {
    synthEngine.state.kickSettings.distortion = parseInt(e.target.value);
  });
  document.getElementById("kickSweep").addEventListener("input", e => {
    synthEngine.state.kickSettings.sweep = parseInt(e.target.value);
  });
  
  // Octave controls
  document.getElementById("octUp").addEventListener("click", () => {
    synthEngine.state.octaveOffset++;
    createNoteRuler();
  });
  document.getElementById("octDown").addEventListener("click", () => {
    synthEngine.state.octaveOffset--;
    createNoteRuler();
  });
  
  // Motion permission
  document.getElementById("permissionAllow").addEventListener("click", () => {
    DeviceOrientationEvent.requestPermission().then(response => {
      elements.permissionModal.style.display = 'none';
      if (response === 'granted') {
        startMotionControl();
      } else {
        showStatus('Motion permission denied');
      }
    }).catch(e => {
      elements.permissionModal.style.display = 'none';
      showStatus('Permission error');
    });
  });
  
  document.getElementById("permissionDeny").addEventListener("click", () => {
    elements.permissionModal.style.display = 'none';
    showStatus('Motion disabled');
  });
  
  // Synth parameters
  document.getElementById("waveSelect").addEventListener("change", e => {
    synthEngine.state.waveType = e.target.value;
    if (synthEngine.isPlaying) {
      synthEngine.createOscillators();
    }
    showStatus('Wave: ' + synthEngine.state.waveType);
  });
  
  document.getElementById("detuneRange").addEventListener("input", e => {
    synthEngine.state.detuneAmount = parseFloat(e.target.value);
    if (synthEngine.isPlaying && synthEngine.oscillators.length > 0) {
      const now = synthEngine.audioCtx.currentTime;
      synthEngine.oscillators.forEach((osc, i) => {
        if (osc.detune) {
          osc.detune.cancelScheduledValues(now);
          osc.detune.linearRampToValueAtTime(
            (i - Math.floor(synthEngine.state.NUM_OSC/2)) * synthEngine.state.detuneAmount,
            now + 0.02
          );
        }
      });
    }
  });
  
  // Effect toggles
  const toggleMap = {
    toggleDist: 'dist', toggleAutoWah: 'autoWah', toggleFlanger: 'flanger',
    toggleChorus: 'chorus', toggleTremolo: 'tremolo', toggleFilter: 'filter',
    toggleDelay: 'delay', toggleReverb: 'reverb'
  };
  
  Object.entries(toggleMap).forEach(([id, effect]) => {
    document.getElementById(id).addEventListener("click", () => {
      synthEngine.effects[effect] = !synthEngine.effects[effect];
      document.getElementById(id).classList.toggle('active', synthEngine.effects[effect]);
      if (synthEngine.isPlaying) {
        synthEngine.updateEffectBypasses();
      }
      
      if (effect === 'autoWah') {
        elements.wahDisplay.style.display = synthEngine.effects[effect] ? 'block' : 'none';
        elements.wahDisplay.textContent = 'Wah:' + (synthEngine.effects[effect] ? 'ON' : 'OFF');
      }
      
      showStatus(effect + ' ' + (synthEngine.effects[effect] ? 'ON' : 'OFF'));
    });
  });
  
  // Filter controls
  document.getElementById("filterFreq").addEventListener("input", e => {
    if (synthEngine.isPlaying && synthEngine.nodes.filter) {
      synthEngine.applySmoothParamChange(
        synthEngine.nodes.filter.frequency,
        parseFloat(e.target.value)
      );
    }
  });
  
  document.getElementById("filterReso").addEventListener("input", e => {
    if (synthEngine.isPlaying && synthEngine.nodes.filter) {
      synthEngine.applySmoothParamChange(
        synthEngine.nodes.filter.Q,
        parseFloat(e.target.value)
      );
    }
  });
  
  // Wah controls
  document.getElementById("autoWahRate").addEventListener("input", e => {
    if (synthEngine.isPlaying && synthEngine.nodes.autoWahLFO) {
      synthEngine.applySmoothParamChange(
        synthEngine.nodes.autoWahLFO.frequency,
        parseFloat(e.target.value)
      );
    }
  });
  
  document.getElementById("autoWahDepth").addEventListener("input", e => {
    if (synthEngine.isPlaying && synthEngine.nodes.autoWahGain) {
      synthEngine.applySmoothParamChange(
        synthEngine.nodes.autoWahGain.gain,
        parseFloat(e.target.value)
      );
    }
  });
  
  // Rhythm controls
  document.getElementById("rhythmSpeed").addEventListener("input", e => {
    synthEngine.state.rhythmSpeed = parseInt(e.target.value);
    if (synthEngine.state.rhythmActive) {
      stopRhythm();
      startRhythm();
    }
  });
  
  document.getElementById("rhythmIntensity").addEventListener("input", e => {
    synthEngine.state.rhythmIntensity = parseInt(e.target.value);
  });
  
  // Animation controls
  document.getElementById("animationSelect").addEventListener("change", e => {
    synthEngine.state.currentAnimation = e.target.value;
    if (synthEngine.isPlaying) {
      stopWaveAnimation();
      startWaveAnimation();
    }
    showStatus(`Animation: ${synthEngine.state.currentAnimation === 'none' ? 'None' : synthEngine.state.currentAnimation}`);
  });
  
  document.getElementById("animSpeed").addEventListener("input", e => {
    synthEngine.state.animationSpeed = parseFloat(e.target.value);
  });
  
  document.getElementById("animIntensity").addEventListener("input", e => {
    synthEngine.state.animationIntensity = parseFloat(e.target.value);
  });
  
  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      synthEngine.state.rhythmActive ? stopRhythm() : startRhythm();
    }
  });
}

// ==================== INITIALIZATION ====================
window.addEventListener('load', () => {
  updateThemeColor([255, 100, 100]);
  initializeEventListeners();
  updateButtonStates();
  createNoteRuler();
  showStatus('Ready - Click Start then try effects! SPACE for rhythm');
});

window.addEventListener("contextmenu", e => e.preventDefault());

// Low power mode detection
if ('hardwareConcurrency' in navigator) {
  if (navigator.hardwareConcurrency <= 4) {
    synthEngine.lowPowerMode = true;
    synthEngine.state.NUM_OSC = 2; // Reduce polyphony on low-end devices
  }
}
</script>
