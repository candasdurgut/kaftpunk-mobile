<div id="app-container"><div id="pad"><div id="noteDisplay">C4</div><div id="motionDisplay">Tilt:0°</div><div id="wahDisplay">Wah:ON</div><div id="panDisplay">Pan:0%</div><div id="noteRuler"></div><canvas id="waveAnimation"></canvas></div><button id="toggleControls">⚙️</button><div id="controls"><button id="startBtn">Start</button><button id="stopBtn" disabled>Stop</button><button id="motionBtn">Motion</button><button id="panBtn">Pan</button><button id="octDown">Oct-</button><button id="octUp">Oct+</button><div class="control-group"><label>Wave</label><select id="waveSelect"><option value="sawtooth">Sawtooth</option><option value="triangle">Triangle</option><option value="square">Square</option><option value="sine">Sine</option></select></div><div class="control-group"><label>Oscillators</label><input type="range" id="oscCount" min="1" max="16" value="4"></div><div class="control-group"><label>Detune</label><input type="range" id="detuneRange" min="0" max="50" value="15"></div><div class="control-group"><label>Filter Freq</label><input type="range" id="filterFreq" min="200" max="20000" value="20000" step="100"></div><div class="control-group"><label>Filter Reso</label><input type="range" id="filterReso" min="0.5" max="20" value="1" step="0.5"></div><div class="rhythm-panel"><div class="rhythm-title">DYNAMIC RHYTHM</div><div class="control-group"><label>Speed (BPM)</label><input type="range" id="rhythmSpeed" min="60" max="200" value="120"></div><div class="rhythm-buttons"><button id="startRhythmBtn">Start Rhythm</button><button id="stopRhythmBtn" disabled>Stop Rhythm</button></div></div><div class="effect-group"><div class="effect-group-title">EFFECTS</div><button id="toggleDist">Distortion</button><button id="toggleFilter">Filter</button><button id="toggleDelay">Delay</button><button id="toggleReverb">Reverb</button><button id="toggleWasmEffect">WASM Effect</button></div><div class="animation-panel"><div class="animation-title">VISUAL ANIMATIONS</div><div class="control-group"><select id="animationSelect"><option value="none">None</option><option value="network" selected>Network</option></select></div></div></div></div><div id="statusMessage"></div><div id="permissionModal" class="modal"><div class="modal-content"><h3>Motion Access Required</h3><p>This feature needs access to your device's motion sensors for tilt control.</p><div class="modal-buttons"><button id="permissionAllow">Allow</button><button id="permissionDeny">Deny</button></div></div></div>
<script>
// ===================================================================
// AUDIO WORKLET PROCESSOR CODE (as strings for Blob URLs)
// ===================================================================

const synthProcessorCode = `
class SynthProcessor extends AudioWorkletProcessor {
    constructor() {
        super();
        this.sampleRate = sampleRate;
        this.oscillators = [];
        this.port.onmessage = (e) => this.handleMessage(e.data);
    }
    handleMessage(params) {
        if (params.type === 'init') {
            const { numOsc, wave, detune } = params;
            this.oscillators = [];
            for (let i = 0; i < numOsc; i++) {
                this.oscillators.push({
                    phase: 0,
                    phaseIncr: 0,
                    detune: (i - Math.floor(numOsc / 2)) * detune,
                });
            }
            this.wave = wave;
        } else if (params.type === 'update') {
            if (params.frequency !== undefined) this.oscillators.forEach(o => o.phaseIncr = (params.frequency * Math.pow(2, o.detune / 1200)) / this.sampleRate);
            if (params.wave !== undefined) this.wave = params.wave;
            if (params.detune !== undefined) this.oscillators.forEach((o, i) => o.detune = (i - Math.floor(this.oscillators.length / 2)) * params.detune);
        }
    }
    process(inputs, outputs, parameters) {
        const output = outputs[0];
        const numChannels = output.length;
        const numSamples = output[0].length;

        for (let sample = 0; sample < numSamples; sample++) {
            let currentSample = 0;
            for (const osc of this.oscillators) {
                let val = 0;
                if (this.wave === 'sine') val = Math.sin(osc.phase * 2 * Math.PI);
                else if (this.wave === 'square') val = Math.sign(Math.sin(osc.phase * 2 * Math.PI));
                else if (this.wave === 'sawtooth') val = 2 * (osc.phase - Math.round(osc.phase));
                else if (this.wave === 'triangle') val = 2 * Math.abs(2 * (osc.phase - Math.round(osc.phase))) - 1;
                currentSample += val / this.oscillators.length;
                osc.phase += osc.phaseIncr;
                if (osc.phase >= 1) osc.phase -= 1;
            }
            for (let channel = 0; channel < numChannels; channel++) {
                output[channel][sample] = currentSample * 0.25;
            }
        }
        return true;
    }
}
registerProcessor('synth-processor', SynthProcessor);
`;

const effectsProcessorCode = `
class EffectsProcessor extends AudioWorkletProcessor {
    constructor() {
        super();
        this.sampleRate = sampleRate;
        const delayBufferSize = Math.floor(this.sampleRate * 2);
        this.delayBufferL = new Float32Array(delayBufferSize);
        this.delayBufferR = new Float32Array(delayBufferSize);
        this.delayReadPos = 0;
        this.delayWritePos = 0;
        const reverbBufferSize = Math.floor(this.sampleRate * 4);
        this.reverbBuffer = new Float32Array(reverbBufferSize);
        this.reverbReadPos = 0;
        this.reverbWritePos = 0;
        this.port.onmessage = (e) => this.handleMessage(e.data);
        this.lfoPhase = 0;
        this.lfoPhaseIncr = 1 / this.sampleRate;
        this.prevL = 0; this.prevR = 0;
    }
    handleMessage(params) {
        Object.assign(this, params);
    }
    process(inputs, outputs, parameters) {
        const input = inputs[0];
        const output = outputs[0];
        const numSamples = input[0].length;

        for (let sample = 0; sample < numSamples; sample++) {
            let dryL = input[0][sample];
            let dryR = input[1] ? input[1][sample] : dryL;
            let wetL = dryL, wetR = dryR;

            if (this.dist) {
                const amount = 50;
                wetL = Math.tanh(wetL * (1 + amount)) / Math.tanh(1 + amount);
                wetR = Math.tanh(wetR * (1 + amount)) / Math.tanh(1 + amount);
            }

            if (this.filter) {
                const freq = this.filterFreq / this.sampleRate;
                const res = this.filterReso;
                const d = (1 - 2 * freq * res) / (1 + 2 * freq * res);
                wetL = d * (wetL - this.prevL) + this.prevL; this.prevL = wetL;
                wetR = d * (wetR - this.prevR) + this.prevR; this.prevR = wetR;
            }

            if (this.delay) {
                wetL += this.delayBufferL[this.delayReadPos] * this.delayFeedback;
                wetR += this.delayBufferR[this.delayReadPos] * this.delayFeedback;
                this.delayBufferL[this.delayWritePos] = wetL;
                this.delayBufferR[this.delayWritePos] = wetR;
                this.delayReadPos = (this.delayReadPos + 1) % this.delayBufferL.length;
                this.delayWritePos = (this.delayWritePos + 1) % this.delayBufferL.length;
            }
            
            if (this.reverb) {
                wetL += this.reverbBuffer[this.reverbReadPos] * 0.5;
                wetR += this.reverbBuffer[(this.reverbReadPos + this.reverbBuffer.length / 2) % this.reverbBuffer.length] * 0.5;
                this.reverbBuffer[this.reverbWritePos] = (wetL + wetR) * 0.5;
                this.reverbWritePos = (this.reverbWritePos + 1) % this.reverbBuffer.length;
                this.reverbReadPos = (this.reverbReadPos + 1) % this.reverbBuffer.length;
            }
            
            if (this.wasmEffect) {
                this.lfoPhase += this.lfoPhaseIncr * 10;
                const modulator = Math.sin(this.lfoPhase * 2 * Math.PI);
                wetL = (wetL * modulator + wetL) * 0.5;
                wetR = (wetR * modulator + wetR) * 0.5;
            }

            output[0][sample] = wetL;
            output[1][sample] = wetR;
        }
        return true;
    }
}
registerProcessor('effects-processor', EffectsProcessor);
`;

const sequencerProcessorCode = `
class SequencerProcessor extends AudioWorkletProcessor {
    constructor() {
        super();
        this.sampleRate = sampleRate;
        this.port.onmessage = (e) => this.handleMessage(e.data);
        this.isPlaying = false;
        this.bpm = 120;
        this.currentStep = 0;
        this.samplesPerStep = (60 / this.bpm / 4) * this.sampleRate;
        this.sampleCounter = 0;
        this.pattern = [1, 0, 0, 0, 1, 0, 0, 0, 1, 0, 0, 0, 1, 0, 0, 0];
    }
    handleMessage(params) {
        if (params.bpm !== undefined) {
            this.bpm = params.bpm;
            this.samplesPerStep = (60 / this.bpm / 4) * this.sampleRate;
        }
        if (params.isPlaying !== undefined) this.isPlaying = params.isPlaying;
        if (params.pattern !== undefined) this.pattern = params.pattern;
    }
    process(inputs, outputs, parameters) {
        if (this.isPlaying) {
            this.sampleCounter++;
            if (this.sampleCounter >= this.samplesPerStep) {
                this.sampleCounter = 0;
                if (this.pattern[this.currentStep % this.pattern.length] === 1) {
                    this.port.postMessage({ type: 'triggerKick' });
                }
                this.currentStep++;
            }
        }
        return true;
    }
}
registerProcessor('sequencer-processor', SequencerProcessor);
`;

// ===================================================================
// MAIN APPLICATION LOGIC
// ===================================================================

const AppState = {
    audioCtx: null, isPlaying: false, motionEnabled: false, panEnabled: false,
    NUM_OSC: 4, waveType: "sawtooth", detuneAmount: 15,
    baseFreq: 261.63, octaveOffset: 0, tiltBend: 0,
    rhythmActive: false, rhythmBPM: 120,
    effects: { dist: false, filter: true, delay: false, reverb: false, wasmEffect: false },
    filterFreq: 20000, filterReso: 1, delayFeedback: 0.5,
    touchPoint: { x: 0.5, y: 0.5 }, panTarget: 0, freqTarget: 261.63,
    themeNeedsUpdate: false,
};

const noteColors = [[255,100,100],[255,150,80],[255,220,80],[220,255,80],[120,255,100],[80,255,180],[80,220,255],[100,150,255],[150,100,255],[220,80,255],[255,80,220],[255,80,120]];
const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const elements = { /* ... element selectors ... */ };
Object.assign(elements, { pad: document.getElementById("pad"), noteDisplay: document.getElementById("noteDisplay"), motionDisplay: document.getElementById("motionDisplay"), panDisplay: document.getElementById("panDisplay"), startBtn: document.getElementById("startBtn"), stopBtn: document.getElementById("stopBtn"), motionBtn: document.getElementById("motionBtn"), panBtn: document.getElementById("panBtn"), statusMessage: document.getElementById("statusMessage"), permissionModal: document.getElementById("permissionModal"), controls: document.getElementById("controls"), toggleControls: document.getElementById("toggleControls"), noteRuler: document.getElementById("noteRuler"), startRhythmBtn: document.getElementById("startRhythmBtn"), stopRhythmBtn: document.getElementById("stopRhythmBtn"), rhythmSpeed: document.getElementById("rhythmSpeed"), waveSelect: document.getElementById("waveSelect"), oscCount: document.getElementById("oscCount"), detuneRange: document.getElementById("detuneRange"), filterFreq: document.getElementById("filterFreq"), filterReso: document.getElementById("filterReso"), animationSelect: document.getElementById("animationSelect") });

// --- Modular Audio Classes ---
class AudioModule {
    constructor(ctx, processorCode, processorName) {
        this.ctx = ctx;
        this.blob = new Blob([processorCode], { type: 'application/javascript' });
        this.workletUrl = URL.createObjectURL(this.blob);
        this.nodePromise = ctx.audioWorklet.addModule(this.workletUrl).then(() => {
            this.node = new AudioWorkletNode(ctx, processorName);
            URL.revokeObjectURL(this.workletUrl);
            return this.node;
        });
    }
    sendMessage(data) { this.nodePromise.then(n => n.port.postMessage(data)); }
}

class SynthModule extends AudioModule {
    constructor(ctx) { super(ctx, synthProcessorCode, 'synth-processor'); }
    init(numOsc, wave, detune) { this.sendMessage({ type: 'init', sampleRate: this.ctx.sampleRate, numOsc, wave, detune }); }
    updateParams(frequency, wave, detune) { this.sendMessage({ type: 'update', frequency, wave, detune }); }
}

class EffectsModule extends AudioModule {
    constructor(ctx) { super(ctx, effectsProcessorCode, 'effects-processor'); }
    updateParams(params) { this.sendMessage(params); }
}

class SequencerModule extends AudioModule {
    constructor(ctx) {
        super(ctx, sequencerProcessorCode, 'sequencer-processor');
        this.nodePromise.then(n => n.port.onmessage = (e) => {
            if (e.data.type === 'triggerKick') playKick();
        });
    }
    start(bpm) { this.sendMessage({ isPlaying: true, bpm }); }
    stop() { this.sendMessage({ isPlaying: false }); }
    updateBpm(bpm) { this.sendMessage({ bpm }); }
}

// --- Global Audio Nodes ---
let synthModule, effectsModule, sequencerModule, pannerNode, masterGainNode, kickGain, kickOsc;

// --- Core Functions ---
function isAudioContextValid() { return AppState.audioCtx && AppState.audioCtx.state === 'running'; }
function showStatus(msg, dur = 800) { elements.statusMessage.textContent = msg; elements.statusMessage.classList.add('show'); setTimeout(() => elements.statusMessage.classList.remove('show'), dur); }
function updateButtonStates() { elements.startBtn.disabled = AppState.isPlaying; elements.stopBtn.disabled = !AppState.isPlaying; }
function createNoteRuler() { const notes = ['C6','B5','A#5','A5','G#5','G5','F#5','F5','E5','D#5','D5','C#5','C5','B4','A#4','A4','G#4','G4','F#4','F4','E4','D#4','D4','C#4','C4']; elements.noteRuler.innerHTML = ''; notes.forEach(note => { const div = document.createElement('div'); div.className = 'ruler-note'; div.textContent = note; elements.noteRuler.appendChild(div); }); }
function freqToNote(freq) { const A4 = 440, semitonesFromA4 = 12 * Math.log2(freq / A4); const noteIndex = Math.round(semitonesFromA4 + 9) % 12; const octave = Math.floor((semitonesFromA4 + 9) / 12); const noteName = noteNames[(noteIndex + 12) % 12]; return { name: noteName, octave: octave, fullName: `${noteName}${octave}` }; }
function updateThemeColor(color) { document.documentElement.style.setProperty('--r', color[0]); document.documentElement.style.setProperty('--g', color[1]); document.documentElement.style.setProperty('--b', color[2]); }
function noteFromPad(y) { const ratio = 1 - y; const baseFreq = 65.41 * Math.pow(2, AppState.octaveOffset); return baseFreq * Math.pow(2, (ratio * 24) / 12); }
function applyPitch() { const noteInfo = freqToNote(AppState.freqTarget); elements.noteDisplay.textContent = noteInfo.fullName; const colorIndex = noteNames.indexOf(noteInfo.name); if (colorIndex !== -1) { updateThemeColor(noteColors[colorIndex]); AppState.themeNeedsUpdate = false; } }
function playKick() { const now = AppState.audioCtx.currentTime; kickOsc.frequency.setValueAtTime(60, now); kickOsc.frequency.exponentialRampToValueAtTime(0.01, now + 0.5); kickGain.gain.setValueAtTime(1, now); kickGain.gain.exponentialRampToValueAtTime(0.01, now + 0.5); }
function startMainLoop() { function loop() { if (!AppState.isPlaying) return; requestAnimationFrame(loop); safeAudioOperation(() => { masterGainNode.gain.setTargetAtTime(AppState.touchPoint.x * 0.4, AppState.audioCtx.currentTime, 0.01); pannerNode.pan.setTargetAtTime(AppState.panTarget, AppState.audioCtx.currentTime, 0.01); }); if (AppState.themeNeedsUpdate) applyPitch(); elements.motionDisplay.textContent = `Tilt:${Math.round(AppState.tiltBend * 10) / 10}st`; elements.panDisplay.textContent = `Pan:${Math.round(AppState.panTarget * 100)}%`; }; loop(); }
function safeAudioOperation(op) { if (!isAudioContextValid()) { showStatus('Start synth first'); return false; } try { op(); return true; } catch (e) { console.error(e); showStatus('Audio error'); return false; } }

// --- Start/Stop ---
async function startSynth() {
    if (isAudioContextValid()) { showStatus('Already running'); return; }
    try {
        AppState.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        await AppState.audioCtx.resume();
        
        synthModule = new SynthModule(AppState.audioCtx);
        effectsModule = new EffectsModule(AppState.audioCtx);
        sequencerModule = new SequencerModule(AppState.audioCtx);
        pannerNode = AppState.audioCtx.createStereoPanner();
        masterGainNode = AppState.audioCtx.createGain();
        
        kickOsc = AppState.audioCtx.createOscillator();
        kickGain = AppState.audioCtx.createGain();
        kickOsc.connect(kickGain).connect(masterGainNode);
        kickOsc.start();

        // FIX: Await all promises before connecting
        const synthNode = await synthModule.nodePromise;
        const effectsNode = await effectsModule.nodePromise;
        
        // Connect the graph explicitly
        synthNode.connect(effectsNode);
        effectsNode.connect(pannerNode);
        pannerNode.connect(masterGainNode);
        masterGainNode.connect(AppState.audioCtx.destination);

        // Initialize modules
        synthModule.init(AppState.NUM_OSC, AppState.waveType, AppState.detuneAmount);
        effectsModule.updateParams(AppState.effects);
        
        // FIX: Send initial parameters to produce sound
        synthModule.updateParams(AppState.freqTarget, AppState.waveType, AppState.detuneAmount);

        AppState.isPlaying = true;
        updateButtonStates();
        startMainLoop();
        showStatus('Started');
    } catch (e) { console.error(e); showStatus('Start failed'); }
}
function stopSynth() {
    if (!AppState.audioCtx) { showStatus('No synth running'); return; }
    try {
        if (AppState.rhythmActive) stopRhythm();
        AppState.audioCtx.close().then(() => {
            AppState.audioCtx = null; AppState.isPlaying = false; updateButtonStates(); showStatus('Stopped');
        }).catch(e => console.error(e));
    } catch (e) { console.error(e); showStatus('Stop error'); }
}

// --- Event Handlers ---
function handleTouch(e) { if (!isAudioContextValid()) { showStatus('Start synth first'); return; } e.preventDefault(); const clientY = e.touches ? e.touches[0].clientY : e.clientY; const clientX = e.touches ? e.touches[0].clientX : e.clientX; AppState.touchPoint = { x: clientX / window.innerWidth, y: clientY / window.innerHeight }; AppState.freqTarget = noteFromPad(AppState.touchPoint.y); AppState.themeNeedsUpdate = true; synthModule.updateParams(AppState.freqTarget, AppState.waveType, AppState.detuneAmount); }
function toggleControls() { elements.controls.classList.toggle('expanded'); elements.toggleControls.textContent = elements.controls.classList.contains('expanded') ? '✕' : '⚙️'; }
function requestMotionPermission() { if (typeof DeviceOrientationEvent.requestPermission === 'function') { elements.permissionModal.style.display = 'flex'; } else { startMotionControl(); } }
function startMotionControl() { window.addEventListener("deviceorientation", handleOrientation); AppState.motionEnabled = true; elements.motionBtn.textContent = "Motion ON"; elements.motionBtn.classList.add('active'); elements.motionDisplay.style.display = 'block'; showStatus('Motion enabled'); }
function disableMotion() { window.removeEventListener("deviceorientation", handleOrientation); AppState.motionEnabled = false; AppState.tiltBend = 0; elements.motionBtn.textContent = "Motion OFF"; elements.motionBtn.classList.remove('active'); elements.motionDisplay.style.display = 'none'; showStatus('Motion disabled'); }
function togglePan() { AppState.panEnabled = !AppState.panEnabled; elements.panBtn.textContent = AppState.panEnabled ? "Pan ON" : "Pan OFF"; elements.panBtn.classList.toggle('active', AppState.panEnabled); elements.panDisplay.style.display = AppState.panEnabled ? 'block' : 'none'; if (!AppState.panEnabled) { AppState.panTarget = 0; } showStatus(AppState.panEnabled ? 'Pan enabled' : 'Pan disabled'); }
function handleOrientation(e) { if (e.beta === null) return; const tilt = e.beta, pan = e.gamma; if (AppState.motionEnabled) { AppState.tiltBend = tilt / 45 * 12; const baseFreq = 65.41 * Math.pow(2, AppState.octaveOffset); AppState.freqTarget = baseFreq * Math.pow(2, AppState.tiltBend / 12); AppState.themeNeedsUpdate = true; synthModule.updateParams(AppState.freqTarget, AppState.waveType, AppState.detuneAmount); } if (AppState.panEnabled && pan !== null) { AppState.panTarget = Math.max(-1, Math.min(1, pan / 90)); } }
function startRhythm() { if (!isAudioContextValid()) { showStatus('Start synth first'); return; } AppState.rhythmActive = true; elements.startRhythmBtn.disabled = true; elements.stopRhythmBtn.disabled = false; sequencerModule.start(AppState.rhythmBPM); showStatus('Rhythm Started'); }
function stopRhythm() { AppState.rhythmActive = false; elements.startRhythmBtn.disabled = false; elements.stopRhythmBtn.disabled = true; sequencerModule.stop(); showStatus('Rhythm Stopped'); }

// --- Initialization ---
function initializeEventListeners() {
    elements.pad.addEventListener("touchstart", handleTouch, { passive: false });
    elements.pad.addEventListener("touchmove", handleTouch, { passive: false });
    elements.pad.addEventListener("mousedown", handleTouch);
    elements.pad.addEventListener("mousemove", e => { if (e.buttons === 1) handleTouch(e); });
    elements.startBtn.addEventListener("click", startSynth);
    elements.stopBtn.addEventListener("click", stopSynth);
    elements.motionBtn.addEventListener("click", () => { AppState.motionEnabled ? disableMotion() : requestMotionPermission(); });
    elements.panBtn.addEventListener("click", togglePan);
    elements.toggleControls.addEventListener("click", toggleControls);
    elements.startRhythmBtn.addEventListener("click", startRhythm);
    elements.stopRhythmBtn.addEventListener("click", stopRhythm);
    document.getElementById("octUp").addEventListener("click", () => { AppState.octaveOffset++; AppState.freqTarget = noteFromPad(AppState.touchPoint.y); AppState.themeNeedsUpdate = true; createNoteRuler(); });
    document.getElementById("octDown").addEventListener("click", () => { AppState.octaveOffset--; AppState.freqTarget = noteFromPad(AppState.touchPoint.y); AppState.themeNeedsUpdate = true; createNoteRuler(); });
    document.getElementById("permissionAllow").addEventListener("click", () => { DeviceOrientationEvent.requestPermission().then(r => { elements.permissionModal.style.display = 'none'; if (r === 'granted') { startMotionControl(); } else { showStatus('Motion permission denied'); } }).catch(e => { elements.permissionModal.style.display = 'none'; showStatus('Permission error'); }); });
    document.getElementById("permissionDeny").addEventListener("click", () => { elements.permissionModal.style.display = 'none'; showStatus('Motion disabled'); });
    
    elements.waveSelect.addEventListener("change", e => { AppState.waveType = e.target.value; synthModule.updateParams(AppState.freqTarget, AppState.waveType, AppState.detuneAmount); });
    elements.oscCount.addEventListener("input", e => { AppState.NUM_OSC = parseInt(e.target.value); synthModule.init(AppState.NUM_OSC, AppState.waveType, AppState.detuneAmount); });
    elements.detuneRange.addEventListener("input", e => { AppState.detuneAmount = parseFloat(e.target.value); synthModule.updateParams(AppState.freqTarget, AppState.waveType, AppState.detuneAmount); });
    elements.filterFreq.addEventListener("input", e => { AppState.filterFreq = parseFloat(e.target.value); effectsModule.updateParams({ ...AppState.effects, filterFreq: AppState.filterFreq }); });
    elements.filterReso.addEventListener("input", e => { AppState.filterReso = parseFloat(e.target.value); effectsModule.updateParams({ ...AppState.effects, filterReso: AppState.filterReso }); });
    elements.rhythmSpeed.addEventListener("input", e => { AppState.rhythmBPM = parseInt(e.target.value); if (AppState.rhythmActive) sequencerModule.updateBpm(AppState.rhythmBPM); });
    
    const toggleMap = { toggleDist: 'dist', toggleFilter: 'filter', toggleDelay: 'delay', toggleReverb: 'reverb', toggleWasmEffect: 'wasmEffect' };
    Object.entries(toggleMap).forEach(([id, effect]) => {
        document.getElementById(id).addEventListener("click", () => {
            AppState.effects[effect] = !AppState.effects[effect];
            document.getElementById(id).classList.toggle('active', AppState.effects[effect]);
            effectsModule.updateParams(AppState.effects);
            showStatus(effect + ' ' + (AppState.effects[effect] ? 'ON' : 'OFF'));
        });
    });
    document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); AppState.rhythmActive ? stopRhythm() : startRhythm(); } });
    document.addEventListener('visibilitychange', () => { if (document.hidden && AppState.rhythmActive) stopRhythm(); });
    elements.pad.addEventListener('touchstart', () => { if (AppState.audioCtx && AppState.audioCtx.state === 'suspended') AppState.audioCtx.resume(); }, { once: true });
}

window.addEventListener('load', () => {
    updateThemeColor([255, 100, 100]); initializeEventListeners(); updateButtonStates(); createNoteRuler();
    showStatus('Ready - Click Start then try effects! SPACE for rhythm');
});
window.addEventListener("contextmenu", e => e.preventDefault());
</script></body></html>
