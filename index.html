<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Premium Synth</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --r: 100; --g: 100; --b: 100;
            --bg-color: rgb(var(--r), var(--g), var(--b));
            --control-bg: rgba(0, 0, 0, 0.3);
            --text-color: #f0f0f0;
            --border-color: rgba(var(--r), var(--g), var(--b), 0.6);
            --safe-area-inset-top: env(safe-area-inset-top);
            --safe-area-inset-bottom: env(safe-area-inset-bottom);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * { 
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            background-color: #111;
            color: var(--text-color);
            font-family: 'Inter', -apple-system, sans-serif;
            font-weight: 400;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            overscroll-behavior: none;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-color);
            padding-top: var(--safe-area-inset-top);
            padding-bottom: var(--safe-area-inset-bottom);
            transition: background-color 0.3s ease;
        }

        #app-container { 
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #pad {
            width: 100%;
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, var(--control-bg), rgba(0,0,0,0.6));
            cursor: crosshair;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .info-display {
            position: absolute;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            pointer-events: none;
            z-index: 10;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #noteDisplay {
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            padding: 25px 40px;
            font-size: min(8vw, 48px);
            font-weight: 700;
            text-shadow: 0 0 20px var(--bg-color);
        }

        #frequencyDisplay {
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            font-size: min(4vw, 24px);
            font-weight: 500;
            opacity: 0.9;
        }

        #octaveDisplay {
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            font-size: min(3.5vw, 20px);
            font-weight: 500;
            opacity: 0.8;
        }

        #motionDisplay, #wahDisplay {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: min(3vw, 16px);
            font-weight: 500;
            display: none;
        }

        #wahDisplay { 
            bottom: 60px; 
        }

        #toggleControls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        #toggleControls:hover {
            transform: scale(1.1);
        }

        #controls {
            height: 40vh;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            padding: 20px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            transition: all 0.3s ease;
            border-top: 1px solid var(--glass-border);
        }

        #controls.hidden {
            height: 0;
            padding: 0;
            overflow: hidden;
            border-top: none;
        }

        button, select, input[type=range], label {
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 14px;
            font-weight: 500;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-color);
            -webkit-appearance: none;
            appearance: none;
            transition: all 0.3s ease;
            outline: none;
            backdrop-filter: blur(10px);
        }

        button { 
            padding: 16px;
            cursor: pointer;
            min-height: 52px;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(var(--r), var(--g), var(--b), 0.3);
        }

        button.active { 
            background: var(--bg-color);
            color: #111;
            font-weight: 700;
            box-shadow: 0 0 30px var(--bg-color);
        }

        .control-group { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        label { 
            font-size: 12px;
            margin-bottom: 8px;
            display: block;
            text-align: center;
            color: var(--text-color);
            opacity: 0.9;
            font-weight: 600;
        }

        input[type=range] {
            width: 100%;
            height: 6px;
            background: rgba(var(--r), var(--g), var(--b), 0.3);
            outline: none;
            border: none;
            padding: 0;
            margin: 10px 0;
            border-radius: 10px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: var(--bg-color);
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 15px var(--bg-color);
            border: 2px solid white;
        }

        select { 
            padding: 15px;
            cursor: pointer;
            min-height: 52px;
            width: 100%;
            font-weight: 600;
        }

        #noteRuler {
            position: absolute;
            top: 0;
            left: 0;
            width: 60px;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px 0;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 5;
            backdrop-filter: blur(10px);
        }

        .ruler-item { 
            display: flex;
            align-items: center;
            width: 100%;
            padding-right: 12px;
            box-sizing: border-box;
        }

        .ruler-item .tick { 
            width: 12px;
            height: 1px;
            background-color: var(--glass-border);
            margin-right: 10px;
        }

        .ruler-item .note-label { 
            font-size: 11px;
            font-weight: 600;
            color: var(--text-color);
            text-align: right;
            width: 100%;
            opacity: 0.8;
        }

        #statusMessage {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 500;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
        }

        #statusMessage.show {
            opacity: 1;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }

        .effect-group {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin: 15px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .effect-group-title {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 8px;
            opacity: 0.9;
            letter-spacing: 0.5px;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            #controls {
                grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
                gap: 10px;
                padding: 15px;
            }
            
            .effect-group {
                grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
                gap: 10px;
                padding: 12px;
            }
            
            button, select {
                min-height: 48px;
                padding: 14px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            #controls {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 12px;
            }
            
            .effect-group {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 10px;
            }
            
            #noteDisplay {
                font-size: 36px;
                padding: 20px 30px;
            }
            
            #frequencyDisplay {
                font-size: 18px;
                padding: 12px 20px;
            }
            
            #octaveDisplay {
                font-size: 16px;
                padding: 10px 18px;
            }
        }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="pad">
            <div id="noteDisplay" class="info-display">C4</div>
            <div id="frequencyDisplay" class="info-display">261.63 Hz</div>
            <div id="octaveDisplay" class="info-display">Octave 4</div>
            <div id="motionDisplay" class="info-display">Motion: 0°</div>
            <div id="wahDisplay" class="info-display">Wah: 0%</div>
            <button id="toggleControls">⚙️</button>
        </div>
        
        <div id="controls">
            <button id="startBtn"><span class="spinner" style="display:none;"></span>Start Synth</button>
            <button id="stopBtn" disabled>Stop Synth</button>
            <button id="motionBtn">Enable Motion</button>
            <button id="octDown">Octave -</button>
            <button id="octUp">Octave +</button>
            
            <div class="control-group">
                <label for="waveSelect">Wave Type</label>
                <select id="waveSelect">
                    <option value="sawtooth">Sawtooth</option>
                    <option value="triangle">Triangle</option>
                    <option value="square">Square</option>
                    <option value="sine">Sine</option>
                </select>
            </div>

            <div class="control-group">
                <label for="detuneRange">Detune</label>
                <input type="range" id="detuneRange" min="0" max="50" value="15">
            </div>

            <div class="effect-group">
                <div class="effect-group-title">WAH WAH EFFECTS</div>
                <button id="toggleAutoWah">Auto Wah</button>
                <button id="toggleManualWah">Manual Wah</button>
                
                <div class="control-group">
                    <label for="autoWahRate">Auto Wah Rate</label>
                    <input type="range" id="autoWahRate" min="0.1" max="5" value="1" step="0.1">
                </div>

                <div class="control-group">
                    <label for="autoWahDepth">Auto Wah Depth</label>
                    <input type="range" id="autoWahDepth" min="100" max="1500" value="800">
                </div>

                <div class="control-group">
                    <label for="wahFreq">Wah Frequency</label>
                    <input type="range" id="wahFreq" min="200" max="2000" value="800">
                </div>

                <div class="control-group">
                    <label for="wahReso">Wah Resonance</label>
                    <input type="range" id="wahReso" min="0.5" max="20" value="5" step="0.5">
                </div>
            </div>

            <div class="effect-group">
                <div class="effect-group-title">FILTER EFFECTS</div>
                <button id="toggleFilter">Enable Filter</button>
                
                <div class="control-group">
                    <label for="filterFreq">Filter Frequency</label>
                    <input type="range" id="filterFreq" min="200" max="20000" value="20000" step="100">
                </div>

                <div class="control-group">
                    <label for="filterReso">Filter Resonance</label>
                    <input type="range" id="filterReso" min="0.5" max="20" value="1" step="0.5">
                </div>
            </div>

            <div class="effect-group">
                <div class="effect-group-title">MODULATION EFFECTS</div>
                <button id="toggleFlanger">Enable Flanger</button>
                <button id="togglePhaser">Enable Phaser</button>
                <button id="toggleChorus">Enable Chorus</button>
                <button id="toggleTremolo">Enable Tremolo</button>

                <div class="control-group">
                    <label for="flangerRate">Flanger Rate</label>
                    <input type="range" id="flangerRate" min="0.1" max="2" value="0.25" step="0.05">
                </div>

                <div class="control-group">
                    <label for="phaserRate">Phaser Rate</label>
                    <input type="range" id="phaserRate" min="0.1" max="2" value="0.5" step="0.05">
                </div>

                <div class="control-group">
                    <label for="chorusRate">Chorus Rate</label>
                    <input type="range" id="chorusRate" min="0.1" max="2" value="0.5" step="0.05">
                </div>

                <div class="control-group">
                    <label for="tremoloRate">Tremolo Rate</label>
                    <input type="range" id="tremoloRate" min="0.1" max="10" value="5" step="0.1">
                </div>
            </div>

            <div class="effect-group">
                <div class="effect-group-title">TIME-BASED EFFECTS</div>
                <button id="toggleReverb">Enable Reverb</button>
                <button id="toggleDelay">Enable Delay</button>
                <button id="toggleDist">Enable Distortion</button>
                <button id="toggleBitCrusher">Enable Bit Crusher</button>

                <div class="control-group">
                    <label for="reverbMix">Reverb Mix</label>
                    <input type="range" id="reverbMix" min="0" max="100" value="70">
                </div>

                <div class="control-group">
                    <label for="distAmount">Distortion Amount</label>
                    <input type="range" id="distAmount" min="0" max="100" value="50">
                </div>

                <div class="control-group">
                    <label for="delayTime">Delay Time (ms)</label>
                    <input type="range" id="delayTime" min="50" max="1000" value="250">
                </div>
                <div class="control-group">
                    <label for="delayFeedback">Delay Feedback</label>
                    <input type="range" id="delayFeedback" min="0" max="90" value="40">
                </div>

                <div class="control-group">
                    <label for="bitCrushBits">Bit Depth</label>
                    <input type="range" id="bitCrushBits" min="1" max="16" value="8">
                </div>
            </div>
        </div>
    </div>

    <div id="statusMessage"></div>

    <script>
        const AppState = {
            audioCtx: null, oscillators: [], masterGain: null, filter: null, reverb: null,
            delayNode: null, delayFeedback: null, baseFreq: 261.63, octaveOffset: 0,
            tiltBend: 0, isFilter: false, isReverb: false, isFlanger: false, isPhaser: false,
            isDist: false, isDelay: false, isAutoWah: false, isManualWah: false, isChorus: false,
            isTremolo: false, isBitCrusher: false, NUM_OSC: 7, detuneAmount: 15, waveType: "sawtooth",
            isPlaying: false, motionEnabled: false, manualWahPosition: 0.5,
            controlsVisible: true
        };

        let reverbDryWet, flangerDryWet, phaserDryWet, distortionGain, delayDryWet;
        let flanger, phaser, distortionWaveShaper;
        let autoWahFilter, autoWahLFO, autoWahDryWet;
        let manualWahFilter, manualWahDryWet;
        let chorusNode, chorusDryWet;
        let tremoloGain, tremoloLFO, tremoloDryWet;
        let bitCrusherNode, bitCrusherDryWet;

        const noteColors = {
            'C': [255, 100, 100], 'C#': [255, 150, 100], 'D': [255, 255, 100],
            'D#': [150, 255, 100], 'E': [100, 255, 100], 'F': [100, 255, 150],
            'F#': [100, 255, 255], 'G': [100, 150, 255], 'G#': [100, 100, 255],
            'A': [150, 100, 255], 'A#': [255, 100, 255], 'B': [255, 100, 150]
        };

        const elements = {
            pad: document.getElementById("pad"), 
            noteDisplay: document.getElementById("noteDisplay"),
            frequencyDisplay: document.getElementById("frequencyDisplay"),
            octaveDisplay: document.getElementById("octaveDisplay"), 
            motionDisplay: document.getElementById("motionDisplay"),
            wahDisplay: document.getElementById("wahDisplay"), 
            startBtn: document.getElementById("startBtn"),
            stopBtn: document.getElementById("stopBtn"), 
            motionBtn: document.getElementById("motionBtn"),
            statusMessage: document.getElementById("statusMessage"),
            toggleControls: document.getElementById("toggleControls"),
            controls: document.getElementById("controls")
        };

        const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        function showStatus(message, duration = 2000) {
            elements.statusMessage.textContent = message;
            elements.statusMessage.classList.add('show');
            setTimeout(() => elements.statusMessage.classList.remove('show'), duration);
        }

        function updateButtonStates() {
            elements.startBtn.disabled = AppState.isPlaying;
            elements.stopBtn.disabled = !AppState.isPlaying;
            const spinner = elements.startBtn.querySelector('.spinner');
            if (AppState.isPlaying) spinner.style.display = 'none';
        }

        function toggleControls() {
            AppState.controlsVisible = !AppState.controlsVisible;
            if (AppState.controlsVisible) {
                elements.controls.classList.remove('hidden');
                elements.toggleControls.textContent = '⚙️';
            } else {
                elements.controls.classList.add('hidden');
                elements.toggleControls.textContent = '↑';
            }
        }

        function startSynth() {
            if (AppState.audioCtx && AppState.audioCtx.state === 'running') {
                showStatus('Synth is already running'); return;
            }

            try {
                const spinner = elements.startBtn.querySelector('.spinner');
                spinner.style.display = 'inline-block';
                AppState.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                createAudioNodes(AppState.audioCtx.currentTime);
                AppState.isPlaying = true;
                updateButtonStates();
                showStatus('Synth started');
            } catch (error) {
                console.error('Error starting synth:', error);
                showStatus('Error starting synth', 4000);
                elements.startBtn.querySelector('.spinner').style.display = 'none';
            }
        }

        function createAudioNodes(now) {
            AppState.masterGain = AppState.audioCtx.createGain();
            AppState.masterGain.gain.value = 0.2;
            AppState.filter = AppState.audioCtx.createBiquadFilter();
            AppState.filter.type = "lowpass";
            AppState.filter.frequency.value = 20000;
            AppState.filter.Q.value = 1;

            createEffects();
            createOscillators(now);
            connectAudioGraph();
        }

        function createEffects() {
            AppState.reverb = createReverb(AppState.audioCtx);
            reverbDryWet = AppState.audioCtx.createGain(); reverbDryWet.gain.value = 0;

            flanger = createFlanger(AppState.audioCtx);
            flangerDryWet = AppState.audioCtx.createGain(); flangerDryWet.gain.value = 0;

            phaser = createPhaser(AppState.audioCtx);
            phaserDryWet = AppState.audioCtx.createGain(); phaserDryWet.gain.value = 0;

            distortionWaveShaper = createDistortion(AppState.audioCtx, 50);
            distortionGain = AppState.audioCtx.createGain(); distortionGain.gain.value = 0;

            AppState.delayNode = AppState.audioCtx.createDelay(1.0);
            AppState.delayFeedback = AppState.audioCtx.createGain();
            delayDryWet = AppState.audioCtx.createGain();
            AppState.delayNode.delayTime.value = 0.25;
            AppState.delayFeedback.gain.value = 0.4;
            delayDryWet.gain.value = 0;

            const autoWah = createAutoWah(AppState.audioCtx);
            autoWahFilter = autoWah.filter; autoWahLFO = autoWah.lfo;
            autoWahDryWet = autoWah.dryWet; autoWahDryWet.gain.value = 0;

            const manualWah = createManualWah(AppState.audioCtx);
            manualWahFilter = manualWah.filter;
            manualWahDryWet = manualWah.dryWet; manualWahDryWet.gain.value = 0;

            const chorus = createChorus(AppState.audioCtx);
            chorusNode = chorus.chorus; chorusDryWet = chorus.dryWet; chorusDryWet.gain.value = 0;

            const tremolo = createTremolo(AppState.audioCtx);
            tremoloGain = tremolo.gain; tremoloLFO = tremolo.lfo;
            tremoloDryWet = tremolo.dryWet; tremoloDryWet.gain.value = 0;

            const bitCrusher = createBitCrusher(AppState.audioCtx);
            bitCrusherNode = bitCrusher.bitCrusher;
            bitCrusherDryWet = bitCrusher.dryWet; bitCrusherDryWet.gain.value = 0;
        }

        function createOscillators(now) {
            AppState.oscillators = [];
            for(let i = 0; i < AppState.NUM_OSC; i++) {
                const osc = AppState.audioCtx.createOscillator();
                osc.type = AppState.waveType;
                const detune = (i - Math.floor(AppState.NUM_OSC / 2)) * AppState.detuneAmount;
                osc.detune.value = detune;
                osc.connect(AppState.masterGain);
                osc.start(now);
                AppState.oscillators.push(osc);
            }
        }

        function connectAudioGraph() {
            AppState.masterGain.connect(AppState.filter);
            const dryGain = AppState.audioCtx.createGain(); dryGain.gain.value = 1.0;
            AppState.filter.connect(dryGain); dryGain.connect(AppState.audioCtx.destination);
            
            AppState.filter.connect(AppState.reverb); AppState.reverb.connect(reverbDryWet); reverbDryWet.connect(AppState.audioCtx.destination);
            AppState.filter.connect(flanger.delay); flanger.delay.connect(flangerDryWet); flangerDryWet.connect(AppState.audioCtx.destination);
            AppState.filter.connect(phaser.filter); phaser.filter.connect(phaserDryWet); phaserDryWet.connect(AppState.audioCtx.destination);
            AppState.filter.connect(distortionGain); distortionGain.connect(distortionWaveShaper); distortionWaveShaper.connect(AppState.audioCtx.destination);
            AppState.filter.connect(AppState.delayNode); AppState.delayNode.connect(AppState.delayFeedback); AppState.delayFeedback.connect(AppState.delayNode); AppState.delayNode.connect(delayDryWet); delayDryWet.connect(AppState.audioCtx.destination);
            AppState.filter.connect(autoWahFilter); autoWahFilter.connect(autoWahDryWet); autoWahDryWet.connect(AppState.audioCtx.destination);
            AppState.filter.connect(manualWahFilter); manualWahFilter.connect(manualWahDryWet); manualWahDryWet.connect(AppState.audioCtx.destination);
            AppState.filter.connect(chorusNode); chorusNode.connect(chorusDryWet); chorusDryWet.connect(AppState.audioCtx.destination);
            AppState.filter.connect(tremoloGain); tremoloGain.connect(tremoloDryWet); tremoloDryWet.connect(AppState.audioCtx.destination);
            AppState.filter.connect(bitCrusherNode); bitCrusherNode.connect(bitCrusherDryWet); bitCrusherDryWet.connect(AppState.audioCtx.destination);
        }

        function createReverb(ctx) {
            const convolver = ctx.createConvolver();
            const len = 3 * ctx.sampleRate;
            const impulse = ctx.createBuffer(2, len, ctx.sampleRate);
            for(let c = 0; c < 2; c++) {
                const buf = impulse.getChannelData(c);
                for(let i = 0; i < len; i++) buf[i] = (Math.random() * 2 - 1) * (1 - i / len);
            }
            convolver.buffer = impulse; return convolver;
        }

        function createFlanger(ctx) {
            const delay = ctx.createDelay(0.005); delay.delayTime.value = 0.002;
            const feedback = ctx.createGain(); feedback.gain.value = 0.7;
            const lfo = ctx.createOscillator(); lfo.frequency.value = 0.25;
            const lfoGain = ctx.createGain(); lfoGain.gain.value = 0.001;
            lfo.connect(lfoGain); lfoGain.connect(delay.delayTime); lfo.start();
            delay.connect(feedback); feedback.connect(delay);
            return { delay, feedback, lfo, lfoGain };
        }

        function createPhaser(ctx) {
            const stages = 8, filters = [];
            for (let i = 0; i < stages; i++) {
                filters.push(ctx.createBiquadFilter());
                filters[i].type = "allpass"; filters[i].frequency.value = 1000; filters[i].Q.value = 1;
            }
            const lfo = ctx.createOscillator(); lfo.frequency.value = 0.5;
            const lfoGain = ctx.createGain(); lfoGain.gain.value = 800;
            lfo.connect(lfoGain);
            for (let i = 0; i < stages; i++) lfoGain.connect(filters[i].frequency);
            lfo.start();
            for (let i = 0; i < stages - 1; i++) filters[i].connect(filters[i + 1]);
            return { filter: filters[0], filters, lfo };
        }

        function createDistortion(ctx, amount) {
            const waveshaper = ctx.createWaveShaper();
            const samples = 44100, curve = new Float32Array(samples), deg = Math.PI / 180;
            for (let i = 0; i < samples; i++) {
                const x = (i * 2) / samples - 1;
                curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
            }
            waveshaper.curve = curve; waveshaper.oversample = '4x'; return waveshaper;
        }

        function createAutoWah(ctx) {
            const filter = ctx.createBiquadFilter(); filter.type = "bandpass"; filter.frequency.value = 800; filter.Q.value = 5;
            const lfo = ctx.createOscillator(); lfo.frequency.value = 1.0;
            const lfoGain = ctx.createGain(); lfoGain.gain.value = 600;
            const dryWet = ctx.createGain(); dryWet.gain.value = 0;
            lfo.connect(lfoGain); lfoGain.connect(filter.frequency); lfo.start();
            return { filter, lfo, lfoGain, dryWet };
        }

        function createManualWah(ctx) {
            const filter = ctx.createBiquadFilter(); filter.type = "bandpass"; filter.frequency.value = 800; filter.Q.value = 5;
            const dryWet = ctx.createGain(); dryWet.gain.value = 0;
            return { filter, dryWet };
        }

        function createChorus(ctx) {
            const chorus = ctx.createGain(), dryWet = ctx.createGain(); dryWet.gain.value = 0;
            return { chorus, dryWet };
        }

        function createTremolo(ctx) {
            const gain = ctx.createGain(); gain.gain.value = 1.0;
            const lfo = ctx.createOscillator(); lfo.frequency.value = 5.0;
            const lfoGain = ctx.createGain(); lfoGain.gain.value = 0.5;
            const dryWet = ctx.createGain(); dryWet.gain.value = 0;
            lfo.connect(lfoGain); lfoGain.connect(gain.gain); lfo.start();
            return { gain, lfo, lfoGain, dryWet };
        }

        function createBitCrusher(ctx) {
            const bitCrusher = ctx.createGain(), dryWet = ctx.createGain(); dryWet.gain.value = 0;
            return { bitCrusher, dryWet };
        }

        function createNoteRuler() {
            const ruler = document.createElement('div'); ruler.id = 'noteRuler'; elements.pad.appendChild(ruler);
            const notesToShow = [
                { name: 'C', octave: 4 + AppState.octaveOffset, position: 1.0 },
                { name: 'B', octave: 3 + AppState.octaveOffset, position: 0.92 },
                { name: 'A#', octave: 3 + AppState.octaveOffset, position: 0.83 },
                { name: 'A', octave: 3 + AppState.octaveOffset, position: 0.75 },
                { name: 'G#', octave: 3 + AppState.octaveOffset, position: 0.67 },
                { name: 'G', octave: 3 + AppState.octaveOffset, position: 0.58 },
                { name: 'F#', octave: 3 + AppState.octaveOffset, position: 0.50 },
                { name: 'F', octave: 3 + AppState.octaveOffset, position: 0.42 },
                { name: 'E', octave: 3 + AppState.octaveOffset, position: 0.33 },
                { name: 'D#', octave: 3 + AppState.octaveOffset, position: 0.25 },
                { name: 'D', octave: 3 + AppState.octaveOffset, position: 0.17 },
                { name: 'C', octave: 3 + AppState.octaveOffset, position: 0.08 }
            ];
            ruler.innerHTML = '';
            notesToShow.forEach(noteInfo => {
                const item = document.createElement('div'); item.className = 'ruler-item'; item.style.position = 'absolute'; item.style.top = `${(1 - noteInfo.position) * 100}%`;
                const tick = document.createElement('div'); tick.className = 'tick';
                const label = document.createElement('div'); label.className = 'note-label'; label.textContent = `${noteInfo.name}${noteInfo.octave}`;
                item.appendChild(tick); item.appendChild(label); ruler.appendChild(item);
            });
        }

        function freqToNote(freq) {
            const A4 = 440, semitonesFromA4 = 12 * Math.log2(freq / A4);
            const noteIndex = Math.round(semitonesFromA4 + 9) % 12;
            const octave = Math.floor((semitonesFromA4 + 9) / 12);
            const noteName = noteNames[(noteIndex + 12) % 12];
            return { name: noteName, octave: octave, fullName: `${noteName}${octave}`, cents: Math.round((semitonesFromA4 - Math.round(semitonesFromA4)) * 100) };
        }

        function updateThemeColor(noteName) {
            const color = noteColors[noteName] || [100, 100, 100];
            document.documentElement.style.setProperty('--r', color[0]);
            document.documentElement.style.setProperty('--g', color[1]);
            document.documentElement.style.setProperty('--b', color[2]);
        }

        function noteFromPad(y) {
            const padHeight = elements.pad.clientHeight, ratio = 1 - (y / padHeight);
            const baseFreq = 130.81 * Math.pow(2, AppState.octaveOffset);
            return baseFreq * Math.pow(2, (ratio * 12) / 12);
        }

        function applyPitch() {
            if (!AppState.audioCtx || AppState.audioCtx.state !== 'running') return;
            const freq = AppState.baseFreq, noteInfo = freqToNote(freq);
            AppState.oscillators.forEach(osc => osc.frequency.setTargetAtTime(freq, AppState.audioCtx.currentTime, 0.01));
            const centDisplay = noteInfo.cents !== 0 ? ` (${noteInfo.cents > 0 ? '+' : ''}${noteInfo.cents}¢)` : '';
            elements.noteDisplay.textContent = noteInfo.fullName + centDisplay;
            elements.frequencyDisplay.textContent = `${freq.toFixed(2)} Hz`;
            elements.octaveDisplay.textContent = `Octave ${noteInfo.octave}`;
            updateThemeColor(noteInfo.name);
        }

        function handleTouch(e) {
            e.preventDefault();
            if (!AppState.audioCtx || AppState.audioCtx.state !== 'running') {
                showStatus('Start the synth first', 2000); return;
            }
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const rect = elements.pad.getBoundingClientRect();
            const y = clientY - rect.top;
            const x = clientX - rect.left;
            
            AppState.baseFreq = noteFromPad(y);
            const volume = x / rect.width;
            AppState.masterGain.gain.setTargetAtTime(volume * 0.4, AppState.audioCtx.currentTime, 0.01);
            if (AppState.isManualWah) {
                AppState.manualWahPosition = x / rect.width;
                updateManualWah();
            }
            applyPitch();
        }

        function updateManualWah() {
            if (!manualWahFilter) return;
            const minFreq = 200, maxFreq = 2000;
            const freq = minFreq + (AppState.manualWahPosition * (maxFreq - minFreq));
            manualWahFilter.frequency.setTargetAtTime(freq, AppState.audioCtx.currentTime, 0.01);
            elements.wahDisplay.textContent = `Wah: ${Math.round(AppState.manualWahPosition * 100)}%`;
            elements.wahDisplay.style.display = 'block';
        }

        function enableMotion() {
            if (typeof DeviceOrientationEvent.requestPermission === "function") {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response === 'granted') startMotionControl();
                    else showStatus('Motion permission denied', 3000);
                }).catch(() => {
                    startMotionControl();
                });
            } else startMotionControl();
        }

        function startMotionControl() {
            window.addEventListener("deviceorientation", handleOrientation);
            AppState.motionEnabled = true;
            elements.motionBtn.textContent = "Disable Motion";
            elements.motionBtn.classList.add('active');
            elements.motionDisplay.style.display = 'block';
            showStatus('Motion control enabled');
        }

        function disableMotion() {
            window.removeEventListener("deviceorientation", handleOrientation);
            AppState.motionEnabled = false; AppState.tiltBend = 0; applyPitch();
            elements.motionBtn.textContent = "Enable Motion";
            elements.motionBtn.classList.remove('active');
            elements.motionDisplay.style.display = 'none';
            showStatus('Motion control disabled');
        }

        function handleOrientation(e) {
            if (e.beta !== null) {
                const norm = e.beta / 45; AppState.tiltBend = norm * 12;
                const baseFreq = 130.81 * Math.pow(2, AppState.octaveOffset);
                AppState.baseFreq = baseFreq * Math.pow(2, AppState.tiltBend / 12);
                applyPitch();
                elements.motionDisplay.textContent = `Tilt: ${Math.round(e.beta)}° (${AppState.tiltBend > 0 ? '+' : ''}${Math.round(AppState.tiltBend * 10) / 10} st)`;
            }
        }

        function stopSynth() {
            if (!AppState.audioCtx) { showStatus('No synth is running'); return; }
            try {
                AppState.audioCtx.close().then(() => {
                    AppState.audioCtx = null; AppState.oscillators = []; AppState.isPlaying = false;
                    updateButtonStates(); showStatus('Synth stopped');
                }).catch(error => {
                    console.error('Error closing audio context:', error); showStatus('Error stopping synth', 4000);
                });
            } catch (error) {
                console.error('Error in stopSynth:', error); showStatus('Error stopping synth', 4000);
            }
        }

        function initializeEventListeners() {
            elements.pad.addEventListener("touchstart", handleTouch, { passive: false });
            elements.pad.addEventListener("touchmove", handleTouch, { passive: false });
            elements.pad.addEventListener("mousedown", handleTouch);
            elements.pad.addEventListener("mousemove", e => { if (e.buttons === 1) handleTouch(e); });

            elements.startBtn.addEventListener("click", startSynth);
            elements.stopBtn.addEventListener("click", stopSynth);
            elements.motionBtn.addEventListener("click", enableMotion);
            elements.toggleControls.addEventListener("click", toggleControls);
            
            document.getElementById("octUp").addEventListener("click", () => { AppState.octaveOffset++; applyPitch(); createNoteRuler(); });
            document.getElementById("octDown").addEventListener("click", () => { AppState.octaveOffset--; applyPitch(); createNoteRuler(); });

            document.getElementById("waveSelect").addEventListener("change", e => {
                AppState.waveType = e.target.value;
                if (AppState.oscillators.length > 0) AppState.oscillators.forEach(osc => osc.type = AppState.waveType);
            });
            
            document.getElementById("detuneRange").addEventListener("input", e => {
                AppState.detuneAmount = parseFloat(e.target.value);
                if (AppState.oscillators.length > 0) {
                    AppState.oscillators.forEach((osc, i) => {
                        const det = (i - Math.floor(AppState.NUM_OSC / 2)) * AppState.detuneAmount;
                        osc.detune.setValueAtTime(det, AppState.audioCtx.currentTime);
                    });
                }
            });

            // Effect controls
            const controls = {
                "filterFreq": (val) => AppState.filter?.frequency.setTargetAtTime(val, AppState.audioCtx.currentTime, 0.01),
                "filterReso": (val) => AppState.filter && (AppState.filter.Q.value = val),
                "delayTime": (val) => AppState.delayNode && (AppState.delayNode.delayTime.value = val / 1000),
                "delayFeedback": (val) => AppState.delayFeedback && (AppState.delayFeedback.gain.value = val / 100),
                "reverbMix": (val) => reverbDryWet && (reverbDryWet.gain.value = val / 100),
                "autoWahRate": (val) => autoWahLFO && (autoWahLFO.frequency.value = val),
                "autoWahDepth": (val) => autoWahLFO && (autoWahLFO.gain.value = val),
                "wahFreq": (val) => {
                    autoWahFilter && (autoWahFilter.frequency.value = val);
                    manualWahFilter && (manualWahFilter.frequency.value = val);
                },
                "wahReso": (val) => {
                    autoWahFilter && (autoWahFilter.Q.value = val);
                    manualWahFilter && (manualWahFilter.Q.value = val);
                }
            };

            Object.entries(controls).forEach(([id, setter]) => {
                document.getElementById(id).addEventListener("input", e => setter(parseFloat(e.target.value)));
            });

            document.getElementById("distAmount").addEventListener("input", e => {
                const amount = parseFloat(e.target.value);
                if (distortionWaveShaper && AppState.audioCtx) {
                    const newWaveShaper = createDistortion(AppState.audioCtx, amount);
                    distortionGain.disconnect(); distortionGain.connect(newWaveShaper); newWaveShaper.connect(AppState.audioCtx.destination);
                    distortionWaveShaper = newWaveShaper;
                }
            });

            // Effect toggles
            const toggles = {
                toggleFilter: ['isFilter', AppState.filter],
                toggleReverb: ['isReverb', reverbDryWet],
                toggleFlanger: ['isFlanger', flangerDryWet],
                togglePhaser: ['isPhaser', phaserDryWet],
                toggleDist: ['isDist', distortionGain],
                toggleDelay: ['isDelay', delayDryWet],
                toggleChorus: ['isChorus', chorusDryWet],
                toggleTremolo: ['isTremolo', tremoloDryWet],
                toggleBitCrusher: ['isBitCrusher', bitCrusherDryWet]
            };

            Object.entries(toggles).forEach(([id, [stateKey, node]]) => {
                document.getElementById(id).addEventListener("click", () => {
                    AppState[stateKey] = !AppState[stateKey];
                    if (node) node.gain.setTargetAtTime(AppState[stateKey] ? 1 : 0, AppState.audioCtx.currentTime, 0.01);
                    document.getElementById(id).classList.toggle('active', AppState[stateKey]);
                });
            });

            document.getElementById("toggleAutoWah").addEventListener("click", () => {
                AppState.isAutoWah = !AppState.isAutoWah; AppState.isManualWah = false;
                if (autoWahDryWet) autoWahDryWet.gain.setTargetAtTime(AppState.isAutoWah ? 1 : 0, AppState.audioCtx.currentTime, 0.01);
                if (manualWahDryWet) manualWahDryWet.gain.setTargetAtTime(0, AppState.audioCtx.currentTime, 0.01);
                document.getElementById("toggleAutoWah").classList.toggle('active', AppState.isAutoWah);
                document.getElementById("toggleManualWah").classList.toggle('active', false);
                elements.wahDisplay.style.display = AppState.isAutoWah ? 'block' : 'none';
                elements.wahDisplay.textContent = "Auto Wah: ON";
            });
            
            document.getElementById("toggleManualWah").addEventListener("click", () => {
                AppState.isManualWah = !AppState.isManualWah; AppState.isAutoWah = false;
                if (manualWahDryWet) manualWahDryWet.gain.setTargetAtTime(AppState.isManualWah ? 1 : 0, AppState.audioCtx.currentTime, 0.01);
                if (autoWahDryWet) autoWahDryWet.gain.setTargetAtTime(0, AppState.audioCtx.currentTime, 0.01);
                document.getElementById("toggleManualWah").classList.toggle('active', AppState.isManualWah);
                document.getElementById("toggleAutoWah").classList.toggle('active', false);
                elements.wahDisplay.style.display = AppState.isManualWah ? 'block' : 'none';
                if (AppState.isManualWah) updateManualWah();
            });
        }

        window.addEventListener('load', () => {
            createNoteRuler(); updateThemeColor('C'); initializeEventListeners(); 
            updateButtonStates(); showStatus('Ready to play');
        });

        window.addEventListener("contextmenu", e => e.preventDefault());
        window.addEventListener('resize', () => createNoteRuler());
    </script>
</body>
</html>
