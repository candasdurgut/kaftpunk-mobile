<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Next-Gen Pad Synth – Ultra Low Latency</title>

<style>
    html,body {
        margin:0; padding:0; width:100%; height:100%; overflow:hidden;
        background:#000; touch-action:none; user-select:none;
        font-family:sans-serif; color:#0f0;
    }
    #pad {
        position:absolute; left:0; top:0; width:100%; height:100%;
        background:#111;
    }
</style>
</head>

<body>
<div id="pad"></div>

<script>
/* ---------------------------------------------------------
   1. Audio Context + Worklet Setup (Ultra-low latency mode)
------------------------------------------------------------*/
let audio;
let fmIndex = 0;
let currentNote = null;
let lastX = 0, lastY = 0;
let freqTarget = 440;
let volTarget = 0.4;

/*** RENDERER: AudioWorklet Code (no heap allocations) ***/
const workletCode = `
class Synth extends AudioWorkletProcessor {
  static get parameterDescriptors() {
    return [
      { name:"gain", defaultValue:0.3, minValue:0, maxValue:1 },
      { name:"freq", defaultValue:440, minValue:20, maxValue:20000 },
      { name:"fmIndex", defaultValue:0, minValue:0, maxValue:2000 }
    ];
  }

  constructor() {
    super();
    this.phase = 0;
    this.modPhase = 0;
    this.sr = sampleRate;
  }

  process(inputs, outputs, params) {
    const out = outputs[0][0];
    const gain = params.gain;
    const freq = params.freq;
    const fmIndex = params.fmIndex;

    for (let i=0; i<128; i++) {
      const f = freq.length>1? freq[i] : freq[0];
      const idx = fmIndex.length>1? fmIndex[i] : fmIndex[0];
      // real FM (phase modulation)
      this.modPhase += f*2*Math.PI / this.sr;
      const mod = Math.sin(this.modPhase) * idx;
      this.phase += (f*2*Math.PI + mod) / this.sr;

      const g = gain.length>1? gain[i] : gain[0];
      out[i] = Math.sin(this.phase) * g;
    }
    return true;
  }
}
registerProcessor("synth", Synth);
`;

/* ---------------------------------------------------------
   2. Audio Graph: Optimized Routing
   worklet → (tremolo) → master → (delay/reverb/chorus/flanger) → out
------------------------------------------------------------*/
async function initAudio() {
  audio = new AudioContext({ latencyHint: "interactive", sampleRate: 48000 });

  // Load Worklet
  const blob = new Blob([workletCode], {type:"application/javascript"});
  await audio.audioWorklet.addModule(URL.createObjectURL(blob));

  // Main synth node
  const synth = new AudioWorkletNode(audio, "synth", {
    numberOfInputs:0,
    numberOfOutputs:1,
    outputChannelCount:[1]
  });

  // Tremolo
  const tremGain = audio.createGain();
  const tremLFO = audio.createOscillator();
  const tremDepth = audio.createGain();
  tremDepth.gain.value = 0.5;
  tremLFO.frequency.value = 5;
  tremLFO.connect(tremDepth).connect(tremGain.gain);
  tremLFO.start();

  // Master gain
  const master = audio.createGain();
  master.gain.value = 0.7;

  // Delay (fast)
  const delay = audio.createDelay(1.0);
  delay.delayTime.value = 0.25;
  const delayFb = audio.createGain();
  delayFb.gain.value = 0.3;
  delay.connect(delayFb).connect(delay);

  // Reverb (lightweight convolution)
  const convolver = audio.createConvolver();
  convolver.normalize = true;
  convolver.buffer = makeImpulse(audio, 1.2);

  // Chorus / Flanger (light)
  const chorus = audio.createDelay(0.03);
  const chorusLFO = audio.createOscillator();
  const chorusDepth = audio.createGain();
  chorusDepth.gain.value = 0.002;
  chorusLFO.frequency.value = 0.6;
  chorusLFO.connect(chorusDepth).connect(chorus.delayTime);
  chorusLFO.start();

  const flanger = audio.createDelay(0.005);
  const flangerLFO = audio.createOscillator();
  const flangerDepth = audio.createGain();
  flangerDepth.gain.value = 0.001;
  flangerLFO.frequency.value = 0.3;
  flangerLFO.connect(flangerDepth).connect(flanger.delayTime);
  flangerLFO.start();

  // Routing: all parallel FX merge → destination
  const merger = audio.createGain();
  synth.connect(tremGain).connect(master).connect(merger);

  master.connect(delay);
  delay.connect(merger);

  master.connect(convolver);
  convolver.connect(merger);

  master.connect(chorus);
  chorus.connect(merger);

  master.connect(flanger);
  flanger.connect(merger);

  merger.connect(audio.destination);

  window.SYN = synth;
}

/* ---------------------------------------------------------
   3. Touch Handling (latency optimized)
------------------------------------------------------------*/
function posToFreq(x) {
  const f = 80 * Math.pow(2, x * 3.5); // 80Hz–~7kHz
  return f;
}
function posToGain(y) {
  return Math.max(0.05, 1 - y);
}

function pointer(e) {
  const x = e.clientX / innerWidth;
  const y = e.clientY / innerHeight;
  freqTarget = posToFreq(x);
  volTarget = posToGain(y);

  if (audio && audio.state==="running") {
    const t = audio.currentTime + 0.01;
    SYN.parameters.get("freq").setTargetAtTime(freqTarget, t, 0.015);
    SYN.parameters.get("gain").setTargetAtTime(volTarget, t, 0.03);
  }
}

document.getElementById("pad").addEventListener("pointermove", pointer);
document.getElementById("pad").addEventListener("pointerdown", () => {
  audio.resume();
  SYN.parameters.get("gain").value = volTarget;
});
document.getElementById("pad").addEventListener("pointerup", () => {
  SYN.parameters.get("gain").setTargetAtTime(0, audio.currentTime, 0.05);
});

/* ---------------------------------------------------------
   4. Motion → Pitch Bend (clamped)
------------------------------------------------------------*/
window.addEventListener("deviceorientation", (ev)=>{
  const bend = (ev.beta - 50) * 0.01; // -0.5 to +0.5
  const t = audio.currentTime + 0.015;
  SYN.parameters.get("freq").setTargetAtTime(freqTarget * (1+bend), t, 0.02);
});

/* ---------------------------------------------------------
   5. Lightweight Reverb Impulse
------------------------------------------------------------*/
function makeImpulse(ctx, dur) {
  const len = ctx.sampleRate * dur;
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1-i/len);
  return buf;
}

/* ---------------------------------------------------------
   Init
------------------------------------------------------------*/
initAudio();
</script>
</body>
</html>
