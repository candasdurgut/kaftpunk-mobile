<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Synth v2</title>

<style>
:root {
--r:100;--g:100;--b:100;
--c:rgba(var(--r),var(--g),var(--b),1);
--bg:rgba(var(--r),var(--g),var(--b),0.10);
--ui:rgba(var(--r),var(--g),var(--b),0.22);
--txt:#fff;
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;font-family:-apple-system,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;}

#pad{
height:100vh;display:flex;align-items:center;justify-content:center;
position:relative;background:radial-gradient(circle,var(--ui),#000);
}

.float{
position:absolute;padding:8px 16px;border-radius:20px;
background:rgba(0,0,0,0.45);backdrop-filter:blur(15px);
border:1px solid var(--ui);
}

#note{top:25px;left:50%;transform:translateX(-50%);font-size:26px;font-weight:600;text-shadow:0 0 12px var(--c);}
#tilt{bottom:120px;left:50%;transform:translateX(-50%);display:none;}
#wah{bottom:80px;left:50%;transform:translateX(-50%);display:none;}
#pan{bottom:40px;left:50%;transform:translateX(-50%);display:none;}

#ruler{
position:absolute;right:0;top:0;bottom:0;width:60px;
background:rgba(0,0,0,0.2);display:flex;flex-direction:column;padding:10px 0;
}

.r{flex:1;display:flex;align-items:center;justify-content:center;font-size:11px;border-bottom:1px solid rgba(255,255,255,0.1);}

#controls{
position:fixed;bottom:0;left:0;right:0;transform:translateY(calc(100% - 50px));
background:rgba(0,0,0,0.6);backdrop-filter:blur(30px);
padding:15px;border-top:1px solid var(--ui);transition:0.3s;
display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
}

#controls.show{transform:translateY(0);}

.btn,select,input[type=range]{
background:var(--ui);border:1px solid var(--ui);color:var(--txt);
padding:10px;border-radius:8px;font-size:12px;cursor:pointer;
}

.btn.active{background:var(--c);color:#000;font-weight:700;}

#toggle{
position:fixed;bottom:10px;right:15px;width:50px;height:50px;
border-radius:50%;display:flex;justify-content:center;align-items:center;
background:var(--ui);border:2px solid var(--ui);font-size:20px;
}

.group{grid-column:1/-1;padding:10px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid var(--ui);}
</style>
</head>

<body>

<div id="pad">
<div id="note" class="float">C4</div>
<div id="tilt" class="float">Tilt:0</div>
<div id="wah" class="float">Wah</div>
<div id="pan" class="float">Pan</div>
<div id="ruler"></div>
</div>

<div id="toggle">⚙️</div>

<div id="controls">
<button class="btn" id="start">Start</button>
<button class="btn" id="stop" disabled>Stop</button>
<button class="btn" id="motion">Motion</button>
<button class="btn" id="panning">Pan</button>
<button class="btn" id="oct-">Oct-</button>
<button class="btn" id="oct+">Oct+</button>

<select id="wave">
<option>sawtooth</option><option>triangle</option><option>square</option>
<option>sine</option><option>pulse</option><option>fm</option>
</select>

<input type="range" id="detune" min="0" max="50" value="15">
<input type="range" id="ff" min="200" max="20000" value="20000">
<input type="range" id="fq" min="0.5" max="20" value="1">

<div class="group">
<button class="btn fx" data-fx="dist">Dist</button>
<button class="btn fx" data-fx="wah">Wah</button>
<button class="btn fx" data-fx="flanger">Flanger</button>
<button class="btn fx" data-fx="chorus">Chorus</button>
<button class="btn fx" data-fx="trem">Trem</button>
<button class="btn fx" data-fx="delay">Delay</button>
<button class="btn fx" data-fx="rev">Reverb</button>
</div>
</div>

<script>
/* ============================================================
   S I M P L E   S Y N T H   v 2  -  O P T I M I Z E D
   ============================================================ */

const UI={
pad:$("#pad"),note:$("#note"),tilt:$("#tilt"),wah:$("#wah"),pan:$("#pan"),
controls:$("#controls"),toggle:$("#toggle"),ruler:$("#ruler")
};

function $(q){return document.querySelector(q);}
function on(el,ev,cb){el.addEventListener(ev,cb);}

const colors={
C:[255,60,60],C#:[255,140,40],D:[255,255,60],D#:[140,255,80],E:[50,255,50],
F:[50,255,180],F#:[40,255,255],G:[60,150,255],G#:[80,80,255],
A:[160,80,255],A#:[255,60,255],B:[255,60,160]
};

function theme(n){
let c=colors[n]||[200,200,200];
document.documentElement.style.setProperty("--r",c[0]);
document.documentElement.style.setProperty("--g",c[1]);
document.documentElement.style.setProperty("--b",c[2]);
}

let A=null,osc=[],master,panner,filter;
let base=261.63,oct=0,tilt=0,isPlay=false;

function initAudio(){
A=new AudioContext();
master=A.createGain();master.gain.value=.25;
panner=A.createStereoPanner();

filter=A.createBiquadFilter();filter.type="lowpass";filter.frequency.value=20000;

connectChain();
makeOsc();
}

function connectChain(){
master.disconnect();
master.connect(filter);
filter.connect(panner);
panner.connect(A.destination);
}

function makeOsc(){
osc.forEach(o=>o.stop());
osc=[];
let t=A.currentTime;

for(let i=0;i<7;i++){
let o=A.createOscillator();
o.type=$("#wave").value;
o.frequency.value=base;
o.detune.value=(i-3)*$("#detune").value;
o.connect(master);
o.start(t);
osc.push(o);
}
}

function setFreq(f){
osc.forEach(o=>o.frequency.setTargetAtTime(f,A.currentTime,0.001));
let n=nFromF(f);
UI.note.textContent=n;
theme(n.replace(/[0-9]/g,""));
}

function nFromF(f){
let a=12*Math.log2(f/440)+57;
let i=(Math.round(a)%12+12)%12;
let o=Math.floor((Math.round(a))/12);
return ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"][i]+o;
}

function padFreq(y){
let r=1-(y/innerHeight);
let bf=65.41*Math.pow(2,oct);
return bf*Math.pow(2,(r*24)/12);
}

/* TOUCH */
on(UI.pad,"mousemove",e=>{if(e.buttons)touch(e.clientX,e.clientY)});
on(UI.pad,"mousedown",e=>touch(e.clientX,e.clientY));
on(UI.pad,"touchmove",e=>{
e.preventDefault();
let t=e.touches[0];touch(t.clientX,t.clientY);
},{passive:false});

function touch(x,y){
if(!isPlay)return;
let f=padFreq(y);setFreq(f);
master.gain.setTargetAtTime((x/innerWidth)*0.5,A.currentTime,0.01);
}

/* UI */
on(UI.toggle,"click",()=>UI.controls.classList.toggle("show"));

$("#start").onclick=()=>{
if(isPlay)return;
initAudio();
isPlay=true;
$("#stop").disabled=false;
$("#start").disabled=true;
};

$("#stop").onclick=()=>{
isPlay=false;
osc.forEach(o=>o.stop());
A.close();
$("#stop").disabled=true;
$("#start").disabled=false;
};

$("#oct+").onclick=()=>{oct++;};
$("#oct-").onclick=()=>{oct--;};

$("#wave").onchange=()=>makeOsc();
$("#detune").oninput=()=>makeOsc();
$("#ff").oninput=e=>filter.frequency.value=e.target.value;
$("#fq").oninput=e=>filter.Q.value=e.target.value;

/* PANNING */
let panOn=false;
$("#panning").onclick=()=>{
panOn=!panOn;
$("#panning").classList.toggle("active",panOn);
UI.pan.style.display=panOn?"block":"none";
};

addEventListener("deviceorientation",e=>{
if(panOn && e.gamma!=null){
let p=Math.max(-1,Math.min(1,e.gamma/90));
panner.pan.setTargetAtTime(p,A.currentTime,.01);
UI.pan.textContent=`Pan:${(p*100).toFixed(0)}%`;
}
});

/* MOTION PITCH */
let tiltOn=false;
$("#motion").onclick=()=>{
tiltOn=!tiltOn;
$("#motion").classList.toggle("active",tiltOn);
UI.tilt.style.display=tiltOn?"block":"none";
};

addEventListener("deviceorientation",e=>{
if(tiltOn && e.beta!=null){
let st=e.beta/45*12;
tilt=st;
let bf=padFreq(innerHeight/2);
setFreq(bf*Math.pow(2,st/12));
UI.tilt.textContent=`Tilt:${st.toFixed(1)}st`;
}
});

/* RULER */
(()=>{
let notes=["C6","B5","A#5","A5","G#5","G5","F#5","F5",
"E5","D#5","D5","C#5","C5","B4","A#4","A4","G#4","G4",
"F#4","F4","E4","D#4","D4","C#4","C4"];
UI.ruler.innerHTML=notes.map(n=>`<div class="r">${n}</div>`).join("");
})();
</script>

</body>
</html>
