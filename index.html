<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>Synth Pro — Final</title>
<style>
:root{--r:100;--g:100;--b:100;--bg:rgb(var(--r),var(--g),var(--b));--control-bg:rgba(0,0,0,0.18);--text:#f0f0f0;--border:rgba(var(--r),var(--g),var(--b),0.45)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#111;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial}
body{background:var(--bg);transition:background .12s}
#pad{height:100vh;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at center,var(--control-bg),rgba(0,0,0,0.45));cursor:crosshair;touch-action:none}
#noteDisplay{position:absolute;top:max(20px,env(safe-area-inset-top));left:16px;background:rgba(0,0,0,0.7);color:var(--text);padding:8px 12px;border-radius:16px;border:1px solid var(--border);backdrop-filter:blur(8px);z-index:10;font-size:20px}
#motionDisplay,#wahDisplay,#panDisplay{bottom:18px;left:50%;transform:translateX(-50%);display:none;background:rgba(0,0,0,0.7);color:var(--text);padding:8px 12px;border-radius:16px;border:1px solid var(--border);backdrop-filter:blur(8px);z-index:10}
#noteRuler{position:absolute;right:0;top:0;bottom:0;width:60px;background:rgba(0,0,0,0.28);border-left:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:8px 0;pointer-events:none}
.ruler-note{display:flex;align-items:center;justify-content:center;flex:1;font-size:11px;color:var(--border);border-bottom:1px solid rgba(255,255,255,0.06)}
#controls{position:fixed;left:0;right:0;bottom:0;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;background:rgba(0,0,0,0.92);backdrop-filter:blur(14px);border-top:1px solid var(--border);transform:translateY(calc(100% - 50px));transition:transform .28s;max-height:70vh;overflow-y:auto}
#controls.expanded{transform:translateY(0)}
#toggleControls{position:fixed;right:18px;bottom:12px;width:50px;height:50px;border-radius:50%;background:var(--bg);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1000}
button,select,input[type=range],label{font-family:inherit;font-size:12px;border-radius:8px;border:1px solid var(--border);background:var(--control-bg);color:var(--text);padding:8px}
button{cursor:pointer;transition:all .15s}
button:active{transform:scale(.95)}
button.active{background:var(--bg);color:#111;font-weight:700}
.control-group{display:flex;flex-direction:column;align-items:center;gap:4px}
.control-group label{font-size:11px;color:#aaa}
.rhythm-panel,.effect-group{grid-column:1/-1;display:grid;padding:8px;border-radius:8px;border:1px solid var(--border);gap:8px}
.rhythm-panel{grid-template-columns:repeat(5,1fr);background:rgba(0,0,0,0.3)}
.effect-group{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));background:rgba(0,0,0,0.32)}
#statusMessage{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:rgba(0,0,0,0.85);padding:8px 12px;border-radius:8px;opacity:0;transition:opacity .2s;color:#fff;font-size:12px;pointer-events:none}
#statusMessage.show{opacity:1}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:2000}
.modal-content{background:rgba(30,30,30,0.98);padding:18px;border-radius:12px;border:1px solid var(--border)}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(.96)}100%{transform:scale(1)}}
.pulse{animation:pulse .28s}
@keyframes flash{0%{background:rgba(255,255,255,.1)}50%{background:rgba(255,255,255,.02)}}
.flash{animation:flash .12s}
.bpm-control{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:8px}
.bpm-control label{flex:0 0 auto}
.bpm-control input{flex:1}
.delay-panel{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,0.32)}
.visual-pulse{position:absolute;top:50%;left:50%;width:100px;height:100px;background:radial-gradient(circle,var(--border),transparent 70%);border-radius:50%;transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none}
.visual-pulse.active{animation:pulse-visual .3s ease-out}
@keyframes pulse-visual{0%{transform:translate(-50%,-50%) scale(0);opacity:0.7}100%{transform:translate(-50%,-50%) scale(2);opacity:0}}
</style>
</head>
<body>
<div id="pad">
<div id="noteDisplay">C4 (Oct:0)</div>

<div id="wahDisplay">Wah:ON</div>

<input id="filterFreq" type="range" min="200" max="20000" value="20000" step="100"/>
</div>

<input id="filterReso" type="range" min="0.5" max="10" value="1" step="0.1"/>

<input id="autoWahRate" type="range" min="0.1" max="8" value="1" step="0.1"/>
</div>

<label>Wah Depth</label>
<input id="autoWahDepth" type="range" min="0" max="1200" value="600"/>
</div>
<div class="bpm-control">
<label>BPM: <span id="bpmValue">120</span></label>
<input id="bpmRange" type="range" min="40" max="255" value="120"/>
</div>
<div class="rhythm-panel">
<button id="rhythm4">1/4</button>
<button id="rhythm8">1/8</button>
<button id="rhythm16">1/16</button>
<button id="rhythm32">1/32</button>
<button id="rhythmStop">Stop</button>
<button id="rhythmTriplet">Trip</button>
<button id="rhythmShuffle">Shuf</button>
<button id="rhythmDotted">Dot</button>
<button id="rhythmStutter">Stut</button>
<button id="rhythmRandom">Rnd</button>
</div>
<div class="delay-panel">
<div class="control-group">
<label>Delay Time</label>
<input id="delayTime" type="range" min="0.1" max="1.0" value="0.3" step="0.05"/>
</div>
<div class="control-group">
<label>Delay Feedback</label>
<input id="delayFeedback" type="range" min="0" max="0.9" value="0.45" step="0.05"/>
</div>
<div class="control-group">
<label>Delay Mix</label>
<input id="delayMix" type="range" min="0" max="1" value="0.5" step="0.05"/>
</div>
<div class="control-group">
<button id="toggleDelay">Delay OFF</button>
</div>
</div>
<div class="effect-group">
<button id="toggleDist">Distortion</button>
<button id="toggleAutoWah">Auto Wah</button>
<button id="toggleFlanger">Flanger</button>
<button id="toggleChorus">Chorus</button>
<button id="toggleTremolo">Tremolo</button>
<button id="toggleFilter">Filter</button>
<button id="toggleReverb">Reverb</button>
</div>
</div>
<div id="statusMessage"></div>
<div id="permissionModal" class="modal">
<div class="modal-content">
<h3>Motion Access Required</h3>
<p>This feature needs access to your device's motion sensors for tilt control.</p>
<div style="display:flex;gap:8px;margin-top:12px;">
<button id="permissionAllow">Allow</button>
<button id="permissionDeny">Deny</button>
</div>
</div>
</div>
<script>
// AudioWorklet Processor - Fixed FM and PolyBLEP
const workletCode = `class SynthProcessor extends AudioWorkletProcessor {
    static get parameterDescriptors() {
        return [
            { name: 'baseFreq', defaultValue: 261.63, minValue: 20, maxValue: 20000 },
            { name: 'fmDepth', defaultValue: 0, minValue: 0, maxValue: 5000 },
            { name: 'pulseWidth', defaultValue: 0.5, minValue: 0.01, maxValue: 0.99 }
        ];
    }

    constructor() {
        super();
        this.sampleRate = sampleRate;
        this.numVoices = 7;
        this.phases = new Float32Array(this.numVoices);
        this.fmPhases = new Float32Array(this.numVoices);
        this.detunes = new Float32Array(this.numVoices);
        this.wave = 'sawtooth';
        this.fmEnabled = false;
        this.fmRatio = 1.0;
        this.twoPI = 2 * Math.PI;
        
        this.port.onmessage = e => {
            const d = e.data;
            if (d.type === 'detuneArray' && d.detuneArray) {
                for (let i = 0; i < Math.min(this.numVoices, d.detuneArray.length); i++) {
                    this.detunes[i] = d.detuneArray[i];
                }
            } else if (d.type === 'wave') {
                this.wave = d.wave;
                this.fmEnabled = d.wave === 'fm';
            } else if (d.type === 'voices') {
                const nv = Math.min(12, Math.max(1, d.numVoices));
                if (nv !== this.numVoices) {
                    this.numVoices = nv;
                    this.phases = new Float32Array(this.numVoices);
                    this.fmPhases = new Float32Array(this.numVoices);
                    this.detunes = new Float32Array(this.numVoices);
                }
            }
        };
    }

    polyBLEP(t, dt) {
        if (t < dt) {
            t /= dt;
            return t + t - t * t - 1;
        } else if (t > 1 - dt) {
            t = (t - 1) / dt;
            return t * t + t + t + 1;
        }
        return 0;
    }

    bl_saw(phase, dt) {
        let t = phase % 1;
        let v = 2 * t - 1;
        v -= this.polyBLEP(t, dt);
        return v;
    }

    bl_square(phase, duty, dt) {
        let t = phase % 1;
        let v = t < duty ? 1 : -1;
        v += this.polyBLEP(t, dt);
        let t2 = (t - duty + 1) % 1;
        v -= this.polyBLEP(t2, dt);
        return v;
    }

    process(inputs, outputs, parameters) {
        const out = outputs[0];
        if (!out || !out[0]) return true;

        const chCount = out.length;
        const frames = out[0].length;
        const baseFreqArr = parameters.baseFreq;
        const fmDepthArr = parameters.fmDepth;
        const pulseArr = parameters.pulseWidth;

        const detuneFactors = new Float32Array(this.numVoices);
        for (let v = 0; v < this.numVoices; v++) {
            detuneFactors[v] = Math.pow(2, (this.detunes[v] || 0) / 1200);
        }

        for (let i = 0; i < frames; i++) {
            const baseFreq = baseFreqArr.length > 1 ? baseFreqArr[i] : baseFreqArr[0];
            const fmDepth = fmDepthArr.length > 1 ? fmDepthArr[i] : fmDepthArr[0];
            const pulseW = pulseArr.length > 1 ? pulseArr[i] : pulseArr[0];

            // Calculate maximum frequency for anti-aliasing
            let maxF = baseFreq * detuneFactors[0];
            for (let v = 1; v < this.numVoices; v++) {
                const f = baseFreq * detuneFactors[v];
                if (f > maxF) maxF = f;
            }
            maxF += fmDepth; // Add FM depth for safety
            maxF = Math.min(maxF, this.sampleRate * 0.45);
            const dt = maxF / this.sampleRate;

            let mix = 0;
            for (let v = 0; v < this.numVoices; v++) {
                let freq = baseFreq * detuneFactors[v];
                
                // Real FM synthesis with per-voice modulation
                if (this.fmEnabled && fmDepth !== 0) {
                    const fmFreq = freq * this.fmRatio;
                    const fmInc = fmFreq / this.sampleRate;
                    this.fmPhases[v] += fmInc;
                    if (this.fmPhases[v] >= 1) this.fmPhases[v] -= 1;
                    
                    const fmMod = Math.sin(this.twoPI * this.fmPhases[v]) * fmDepth;
                    freq += fmMod;
                    freq = Math.max(20, Math.min(freq, this.sampleRate * 0.45));
                }

                const phaseInc = freq / this.sampleRate;
                let p = this.phases[v];
                let s = 0;

                switch (this.wave) {
                    case 'sine':
                        s = Math.sin(this.twoPI * p);
                        break;
                    case 'square':
                        s = this.bl_square(p, 0.5, dt);
                        break;
                    case 'pulse':
                        s = this.bl_square(p, pulseW, dt);
                        break;
                    case 'sawtooth':
                        s = this.bl_saw(p, dt);
                        break;
                    case 'triangle':
                        s = 2 * Math.abs(2 * (p - Math.floor(p + 0.5))) - 1;
                        break;
                    case 'fm':
                        // Real FM synthesis - carrier modulated by modulator
                        const carrierPhase = p;
                        const modulator = Math.sin(this.twoPI * this.fmPhases[v]);
                        s = Math.sin(this.twoPI * (carrierPhase + fmDepth * modulator / 1000));
                        break;
                    default:
                        s = Math.sin(this.twoPI * p);
                }
                
                mix += s;
                p += phaseInc;
                if (p >= 1) p -= 1;
                this.phases[v] = p;
            }
            
            mix = mix / this.numVoices * 0.85;
            
            for (let ch = 0; ch < chCount; ch++) {
                out[ch][i] = mix;
            }
        }
        return true;
    }
}

registerProcessor('synth-processor', SynthProcessor);`;

// Fixed Scheduler Worker
const workerCode = `let isRunning = false;
let tempo = 120;
let lookahead = 25;
let step = 0;
let tickIndex = 0;
let startTime = 0;
let workerStartTime = 0;
let nextTickTime = 0;
let scheduleInterval = null;

const patternMultipliers = {
    '4': 1.0,      // 1/4 note
    '8': 0.5,      // 1/8 note  
    '16': 0.25,    // 1/16 note
    '32': 0.125,   // 1/32 note
    'triplet': 0.666, // 1/8 triplet
    'shuffle': 0.333, // shuffle feel
    'dotted': 1.5,   // dotted note
    'stutter': 0.0625, // very fast
    'random': 0.25   // default to 1/16
};

self.onmessage = e => {
    const d = e.data;
    if (d.type === 'start') {
        isRunning = true;
        tempo = d.tempo || 120;
        startTime = d.audioTime + 0.1;
        workerStartTime = performance.now() / 1000;
        tickIndex = 0;
        nextTickTime = startTime;
        setPattern(d.pattern || '16');
        startScheduler();
    } else if (d.type === 'stop') {
        isRunning = false;
        if (scheduleInterval) {
            clearInterval(scheduleInterval);
            scheduleInterval = null;
        }
    } else if (d.type === 'tempo') {
        tempo = d.tempo;
        updateStep();
    } else if (d.type === 'pattern') {
        setPattern(d.pattern);
    }
};

function setPattern(pattern) {
    const multiplier = patternMultipliers[pattern] || 0.25;
    step = (60 / tempo) * multiplier;
}

function updateStep() {
    // Step is recalculated when tempo changes
    const currentPattern = Object.keys(patternMultipliers).find(key => 
        patternMultipliers[key] === step / (60 / tempo)
    ) || '16';
    setPattern(currentPattern);
}

function startScheduler() {
    if (scheduleInterval) {
        clearInterval(scheduleInterval);
    }
    
    scheduleInterval = setInterval(() => {
        if (!isRunning) return;
        
        const currentTime = performance.now() / 1000;
        const audioTime = startTime + (currentTime - workerStartTime);
        
        while (nextTickTime < audioTime + 0.1) {
            const relativeTime = nextTickTime - startTime;
            self.postMessage({
                type: 'beat', 
                relativeTime: relativeTime,
                tickIndex: tickIndex
            });
            
            tickIndex++;
            nextTickTime = startTime + tickIndex * step;
        }
    }, 10);
}`;

// Application State
const AppState = {
    audioCtx: null, engine: null, workletNode: null, lastVolume: 0.3,
    baseFreq: 261.63, octaveOffset: 0, waveType: 'sawtooth', detuneAmount: 15,
    fmDepth: 0, pulseWidth: 0.5, isPlaying: false, motionEnabled: false,
    panEnabled: false, NUM_VOICES: 7, pendingPan: 0, pendingTilt: 0,
    smoothedPan: 0, smoothedTilt: 0, lastDetuneSent: null, schedulerWorker: null,
    workerStartTime: 0, bpm: 120, currentPattern: '16'
};

// DOM Elements
const elements = {
    pad: document.getElementById('pad'), noteDisplay: document.getElementById('noteDisplay'),
    motionDisplay: document.getElementById('motionDisplay'), wahDisplay: document.getElementById('wahDisplay'),
    panDisplay: document.getElementById('panDisplay'), startBtn: document.getElementById('startBtn'),
    stopBtn: document.getElementById('stopBtn'), motionBtn: document.getElementById('motionBtn'),
    panBtn: document.getElementById('panBtn'), statusMessage: document.getElementById('statusMessage'),
    controls: document.getElementById('controls'), toggleControls: document.getElementById('toggleControls'),
    noteRuler: document.getElementById('noteRuler'), permissionModal: document.getElementById('permissionModal'),
    visualPulse: document.getElementById('visualPulse')
};

// Note frequencies and names
const noteFrequencies = {
    'A#2':116.54,'B2':123.47,'C3':130.81,'C#3':138.59,'D3':146.83,'D#3':155.56,
    'E3':164.81,'F3':174.61,'F#3':185,'G3':196,'G#3':207.65,'A3':220,'A#3':233.08,
    'B3':246.94,'C4':261.63,'C#4':277.18,'D4':293.66
};
const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

// Utility Functions
function showStatus(msg, dur = 1500) {
    elements.statusMessage.textContent = msg;
    elements.statusMessage.classList.add('show');
    clearTimeout(showStatus._t);
    showStatus._t = setTimeout(() => elements.statusMessage.classList.remove('show'), dur);
}

function updateButtonStates() {
    elements.startBtn.disabled = AppState.isPlaying;
    elements.stopBtn.disabled = !AppState.isPlaying;
}

// Fixed Audio Engine with proper routing
class AdvancedSynthEngine {
    constructor() {
        this.audioContext = null;
        this.workletNode = null;
        this.audioNodes = {};
        this.effects = {
            dist: false, autoWah: false, flanger: false, chorus: false,
            tremolo: false, filter: true, delay: false, reverb: false
        };
        this.effectLFOs = {};
        this.effectMixers = {};
    }

    async init() {
        this.audioContext = new (window.AudioContext || window.webkitAudioContext)({
            latencyHint: 'interactive',
            sampleRate: 44100
        });
        
        await this._addWorkletModuleSafe();
        this._createNodes();
        this._connectGraph();
        this._postInitialParams();
    }

    async _addWorkletModuleSafe() {
        const blob = new Blob([workletCode], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        try {
            await this.audioContext.audioWorklet.addModule(url);
        } catch (e) {
            URL.revokeObjectURL(url);
            throw e;
        }
        URL.revokeObjectURL(url);
    }

    _createNodes() {
        const ctx = this.audioContext;
        
        // Create all audio nodes
        this.audioNodes.masterGain = ctx.createGain();
        this.audioNodes.masterGain.gain.value = AppState.lastVolume;
        
        this.audioNodes.tremoloGain = ctx.createGain();
        this.audioNodes.tremoloGain.gain.value = 1;
        
        this.audioNodes.panner = ctx.createStereoPanner();
        
        // Effects chain nodes
        this.audioNodes.distortion = this._createWaveShaper(50);
        this.audioNodes.autoWah = ctx.createBiquadFilter();
        this.audioNodes.autoWah.type = 'bandpass';
        this.audioNodes.autoWah.frequency.value = 800;
        this.audioNodes.autoWah.Q.value = 5;
        
        this.audioNodes.filter = ctx.createBiquadFilter();
        this.audioNodes.filter.type = 'lowpass';
        this.audioNodes.filter.frequency.value = 20000;
        this.audioNodes.filter.Q.value = 1;
        
        // Parallel effects with mix controls
        this.audioNodes.chorusDelay = ctx.createDelay(0.05);
        this.audioNodes.chorusLFO = ctx.createOscillator();
        this.audioNodes.chorusLFO.type = 'sine';
        this.audioNodes.chorusLFO.frequency.value = 0.6;
        this.audioNodes.chorusDepth = ctx.createGain();
        this.audioNodes.chorusDepth.gain.value = 0.01;
        
        this.audioNodes.flangerDelay = ctx.createDelay(0.01);
        this.audioNodes.flangerLFO = ctx.createOscillator();
        this.audioNodes.flangerLFO.type = 'sine';
        this.audioNodes.flangerLFO.frequency.value = 0.25;
        this.audioNodes.flangerDepth = ctx.createGain();
        this.audioNodes.flangerDepth.gain.value = 0.005;
        this.audioNodes.flangerFeedback = ctx.createGain();
        this.audioNodes.flangerFeedback.gain.value = 0.45;
        
        this.audioNodes.delay = ctx.createDelay(2);
        this.audioNodes.delay.delayTime.value = 0.3;
        this.audioNodes.delayFeedback = ctx.createGain();
        this.audioNodes.delayFeedback.gain.value = 0.45;
        
        this.audioNodes.reverb = ctx.createConvolver();
        
        // Create impulse response for reverb
        if (!window._cachedReverbBuffer) {
            this._createImpulseAsync(ctx, 1.5).then(buf => {
                window._cachedReverbBuffer = buf;
                this.audioNodes.reverb.buffer = buf;
            }).catch(console.error);
        } else {
            this.audioNodes.reverb.buffer = window._cachedReverbBuffer;
        }
        
        // Effect mixers for parallel routing
        this.effectMixers = {
            chorus: { dry: ctx.createGain(), wet: ctx.createGain() },
            flanger: { dry: ctx.createGain(), wet: ctx.createGain() },
            delay: { dry: ctx.createGain(), wet: ctx.createGain() },
            reverb: { dry: ctx.createGain(), wet: ctx.createGain() }
        };
        
        // Set initial mix levels
        Object.values(this.effectMixers).forEach(mixer => {
            mixer.dry.gain.value = 1;
            mixer.wet.gain.value = 0;
        });
        
        // Start LFOs
        this.audioNodes.chorusLFO.start();
        this.audioNodes.flangerLFO.start();
    }

    _connectGraph() {
        const ctx = this.audioContext;
        
        // Create worklet node
        this.workletNode = new AudioWorkletNode(ctx, 'synth-processor', {
            outputChannelCount: [2]
        });
        
        // Main signal chain: Oscillator -> Tremolo -> Master Volume
        this.workletNode.connect(this.audioNodes.tremoloGain);
        this.audioNodes.tremoloGain.connect(this.audioNodes.masterGain);
        
        // Distortion path (serial)
        const distortionSplit = ctx.createGain();
        this.audioNodes.masterGain.connect(distortionSplit);
        
        distortionSplit.connect(this.audioNodes.distortion);
        this.audioNodes.distortion.connect(this.audioNodes.autoWah);
        this.audioNodes.autoWah.connect(this.audioNodes.filter);
        
        // Main output from filter
        const filterOut = ctx.createGain();
        this.audioNodes.filter.connect(filterOut);
        
        // Parallel effects routing
        const finalMix = ctx.createGain();
        
        // Chorus path
        const chorusSplit = ctx.createGain();
        filterOut.connect(chorusSplit);
        
        chorusSplit.connect(this.effectMixers.chorus.dry);
        chorusSplit.connect(this.audioNodes.chorusDelay);
        
        // Chorus modulation
        this.audioNodes.chorusLFO.connect(this.audioNodes.chorusDepth);
        this.audioNodes.chorusDepth.connect(this.audioNodes.chorusDelay.delayTime);
        
        this.audioNodes.chorusDelay.connect(this.effectMixers.chorus.wet);
        
        // Flanger path
        const flangerSplit = ctx.createGain();
        filterOut.connect(flangerSplit);
        
        flangerSplit.connect(this.effectMixers.flanger.dry);
        flangerSplit.connect(this.audioNodes.flangerDelay);
        
        // Flanger modulation and feedback
        this.audioNodes.flangerLFO.connect(this.audioNodes.flangerDepth);
        this.audioNodes.flangerDepth.connect(this.audioNodes.flangerDelay.delayTime);
        this.audioNodes.flangerDelay.connect(this.audioNodes.flangerFeedback);
        this.audioNodes.flangerFeedback.connect(this.audioNodes.flangerDelay);
        this.audioNodes.flangerDelay.connect(this.effectMixers.flanger.wet);
        
        // Delay path
        const delaySplit = ctx.createGain();
        filterOut.connect(delaySplit);
        
        delaySplit.connect(this.effectMixers.delay.dry);
        delaySplit.connect(this.audioNodes.delay);
        this.audioNodes.delay.connect(this.audioNodes.delayFeedback);
        this.audioNodes.delayFeedback.connect(this.audioNodes.delay);
        this.audioNodes.delay.connect(this.effectMixers.delay.wet);
        
        // Reverb path
        const reverbSplit = ctx.createGain();
        filterOut.connect(reverbSplit);
        
        reverbSplit.connect(this.effectMixers.reverb.dry);
        reverbSplit.connect(this.audioNodes.reverb);
        this.audioNodes.reverb.connect(this.effectMixers.reverb.wet);
        
        // Connect all dry/wet mixes to final output
        Object.values(this.effectMixers).forEach(mixer => {
            mixer.dry.connect(finalMix);
            mixer.wet.connect(finalMix);
        });
        
        // Connect to output
        finalMix.connect(this.audioNodes.panner);
        this.audioNodes.panner.connect(ctx.destination);
        
        this.params = this.workletNode.parameters;
    }

    _createWaveShaper(amount) {
        const ctx = this.audioContext;
        const ws = ctx.createWaveShaper();
        const N = 2048;
        const curve = new Float32Array(N);
        
        for (let i = 0; i < N; i++) {
            const x = (i / (N - 1)) * 2 - 1;
            curve[i] = Math.tanh(x * (1 + amount / 50));
        }
        
        ws.curve = curve;
        ws.oversample = '4x';
        return ws;
    }

    async _createImpulseAsync(ctx, seconds = 1.5) {
        const len = Math.floor(ctx.sampleRate * seconds);
        const buf = ctx.createBuffer(2, len, ctx.sampleRate);
        
        for (let c = 0; c < 2; c++) {
            const data = buf.getChannelData(c);
            for (let i = 0; i < len; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2) * 0.6;
            }
        }
        
        return buf;
    }

    _postInitialParams() {
        if (!this.workletNode) return;
        
        try {
            const detunes = [];
            const center = Math.floor(AppState.NUM_VOICES / 2);
            for (let i = 0; i < AppState.NUM_VOICES; i++) {
                detunes.push((i - center) * AppState.detuneAmount);
            }
            
            const key = detunes.join(',');
            if (AppState.lastDetuneSent !== key) {
                this.workletNode.port.postMessage({ type: 'detuneArray', detuneArray: detunes });
                AppState.lastDetuneSent = key;
            }
            
            this.workletNode.port.postMessage({ type: 'wave', wave: AppState.waveType });
            this.workletNode.port.postMessage({ type: 'voices', numVoices: AppState.NUM_VOICES });
            
        } catch (e) {
            console.warn('postInitialParams:', e);
        }
    }

    // Effect control methods
    enableAutoWah(on) {
        if (on && !this.effectLFOs.autoWah) {
            const ctx = this.audioContext;
            const lfo = ctx.createOscillator();
            const g = ctx.createGain();
            
            lfo.type = 'sine';
            lfo.frequency.value = parseFloat(document.getElementById('autoWahRate').value || 1);
            g.gain.value = parseFloat(document.getElementById('autoWahDepth').value || 600);
            
            lfo.connect(g);
            g.connect(this.audioNodes.autoWah.frequency);
            
            if (ctx.state === 'running') lfo.start();
            else ctx.resume().then(() => lfo.start()).catch(() => {});
            
            this.effectLFOs.autoWah = { lfo, gain: g };
        } else if (!on && this.effectLFOs.autoWah) {
            try {
                this.effectLFOs.autoWah.lfo.disconnect();
                this.effectLFOs.autoWah.gain.disconnect();
                this.effectLFOs.autoWah.lfo.stop();
            } catch (e) {}
            this.effectLFOs.autoWah = null;
        }
    }

    updateEffectParameters() {
        const ef = this.effects;
        
        // Update effect mix levels
        this.effectMixers.chorus.wet.gain.value = ef.chorus ? 0.3 : 0;
        this.effectMixers.chorus.dry.gain.value = ef.chorus ? 0.7 : 1;
        
        this.effectMixers.flanger.wet.gain.value = ef.flanger ? 0.5 : 0;
        this.effectMixers.flanger.dry.gain.value = ef.flanger ? 0.5 : 1;
        
        this.effectMixers.delay.wet.gain.value = ef.delay ? parseFloat(document.getElementById('delayMix').value) : 0;
        this.effectMixers.delay.dry.gain.value = ef.delay ? (1 - parseFloat(document.getElementById('delayMix').value)) : 1;
        
        this.effectMixers.reverb.wet.gain.value = ef.reverb ? 0.4 : 0;
        this.effectMixers.reverb.dry.gain.value = ef.reverb ? 0.6 : 1;
        
        // Enable/disable effects
        this.enableAutoWah(ef.autoWah);
        
        // Filter bypass
        if (this.audioNodes.filter) {
            this.audioNodes.filter.frequency.value = ef.filter ? 
                parseFloat(document.getElementById('filterFreq').value) : 20000;
        }
        
        // Tremolo positioning fix - moved after all effects
        if (ef.tremolo && !this.effectLFOs.tremolo) {
            const ctx = this.audioContext;
            const lfo = ctx.createOscillator();
            const g = ctx.createGain();
            const offset = ctx.createConstantSource();
            
            lfo.type = 'sine';
            lfo.frequency.value = 5;
            g.gain.value = 0.3; // Reduced depth for better sound
            offset.offset.value = 0.7; // Higher base level
            
            lfo.connect(g);
            g.connect(this.audioNodes.tremoloGain.gain);
            offset.connect(this.audioNodes.tremoloGain.gain);
            
            if (ctx.state === 'running') {
                lfo.start();
                offset.start();
            } else {
                ctx.resume().then(() => {
                    lfo.start();
                    offset.start();
                }).catch(() => {});
            }
            
            this.effectLFOs.tremolo = { lfo, gain: g, offset };
        } else if (!ef.tremolo && this.effectLFOs.tremolo) {
            try {
                this.effectLFOs.tremolo.lfo.disconnect();
                this.effectLFOs.tremolo.gain.disconnect();
                this.effectLFOs.tremolo.offset.disconnect();
                this.effectLFOs.tremolo.lfo.stop();
                this.effectLFOs.tremolo.offset.stop();
            } catch (e) {}
            this.effectLFOs.tremolo = null;
            this.audioNodes.tremoloGain.gain.value = 1;
        }
    }

    dispose() {
        try {
            if (this.workletNode) {
                try { this.workletNode.disconnect(); } catch (e) {}
                this.workletNode = null;
            }
            
            ['autoWah', 'tremolo'].forEach(k => {
                if (this.effectLFOs[k]) {
                    try {
                        this.effectLFOs[k].lfo.disconnect();
                        this.effectLFOs[k].gain && this.effectLFOs[k].gain.disconnect();
                        this.effectLFOs[k].offset && this.effectLFOs[k].offset.disconnect();
                        this.effectLFOs[k].lfo.stop();
                        this.effectLFOs[k].offset && this.effectLFOs[k].offset.stop();
                    } catch (e) {}
                    this.effectLFOs[k] = null;
                }
            });
        } catch (e) {
            console.error('Dispose error:', e);
        }
    }
}

// Fixed Scheduler
class AdvancedScheduler {
    constructor() {
        this.isRunning = false;
        this.tempo = 120;
    }

    start(callback, pattern = '16') {
        if (!AppState.engine || !AppState.audioCtx) return;
        
        this.stop();
        this.isRunning = true;
        AppState.currentPattern = pattern;
        
        if (!AppState.schedulerWorker) {
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            const url = URL.createObjectURL(blob);
            AppState.schedulerWorker = new Worker(url);
            URL.revokeObjectURL(url);
            
            AppState.schedulerWorker.onmessage = e => {
                if (e.data.type === 'beat') {
                    const audioTime = AppState.audioCtx.currentTime + e.data.relativeTime;
                    callback(audioTime, e.data.tickIndex);
                }
            };
        }
        
        AppState.workerStartTime = performance.now() / 1000;
        AppState.schedulerWorker.postMessage({
            type: 'start',
            audioTime: AppState.audioCtx.currentTime,
            pattern: pattern,
            tempo: AppState.bpm
        });
    }

    stop() {
        this.isRunning = false;
        if (AppState.schedulerWorker) {
            AppState.schedulerWorker.postMessage({ type: 'stop' });
        }
    }
}

const scheduler = new AdvancedScheduler();

// Audio control functions
function isAudioRunning() {
    return AppState.audioCtx && AppState.audioCtx.state === 'running';
}

function createEngineAndStart() {
    if (AppState.isPlaying) {
        showStatus('Already running');
        return;
    }
    
    AppState.engine = new AdvancedSynthEngine();
    AppState.engine.init().then(() => {
        AppState.audioCtx = AppState.engine.audioContext;
        AppState.workletNode = AppState.engine.workletNode;
        AppState.isPlaying = true;
        updateButtonStates();
        showStatus('Started ✓');
        AppState.engine._postInitialParams();
    }).catch(err => {
        console.error('Engine init failed', err);
        showStatus('Audio init failed');
    });
}

function stopSynth() {
    if (!AppState.audioCtx) {
        showStatus('No synth running');
        return;
    }
    
    try {
        scheduler.stop();
        AppState.engine.dispose();
        AppState.audioCtx.close().then(() => {
            AppState.audioCtx = null;
            AppState.engine = null;
            AppState.workletNode = null;
            AppState.isPlaying = false;
            updateButtonStates();
            showStatus('Stopped');
        }).catch(e => {
            console.error(e);
            showStatus('Stop error');
        });
    } catch (e) {
        console.error(e);
        showStatus('Stop error');
    }
}

// Fixed touch and audio functions
function noteFromPad(y) {
    const padHeight = window.innerHeight;
    const ratio = 1 - y / padHeight;
    const notes = Object.keys(noteFrequencies);
    const idx = Math.max(0, Math.min(notes.length - 1, Math.floor(ratio * (notes.length - 1))));
    return noteFrequencies[notes[idx]];
}

function applyPitchToWorklet(freq) {
    if (!AppState.engine || !AppState.engine.workletNode || !AppState.audioCtx) return;
    
    try {
        const param = AppState.engine.workletNode.parameters.get('baseFreq');
        const t = AppState.audioCtx.currentTime;
        
        // Get current value safely
        let currentValue;
        try {
            currentValue = param.value;
        } catch (e) {
            currentValue = freq;
        }
        
        param.cancelScheduledValues(t);
        param.setValueAtTime(currentValue, t);
        param.linearRampToValueAtTime(freq, t + 0.03);
        
        const noteInfo = freqToNote(freq);
        elements.noteDisplay.textContent = `${noteInfo.fullName} (Oct:${AppState.octaveOffset})`;
        updateThemeColor(noteInfo.name);
    } catch (e) {
        console.warn('Pitch apply error:', e);
    }
}

function applyFMDepthToWorklet(depth) {
    if (!AppState.engine || !AppState.engine.workletNode || !AppState.audioCtx) return;
    
    try {
        const param = AppState.engine.workletNode.parameters.get('fmDepth');
        const t = AppState.audioCtx.currentTime;
        param.cancelScheduledValues(t);
        param.setValueAtTime(depth, t);
    } catch (e) {}
}

function applyPulseWidthToWorklet(pw) {
    if (!AppState.engine || !AppState.engine.workletNode || !AppState.audioCtx) return;
    
    try {
        const param = AppState.engine.workletNode.parameters.get('pulseWidth');
        param.setValueAtTime(pw, AppState.audioCtx.currentTime);
    } catch (e) {}
}

// Fixed touch handling
let isTouching = false;
let lastTouchTime = 0;

function handleTouchStart(e) {
    e.preventDefault();
    isTouching = true;
    handleTouchMove(e);
}

function handleTouchMove(e) {
    if (!isTouching && !(e.type === 'mousemove' && e.buttons === 1)) return;
    
    const now = performance.now();
    if (now - lastTouchTime < 35) return;
    lastTouchTime = now;
    
    if (!isAudioRunning()) {
        showStatus('Start synth first');
        return;
    }
    
    const touch = e.touches ? e.touches[0] : e;
    const cx = touch.clientX;
    const cy = touch.clientY;
    
    const freq = noteFromPad(cy) * Math.pow(2, AppState.octaveOffset);
    AppState.baseFreq = freq;
    applyPitchToWorklet(freq);
    
    // Fixed volume calculation - now 0% to 100%
    const targetVolume = Math.min(1.0, (cx / window.innerWidth) * 1.5);
    AppState.lastVolume = targetVolume;
    
    try {
        if (AppState.engine && AppState.engine.audioNodes && AppState.engine.audioNodes.masterGain) {
            AppState.engine.audioNodes.masterGain.gain.setTargetAtTime(AppState.lastVolume, AppState.audioCtx.currentTime, 0.02);
        }
    } catch (e) {}
}

function handleTouchEnd() {
    isTouching = false;
}

// Rhythm functions
function createClickSound(time) {
    if (!AppState.audioCtx) return;
    
    const ctx = AppState.audioCtx;
    const t = time || ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, t);
    g.gain.setValueAtTime(0.1, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.06);
}

function rhythmBeat(time, tickIndex) {
    if (!AppState.engine) return;
    
    try {
        const g = AppState.engine.audioNodes.masterGain;
        g.gain.setTargetAtTime(0.1, time, 0.01);
        setTimeout(() => {
            if (isAudioRunning()) {
                g.gain.setTargetAtTime(AppState.lastVolume, AppState.audioCtx.currentTime, 0.02);
            }
        }, 50);
    } catch (e) {}
    
    triggerVisualFeedback();
    createClickSound(time);
}

function startRhythm(pattern) {
    if (!isAudioRunning()) {
        showStatus('Start synth first');
        return;
    }
    
    scheduler.start((time, tickIndex) => rhythmBeat(time, tickIndex), pattern);
    showStatus('Rhythm: ' + pattern);
}

function stopRhythm() {
    scheduler.stop();
    showStatus('Rhythm stopped');
}

// Fixed motion handling
function handleOrientationEvent(e) {
    if (e.beta !== undefined && e.gamma !== undefined) {
        // Fixed scaling for pan and tilt
        AppState.pendingTilt = Math.max(-30, Math.min(30, e.beta - 90)); // -30 to +30 degrees
        AppState.pendingPan = Math.max(-1, Math.min(1, e.gamma / 45)); // -1 to +1
    }
}

function orientationRAF() {
    const alpha = 0.15;
    AppState.smoothedPan += (AppState.pendingPan - AppState.smoothedPan) * alpha;
    AppState.smoothedTilt += ((AppState.pendingTilt || 0) - AppState.smoothedTilt) * alpha;
    
    if (AppState.motionEnabled) {
        const bend = (AppState.smoothedTilt / 30) * 12; // ±12 semitones max
        const base = 130.81 * Math.pow(2, AppState.octaveOffset);
        const freq = base * Math.pow(2, bend / 12);
        AppState.baseFreq = freq;
        applyPitchToWorklet(freq);
        elements.motionDisplay.style.display = 'block';
        elements.motionDisplay.textContent = `Tilt:${Math.round(bend * 10) / 10}st`;
    }
    
    if (AppState.panEnabled && AppState.engine && AppState.engine.audioNodes && AppState.audioCtx) {
        const ctx = AppState.audioCtx;
        AppState.engine.audioNodes.panner.pan.setTargetAtTime(AppState.smoothedPan, ctx.currentTime, 0.02);
        elements.panDisplay.style.display = 'block';
        elements.panDisplay.textContent = `Pan:${Math.round(AppState.smoothedPan * 100)}%`;
    }
    
    requestAnimationFrame(orientationRAF);
}

requestAnimationFrame(orientationRAF);

// Optimized visual feedback
function triggerVisualFeedback() {
    document.body.classList.add('flash');
    setTimeout(() => document.body.classList.remove('flash'), 120);
    
    // Use optimized visual pulse instead of button animation
    elements.visualPulse.classList.add('active');
    setTimeout(() => elements.visualPulse.classList.remove('active'), 300);
}

// Note utilities
function freqToNote(freq) {
    const A4 = 440;
    const semitonesFromA4 = 12 * Math.log2(freq / A4);
    const noteIndex = Math.round(semitonesFromA4 + 9) % 12;
    const octave = Math.floor((semitonesFromA4 + 9) / 12) + 4;
    const noteName = noteNames[(noteIndex + 12) % 12];
    return { name: noteName, octave, fullName: `${noteName}${octave}` };
}

// Optimized theme color update
let uiRAF = null;
let lastNoteName = '';

function updateThemeColor(noteName) {
    if (noteName === lastNoteName) return;
    lastNoteName = noteName;
    
    if (uiRAF) cancelAnimationFrame(uiRAF);
    uiRAF = requestAnimationFrame(() => {
        const map = {
            'C': [255, 100, 100], 'C#': [255, 150, 100], 'D': [255, 255, 100],
            'D#': [150, 255, 100], 'E': [100, 255, 100], 'F': [100, 255, 150],
            'F#': [100, 255, 255], 'G': [100, 150, 255], 'G#': [100, 100, 255],
            'A': [150, 100, 255], 'A#': [255, 100, 255], 'B': [255, 100, 150]
        };
        const color = map[noteName] || [100, 100, 100];
        document.documentElement.style.setProperty('--r', color[0]);
        document.documentElement.style.setProperty('--g', color[1]);
        document.documentElement.style.setProperty('--b', color[2]);
    });
}

function createNoteRuler() {
    const notes = ['D4','C#4','C4','B3','A#3','A3','G#3','G3','F#3','F3','E3','D#3','D3','C#3','C3','B2','A#2'];
    elements.noteRuler.innerHTML = '';
    notes.forEach(n => {
        const d = document.createElement('div');
        d.className = 'ruler-note';
        d.textContent = n;
        elements.noteRuler.appendChild(d);
    });
}

    document.getElementById('delayMix').addEventListener('input', e => {
        if (AppState.engine && AppState.engine.effectMixers.delay && AppState.engine.effects.delay) {
            const mix = parseFloat(e.target.value);
            AppState.engine.effectMixers.delay.wet.gain.value = mix;
            AppState.engine.effectMixers.delay.dry.gain.value = 1 - mix;
        }
    });
    
    // Effect toggles
    const toggleMap = {
        toggleDist: 'dist', toggleAutoWah: 'autoWah', toggleFlanger: 'flanger',
        toggleChorus: 'chorus', toggleTremolo: 'tremolo', toggleFilter: 'filter',
        toggleDelay: 'delay', toggleReverb: 'reverb'
    };
    
    Object.entries(toggleMap).forEach(([id, effect]) => {
        document.getElementById(id).addEventListener('click', () => {
            if (!AppState.engine) {
                showStatus('Start first');
                return;
            }
            AppState.engine.effects[effect] = !AppState.engine.effects[effect];
            document.getElementById(id).classList.toggle('active', AppState.engine.effects[effect]);
            AppState.engine.updateEffectParameters();
            showStatus(effect + ' ' + (AppState.engine.effects[effect] ? 'ON' : 'OFF'));
            
            if (effect === 'autoWah') {
                elements.wahDisplay.style.display = AppState.engine.effects.autoWah ? 'block' : 'none';
                elements.wahDisplay.textContent = 'Wah:' + (AppState.engine.effects.autoWah ? 'ON' : 'OFF');
            }
            if (effect === 'delay') {
                document.getElementById('toggleDelay').textContent = 'Delay ' + (AppState.engine.effects.delay ? 'ON' : 'OFF');
            }
        });
    });
    
    // Rhythm controls
    const rhythmButtons = {
        rhythm4: '4', rhythm8: '8', rhythm16: '16', rhythm32: '32',
        rhythmTriplet: 'triplet', rhythmShuffle: 'shuffle', rhythmDotted: 'dotted',
        rhythmStutter: 'stutter', rhythmRandom: 'random'
    };
    
    Object.entries(rhythmButtons).forEach(([id, pattern]) => {
        document.getElementById(id).addEventListener('click', () => startRhythm(pattern));
    });
    
    document.getElementById('rhythmStop').addEventListener('click', stopRhythm);
    
    // Motion and pan controls
    elements.motionBtn.addEventListener('click', () => {
        if (AppState.motionEnabled) {
            window.removeEventListener('deviceorientation', handleOrientationEvent);
            AppState.motionEnabled = false;
            elements.motionBtn.classList.remove('active');
            elements.motionBtn.textContent = 'Motion';
            elements.motionDisplay.style.display = 'none';
            showStatus('Motion disabled');
        } else {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                elements.permissionModal.style.display = 'flex';
            } else {
                window.addEventListener('deviceorientation', handleOrientationEvent, { passive: true });
                AppState.motionEnabled = true;
                elements.motionBtn.classList.add('active');
                elements.motionBtn.textContent = 'Motion ON';
                showStatus('Motion enabled');
            }
        }
    });
    
    document.getElementById('permissionAllow').addEventListener('click', () => {
        DeviceOrientationEvent.requestPermission().then(res => {
            elements.permissionModal.style.display = 'none';
            if (res === 'granted') {
                window.addEventListener('deviceorientation', handleOrientationEvent, { passive: true });
                AppState.motionEnabled = true;
                elements.motionBtn.classList.add('active');
                elements.motionBtn.textContent = 'Motion ON';
                showStatus('Motion enabled');
            } else {
                showStatus('Motion permission denied');
            }
        }).catch(e => {
            elements.permissionModal.style.display = 'none';
            showStatus('Permission error');
        });
    });
    
    document.getElementById('permissionDeny').addEventListener('click', () => {
        elements.permissionModal.style.display = 'none';
        showStatus('Motion disabled');
    });
    
    elements.panBtn.addEventListener('click', () => {
        AppState.panEnabled = !AppState.panEnabled;
        elements.panBtn.classList.toggle('active', AppState.panEnabled);
        elements.panBtn.textContent = AppState.panEnabled ? 'Pan ON' : 'Pan';
        elements.panDisplay.style.display = AppState.panEnabled ? 'block' : 'none';
        if (!AppState.panEnabled && AppState.engine && AppState.engine.audioNodes) {
            AppState.engine.audioNodes.panner.pan.setTargetAtTime(0, AppState.audioCtx.currentTime, 0.01);
        }
    });
}

// Initialize application
window.addEventListener('load', () => {
    createNoteRuler();
    initializeEventListeners();
    updateButtonStates();
    showStatus('Ready — Click Start');
});

window.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
